<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* Timed to K032's voice (the card starts 4.16 s into the beat, after S59):
   "डीलर का" is already being said at the cut ("डीलर" −0.08 s, "का" ≈ 0.46 s),
   "समय" ≈ 0.64 s (after the "k" closure at 0.44–0.48 s and the "s" at 0.62 s),
   "ध्यान" ≈ 2.21 s (the "dh" closure sits at 6.32–6.39 s of the beat).
   So the label is fully written at the cut (0 s), the hourglass lands by 0.37 s and the eye
   by 2.0 s; the pupil darts between the task chips and is back on centre, the
   sand run out, by 3.5 s — the last 0.6 s is still. */
.mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
@keyframes wr{0%{clip-path:inset(-10% 100% -10% 0)}100%{clip-path:inset(-10% -4% -10% 0)}}
@keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.72) translateY(40px)}62%{opacity:1;transform:scale(1.04) translateY(0)}100%{opacity:1;transform:none}}
@keyframes chipIn{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:none}}
@keyframes topSand{0%{transform:translateY(0)}100%{transform:translateY(70px)}}
@keyframes botSand{0%{transform:translateY(42px)}100%{transform:translateY(-8px)}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-28}}
@keyframes streamOn{0%{opacity:0}6%,94%{opacity:1}100%{opacity:0}}
@keyframes dart{
  0%{transform:none}
  8%,20%{transform:translate(22px,-20px)}
  28%,40%{transform:translate(-30px,-2px)}
  48%,60%{transform:translate(20px,22px)}
  68%,80%{transform:translate(-22px,-20px)}
  88%,100%{transform:none}}
@keyframes look{0%,100%{opacity:0}35%{opacity:1}}

#I88a{gap:0}
#I88a .blk{display:flex;flex-direction:column;align-items:center;margin-top:-10px}
#I88a .srule{width:150px;height:7px;border-radius:7px;background:linear-gradient(90deg,#E9A23B,#F4C979);transform-origin:50% 50%;animation-name:growX}
#I88a .lbl{font-size:74px;color:var(--amberDeep);margin-top:26px;line-height:1.35;animation-name:wr;animation-timing-function:linear}
#I88a .pair{display:flex;gap:70px;margin-top:84px}
#I88a .it{width:420px;display:flex;flex-direction:column;align-items:center}
#I88a .md{position:relative;width:380px;height:380px;animation-name:pop}
#I88a .medal{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff,#FBF1E1 70%);border:2px solid rgba(201,160,100,.55);
  box-shadow:0 30px 60px rgba(58,16,10,.24),inset 0 -6px 14px rgba(160,110,50,.12);
  display:flex;align-items:center;justify-content:center}
#I88a .medal svg{overflow:visible}
#I88a .w{font-size:140px;color:var(--maroon);line-height:1.3;margin-top:34px;animation-name:wr;animation-timing-function:linear;
  text-shadow:0 18px 40px rgba(107,22,22,.14)}
#I88a .top{animation-name:topSand;animation-timing-function:cubic-bezier(.35,0,.6,1)}
#I88a .bot{animation-name:botSand;animation-timing-function:cubic-bezier(.35,0,.6,1)}
#I88a .strm{stroke-dasharray:7 7;animation-name:flow,streamOn;animation-timing-function:linear,linear}
#I88a .iris{animation-name:dart;animation-timing-function:cubic-bezier(.6,0,.2,1)}
#I88a .chip{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep));box-shadow:0 10px 20px rgba(58,16,10,.26),inset 0 -4px 10px rgba(0,0,0,.2);
  animation-name:chipIn}
#I88a .chip svg{width:40px;height:40px}
#I88a .chip i{position:absolute;inset:-7px;border-radius:26px;display:block;animation-name:look;animation-timing-function:ease-out;
  border:4px solid #F4C979;box-shadow:0 0 18px rgba(233,162,59,.6)}
</style>
</head>
<body>
<!-- ══ I88a · the dealer's time and attention · K032 "…डीलर का समय, और उसका ध्यान।" (4.18 s, after S59) ══ -->
<div class="panel" id="I88a" data-plate="office" style="--T:5s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;top:52%"></div>
  <div class="blk">
    <div class="srule mv" style="animation-delay:-.45s;animation-duration:.4s"></div>
    <div class="lbl hi mv" style="animation-delay:-.42s;animation-duration:.4s">डीलर का</div>
    <div class="pair">
      <div class="it">
        <div class="md mv" style="animation-delay:.02s;animation-duration:.35s">
          <div class="medal">
            <!-- an hourglass: caps, two bulbs, the sand draining fast -->
            <svg width="206" height="268" viewBox="0 0 200 260">
              <defs>
                <clipPath id="hgTop"><path d="M40 28H160C160 90 108 110 108 130H92C92 110 40 90 40 28Z"/></clipPath>
                <clipPath id="hgBot"><path d="M92 130H108C108 150 160 170 160 232H40C40 170 92 150 92 130Z"/></clipPath>
                <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4C979"/><stop offset="1" stop-color="#C77C1B"/></linearGradient>
              </defs>
              <g clip-path="url(#hgTop)"><rect class="top mv" x="20" y="62" width="160" height="90" fill="url(#sand)" style="animation-delay:.3s;animation-duration:3.05s"/></g>
              <g clip-path="url(#hgBot)"><path class="bot mv" d="M20 320V204Q100 164 180 204V320Z" fill="url(#sand)" style="animation-delay:.3s;animation-duration:3.05s"/></g>
              <line class="strm mv" x1="100" y1="128" x2="100" y2="226" stroke="#D08A28" stroke-width="5" stroke-linecap="round"
                style="animation-delay:.3s,.3s;animation-duration:.22s,3.05s;animation-iteration-count:14,1"/>
              <path d="M40 28C40 90 92 110 92 130C92 150 40 170 40 232M160 28C160 90 108 110 108 130C108 150 160 170 160 232"
                fill="none" stroke="var(--maroon)" stroke-width="7" stroke-linecap="round"/>
              <rect x="18" y="12" width="164" height="20" rx="10" fill="var(--maroon)"/>
              <rect x="18" y="228" width="164" height="20" rx="10" fill="var(--maroon)"/>
            </svg>
          </div>
        </div>
        <div class="w hi mv" style="animation-delay:.1s;animation-duration:.25s">समय</div>
      </div>
      <div class="it">
        <div class="md mv" style="animation-delay:1.65s;animation-duration:.35s">
          <div class="medal">
            <!-- an eye; the iris darts from task to task -->
            <svg width="250" height="250" viewBox="0 0 200 200">
              <defs>
                <clipPath id="eyeC"><path d="M16 100Q100 26 184 100Q100 174 16 100Z"/></clipPath>
                <radialGradient id="irisG" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#A3423A"/><stop offset="1" stop-color="#4E0F0F"/></radialGradient>
              </defs>
              <path d="M16 100Q100 26 184 100Q100 174 16 100Z" fill="#fff"/>
              <g clip-path="url(#eyeC)">
                <g class="iris mv" style="animation-delay:2.15s;animation-duration:1.35s">
                  <circle cx="100" cy="100" r="36" fill="url(#irisG)"/>
                  <circle cx="100" cy="100" r="15" fill="#240707"/>
                  <circle cx="89" cy="89" r="6" fill="#fff" opacity=".85"/>
                </g>
              </g>
              <path d="M16 100Q100 26 184 100Q100 174 16 100Z" fill="none" stroke="var(--maroon)" stroke-width="7" stroke-linejoin="round"/>
            </svg>
          </div>
          <!-- tiny task chips round it, in the order the eye visits them -->
          <div class="chip mv" style="left:338px;top:40px;animation-delay:1.95s;animation-duration:.3s"><i class="mv" style="animation-delay:2.28s;animation-duration:.3s"></i><svg class="i"><use href="#i-doc"/></svg></div>
          <div class="chip mv" style="left:4px;top:176px;animation-delay:2.0s;animation-duration:.3s"><i class="mv" style="animation-delay:2.55s;animation-duration:.3s"></i><svg class="i"><use href="#i-clock"/></svg></div>
          <div class="chip mv" style="left:330px;top:338px;animation-delay:2.05s;animation-duration:.3s"><i class="mv" style="animation-delay:2.82s;animation-duration:.3s"></i><svg class="i"><use href="#i-cal"/></svg></div>
          <div class="chip mv" style="left:44px;top:30px;animation-delay:2.1s;animation-duration:.3s"><i class="mv" style="animation-delay:3.09s;animation-duration:.3s"></i><svg class="i"><use href="#i-drop"/></svg></div>
        </div>
        <div class="w hi mv" style="animation-delay:1.75s;animation-duration:.25s">ध्यान</div>
      </div>
    </div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
