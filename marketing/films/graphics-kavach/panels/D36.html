<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes paperIn{0%{opacity:0;transform:translateY(-120px) rotate(-4deg) scale(1.04)}70%{opacity:1;transform:translateY(6px) rotate(-1deg)}100%{opacity:1;transform:rotate(-1.2deg)}}
  @keyframes show{0%{opacity:0}100%{opacity:1}}
  @keyframes scan{0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(.9)}
    14%{opacity:1}
    28%,42%{opacity:1;transform:translate(var(--xa),var(--ya)) scale(1)}
    58%,68%{opacity:1;transform:translate(var(--xb),var(--yb)) scale(1)}
    82%,90%{opacity:1;transform:translate(var(--xc),var(--yc)) scale(1)}
    100%{opacity:1;transform:translate(var(--xd),var(--yd)) scale(.92)}}
  @keyframes hl{0%{background-size:0% 100%}100%{background-size:100% 100%}}
  @keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-25deg)}65%{opacity:1;transform:scale(1.12) rotate(4deg)}100%{opacity:1;transform:rotate(6deg)}}
  @keyframes dash{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
  @keyframes dot{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:none}}
  @keyframes wr{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(-10% -4% -10% 0)}}

  #D36{gap:64px}
  #D36 .wrap{position:relative;width:940px}
  #D36 .paper{--rot:-1.2deg;width:940px;padding:40px 44px 44px;animation-name:paperIn;animation-duration:.8s}
  #D36 .hd{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 12px;font-size:46px;font-weight:700;color:var(--print);padding-bottom:22px;border-bottom:3px solid var(--print)}
  #D36 .hd .code{font-family:'Space Grotesk',sans-serif;font-size:52px;color:var(--maroon);padding:0 8px;border-radius:6px;
    background:linear-gradient(rgba(255,214,64,.55),rgba(255,214,64,.55)) no-repeat 0 0 / 0% 100%;animation-name:hl;animation-duration:.4s}
  #D36 .fld{display:flex;align-items:baseline;gap:18px;font-size:44px;color:var(--print);padding:24px 0 14px;border-bottom:2px dashed #C9BBA6}
  #D36 .fld .k{font-weight:700}
  #D36 .fld .v{font-family:'Space Grotesk',sans-serif;font-size:48px;color:#6B6258}
  #D36 .tbl{margin-top:34px;border:2px solid #9C9184;border-radius:4px;overflow:hidden}
  #D36 .tbl .th{height:54px;background:#F3ECE0;border-bottom:2px solid #9C9184;display:flex;gap:18px;align-items:center;padding:0 20px}
  #D36 .tbl .th i{display:block;height:14px;border-radius:7px;background:#B9AC98}
  #D36 .tbl .tr{height:58px;border-bottom:1.5px solid #D8CCBA;display:flex;gap:18px;align-items:center;padding:0 20px}
  #D36 .tbl .tr:last-child{border-bottom:0}
  #D36 .tbl .tr i{display:block;height:12px;border-radius:6px;background:#D9CFC0}
  #D36 .lens{position:absolute;left:0;top:0;width:230px;height:230px;z-index:8;pointer-events:none;animation-name:scan;animation-duration:2.7s;
    animation-timing-function:cubic-bezier(.45,0,.35,1)}
  #D36 .lens .g{position:absolute;inset:0;border-radius:50%;border:16px solid #2E2724;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 38%,rgba(233,162,59,.10) 70%,rgba(233,162,59,.22));
    box-shadow:0 26px 40px rgba(20,8,4,.45),inset 0 0 0 3px rgba(255,255,255,.35),inset 0 -10px 24px rgba(0,0,0,.12)}
  #D36 .lens .h{position:absolute;left:190px;top:186px;width:130px;height:40px;border-radius:20px;background:linear-gradient(#4A403B,#1E1917);
    transform:rotate(45deg);transform-origin:0 50%;box-shadow:0 14px 24px rgba(20,8,4,.4)}
  #D36 .q{position:absolute;right:6px;bottom:-80px;width:210px;height:210px;border-radius:50%;z-index:9;
    background:radial-gradient(circle at 35% 30%,var(--maroonSoft),var(--maroonDeep));box-shadow:0 30px 60px rgba(58,16,10,.45),inset 0 0 0 6px rgba(233,162,59,.55);
    display:flex;align-items:center;justify-content:center;animation-name:pop;animation-duration:.55s}
  #D36 .q svg{width:120px;height:140px;overflow:visible}
  #D36 .q path{fill:none;stroke:var(--amber);stroke-width:18;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
    animation-name:dash;animation-duration:.5s;animation-timing-function:cubic-bezier(.5,.1,.3,1)}
  #D36 .q circle{fill:var(--amber);transform-box:fill-box;transform-origin:center;animation-name:dot;animation-duration:.2s}
  #D36 .ask{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  #D36 .ask .a{font-size:70px;color:var(--maroon);animation-name:wr;animation-duration:.5s;animation-timing-function:linear}
  #D36 .ask .b{font-size:50px;color:var(--ink);animation-name:wr;animation-duration:.55s;animation-timing-function:linear}
</style>
</head>
<body>
<!-- ══ D36 · a report that carries only the code · K804 (held 6.5 s) ═════════════ -->
<div class="panel" id="D36" data-plate="office" style="--T:7s">
  <div class="wrap">
    <div class="paper mv" style="animation-delay:0s">
      <div class="hd hi"><span>पंप कोड:</span><span class="code mv" style="animation-delay:2.1s">47Q</span><span>· डी-एस-आर · 20-08</span></div>
      <div class="fld hi"><span class="k">नाम:</span><span class="v">—</span></div>
      <div class="fld hi"><span class="k">पता:</span><span class="v">—</span></div>
      <div class="tbl">
        <div class="th"><i style="width:18%"></i><i style="width:14%"></i><i style="width:16%"></i><i style="width:14%"></i><i style="width:16%"></i></div>
        <div class="tr"><i style="width:16%"></i><i style="width:12%"></i><i style="width:15%"></i><i style="width:13%"></i><i style="width:17%"></i></div>
        <div class="tr"><i style="width:14%"></i><i style="width:13%"></i><i style="width:16%"></i><i style="width:12%"></i><i style="width:15%"></i></div>
        <div class="tr"><i style="width:17%"></i><i style="width:11%"></i><i style="width:14%"></i><i style="width:14%"></i><i style="width:16%"></i></div>
        <div class="tr"><i style="width:15%"></i><i style="width:13%"></i><i style="width:17%"></i><i style="width:12%"></i><i style="width:14%"></i></div>
        <div class="tr"><i style="width:16%"></i><i style="width:12%"></i><i style="width:15%"></i><i style="width:13%"></i><i style="width:16%"></i></div>
      </div>
      <div class="lens mv" style="animation-delay:1.35s;--x0:680px;--y0:560px;--xa:148px;--ya:-42px;--xb:140px;--yb:75px;--xc:140px;--yc:181px;--xd:590px;--yd:128px">
        <div class="h"></div><div class="g"></div>
      </div>
    </div>
    <div class="q mv" style="animation-delay:3.55s">
      <svg viewBox="0 0 120 140"><path class="mv" d="M26 40 C26 12 94 8 94 42 C94 66 60 66 60 92" pathLength="1" style="animation-delay:3.65s"/>
        <circle class="mv" cx="60" cy="124" r="11" style="animation-delay:4.1s"/></svg>
    </div>
  </div>
  <div class="ask hi">
    <div class="a mv" style="animation-delay:3.75s">किस पंप की?</div>
    <div class="b mv" style="animation-delay:4.0s">सिर्फ़ कोड से पहचानना आसान नहीं</div>
  </div>
  <div class="rail hi">रिपोर्ट पर सिर्फ़ कोड</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
