/* The four kinds of legal matter, one card per phrase as it is spoken. */
.eb{display:flex;align-items:center;gap:22px;font-size:44px;color:var(--amberDeep)}
.eb .n{font-size:44px;font-weight:700;color:#4E0F0F;padding:6px 16px;border-radius:12px;
  background:linear-gradient(160deg,#F8D899,#E9A23B 55%,#C27716)}
.list{width:940px;display:flex;flex-direction:column;gap:36px;margin-top:10px}
.mt{display:flex;align-items:center;gap:34px;padding:30px 36px;border-radius:26px;
  background:linear-gradient(170deg,#fff,#FBF3E7);border:1px solid rgba(201,160,100,.55);
  box-shadow:0 30px 60px rgba(58,16,10,.22),0 4px 10px rgba(58,16,10,.12)}
.mt .g{flex:none;width:120px;height:120px;border-radius:32px;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep));
  box-shadow:inset 0 -6px 14px rgba(0,0,0,.22),0 12px 24px rgba(58,16,10,.26)}
.mt .g svg{width:66px;height:66px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mt .t{font-size:50px;color:var(--maroon);line-height:1.3}
</style>
