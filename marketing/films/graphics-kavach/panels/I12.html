<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  /* numbered job heading — same build for 01 / 02 / 03 / 04 */
  .hd{display:flex;flex-direction:column;align-items:center;text-align:center;width:960px}
  .hd svg.num{width:620px;height:330px;overflow:visible}
  .hd .numtx{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:340px;letter-spacing:-8px;
    fill:url(#gold);stroke:#C77C1B;stroke-width:3;stroke-dasharray:1500;stroke-dashoffset:1500;fill-opacity:0;
    paint-order:stroke}
  @keyframes numDraw{0%{stroke-dashoffset:1500;fill-opacity:0}55%{stroke-dashoffset:0;fill-opacity:0}100%{stroke-dashoffset:0;fill-opacity:1}}
  .hd .numtx.anim{animation-name:numDraw;animation-duration:.95s;animation-timing-function:cubic-bezier(.45,.1,.3,1)}
  .hd .rule{width:180px;height:8px;border-radius:8px;margin:14px 0 40px;
    background:linear-gradient(90deg,var(--amberDeep),#F6C877,var(--amberDeep));transform-origin:center}
  @keyframes ruleIn{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  .hd .rule.anim{animation-name:ruleIn;animation-duration:.7s}
  .hd .lab{font-size:50px;color:var(--amberDeep);line-height:1.2}
  .hd .ttl{font-size:150px;color:var(--maroon);line-height:1.22;margin-top:18px;max-width:940px}
  .hd .sub2{font-size:50px;color:var(--inkMuted);margin-top:16px}
  .hd svg.ico{width:300px;height:230px;margin-top:56px;overflow:visible}
  .hd svg.ico path,.hd svg.ico rect,.hd svg.ico circle{fill:none;stroke:var(--maroonSoft);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:1;stroke-dashoffset:1}
  .hd svg.ico .gd{stroke:var(--amber)}
  @keyframes drawIco{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
  .hd svg.ico .anim{animation-name:drawIco;animation-duration:.9s;animation-timing-function:cubic-bezier(.5,.1,.3,1)}
</style>
</head>
<body>
<!-- ══ I12 · heading: second, the DSR · K207 "दूसरा — डी-एस-आर, यानी डेली सेल्स रिपोर्ट।" (first 3 s) ═══ -->
<div class="panel" id="I12" data-plate="desk" style="--T:3s">
  <div class="glow anim a-glow" style="animation-delay:-1.4s;top:44%"></div>
  <div class="hd anim a-drift" style="--rot:0deg;--dy1:-16px;--s0:1;--s1:1.03">
    <svg class="num" viewBox="0 0 620 330">
      <defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8C977"/><stop offset=".55" stop-color="#E9A23B"/><stop offset="1" stop-color="#B96E12"/></linearGradient></defs>
      <text class="numtx anim" x="310" y="300" text-anchor="middle" style="animation-delay:-.02s">02</text>
    </svg>
    <div class="rule anim" style="animation-delay:.35s"></div>
    <div class="lab hi anim a-write" style="animation-delay:.75s">दूसरा</div>
    <div class="ttl hi anim a-write" style="animation-delay:1.0s">डी-एस-आर</div>
    <div class="sub2 hi anim a-fade" style="animation-delay:1.3s">डेली सेल्स रिपोर्ट</div>
  </div>
  <div class="rail hi">रोज़ की बिक्री, रोज़ का हिसाब</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
