<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* Timed to K035's voice (this card opens the beat): "यहीं पर डीलर" 0–0.9 s,
   "फँस जाता है" 1.04–1.65 s, "पंप को समय देना तो ज़रूरी है" 2.88–4.63 s
   ("ज़रूरी" ≈ 4.14 s). "यहीं" is said from the very first frame, so line 1 is
   already written at the cut; line 2 is written by 0.85 s, before "फँस"; the maroon arrow slides in from the left and is on by
   2.65 s, and gives one push on "ज़रूरी". Still from 4.45 s.
   I88e OPENS ON THIS CARD'S LAST FRAME: the title, the arrow, its label and the
   glow (at rest after two 2.4 s pulses) are copied there at the same
   positions. Change one, change both. */
.mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
@keyframes wr{0%{clip-path:inset(-10% 100% -10% 0)}100%{clip-path:inset(-10% -4% -10% 0)}}
@keyframes inL{0%{transform:translateX(-640px)}80%{transform:translateX(12px)}100%{transform:none}}
@keyframes nudge{0%,100%{transform:none}40%{transform:translateX(20px)}}

#I88d .abs{position:absolute}
#I88d .ttl{left:40px;right:40px;top:520px;text-align:center;font-size:116px;line-height:1.3;color:var(--maroon);
  text-shadow:0 18px 40px rgba(107,22,22,.14)}
#I88d .ttl div{animation-name:wr;animation-timing-function:linear}
#I88d .trule{left:465px;top:858px;width:150px;height:7px;border-radius:7px;background:linear-gradient(90deg,#E9A23B,#F4C979)}
#I88d svg.ar{left:0;top:880px;width:1080px;height:700px;overflow:visible}
#I88d .lab{font-size:60px;line-height:1.3}
#I88d .lab.l{left:60px;top:1010px;color:var(--maroon)}
#I88d .lab.l,#I88d .lab.r{animation-name:wr;animation-timing-function:linear}
</style>
</head>
<body>
<!-- ══ I88d · where the dealer gets stuck · K035 "यहीं पर डीलर फँस जाता है। पंप को समय देना तो ज़रूरी है।" (6.06 s) ══ -->
<div class="panel" id="I88d" data-plate="desk" style="--T:7s">
  <div class="glow mv" style="animation-name:glowPulse;animation-timing-function:ease-in-out;animation-duration:2.4s;animation-iteration-count:2;top:62%"></div>
  <div class="abs ttl hi">
    <div class="mv" style="animation-delay:-.44s;animation-duration:.4s">यहीं पर डीलर</div>
    <div class="mv" style="animation-delay:.5s;animation-duration:.35s">फँस जाता है</div>
  </div>
  <div class="abs trule"></div>

  <svg class="abs ar" viewBox="0 0 1080 700">
    <defs>
      <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A2B2B"/><stop offset="1" stop-color="#5A1212"/></linearGradient>
    </defs>
    <!-- the pump's claim on his time: a maroon arrow from the left -->
    <g class="mv" style="animation-name:nudge;animation-delay:3.95s;animation-duration:.5s;animation-timing-function:ease-in-out">
      <g class="mv" style="animation-name:inL;animation-delay:2.15s;animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.3,1)">
        <path d="M-60 350L410 350C413 350 416 350 418.75 350C421.7 350 424.6 350 427.5 350C430.4 350 433.3 350 436.25 350C439.2 350 442.1 350 445 350"
          fill="none" stroke="#6B1616" stroke-width="56" stroke-linecap="round"/>
        <path d="M532 350 428 278Q418 350 428 422Z" fill="#6B1616" stroke="#6B1616" stroke-width="12" stroke-linejoin="round"/>
      </g>
    </g>
  </svg>
  <div class="abs lab l hi mv" style="animation-delay:2.3s;animation-duration:.35s">पंप को समय देना — ज़रूरी</div>

  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
