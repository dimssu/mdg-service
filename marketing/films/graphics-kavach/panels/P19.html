<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* P19 opens 4 s into K507, after "लिखकर" and while "बोलकर" is being said; "फ़ोटो भेजकर"
   follows at 0.5–1.9 s and "हर बात का लिखित रिकॉर्ड" at 3.8–6.1 s. So the first
   two ways are there almost at once, the photo lands on its words, the reply
   fills the pause, and the record strip rises as the record is mentioned. */
#P19 .phone{width:860px;height:1560px;border-radius:84px;padding:16px}
#P19 .screen{border-radius:70px;background:#F4EBDD}
#P19 .island{position:absolute;top:22px;left:50%;width:150px;height:40px;margin-left:-75px;border-radius:20px;background:#000;z-index:10}
#P19 .top{padding:84px 36px 24px;display:flex;align-items:center;gap:20px;background:#fff;border-bottom:1px solid #EDE7E0}
#P19 .logo{width:72px;height:72px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:#fff;background:linear-gradient(145deg,var(--maroonSoft),var(--maroonDeep))}
#P19 .top .nm{font-size:36px;color:#16120F;line-height:1.2}
#P19 .top .st{font-size:26px;color:var(--inkMuted);line-height:1.3}
#P19 .chat{flex:1;padding:30px 30px 150px;display:flex;flex-direction:column;gap:14px}
#P19 .tag{align-self:flex-end;display:flex;align-items:center;gap:10px;font-size:30px;color:var(--amberDeep);
  background:#FFF4E0;border:2px solid var(--amberSoft);border-radius:999px;padding:6px 18px 6px 14px;margin-top:10px}
#P19 .tag svg{width:30px;height:30px;stroke-width:2.4}
#P19 .bub{font-size:36px;line-height:1.45;max-width:86%;border-radius:24px;padding:20px 26px;box-shadow:0 3px 10px rgba(74,15,15,.10)}
#P19 .bub.me{align-self:flex-end;background:#FCE6C6;color:var(--ink);border-top-right-radius:8px}
#P19 .bub.them{max-width:94%;align-self:flex-start;background:#fff;color:var(--ink);border-top-left-radius:8px;margin-top:14px}
#P19 .voice{display:flex;align-items:center;gap:20px;padding:18px 26px 18px 18px}
#P19 .voice .pl{width:76px;height:76px;border-radius:50%;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
#P19 .voice .wave{display:flex;align-items:center;gap:6px;height:60px}
#P19 .voice .wave i{display:block;width:7px;border-radius:4px;background:#B98A5A}
#P19 .voice .dur{font-size:32px;color:#6B5A4C;font-weight:500}
#P19 .photo{padding:10px}
#P19 .photo .img{width:520px;height:330px;border-radius:16px;overflow:hidden;background:#7A5234}
#P19 .photo .img svg{display:block;width:100%;height:100%;filter:blur(4.4px)}
#P19 .rec{position:absolute;left:0;right:0;bottom:0;padding:34px 40px 48px;display:flex;align-items:center;gap:20px;
  background:linear-gradient(120deg,var(--maroonSoft),var(--maroon) 60%);border-top:5px solid var(--amber);color:#FFF3E2;
  box-shadow:0 -14px 30px rgba(74,15,15,.22)}
#P19 .rec .t{font-size:40px;line-height:1.3}
#P19 .rec svg{width:52px;height:52px;flex:none;color:var(--amber)}
@keyframes slideUp{0%{transform:translateY(110%)}100%{transform:none}}
.up{animation-name:slideUp;animation-duration:.8s!important}
.fast{animation-duration:.6s!important}
/* after the strip lands, a slow push keeps the held frame alive */
#P19 .cam{transform-origin:50% 70%}
@keyframes push{0%{transform:scale(1)}100%{transform:scale(1.035)}}
.push{animation-name:push;animation-duration:3.4s!important;animation-timing-function:cubic-bezier(.4,0,.6,1)!important}
</style>
</head>
<body>
<!-- ══ P19 · ask by typing, speaking or sending a photo · K507 "…लिखकर, बोलकर, या काग़ज़ की फ़ोटो भेजकर…" ══ -->
<div class="panel" id="P19" data-plate="desk" style="--T:9s">
  <div class="glow anim a-glow"></div>
  <div class="cam anim push" style="animation-delay:4.6s">
  <div class="phone anim a-rise" style="animation-duration:.9s">
    <div class="screen">
      <div class="island"></div>
      <div class="top">
        <div class="logo dis">DK</div>
        <div><div class="nm hi">MDG टीम</div><div class="st hi">डीलर कवच</div></div>
      </div>
      <div class="chat">
        <div class="tag hi anim a-fade fast" style="animation-delay:.1s"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z"/><path d="M13.5 6.5l4 4"/></svg>लिखकर</div>
        <div class="bub me hi anim a-bub" style="animation-delay:.12s">नापतौल का सर्टिफ़िकेट कब तक रिन्यू होना है?</div>

        <div class="tag hi anim a-fade fast" style="animation-delay:.55s"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>बोलकर</div>
        <div class="bub me voice anim a-bub" style="animation-delay:.6s">
          <span class="pl"><svg class="i" viewBox="0 0 24 24" style="width:34px;height:34px;fill:#fff;stroke:none"><path d="M8 5.5v13l10.5-6.5Z"/></svg></span>
          <span class="wave"><i style="height:22px"></i><i style="height:40px"></i><i style="height:28px"></i><i style="height:52px"></i><i style="height:34px"></i><i style="height:46px"></i><i style="height:20px"></i><i style="height:38px"></i><i style="height:56px"></i><i style="height:30px"></i><i style="height:44px"></i><i style="height:24px"></i><i style="height:36px"></i><i style="height:50px"></i><i style="height:26px"></i><i style="height:40px"></i><i style="height:18px"></i><i style="height:32px"></i><i style="height:22px"></i></span>
          <span class="dur dis">0:14</span>
        </div>

        <div class="tag hi anim a-fade fast" style="animation-delay:1.05s"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 8.5a2 2 0 0 1 2-2h2.2L9.4 4h5.2l1.7 2.5h2.2a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.6"/></svg>फ़ोटो भेजकर</div>
        <div class="bub me photo anim a-bub" style="animation-delay:1.1s">
          <div class="img"><svg viewBox="0 0 520 330">
            <rect width="520" height="330" fill="#6E4A2E"/>
            <g transform="rotate(-4 260 165)">
              <rect x="110" y="18" width="300" height="300" fill="#FBF7EE"/>
              <rect x="140" y="44" width="240" height="18" fill="#3A332C"/>
              <rect x="140" y="84" width="200" height="9" fill="#8C8378"/><rect x="140" y="106" width="230" height="9" fill="#8C8378"/>
              <rect x="140" y="128" width="170" height="9" fill="#8C8378"/><rect x="140" y="150" width="220" height="9" fill="#8C8378"/>
              <rect x="140" y="172" width="150" height="9" fill="#8C8378"/>
              <circle cx="330" cy="250" r="38" fill="none" stroke="#3452A8" stroke-width="7" opacity=".75"/>
              <rect x="140" y="250" width="110" height="7" fill="#3452A8" opacity=".7"/>
            </g>
          </svg></div>
        </div>

        <div class="bub them hi anim a-bub" style="animation-delay:2.6s"><b class="dis" style="color:var(--maroon)">04-09</b> तक। उससे पहले हम याद दिलाते रहेंगे।</div>
      </div>
      <div class="rec anim up" style="animation-delay:3.85s"><svg class="i"><use href="#i-doc"/></svg><span class="t hi">हर बात का लिखित रिकॉर्ड</span></div>
    </div>
  </div>
  </div>
  <div class="rail hi">जैसे आपको आसान लगे</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
