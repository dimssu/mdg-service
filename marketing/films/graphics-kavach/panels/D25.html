<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
#D25 .hd{position:absolute;left:60px;right:60px;top:200px;text-align:center;font-size:76px;line-height:1.3;color:var(--maroon)}
/* the dividers live in a well that ends at the box's mouth, so they rise out of it */
#D25 .well{position:absolute;left:100px;right:100px;top:330px;height:772px;overflow:hidden}
#D25 .dv{position:absolute;left:0;right:0;height:760px;border-radius:18px 18px 0 0;padding:20px 30px 0 34px;
  display:flex;align-items:flex-start;gap:20px;box-shadow:0 -6px 16px rgba(58,16,10,.16),inset 0 0 0 1px rgba(160,120,70,.3)}
#D25 .dv .t{flex:1;font-size:44px;line-height:1.25;color:var(--print);padding-top:6px}
#D25 .dv .ck{width:58px;height:58px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,#27935A,#17663C);border:3px solid var(--amber)}
#D25 .dv .ck svg{width:32px;height:32px;stroke-width:3}
@keyframes riseOut{0%{transform:translateY(var(--ty))}75%{transform:translateY(-10px)}100%{transform:none}}
.ro{animation-name:riseOut;animation-duration:.55s!important;animation-timing-function:cubic-bezier(.3,.8,.4,1)!important}
@keyframes tickIn{0%{opacity:0;transform:scale(.3) rotate(-30deg)}60%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:none}}
.ti{animation-name:tickIn;animation-duration:.4s!important}
/* the box file itself */
#D25 .box{position:absolute;left:80px;right:80px;top:1060px;height:470px;border-radius:14px 14px 22px 22px;z-index:6;
  background:linear-gradient(170deg,#7E2C22,#5A1812 60%,#461210);
  box-shadow:0 40px 80px rgba(40,10,6,.45),inset 0 3px 0 rgba(255,255,255,.14),inset 0 -8px 20px rgba(0,0,0,.25)}
#D25 .box::before{content:'';position:absolute;inset:16px;border-radius:10px;border:2px dashed rgba(246,220,168,.28)}
#D25 .lbl{position:absolute;left:110px;right:110px;top:70px;height:250px;border-radius:12px;
  background:repeating-linear-gradient(transparent 0 58px,rgba(120,150,190,.35) 58px 60px) 0 34px / 100% 190px no-repeat,linear-gradient(170deg,#FFFDF8,#F1E4CE);
  box-shadow:inset 0 0 0 3px #C9A064,0 8px 18px rgba(0,0,0,.25)}
#D25 .hole{position:absolute;left:50%;bottom:44px;width:120px;height:44px;margin-left:-60px;border-radius:22px;background:#2A0B08;
  box-shadow:inset 0 4px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.12)}
#D25 .lid{position:absolute;left:80px;right:80px;top:1010px;height:70px;border-radius:14px 14px 4px 4px;z-index:7;transform-origin:50% 100%;
  background:linear-gradient(#8A3226,#5A1812)}
@keyframes lidOpen{0%{transform:perspective(900px) rotateX(0);opacity:1}100%{transform:perspective(900px) rotateX(-100deg);opacity:0}}
.lo{animation-name:lidOpen;animation-duration:.7s!important;animation-timing-function:cubic-bezier(.5,0,.4,1)!important}
#D25 .stamp{position:absolute;left:50%;top:1174px;z-index:8;width:560px;margin-left:-280px;text-align:center;font-size:48px;line-height:1.25;
  padding:12px 24px;border-width:7px}
#D25 .chips{position:absolute;left:60px;right:60px;top:1600px;display:flex;justify-content:center;gap:22px}
#D25 .chip{font-family:'Inter',sans-serif;font-weight:600;font-size:36px;color:var(--maroon);padding:14px 30px;border-radius:999px;
  background:#fff;border:3px solid var(--maroon);box-shadow:0 10px 20px rgba(74,15,15,.14);white-space:nowrap}
@keyframes chipIn{0%{opacity:0;transform:translateX(-60px)}100%{opacity:1;transform:none}}
.ch{animation-name:chipIn;animation-duration:.45s!important}
</style>
</head>
<body>
<!-- ══ D25 · records ready for inspection, all year · K520 "और आपके रिकॉर्ड साल भर इंस्पेक्शन के लिए तैयार रहें…" ══ -->
<div class="panel" id="D25" data-plate="office" style="--T:6s">
  <div class="glow anim a-glow" style="top:56%"></div>
  <div class="hd hi anim a-fade" style="animation-duration:.5s">रिकॉर्ड फ़ाइल</div>

  <div class="well">
    <div class="dv anim ro" style="top:0;--ty:780px;background:#FBF6EC;animation-delay:.6s"><span class="t hi">डी-एस-आर</span><span class="ck anim ti" style="animation-delay:.9s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="dv anim ro" style="top:112px;--ty:670px;background:#F6E9CF;animation-delay:1.0s"><span class="t hi">डेंसिटी रजिस्टर</span><span class="ck anim ti" style="animation-delay:1.3s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="dv anim ro" style="top:224px;--ty:560px;background:#FBF6EC;animation-delay:1.4s"><span class="t hi">स्टॉक बोर्ड</span><span class="ck anim ti" style="animation-delay:1.7s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="dv anim ro" style="top:336px;--ty:450px;background:#F6E9CF;animation-delay:1.8s"><span class="t hi">सैंपल रिकॉर्ड</span><span class="ck anim ti" style="animation-delay:2.1s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="dv anim ro" style="top:448px;--ty:340px;background:#FBF6EC;animation-delay:2.2s"><span class="t hi">लाइसेंस और प्रमाणपत्र</span><span class="ck anim ti" style="animation-delay:2.5s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="dv anim ro" style="top:560px;--ty:230px;background:#F6E9CF;animation-delay:2.6s"><span class="t hi">डिक्लेरेशन</span><span class="ck anim ti" style="animation-delay:2.9s"><svg class="i"><use href="#i-check"/></svg></span></div>
  </div>

  <div class="box anim a-rise" style="animation-duration:.6s"><div class="lbl"></div><div class="hole"></div></div>
  <div class="lid anim lo" style="animation-delay:.1s"></div>
  <div class="stamp hi anim a-stampdown" style="animation-delay:3.0s;animation-duration:4s">इंस्पेक्शन के लिए तैयार —<br/>साल भर</div>

  <div class="chips">
    <span class="chip anim ch" style="animation-delay:3.25s">Dhruva</span>
    <span class="chip anim ch" style="animation-delay:3.35s">MDT</span>
    <span class="chip anim ch" style="animation-delay:3.45s">QRC</span>
    <span class="chip anim ch" style="animation-delay:3.55s">mobile lab</span>
  </div>

  <div class="rail hi">साल भर तैयार</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
