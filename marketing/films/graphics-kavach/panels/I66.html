<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes fade{0%{opacity:0}100%{opacity:1}}
  @keyframes riseSettle{0%{opacity:0;transform:translateY(90px)}70%{opacity:1;transform:translateY(-8px)}100%{opacity:1;transform:none}}
  @keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  @keyframes push{0%{transform:scale(1)}100%{transform:scale(1.035)}}
  @keyframes halo{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}

  #I66 .halo{position:absolute;left:50%;top:44%;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,162,59,.30),rgba(233,162,59,0) 64%);z-index:1;animation-name:halo;animation-duration:7s;animation-timing-function:ease-in-out}
  #I66 .stage{display:flex;flex-direction:column;align-items:center;gap:76px;animation-name:push;animation-duration:7s;animation-timing-function:linear}
  #I66 .lk{position:relative;width:300px;height:300px;animation-duration:3.2s}
  #I66 .lk .body{position:absolute;inset:0;border-radius:78px;background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep));
    display:flex;align-items:center;justify-content:center;color:var(--amber);
    box-shadow:0 34px 76px rgba(0,0,0,.55),inset 0 -8px 20px rgba(0,0,0,.3),inset 0 0 0 3px rgba(233,162,59,.35)}
  #I66 .lk .body svg.i{width:160px;height:160px;stroke-width:1.7}
  #I66 .lk .gl{position:absolute;inset:0;border-radius:78px;overflow:hidden}
  #I66 .lk .gl i{position:absolute;inset:0;width:46%;display:block;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    animation-name:sweep;animation-duration:3s;animation-timing-function:ease-in-out}
  #I66 .chap .no{font-size:44px;animation-name:fade;animation-duration:.5s}
  #I66 .chap .nm{font-size:100px;line-height:1.28;margin-top:22px;animation-name:riseSettle;animation-duration:.9s}
  #I66 .chap .rule{width:260px;height:6px;margin-top:40px;transform-origin:50% 50%;animation-name:growX;animation-duration:.6s}
</style>
</head>
<body>
<!-- ══ I66 · chapter 8: your data's privacy · K801 (held 6.29 s) ═════════════════ -->
<div class="panel ink" id="I66" data-plate="night" style="--T:7s">
  <div class="halo mv"></div>
  <div class="stage mv">
    <div class="lk mv a-lock" style="animation-delay:0s">
      <div class="body"><svg class="i"><use href="#i-lock"/></svg></div>
      <div class="gl"><i class="mv" style="animation-delay:1.9s"></i></div>
    </div>
    <div class="chap">
      <div class="no hi mv" style="animation-delay:.15s">अध्याय 8</div>
      <div class="nm hi mv" style="animation-delay:.55s">आपके डेटा की<br/>गोपनीयता</div>
      <div class="rule mv" style="animation-delay:1.2s"></div>
    </div>
  </div>
  <div class="rail hi">आपका डेटा, आपका</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
