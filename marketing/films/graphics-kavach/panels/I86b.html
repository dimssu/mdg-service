<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* K027 runs 4.2 s of S57 first, so by this card "मुश्किल सिर्फ़ काम की नहीं — काम
   करने वालों" has been said and "की लागत भी" is being said (0.04–0.69 s here).
   Frame 0: the beam tipped left under "काम", "काम करने वालों की लागत" already
   falling; it lands at 0.28 s, the beam swings level by 1.2 s, and "एक बड़ी
   चुनौती" writes in 0.9–1.5 s, each word just ahead of the voice ("एक" at 1.34 s,
   measured). Settled from 1.85 s. */
#I86b{gap:0}
/* the whole balance sits 170 px higher than first built, so the balance and its verdict are centred in the frame
   rather than hanging in the lower half with the top third empty */
#I86b .rig{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:translateY(-170px)}
#I86b .post{position:absolute;left:526px;top:780px;width:28px;height:560px;border-radius:14px;
  background:linear-gradient(90deg,#C77C1B,#F4C979 45%,#C27716);box-shadow:0 20px 40px rgba(58,16,10,.22)}
#I86b .foot{position:absolute;left:390px;top:1330px;width:300px;height:44px;border-radius:22px 22px 12px 12px;
  background:linear-gradient(180deg,#F4C979,#C77C1B);box-shadow:0 22px 40px rgba(58,16,10,.28)}
#I86b .pivot{position:absolute;left:505px;top:745px;width:70px;height:70px;border-radius:50%;z-index:5;
  background:radial-gradient(circle at 35% 30%,#F7CD78,var(--amber) 55%,var(--amberDeep));box-shadow:0 10px 20px rgba(58,16,10,.3),inset 0 0 0 4px rgba(255,255,255,.35)}
/* the beam turns about (540,780); each hanger turns back by the same angle, so the pans hang straight */
#I86b .beam{position:absolute;left:230px;top:768px;width:620px;height:24px;border-radius:12px;transform-origin:310px 12px;z-index:4;
  background:linear-gradient(180deg,#F8D899,#E9A23B 55%,#C27716);box-shadow:0 14px 26px rgba(58,16,10,.25)}
#I86b .end{position:absolute;top:12px;width:0;height:0}
#I86b .hang{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#I86b .hook{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:#C27716;box-shadow:inset 0 0 0 5px #F4C979}
#I86b .str{position:absolute;left:-190px;top:0;width:380px;height:330px}
#I86b .str svg{width:100%;height:100%;overflow:visible}
#I86b .str path{fill:none;stroke:#A8834F;stroke-width:4;stroke-linecap:round}
#I86b .tray{position:absolute;left:-200px;top:326px;width:400px;height:26px;border-radius:0 0 200px 200px / 0 0 26px 26px;
  background:linear-gradient(180deg,#F4C979,#C77C1B);box-shadow:0 18px 30px rgba(58,16,10,.25)}
#I86b .load{position:absolute;left:-210px;width:420px;bottom:-328px;display:flex;justify-content:center}
#I86b .card{border-radius:26px;background:linear-gradient(170deg,#FFFDF8,#F6ECDD);border:3px solid rgba(214,168,98,.8);
  box-shadow:0 22px 44px rgba(58,16,10,.22);text-align:center;color:var(--maroon)}
#I86b .card.k{font-size:104px;line-height:1.1;padding:22px 50px 12px}
#I86b .card.c{font-size:56px;line-height:1.22;padding:22px 26px 16px;white-space:nowrap}
#I86b .res{position:absolute;left:40px;right:40px;top:1270px;text-align:center;font-size:104px;line-height:1.25;color:var(--maroon)}
#I86b .res i{display:block;width:460px;height:8px;border-radius:8px;margin:14px auto 0;transform-origin:50% 50%;
  background:linear-gradient(90deg,rgba(233,162,59,0),var(--amber) 22%,#F6C877 50%,var(--amber) 78%,rgba(233,162,59,0))}
@keyframes swing{0%{transform:rotate(-10deg)}30%{transform:rotate(-10deg)}62%{transform:rotate(3deg)}80%{transform:rotate(-1deg)}92%{transform:rotate(.35deg)}100%{transform:rotate(0deg)}}
@keyframes swingInv{0%{transform:rotate(10deg)}30%{transform:rotate(10deg)}62%{transform:rotate(-3deg)}80%{transform:rotate(1deg)}92%{transform:rotate(-.35deg)}100%{transform:rotate(0deg)}}
@keyframes dropIn{0%{transform:translateY(-100px)}100%{transform:none}}
@keyframes wr{0%{clip-path:inset(-20% 100% -20% 0)}100%{clip-path:inset(-20% -4% -20% 0)}}
@keyframes drawX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
</style>
</head>
<body>
<!-- ══ I86b · the work, and the cost of the people who do it · K027 "…काम करने वालों की लागत भी, एक बड़ी चुनौती है।" (from 4.2 s, 4.28 s) ══ -->
<div class="panel" id="I86b" data-plate="desk" style="--T:5s">
  <div class="glow" style="top:36%;opacity:.8"></div>
  <div class="rig">
    <div class="post"></div>
    <div class="foot"></div>
    <!-- swing: 0–0.28 s tipped, 0.28–1.25 s swings level -->
    <div class="beam" style="animation:swing 1.3s cubic-bezier(.4,0,.4,1) -.1s both paused">
      <div class="end" style="left:20px">
        <div class="hang" style="animation:swingInv 1.3s cubic-bezier(.4,0,.4,1) -.1s both paused">
          <div class="str"><svg viewBox="0 0 380 330"><path d="M190 0 L12 328 M190 0 L368 328"/></svg></div>
          <div class="tray"></div>
          <div class="load"><div class="card k hi">काम</div></div>
          <div class="hook"></div>
        </div>
      </div>
      <div class="end" style="left:600px">
        <div class="hang" style="animation:swingInv 1.3s cubic-bezier(.4,0,.4,1) -.1s both paused">
          <div class="str"><svg viewBox="0 0 380 330"><path d="M190 0 L12 328 M190 0 L368 328"/></svg></div>
          <div class="tray"></div>
          <div class="load" style="animation:dropIn .28s cubic-bezier(.55,0,.9,.6) 0s both paused"><div class="card c hi">काम करने वालों<br/>की लागत</div></div>
          <div class="hook"></div>
        </div>
      </div>
    </div>
    <div class="pivot"></div>
  </div>
  <div class="res hi"><span style="display:inline-block;animation:wr .6s linear .9s both paused">एक बड़ी चुनौती</span><i style="animation:drawX .5s ease-out 1.35s both paused"></i></div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
