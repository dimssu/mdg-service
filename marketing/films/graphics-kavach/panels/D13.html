<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* what the pump really recorded against what the DSR says, line by line. Three
   lines agree and tick; the stock line does not — two digits swapped — and it is
   caught, ringed, struck through and put right. */
.ttl{font-size:62px;color:var(--maroon);line-height:1.3;text-align:center}
.sheet{width:930px;--rot:-.8deg;padding:10px 0 20px}
.g{display:grid;grid-template-columns:200px 1fr 1fr 100px;padding:0 26px}
.g > div{display:flex;align-items:center;justify-content:center;border-bottom:2px solid #E4DACB;min-height:150px;text-align:center;position:relative}
.g > div:nth-child(4n+2),.g > div:nth-child(4n+3){border-left:2px solid #E4DACB}
.g .h{min-height:150px;flex-direction:column;gap:10px;font-size:34px;line-height:1.25;color:#3A332C;border-bottom:3px solid var(--print)}
.g .h .ic{width:52px;height:52px;border-radius:14px;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center}
.g .h .ic svg{width:30px;height:30px}
.g .k{justify-content:flex-start;font-size:46px;color:var(--ink);text-align:left;padding-left:8px}
.n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:58px;color:var(--print);letter-spacing:-.5px}
.n.hand{font-family:'Kalam',cursive;font-size:64px;color:#1F3B7A;letter-spacing:0}
.tk{width:70px;height:70px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 16px rgba(30,122,74,.3)}
.tk svg{width:40px;height:40px;stroke-width:3.2}
.tk.x{background:var(--bad);box-shadow:0 8px 16px rgba(192,57,43,.35);position:absolute}
.tk.ok2{position:absolute}
.row{display:contents}
.last{min-height:250px !important;flex-direction:column;gap:6px;justify-content:flex-start !important;padding-top:40px}
.g .k.last{flex-direction:row;padding-top:52px}
.tkcell{justify-content:flex-start !important;padding-top:50px}
.pul{border-radius:14px;padding:2px 10px}
svg.ring{position:absolute;left:-18px;top:-16px;width:calc(100% + 36px);height:calc(100% + 32px);overflow:visible}
svg.ring ellipse,svg.strike line{fill:none;stroke:var(--maroon);stroke-width:7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
svg.strike{position:absolute;left:-10px;top:0;width:calc(100% + 20px);height:100%;overflow:visible}
svg.strike line{stroke:var(--penRed);stroke-width:8}
@keyframes drawOn2{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.rg{position:relative;display:inline-block}
.fix{font-family:'Kalam',cursive;font-weight:700;font-size:64px;color:var(--good);display:flex;align-items:center;gap:10px}
@keyframes writeL{0%{clip-path:inset(-30% 100% -30% -4%)}100%{clip-path:inset(-30% -4% -30% -4%)}}
.wl{animation-name:writeL;animation-timing-function:linear}
@keyframes fadeOld{0%{opacity:1}100%{opacity:.62}}
@keyframes pulseBox{0%,100%{background:rgba(192,57,43,0)}30%,70%{background:rgba(192,57,43,.16)}}
.call{width:940px;display:flex;gap:24px;align-items:center;background:#fff;border-left:12px solid var(--amber);border-radius:18px;
  padding:26px 32px;box-shadow:0 18px 40px rgba(74,15,15,.16)}
.call .ic{width:76px;height:76px;border-radius:50%;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.call .ic svg{width:44px;height:44px;stroke-width:2.4}
.call span{font-size:44px;line-height:1.4;color:var(--ink)}
.call b{color:var(--good);font-weight:400}
@keyframes slideIn{0%{opacity:0;transform:translateX(-140px)}70%{opacity:1;transform:translateX(8px)}100%{opacity:1;transform:none}}
</style>
</head>
<body>
<!-- ══ D13 · the pump's real record vs the DSR · K309 "हम देखते हैं कि पंप पर जो रिकॉर्ड असल में बनना चाहिए, और आपकी डी-एस-आर में जो लिखा जा रहा है — दोनों में कोई फ़र्क़ तो नहीं।" (6.3 s) ══ -->
<div class="panel" id="D13" data-plate="desk" style="--T:7s">
  <div class="glow anim a-glow" style="animation-delay:-.5s"></div>
  <div class="ttl hi anim a-fade" style="animation-delay:0s;animation-duration:3s">दोनों में कोई फ़र्क़ तो नहीं?</div>
  <div class="paper sheet anim a-settle" style="--r0:3deg;--r1:-.8deg;animation-delay:.1s;animation-duration:3s">
    <div class="g">
      <div class="h"></div>
      <div class="h hi"><span class="ic"><svg class="i"><use href="#i-gauge"/></svg></span>पंप पर असल रिकॉर्ड</div>
      <div class="h hi"><span class="ic"><svg class="i"><use href="#i-doc"/></svg></span>डी-एस-आर में लिखा</div>
      <div class="h"></div>

      <div class="k hi anim a-fade" style="animation-delay:.3s;animation-duration:2s">रसीद</div>
      <div class="anim a-fade" style="animation-delay:.35s;animation-duration:2s"><span class="n hand">6,000 L</span></div>
      <div class="anim a-fade" style="animation-delay:.55s;animation-duration:2s"><span class="n">6,000 L</span></div>
      <div><span class="tk anim a-pop" style="animation-delay:.85s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>

      <div class="k hi anim a-fade" style="animation-delay:.95s;animation-duration:2s">डिप</div>
      <div class="anim a-fade" style="animation-delay:1.0s;animation-duration:2s"><span class="n hand">160 cm</span></div>
      <div class="anim a-fade" style="animation-delay:1.2s;animation-duration:2s"><span class="n">160 cm</span></div>
      <div><span class="tk anim a-pop" style="animation-delay:1.5s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>

      <div class="k hi anim a-fade" style="animation-delay:1.6s;animation-duration:2s">टेस्टिंग</div>
      <div class="anim a-fade" style="animation-delay:1.65s;animation-duration:2s"><span class="n hand">12 L</span></div>
      <div class="anim a-fade" style="animation-delay:1.85s;animation-duration:2s"><span class="n">12 L</span></div>
      <div><span class="tk anim a-pop" style="animation-delay:2.15s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>

      <div class="k hi last anim a-fade" style="animation-delay:2.25s;animation-duration:2s;border-bottom:none;align-items:flex-start">टंकी में<br/>स्टॉक</div>
      <div class="last anim a-fade" style="animation-delay:2.3s;animation-duration:2s;border-bottom:none">
        <span class="n hand pul anim" style="animation-name:pulseBox;animation-delay:2.55s;animation-duration:.8s">14,246 L</span></div>
      <div class="last anim a-fade" style="animation-delay:2.4s;animation-duration:2s;border-bottom:none">
        <span class="rg"><span class="n pul anim" style="display:inline-block;animation-name:pulseBox,fadeOld;animation-delay:2.55s,3.95s;animation-duration:.8s,.3s">14,426 L</span>
          <svg class="ring"><ellipse class="anim" pathLength="1" cx="50%" cy="50%" rx="49%" ry="47%" style="animation-name:drawOn2;animation-delay:2.9s;animation-duration:.45s"/></svg>
          <svg class="strike"><line class="anim" pathLength="1" x1="0" y1="52%" x2="100%" y2="48%" style="animation-name:drawOn2;animation-delay:3.85s;animation-duration:.3s"/></svg></span>
        <span class="fix"><span class="anim wl" style="animation-delay:4.1s;animation-duration:.35s">14,246 L</span></span>
      </div>
      <div class="last tkcell" style="border-bottom:none">
        <span class="tk x anim a-pop" style="animation-delay:3.0s;animation-duration:2s"><svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></span>
        <span class="tk ok2 anim a-pop" style="animation-delay:4.35s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span>
      </div>
    </div>
  </div>
  <div class="call anim" style="animation-name:slideIn;animation-delay:3.4s;animation-duration:.6s">
    <div class="ic"><svg class="i"><use href="#i-alert"/></svg></div>
    <span class="hi">अंक उलटे लिखे गए — पकड़ा गया, <b style="white-space:nowrap">सुधारा गया <svg class="i" style="width:40px;height:40px;color:var(--good);stroke-width:3.2;vertical-align:-6px"><use href="#i-check"/></svg></b></span></div>
  <div class="rail hi">काग़ज़ और असल, दोनों का मिलान</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
