<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* ── the Dealer Kavach phone, sized up so every line reads on a phone screen ── */
.phone.big{width:820px;height:1500px;border-radius:84px;padding:16px}
.phone.big .screen{border-radius:69px}
.phone.big .app-top{padding:34px 38px 26px;gap:18px}
.phone.big .app-top .logo{width:66px;height:66px;font-size:27px;border-radius:19px;font-family:'Space Grotesk',sans-serif}
.phone.big .app-top .nm{font-size:40px}
.tabpill{margin-left:auto;display:flex;align-items:center;gap:10px;color:#fff;font-size:32px;
  padding:10px 26px 12px 20px;border-radius:999px;background:linear-gradient(140deg,var(--maroonSoft),var(--maroon));
  box-shadow:0 6px 14px rgba(74,15,15,.28)}
.tabpill svg{width:34px;height:34px}
.phone.big .app-body{padding:36px 36px;gap:26px}
.tagx{align-self:center;font-size:30px;color:var(--amberDeep);background:#FFF6E4;border:2px dashed var(--amber);
  border-radius:999px;padding:8px 28px 10px}
.hd2{font-size:46px;color:var(--maroon);text-align:center;line-height:1.3}
.ringw{position:relative;width:400px;height:400px;align-self:center}
.ringw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringw .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringw .pc .n{font-size:128px;font-weight:700;color:var(--maroon);line-height:1;letter-spacing:-3px}
@keyframes ringTo{from{stroke-dashoffset:540.4}to{stroke-dashoffset:var(--off)}}
.ptsl{font-size:44px;color:var(--ink);text-align:center;line-height:1.2}
.ptsl .dis{font-weight:700;color:var(--maroon)}
.it{display:flex;align-items:center;gap:20px;background:#fff;border:2px solid #EFE4D2;border-radius:16px;
  padding:16px 22px;box-shadow:0 4px 12px rgba(74,15,15,.07)}
.it .ic{width:54px;height:54px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.it .ic svg{width:32px;height:32px;stroke-width:3}
.it .ic.ok{background:var(--good)} .it .ic.due{background:var(--amber)} .it .ic.late{background:var(--bad)}
.it .t{font-size:36px;color:var(--ink);line-height:1.3;flex:1}
.it .v{font-size:38px;font-weight:700;color:var(--maroon)}
.cav{font-size:30px;color:var(--inkMuted);text-align:center;font-style:normal}

.blk{background:#fff;border:2px solid #EFE4D2;border-radius:24px;padding:30px 32px 34px;box-shadow:0 10px 26px rgba(74,15,15,.10)}
.blk .bk{font-size:38px;color:var(--amberDeep);padding-bottom:18px;border-bottom:2px solid #F1E7D8;margin-bottom:22px}
.pend{display:flex;align-items:flex-start;gap:30px}
.pend .big{font-size:220px;font-weight:700;color:var(--maroon);line-height:.82;letter-spacing:-4px;padding-top:8px}
.pend .nl{display:flex;flex-direction:column;gap:16px;font-size:40px;color:var(--ink);line-height:1.3;padding-top:6px}
.pend .nl .b{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--amber);margin:0 18px 0 4px;
  vertical-align:middle;position:relative;top:-3px;box-shadow:0 0 0 6px rgba(233,162,59,.22)}
.exp{border-color:var(--amberSoft);background:linear-gradient(180deg,#FFFBF3,#fff)}
.er{display:flex;align-items:center;gap:16px;padding:30px 0;border-bottom:2px solid #F4EBDD}
.er:last-child{border-bottom:none;padding-bottom:4px}
.er .t{font-size:40px;color:var(--ink);flex:1}
.chip{display:flex;align-items:center;gap:10px;font-size:40px;font-weight:600;color:#7A4A08;background:#FDEBC4;
  border:2px solid var(--amber);border-radius:999px;padding:8px 24px 10px 18px;white-space:nowrap}
.chip svg{width:34px;height:34px}
/* a figure that rolls from one value to another (see the script at the end) */
.ctr{display:inline-flex;height:1em;line-height:1;overflow:hidden;vertical-align:top;font-variant-numeric:tabular-nums}
.ctr .cc{display:flex;flex-direction:column}
.ctr .cc span,.ctr .fx{display:block;height:1em;line-height:1}
@keyframes ctrRoll{from{transform:translateY(0)}to{transform:translateY(calc(var(--n) * -1em))}}
@keyframes ctrShow{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<!-- ══ P15 · pending and expiring on his phone · K422 "…कौन-से काम पेंडिंग हैं। और किस काम की वैलिडिटी ख़त्म होने वाली है।" (5.52 s) ══ -->
<div class="panel" id="P15" data-plate="desk" style="--T:6s">
  <div class="glow anim a-glow" style="animation-delay:-.4s"></div>
  <div class="phone big anim a-rise" style="--T:4s;height:1140px">
    <div class="screen">
        <div class="app-top"><div class="logo">DK</div><div class="nm hi">डीलर कवच</div>
          <div class="tabpill hi"><svg class="i" viewBox="0 0 24 24"><path d="M12 2.8 4.8 5.6v5.5c0 4.6 3 8.5 7.2 9.9 4.2-1.4 7.2-5.3 7.2-9.9V5.6Z"/><path d="m8.8 12 2.3 2.3 4.2-4.4"/></svg>कवच</div></div>
        <div class="app-body" style="gap:40px;padding-top:48px">
          <div class="blk anim a-drop" style="--T:4s;animation-delay:.15s">
            <div class="bk hi">कौन-से काम पेंडिंग</div>
            <div class="pend">
              <div class="big dis">9</div>
              <div class="nl">
                <div class="hi anim a-stamp" style="--T:3s;animation-delay:.55s"><i class="b"></i>मॉक ड्रिल</div>
                <div class="hi anim a-stamp" style="--T:3s;animation-delay:.95s"><i class="b"></i>फ़ायर NOC रिन्यूअल</div>
                <div class="hi anim a-stamp" style="--T:3s;animation-delay:1.35s"><i class="b"></i>नापतौल का सालाना काम</div>
                <div class="hi anim a-fade" style="--T:3s;animation-delay:1.75s">…</div>
              </div>
            </div>
          </div>
          <div class="blk exp anim a-rise" style="--T:3s;animation-delay:2.1s">
            <div class="bk hi">वैलिडिटी ख़त्म होने वाली</div>
            <div class="er"><span class="t hi">नापतौल सर्टिफ़िकेट</span><span class="chip hi anim a-pop" style="--T:3s;animation-delay:2.55s"><svg class="i"><use href="#i-clock"/></svg>15 दिन</span></div>
            <div class="er"><span class="t hi">इंश्योरेंस पॉलिसी</span><span class="chip hi anim a-pop" style="--T:3s;animation-delay:2.95s"><svg class="i"><use href="#i-clock"/></svg>27 दिन</span></div>
          </div>
        </div>
    </div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
<script>
/* A figure that rolls from one value to another, starting at a chosen second:
   <span class="ctr" data-from="120" data-to="200" data-at="2.8" data-dur=".8">.
   Each digit is a column running from its old digit to its new one; a place
   that did not exist before starts blank. Same paused clock as everything else. */
for (const el of document.querySelectorAll('.ctr[data-to]')) {
  const num = (s) => parseInt((s || '0').replace(/\D/g, '') || '0', 10);
  const to = el.dataset.to, A = num(el.dataset.from), B = num(to);
  const from = (el.dataset.from || '').padStart(to.length, ' ');
  const at = parseFloat(el.dataset.at || '0'), dur = parseFloat(el.dataset.dur || '.9');
  const nd = to.replace(/\D/g, '').length;
  el.textContent = '';
  let k = 0;
  [...to].forEach((ch, i) => {
    if (!/\d/.test(ch)) {
      const f = document.createElement('span'); f.className = 'fx'; f.textContent = ch;
      if (from[i] === ' ') f.style.animation = `ctrShow .15s linear ${(at + dur * .3).toFixed(2)}s both paused`;
      el.appendChild(f); return;
    }
    const p = nd - 1 - k++;
    const a = Math.floor(A / 10 ** p), b = Math.floor(B / 10 ** p);
    let n = b - a; if (n > 14) n = 10 + (((b - a) % 10) + 10) % 10;
    const col = document.createElement('span'); col.className = 'cc';
    for (let j = 0; j <= n; j++) {
      const s = document.createElement('span');
      s.textContent = (j === 0 && from[i] === ' ') ? '\u2007' : String((a + j) % 10);
      col.appendChild(s);
    }
    col.style.setProperty('--n', n);
    col.style.animation = `ctrRoll ${dur}s cubic-bezier(.3,.7,.25,1) ${(at + (nd - k) * .03).toFixed(2)}s both paused`;
    el.appendChild(col);
  });
}
</script>
</body>
</html>
