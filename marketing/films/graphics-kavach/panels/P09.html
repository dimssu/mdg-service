<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* the app's chat, by day. Messages land at the bottom and push the older ones
   up, the way a real chat scrolls, so four messages fit a phone-sized screen. */
.phone{width:860px;height:1520px;border-radius:84px;padding:16px;margin-top:-40px}
.screen{border-radius:70px;background:var(--cream)}
.island{position:absolute;top:22px;left:50%;width:150px;height:40px;margin-left:-75px;
  border-radius:20px;background:#000;z-index:10}
.top{padding:84px 36px 24px;display:flex;align-items:center;gap:20px;background:#fff;
  border-bottom:1px solid #EDE2D3;position:relative;z-index:2}
.logo{width:72px;height:72px;border-radius:20px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:28px;font-weight:700;color:#fff;
  background:linear-gradient(145deg,var(--maroonSoft),var(--maroonDeep))}
.top .nm{font-size:36px;color:#16120F;line-height:1.2}
.top .st{font-size:27px;color:var(--inkMuted);line-height:1.3}
.chat{flex:1;padding:0 30px 20px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  background:radial-gradient(rgba(107,22,22,.06) 1.5px,transparent 1.5px) 0 0/34px 34px,var(--creamSunk)}
.day{align-self:center;font-size:26px;color:#6E5E50;background:#FCF6DC;padding:8px 24px;border-radius:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);flex:none}
/* a message slot: grows open from nothing, so what is above it moves up */
.msg{display:flex;flex-direction:column;overflow:hidden;flex:none;padding:14px 16px;margin:0 -16px}
.msg.r{align-items:flex-end}.msg.l{align-items:flex-start}
@keyframes arrive{0%{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
  35%{opacity:1}100%{max-height:640px;opacity:1;padding-top:14px;padding-bottom:14px}}
.arr{animation-name:arrive;animation-timing-function:cubic-bezier(.3,.7,.3,1)}
.bub{font-size:42px;line-height:1.5;max-width:92%;border-radius:28px;padding:18px 26px 12px;
  box-shadow:0 4px 12px rgba(74,15,15,.12);color:var(--ink)}
.bub.them{background:#fff;border-top-left-radius:8px}
.bub.me{background:#FBE7C4;border-top-right-radius:8px}
.who{font-size:28px;color:var(--maroon);margin-bottom:4px}
.bub.me .who{color:var(--amberDeep)}
.bub .tm{font-size:24px;color:#9C9184;text-align:right;margin-top:4px}
.compose{margin:0 26px 34px;display:flex;align-items:center;gap:18px}
.compose .in{flex:1;background:#fff;border:2px solid #EDE2D3;border-radius:999px;padding:22px 30px;font-size:28px;color:#A89484}
.compose .mic{width:84px;height:84px;border-radius:50%;background:var(--maroon);color:#fff;
  display:flex;align-items:center;justify-content:center}

/* three photos from the manager; the middle one is badly shaken */
.album{display:flex;gap:14px;margin-top:6px}
.shot{width:216px;display:flex;flex-direction:column;gap:8px;align-items:center;position:relative}
.ph{width:216px;height:320px;border-radius:16px;overflow:hidden;position:relative;background:#5B4636}
.ph .sc{position:absolute;inset:-14px;filter:blur(5px)}
.ph.shaky .sc{filter:blur(13px)}
.cap{font-size:30px;color:#6E5A48;text-align:center;line-height:1.25}
.flagring{position:absolute;left:-10px;right:-10px;top:-10px;height:340px;border-radius:24px;
  border:6px solid var(--bad);box-shadow:0 0 0 6px rgba(192,57,43,.18)}
/* scene: a ruled challan register */
.reg{position:absolute;left:14px;top:44px;width:210px;height:280px;transform:rotate(4deg);background:#F7F1E3;
  background-image:repeating-linear-gradient(transparent 0 26px,#9DB3D6 26px 28px);box-shadow:0 8px 16px rgba(0,0,0,.4)}
.reg i{position:absolute;left:18px;height:9px;border-radius:5px;background:#243E8C}
/* scene: a dip chart, a printed table */
.dip{position:absolute;left:22px;top:40px;width:190px;height:290px;transform:rotate(-3deg);background:#fff;
  background-image:repeating-linear-gradient(transparent 0 22px,#555 22px 24px),repeating-linear-gradient(90deg,transparent 0 60px,#555 60px 62px);
  box-shadow:0 8px 16px rgba(0,0,0,.4)}
/* scene: the sample box — blurred in the album, sharp when it is sent again */
.box{position:absolute;left:18%;right:18%;bottom:10%;height:46%;background:linear-gradient(#B98A55,#8E6435);
  border-radius:8px;box-shadow:0 10px 20px rgba(0,0,0,.45)}
.box::before{content:'';position:absolute;left:0;right:0;top:0;height:16%;background:#A57845;border-radius:8px 8px 0 0}
.bt{position:absolute;bottom:34%;width:15%;height:52%;border-radius:12px 12px 6px 6px;
  background:linear-gradient(90deg,#E9E4DA,#FFFFFF 45%,#D5CEC2);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.bt::before{content:'';position:absolute;left:25%;right:25%;top:-14%;height:16%;background:#B3261E;border-radius:4px}
.bt::after{content:'';position:absolute;left:12%;right:12%;top:34%;height:36%;background:#F2E2BE;border-radius:3px;
  background-image:repeating-linear-gradient(transparent 0 7px,#243E8C 7px 9px)}
.clear{width:560px;height:340px;border-radius:18px;overflow:hidden;position:relative;margin-top:6px;
  background:linear-gradient(#6E5A48,#3E3027)}
.clear .bt{height:50%}
.clear .bt::after{background-image:repeating-linear-gradient(transparent 0 12px,#243E8C 12px 15px)}
.okb{position:absolute;right:14px;top:14px;width:72px;height:72px;border-radius:50%;background:var(--good);color:#fff;
  display:flex;align-items:center;justify-content:center;border:5px solid #fff;box-shadow:0 6px 14px rgba(30,122,74,.4)}
.okb svg{width:40px;height:40px;stroke-width:3.2}
.tk{display:inline-flex;vertical-align:-10px;width:54px;height:54px;border-radius:50%;background:var(--good);color:#fff;
  align-items:center;justify-content:center;margin:0 4px}
.tk svg{width:32px;height:32px;stroke-width:3.2}
.big .tk{width:78px;height:78px}.big .tk svg{width:46px;height:46px}
</style>
</head>
<body>
<!-- ══ P09 · staff send photos, the team verifies · K310 "… स्टाफ़ ज़रूरी फ़ोटो और जानकारी हमें भेजता है, और उसी के आधार पर हमारी टीम वेरिफ़िकेशन करती है।" (6.89 s) ══ -->
<div class="panel" id="P09" data-plate="office" style="--T:8s">
  <div class="glow anim a-glow" style="animation-delay:-.5s"></div>
  <div class="phone anim a-rise" style="animation-duration:3.5s">
    <div class="screen">
      <div class="island"></div>
      <div class="top">
        <div class="logo dis">DK</div>
        <div><div class="nm hi">MDG टीम</div><div class="st hi">डीलर कवच</div></div>
      </div>
      <div class="chat">
        <div class="day hi">आज</div>
        <!-- 15:20–15:21 · three photos from the manager -->
        <div class="msg r anim arr" style="animation-delay:.15s;animation-duration:.7s">
          <div class="bub me" style="padding:16px 20px 10px">
            <div class="who hi">मैनेजर</div>
            <div class="album">
              <div class="shot anim a-pop" style="animation-delay:.2s;animation-duration:3s">
                <div class="ph okclip"><div class="sc" style="background:#4A3A2E">
                  <div class="reg"><i style="top:30px;width:150px"></i><i style="top:58px;width:120px"></i><i style="top:86px;width:160px"></i><i style="top:114px;width:110px"></i><i style="top:142px;width:150px"></i><i style="top:170px;width:90px"></i></div></div></div>
                <div class="cap hi">चालान रजिस्टर</div>
              </div>
              <div class="shot anim a-pop" style="animation-delay:.8s;animation-duration:3s">
                <div class="ph shaky okclip"><div class="sc" style="background:linear-gradient(#6E5A48,#3E3027)">
                  <div class="box"></div><div class="bt" style="left:25%"></div><div class="bt" style="left:43%"></div><div class="bt" style="left:61%"></div></div></div>
                <div class="cap hi">सैंपल बॉक्स</div>
                <div class="flagring anim a-pop" style="animation-delay:3.0s;animation-duration:3s"></div>
              </div>
              <div class="shot anim a-pop" style="animation-delay:1.4s;animation-duration:3s">
                <div class="ph okclip"><div class="sc" style="background:#4A3A2E"><div class="dip"></div></div></div>
                <div class="cap hi">डिप चार्ट</div>
              </div>
            </div>
            <div class="tm dis">15:21</div>
          </div>
        </div>
        <!-- 15:34 · the team's reply -->
        <div class="msg l anim arr" style="animation-delay:2.4s;animation-duration:.75s">
          <div class="bub them">
            <div class="who hi">MDG टीम</div>
            <div class="hi">वेरिफ़िकेशन हो गया <span class="tk"><svg class="i"><use href="#i-check"/></svg></span> सैंपल बॉक्स की फ़ोटो धुंधली है — एक बार फिर भेजिए</div>
            <div class="tm dis">15:34</div>
          </div>
        </div>
        <!-- 15:36 · the sample box, sent again, sharp -->
        <div class="msg r anim arr" style="animation-delay:4.2s;animation-duration:.75s">
          <div class="bub me" style="padding:16px 20px 10px">
            <div class="who hi">मैनेजर</div>
            <div class="clear">
              <div class="box"></div><div class="bt" style="left:25%"></div><div class="bt" style="left:43%"></div><div class="bt" style="left:61%"></div>
              <div class="okb anim a-pop" style="animation-delay:4.6s;animation-duration:3s"><svg class="i"><use href="#i-check"/></svg></div>
            </div>
            <div class="cap hi" style="text-align:left;margin-top:8px">सैंपल बॉक्स</div>
            <div class="tm dis" style="margin-top:-30px">15:36</div>
          </div>
        </div>
        <!-- 15:37 · ✓ -->
        <div class="msg l anim arr" style="animation-delay:4.68s;animation-duration:.6s">
          <div class="bub them big" style="padding:16px 24px 10px">
            <span class="tk" style="margin:0"><svg class="i"><use href="#i-check"/></svg></span>
            <div class="tm dis">15:37</div>
          </div>
        </div>
      </div>
      <div class="compose">
        <div class="in hi">संदेश लिखें…</div>
        <div class="mic"><svg class="i" style="width:38px;height:38px" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>
      </div>
    </div>
  </div>
  <div class="rail hi">स्टाफ़ भेजता है, टीम जाँचती है</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
