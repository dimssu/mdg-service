<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
#P21 .phone{width:860px;height:1400px;border-radius:84px;padding:16px}
#P21 .screen{border-radius:70px;background:#F4EBDD}
#P21 .island{position:absolute;top:22px;left:50%;width:150px;height:40px;margin-left:-75px;border-radius:20px;background:#000;z-index:10}
#P21 .top{padding:84px 36px 24px;display:flex;align-items:center;gap:20px;background:#fff;border-bottom:1px solid #EDE7E0}
#P21 .logo{width:72px;height:72px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:#fff;background:linear-gradient(145deg,var(--maroonSoft),var(--maroonDeep))}
#P21 .top .nm{font-size:36px;color:#16120F;line-height:1.2}
#P21 .top .st{font-size:26px;color:var(--inkMuted);line-height:1.3}
#P21 .chat{flex:1;padding:28px 26px;display:flex;flex-direction:column;gap:18px}
#P21 .day{align-self:center;font-size:26px;color:#5C5248;background:#FCF6DC;padding:8px 22px;border-radius:12px}
#P21 .bub{align-self:flex-start;width:96%;max-width:none;background:#fff;border-radius:26px;border-top-left-radius:8px;padding:12px;
  box-shadow:0 4px 14px rgba(74,15,15,.12)}
#P21 .kc{border-radius:18px;overflow:hidden;border:2px solid var(--amberSoft)}
#P21 .kc-top{background:linear-gradient(120deg,var(--maroonSoft),var(--maroon) 62%);border-bottom:5px solid var(--amber);
  padding:24px 26px;color:#fff;font-size:40px;line-height:1.35}
#P21 .rw{display:flex;align-items:center;gap:18px;padding:24px 24px;border-bottom:1.5px solid #F0E6D6;background:var(--cream)}
#P21 .rw .d{font-family:'Inter',sans-serif;font-weight:600;font-size:30px;color:#6B5E52;width:100px;flex:none}
#P21 .rw .t{font-size:37px;color:var(--ink);line-height:1.3;flex:1}
#P21 .rw .a{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:42px;color:var(--bad);flex:none}
#P21 .rw.first{background:#FFF6DA}
#P21 .sl{border-bottom:1.5px solid #F0E6D6;background:
  linear-gradient(#EEE4D4,#EEE4D4) 24px 50%/88px 16px no-repeat,
  linear-gradient(#EEE4D4,#EEE4D4) 142px 50%/330px 16px no-repeat,
  linear-gradient(#EEE4D4,#EEE4D4) right 24px top 50%/130px 20px no-repeat,var(--cream)}
#P21 .sl .rw{border-bottom:0}
#P21 .slt{background:linear-gradient(#EEE4D4,#EEE4D4) 24px 50%/260px 18px no-repeat,linear-gradient(#EEE4D4,#EEE4D4) right 24px top 50%/190px 26px no-repeat,#fff}
#P21 .tot{display:flex;align-items:center;padding:24px 24px;background:#fff;font-size:40px;color:var(--ink)}
#P21 .tot b{margin-left:auto;font-family:'Space Grotesk',sans-serif;font-size:64px;line-height:1.1;color:var(--maroon)}
#P21 .band{display:flex;align-items:center;gap:18px;padding:22px 24px;background:var(--maroonDeep);color:#FFF3E2;font-size:40px}
#P21 .band .lk{width:60px;height:60px;border-radius:16px;background:var(--amber);color:var(--maroonDeep);display:flex;align-items:center;justify-content:center;flex:none}
#P21 .band .lk svg{width:38px;height:38px;stroke-width:2.4}
#P21 .compose{margin:0 26px 34px;display:flex;align-items:center;gap:18px}
#P21 .compose .in{flex:1;background:#fff;border-radius:999px;padding:22px 30px;font-size:28px;color:#A89886}
#P21 .compose .mic{width:84px;height:84px;border-radius:50%;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center}
.fast{animation-duration:.55s!important}
.lockin{animation-duration:1s!important}
</style>
</head>
<body>
<!-- ══ P21 · told separately: what came off that was not fuel · K511 "…उसकी जानकारी आपको अलग से दी जाती है।" ══ -->
<div class="panel" id="P21" data-plate="desk" style="--T:6s">
  <div class="glow anim a-glow"></div>
  <div class="phone anim a-rise" style="animation-duration:.8s">
    <div class="screen">
      <div class="island"></div>
      <div class="top">
        <div class="logo dis">DK</div>
        <div><div class="nm hi">MDG टीम</div><div class="st hi">डीलर कवच</div></div>
      </div>
      <div class="chat">
        <div class="day hi">आज</div>
        <div class="bub anim a-bub" style="animation-delay:.1s;animation-duration:.6s">
          <div class="kc">
            <div class="kc-top hi">ईंधन ख़रीद और जमा के अलावा — <span style="white-space:nowrap">पिछली 4 एंट्री</span></div>
            <div class="sl"><div class="rw first anim a-stamp fast" style="animation-delay:.6s"><span class="d">20-08</span><span class="t hi">लाइसेंस फ़ीस रिकवरी</span><span class="a">₹8,260</span></div></div>
            <div class="sl"><div class="rw anim a-stamp fast" style="animation-delay:1.3s"><span class="d">14-08</span><span class="t hi">ब्याज — क्रेडिट देर से लौटा</span><span class="a">₹1,184</span></div></div>
            <div class="sl"><div class="rw anim a-stamp fast" style="animation-delay:2.0s"><span class="d">09-08</span><span class="t hi">कार्ड सेटलमेंट चार्ज</span><span class="a">₹642</span></div></div>
            <div class="sl"><div class="rw anim a-stamp fast" style="animation-delay:2.7s"><span class="d">02-08</span><span class="t hi">कमीशन वापसी</span><span class="a">₹3,915</span></div></div>
            <div class="slt"><div class="tot hi anim a-fade fast" style="animation-delay:3.3s"><span>इन 4 का जोड़:</span><b>₹14,001</b></div></div>
            <div class="band hi anim a-lock lockin" style="animation-delay:3.55s"><span class="lk"><svg class="i"><use href="#i-lock"/></svg></span><span>यह DOD जमा राशि नहीं है</span></div>
          </div>
        </div>
      </div>
      <div class="compose">
        <div class="in hi">संदेश लिखें…</div>
        <div class="mic"><svg class="i" style="width:38px;height:38px" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>
      </div>
    </div>
  </div>
  <div class="rail hi">अलग से, साफ़-साफ़</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
