<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* paper on the left, what really happens on the forecourt on the right; a gold
   line joins each pair across, and the match lands in the middle. Both columns
   share one grid, so every pair and its joining line sit on the same row. */
.stage{display:flex;flex-direction:column;align-items:center;gap:56px;transform-origin:50% 82%}
.hd{font-size:76px;color:var(--maroon);line-height:1.25;text-align:center}
.g{display:grid;grid-template-columns:400px 110px 400px;grid-auto-rows:150px;row-gap:30px}
.col{display:flex;align-items:center;justify-content:center;gap:16px;font-size:42px;line-height:1.25;color:var(--inkMuted);height:100px;align-self:end}
.col .ic{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.col .ic svg{width:36px;height:36px}
.card{display:flex;align-items:center;gap:20px;padding:0 26px;border-radius:18px;font-size:46px;line-height:1.25;color:var(--ink);
  box-shadow:0 14px 30px rgba(58,16,10,.16),0 2px 6px rgba(58,16,10,.1)}
.card .ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.card .ic svg{width:36px;height:36px}
.card.p{background:var(--paper);border:1px solid var(--paperEdge);
  background-image:linear-gradient(transparent calc(100% - 2px),var(--rule) 0);background-size:100% 34px}
.card.p .ic{background:var(--maroon);border-radius:16px}
.card.r{background:#fff;border:2px solid #EFE4D2}
.card.r .ic{background:linear-gradient(150deg,var(--amber),var(--amberDeep))}
.jn{position:relative}
.jn i{position:absolute;left:-14px;right:-14px;top:50%;height:7px;margin-top:-3.5px;border-radius:4px;transform-origin:0 50%;
  background:linear-gradient(90deg,#E9A23B,#F4C979,#E9A23B);box-shadow:0 0 14px rgba(233,162,59,.55)}
.jn b{position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:#E9A23B;box-shadow:0 0 0 5px rgba(255,255,255,.9)}
@keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes inL{0%{opacity:0;transform:translateX(-120px)}100%{opacity:1;transform:none}}
@keyframes inR{0%{opacity:0;transform:translateX(120px)}100%{opacity:1;transform:none}}
.res{display:flex;flex-direction:column;align-items:center;gap:22px}
.res .tk{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#2FA266,var(--good) 60%,#155C37);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 20px 44px rgba(30,122,74,.42),0 0 0 10px rgba(255,255,255,.8)}
.res .tk svg{width:88px;height:88px;stroke-width:3}
.res .t{font-size:66px;color:var(--maroon);line-height:1.3}
@keyframes writeL{0%{clip-path:inset(-30% 100% -30% -4%)}100%{clip-path:inset(-30% -4% -30% -4%)}}
.wl{animation-name:writeL;animation-timing-function:linear}
@keyframes push{0%{transform:scale(1)}100%{transform:scale(1.04)}}
</style>
</head>
<body>
<!-- ══ I22 · paper records vs what really happens · K311 "यानी एम-डी-जी सर्विसेज़ सिर्फ़ डेटा लेकर नहीं रुकती। काग़ज़ के रिकॉर्ड, और पंप पर असल में जो हो रहा है — दोनों का मिलान भी करती है।" (7.67 s) ══ -->
<div class="panel" id="I22" data-plate="office" style="--T:9s">
  <div class="glow anim a-glow" style="animation-delay:-.5s;top:62%"></div>
  <div class="stage anim" style="animation-name:push;animation-delay:5.3s;animation-duration:3.3s;animation-timing-function:linear">
    <div class="hd hi anim a-fade" style="animation-delay:0s;animation-duration:3s">सिर्फ़ डेटा नहीं</div>
    <div class="g">
      <div class="col hi anim a-fade" style="grid-column:1;animation-delay:.1s;animation-duration:3s"><span class="ic" style="background:var(--maroon)"><svg class="i"><use href="#i-doc"/></svg></span>काग़ज़ का रिकॉर्ड</div>
      <div class="col hi anim a-fade" style="grid-column:3;animation-delay:1.5s;animation-duration:3s"><span class="ic" style="background:var(--amberDeep)"><svg class="i"><use href="#i-gauge"/></svg></span>पंप पर असल में</div>

      <div class="card p hi anim" style="grid-column:1;grid-row:2;animation-name:inL;animation-delay:.3s;animation-duration:.55s"><span class="ic"><svg class="i"><use href="#i-doc"/></svg></span>डी-एस-आर</div>
      <div class="card p hi anim" style="grid-column:1;grid-row:3;animation-name:inL;animation-delay:.7s;animation-duration:.55s"><span class="ic"><svg class="i"><use href="#i-doc"/></svg></span>डेंसिटी रजिस्टर</div>
      <div class="card p hi anim" style="grid-column:1;grid-row:4;animation-name:inL;animation-delay:1.1s;animation-duration:.55s"><span class="ic"><svg class="i"><use href="#i-doc"/></svg></span>स्टॉक बोर्ड</div>

      <div class="card r hi anim" style="grid-column:3;grid-row:2;animation-name:inR;animation-delay:1.7s;animation-duration:.55s"><span class="ic"><svg class="i"><use href="#i-drop"/></svg></span>टंकी की डिप</div>
      <div class="card r hi anim" style="grid-column:3;grid-row:3;animation-name:inR;animation-delay:2.1s;animation-duration:.55s"><span class="ic"><svg class="i"><use href="#i-gauge"/></svg></span>टैंकर की डेंसिटी</div>
      <div class="card r hi anim" style="grid-column:3;grid-row:4;animation-name:inR;animation-delay:2.5s;animation-duration:.55s"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 8.6a2 2 0 0 1 2-2h2.4l1.5-2.1h5.2l1.5 2.1h2.4a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.9" r="3.4"/></svg></span>बोर्ड की फ़ोटो</div>

      <div class="jn" style="grid-column:2;grid-row:2"><i class="anim" style="animation-name:growX;animation-delay:3.1s;animation-duration:.45s"></i><b class="anim a-pop" style="left:-11px;animation-delay:3.05s;animation-duration:2s"></b><b class="anim a-pop" style="right:-11px;animation-delay:3.45s;animation-duration:2s"></b></div>
      <div class="jn" style="grid-column:2;grid-row:3"><i class="anim" style="animation-name:growX;animation-delay:3.6s;animation-duration:.45s"></i><b class="anim a-pop" style="left:-11px;animation-delay:3.55s;animation-duration:2s"></b><b class="anim a-pop" style="right:-11px;animation-delay:3.95s;animation-duration:2s"></b></div>
      <div class="jn" style="grid-column:2;grid-row:4"><i class="anim" style="animation-name:growX;animation-delay:4.1s;animation-duration:.45s"></i><b class="anim a-pop" style="left:-11px;animation-delay:4.05s;animation-duration:2s"></b><b class="anim a-pop" style="right:-11px;animation-delay:4.45s;animation-duration:2s"></b></div>
    </div>
    <div class="res">
      <div class="tk anim a-pop" style="animation-delay:4.7s;animation-duration:3s"><svg class="i"><use href="#i-check"/></svg></div>
      <div class="t hi anim wl" style="animation-delay:4.95s;animation-duration:.6s">दोनों का मिलान</div>
    </div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
