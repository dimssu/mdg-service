<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* the paper tag tied to a sealed sample bottle's neck swings in and settles;
   every field on it is ticked in turn, top to bottom; then the two verdicts land. */
.panel{justify-content:flex-start}
.neck{position:absolute;left:50%;top:-40px;width:150px;height:250px;margin-left:-75px;z-index:2;
  background:linear-gradient(90deg,#5E3510,#A8692A 38%,#D69A55 48%,#8A5220 62%,#4E2A0C);
  border-radius:0 0 10px 10px;box-shadow:0 20px 40px rgba(40,14,6,.35)}
.neck::before{content:'';position:absolute;left:-18px;right:-18px;top:0;height:110px;border-radius:0 0 14px 14px;
  background:linear-gradient(90deg,#7C1A14,#B3261E 45%,#7C1A14)}
.neck::after{content:'';position:absolute;left:-10px;right:-10px;top:150px;height:20px;border-radius:10px;
  background:linear-gradient(90deg,#8C8378,#D8D2C8 45%,#7C736A)}
.swing{position:absolute;left:0;right:0;top:0;height:1500px;transform-origin:540px 160px;z-index:3}
@keyframes swingIn{0%{opacity:0;transform:rotate(-20deg)}12%{opacity:1}34%{transform:rotate(7deg)}56%{transform:rotate(-3.2deg)}
  76%{transform:rotate(1.3deg)}90%{transform:rotate(-.4deg)}100%{opacity:1;transform:none}}
.string{position:absolute;left:0;top:0;width:1080px;height:340px;overflow:visible}
.string path{fill:none;stroke:#C9B48E;stroke-width:6;stroke-linecap:round}
.tag{position:absolute;left:100px;top:300px;width:880px;padding:96px 44px 26px;
  background:linear-gradient(170deg,#F6E8C7,#EED9AE);
  clip-path:polygon(70px 0,810px 0,880px 70px,880px 100%,0 100%,0 70px);
  filter:drop-shadow(0 30px 40px rgba(40,14,6,.35))}
.tag::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.4),rgba(255,255,255,0) 40%),
    repeating-linear-gradient(0deg,rgba(120,80,30,.035) 0 2px,transparent 2px 5px)}
.hole{position:absolute;left:440px;top:30px;width:44px;height:44px;margin-left:-22px;border-radius:50%;
  background:#6F5A45;box-shadow:0 0 0 12px #E2C996,inset 0 3px 6px rgba(0,0,0,.4)}
.tag h1{font-weight:400;font-size:56px;color:var(--maroon);text-align:center;line-height:1.3;padding-bottom:14px;
  border-bottom:3px solid #B89A66;margin-bottom:6px}
.fld{display:grid;grid-template-columns:1fr auto 70px;align-items:center;gap:20px;height:96px;border-bottom:2px dashed #C9AE7E}
.fld:last-child{border-bottom:none}
.fld .k{font-size:38px;color:#5A4632}
.fld .v{font-family:'Kalam',cursive;font-weight:700;font-size:48px;color:#1F3B7A;justify-self:end}
.fld .v.en{font-family:Inter,sans-serif;font-weight:600;font-size:34px;color:#5A4632}
.fld .t{width:60px;height:60px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 12px rgba(30,122,74,.3)}
.fld .t svg{width:36px;height:36px;stroke-width:3.2}
svg.sig{width:200px;height:70px;overflow:visible}
svg.sig path{fill:none;stroke:#1F3B7A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.verdicts{position:absolute;left:0;right:0;top:1345px;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:4}
.rib{display:flex;align-items:center;gap:20px;background:linear-gradient(120deg,#23884F,var(--good));color:#fff;
  font-size:46px;line-height:1.3;padding:18px 44px 18px 26px;border-radius:14px;box-shadow:0 16px 30px rgba(20,70,40,.35)}
.rib .c{width:62px;height:62px;border-radius:50%;background:#fff;color:var(--good);display:flex;align-items:center;justify-content:center;flex:none}
.rib .c svg{width:38px;height:38px;stroke-width:3.2}
@keyframes land{0%{opacity:0;transform:translateY(-60px) scale(1.12) rotate(-2deg)}60%{opacity:1;transform:translateY(6px) scale(.98)}100%{opacity:1;transform:none}}
</style>
</head>
<body>
<!-- ══ D11 · the sample label, every field checked · K306 "… पंप पर सैंपलिंग सही तरीक़े से हुई या नहीं, और सैंपल पर ज़रूरी जानकारी ठीक से लिखी गई या नहीं — ये भी जाँचा जाता है।" (6.14 s) ══ -->
<div class="panel" id="D11" data-plate="desk" style="--T:7s">
  <div class="glow anim a-glow" style="animation-delay:-.5s;top:44%"></div>
  <div class="neck anim a-drop" style="animation-delay:0s;animation-duration:2.5s"></div>
  <div class="swing anim" style="animation-name:swingIn;animation-delay:.1s;animation-duration:1.5s;animation-timing-function:ease-out">
    <svg class="string"><path d="M540 160 C 520 220, 560 270, 540 330"/></svg>
    <div class="tag">
      <div class="hole"></div>
      <h1 class="hi">सैंपल लेबल</h1>
      <div class="fld"><span class="k hi">उत्पाद</span><span class="v">HSD</span><span class="t anim a-pop" style="animation-delay:1.0s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>
      <div class="fld"><span class="k hi">तारीख़</span><span class="v">20-08</span><span class="t anim a-pop" style="animation-delay:1.33s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>
      <div class="fld"><span class="k hi">टैंक नं.</span><span class="v">2</span><span class="t anim a-pop" style="animation-delay:1.66s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>
      <div class="fld"><span class="k hi">इनवॉइस / चालान नं.</span><span class="v">••••4436</span><span class="t anim a-pop" style="animation-delay:1.99s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>
      <div class="fld"><span class="k" style="font-family:Inter,sans-serif;font-weight:500;font-size:36px">Density@15</span><span class="v">831.5</span><span class="t anim a-pop" style="animation-delay:2.32s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>
      <div class="fld"><span class="k hi">सील नं.</span><span class="v">047721</span><span class="t anim a-pop" style="animation-delay:2.65s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>
      <div class="fld"><span class="k hi">डीलर के हस्ताक्षर</span>
        <svg class="sig" viewBox="0 0 200 70"><path d="M8 48 C 22 10, 34 12, 30 44 C 28 60, 44 30, 56 26 C 66 22, 60 50, 72 46 C 88 40, 92 18, 104 22 C 114 26, 104 52, 120 46 C 138 38, 150 30, 190 34"/></svg>
        <span class="t anim a-pop" style="animation-delay:2.98s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>
      <div class="fld"><span class="k hi">ड्राइवर के हस्ताक्षर</span>
        <svg class="sig" viewBox="0 0 200 70"><path d="M12 40 C 30 18, 44 58, 58 36 C 70 16, 80 16, 82 38 C 84 56, 100 30, 112 30 C 126 30, 118 52, 136 48 C 152 44, 160 26, 188 30"/></svg>
        <span class="t anim a-pop" style="animation-delay:3.31s;animation-duration:2s"><svg class="i"><use href="#i-check"/></svg></span></div>
    </div>
  </div>
  <div class="verdicts">
    <div class="rib anim" style="animation-name:land;animation-delay:3.65s;animation-duration:.55s"><span class="c"><svg class="i"><use href="#i-check"/></svg></span><span class="hi">सैंपलिंग सही तरीक़े से हुई</span></div>
    <div class="rib anim" style="animation-name:land;animation-delay:4.1s;animation-duration:.55s"><span class="c"><svg class="i"><use href="#i-check"/></svg></span><span class="hi">ज़रूरी जानकारी ठीक से लिखी गई</span></div>
  </div>
  <div class="rail hi">सैंपल की हर जानकारी, जाँची गई</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
