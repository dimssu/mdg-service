<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes show{0%{opacity:0}100%{opacity:1}}
  @keyframes dash{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
  @keyframes slideIn{0%{opacity:0;transform:translateX(var(--sx,-240px)) scale(.9) rotate(var(--r,-3deg))}60%{opacity:1;transform:translateX(0) rotate(0)}100%{opacity:1;transform:none}}
  @keyframes wr{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(-10% -4% -10% 0)}}
  @keyframes glowIn{0%{opacity:0}100%{opacity:1}}
  @keyframes halo{0%,100%{opacity:.5}50%{opacity:.85}}

  #I71{gap:44px}
  #I71 .halo{position:absolute;left:50%;top:50%;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,162,59,.32),rgba(233,162,59,0) 64%);z-index:1;animation-name:halo;animation-duration:7s}
  #I71 .hd{font-size:58px;color:var(--maroon);text-align:center;line-height:1.35;animation-name:show;animation-duration:.4s}
  #I71 .sh{position:relative;width:800px;height:940px}
  #I71 .sh > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #I71 .sh .fillp{fill:url(#shf);animation-name:glowIn;animation-duration:.6s}
  #I71 .sh .edge{fill:none;stroke:var(--amber);stroke-width:12;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
    filter:drop-shadow(0 12px 20px rgba(120,60,10,.35));animation-name:dash;animation-duration:.9s;animation-timing-function:cubic-bezier(.5,.1,.3,1)}
  #I71 .stack{position:absolute;left:0;right:0;top:150px;display:flex;flex-direction:column;align-items:center;gap:22px}
  #I71 .chip{display:flex;align-items:center;gap:20px;background:#fff;border:2px solid #EFE4D2;border-radius:22px;padding:18px 30px 18px 20px;
    box-shadow:0 14px 30px rgba(58,16,10,.18);animation-name:slideIn;animation-duration:.55s}
  #I71 .chip .g{width:66px;height:66px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))}
  #I71 .chip .g svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #I71 .chip .t{font-size:46px;color:var(--ink);line-height:1.2}
  #I71 .coda{font-size:62px;color:var(--maroonDeep);text-align:center;animation-name:wr;animation-duration:.55s;animation-timing-function:linear}
</style>
</head>
<body>
<!-- ══ I71 · you run the pump, we carry the rest · K902 (held 6 s, from 5.0 s into the line) ══
     chips land as each word is spoken: डेटा ~0.3, कंप्लायंस ~0.9, डिजिटल काम ~2.2, निगरानी ~3.1, हर ज़रूरी मदद ~3.8 -->
<div class="panel" id="I71" data-plate="office" style="--T:7s">
  <div class="halo mv"></div>
  <div class="hd hi mv" style="animation-delay:-.1s">आप अपने पंप के कारोबार पर<br/>ध्यान दीजिए</div>
  <div class="sh">
    <svg viewBox="0 0 800 940">
      <defs><linearGradient id="shf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFBF3" stop-opacity=".92"/><stop offset="1" stop-color="#F6DCA8" stop-opacity=".78"/></linearGradient></defs>
      <path class="fillp mv" style="animation-delay:.0s" d="M400 18 L770 112 V440 C770 670 610 832 400 922 C190 832 30 670 30 440 V112 Z"/>
      <path class="edge mv" pathLength="1" style="animation-delay:.05s" d="M400 18 L770 112 V440 C770 670 610 832 400 922 C190 832 30 670 30 440 V112 Z"/>
    </svg>
    <div class="stack">
      <div class="chip mv" style="animation-delay:.3s;--r:-4deg;--sx:-240px"><span class="g"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-6"/><path d="M5 11.5v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-6"/></svg></span><span class="t hi">डेटा</span></div>
      <div class="chip mv" style="animation-delay:.9s;--r:3deg;--sx:240px"><span class="g"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M8.8 14.2l2.2 2.2 4.2-4.6"/></svg></span><span class="t hi">कंप्लायंस</span></div>
      <div class="chip mv" style="animation-delay:1.95s;--r:-3deg;--sx:-240px"><span class="g"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 18.5h3"/></svg></span><span class="t hi">डिजिटल काम</span></div>
      <div class="chip mv" style="animation-delay:2.85s;--r:4deg;--sx:240px"><span class="g"><svg viewBox="0 0 24 24"><path d="M3 12s3.4-6 9-6 9 6 9 6-3.4 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.6"/></svg></span><span class="t hi">निगरानी</span></div>
      <div class="chip mv" style="animation-delay:3.4s;--r:-3deg;--sx:-240px"><span class="g"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.6-7.5 10-7.5 10Z"/></svg></span><span class="t hi">हर ज़रूरी मदद</span></div>
    </div>
  </div>
  <div class="coda hi mv" style="animation-delay:3.95s">हमारी टीम आपका साथ देगी</div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
