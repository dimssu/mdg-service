<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes phoneIn{0%{opacity:0;transform:translateY(420px) scale(.92)}100%{opacity:1;transform:none}}
  @keyframes flyIn{0%{opacity:1;transform:translate(0,0) scale(1) rotate(var(--r))}80%{opacity:1}100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.25) rotate(0)}}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
  @keyframes lit{0%{color:#A89A8C}100%{color:var(--maroon)}}
  @keyframes pillIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
  @keyframes line{0%{opacity:0;transform:translateY(-40px)}100%{opacity:1;transform:none}}
  @keyframes halo{0%,100%{opacity:.55}50%{opacity:.9}}

  #P26{justify-content:flex-start;padding-top:230px;gap:46px}
  #P26 .halo{position:absolute;left:50%;top:56%;width:1250px;height:1250px;margin:-625px 0 0 -625px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,162,59,.36),rgba(233,162,59,0) 64%);z-index:1;animation-name:halo;animation-duration:8s}
  #P26 .ln{display:flex;align-items:center;gap:18px;font-size:68px;color:var(--maroon);animation-name:line;animation-duration:.55s}
  #P26 .ln b{color:var(--amberDeep);font-weight:400}
  #P26 .phone{animation-name:phoneIn;animation-duration:1.0s}
  #P26 .app-top .logo{font-size:24px}
  #P26 .app-top .nm{font-size:34px}
  #P26 .app-body{padding:30px 26px 22px;gap:24px}
  #P26 .g6{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  #P26 .mt{height:268px;background:#fff;border:2px solid #EFE4D2;border-radius:26px;padding:30px 16px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    text-align:center;box-shadow:0 6px 16px rgba(74,15,15,.08);animation-name:pop;animation-duration:.4s}
  #P26 .mt .g{width:100px;height:100px;border-radius:28px;display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:inset 0 -4px 10px rgba(0,0,0,.2)}
  #P26 .g svg,#P26 .fly svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  #P26 .mt .g svg{width:58px;height:58px}
  #P26 .mt .t{font-size:34px;color:var(--ink);line-height:1.25}
  #P26 .tabs{margin-top:auto;display:flex;justify-content:space-around;background:#fff;border-top:2px solid #EFE4D2;margin:auto -26px -22px;padding:18px 6px 26px}
  #P26 .tab{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;gap:8px;width:150px;color:#A89A8C;animation-name:lit;animation-duration:.3s}
  #P26 .tab .pl{position:absolute;top:-6px;left:50%;width:108px;height:66px;margin-left:-54px;border-radius:33px;background:#F6E3C4;z-index:-1;
    animation-name:pillIn;animation-duration:.35s}
  #P26 .tab svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #P26 .tab .l{font-size:30px;line-height:1.2}
  #P26 .fly{position:absolute;width:150px;height:150px;border-radius:40px;display:flex;align-items:center;justify-content:center;color:#fff;z-index:9;
    box-shadow:0 20px 40px rgba(58,16,10,.35),inset 0 -6px 14px rgba(0,0,0,.2);animation-name:flyIn;animation-duration:1.05s;animation-timing-function:cubic-bezier(.5,0,.4,1)}
  #P26 .fly svg{width:84px;height:84px}
</style>
</head>
<body>
<!-- ══ P26 · the app, four tabs — everything in one place · K903 (held 3.34 s) ═══
     "सब एक ही जगह" is spoken 0.85 s in; the line lands just before it. Everything has
     settled by 2.1 s, so the finished screen holds for the last 1.2 s. -->
<div class="panel" id="P26" data-plate="dusk" style="--T:6s">
  <div class="halo mv"></div>
  <div class="ln hi mv" style="animation-delay:.6s">सब <b>एक ही जगह</b></div>
  <div class="phone mv" style="animation-delay:-.25s">
    <div class="screen">
      <div class="app-top"><div class="logo dis">DK</div><div class="nm hi">डीलर कवच</div></div>
      <div class="app-body">
        <div class="g6">
          <div class="mt mv" style="animation-delay:.75s"><span class="g" style="background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6.8V12l3.4 2"/></svg></span><span class="t hi">चौबीसों घंटे का साथ</span></div>
          <div class="mt mv" style="animation-delay:.82s"><span class="g" style="background:linear-gradient(150deg,var(--amber),var(--amberDeep))"><svg viewBox="0 0 24 24"><path d="M3 12s3.4-6 9-6 9 6 9 6-3.4 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.6"/></svg></span><span class="t hi">रोज़ की निगरानी</span></div>
          <div class="mt mv" style="animation-delay:.89s"><span class="g" style="background:linear-gradient(150deg,#2B8C58,#145A35)"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M8.8 14.2l2.2 2.2 4.2-4.6"/></svg></span><span class="t hi">कंप्लायंस का हिसाब</span></div>
          <div class="mt mv" style="animation-delay:.96s"><span class="g" style="background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.8 8.2h6.4M8.8 10.8h6.4M9.8 8.2c3.2 0 3.2 5 0 5h-1l4.6 4.6"/></svg></span><span class="t hi">पैसों पर नज़र</span></div>
          <div class="mt mv" style="animation-delay:1.03s"><span class="g" style="background:linear-gradient(150deg,#0C7A6C,#044B43)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.6"/><path d="M11 16.6h2"/></svg></span><span class="t hi">डिजिटल काम में मदद</span></div>
          <div class="mt mv" style="animation-delay:1.1s"><span class="g" style="background:linear-gradient(150deg,var(--amber),var(--amberDeep))"><svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1 6L12 17l-5.35 2.85 1-6L3.3 9.6l6-.9Z"/></svg></span><span class="t hi">प्रीमियम सपोर्ट</span></div>
        </div>
        <div class="tabs">
          <div class="tab mv" style="animation-delay:1.15s"><span class="pl mv" style="animation-delay:1.15s"></span><svg viewBox="0 0 24 24"><path d="M21 11.6c0 4-3.9 7.2-8.7 7.2a10 10 0 0 1-2.6-.33L4.6 21l1.1-3.9A6.9 6.9 0 0 1 3.6 11.6c0-4 3.9-7.2 8.7-7.2s8.7 3.2 8.7 7.2Z"/></svg><span class="l hi">चैट</span></div>
          <div class="tab mv" style="animation-delay:1.35s"><span class="pl mv" style="animation-delay:1.35s"></span><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg><span class="l hi">रिपोर्ट</span></div>
          <div class="tab mv" style="animation-delay:1.55s"><span class="pl mv" style="animation-delay:1.55s"></span><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6Z"/></svg><span class="l hi">कवच</span></div>
          <div class="tab mv" style="animation-delay:1.75s"><span class="pl mv" style="animation-delay:1.75s"></span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5"/></svg><span class="l hi">प्रोफ़ाइल</span></div>
        </div>
      </div>
    </div>
  </div>
  <!-- the six tiles from the line before fly into the phone -->
  <div class="fly mv" style="left:140px;top:420px;--r:-8deg;--fx:325px;--fy:465px;animation-delay:-.15s;background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6.8V12l3.4 2"/></svg></div>
  <div class="fly mv" style="left:790px;top:400px;--r:7deg;--fx:-325px;--fy:485px;animation-delay:-.1s;background:linear-gradient(150deg,var(--amber),var(--amberDeep))"><svg viewBox="0 0 24 24"><path d="M3 12s3.4-6 9-6 9 6 9 6-3.4 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.6"/></svg></div>
  <div class="fly mv" style="left:60px;top:820px;--r:6deg;--fx:405px;--fy:65px;animation-delay:-.05s;background:linear-gradient(150deg,#2B8C58,#145A35)"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M8.8 14.2l2.2 2.2 4.2-4.6"/></svg></div>
  <div class="fly mv" style="left:870px;top:840px;--r:-6deg;--fx:-405px;--fy:45px;animation-delay:0s;background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.8 8.2h6.4M8.8 10.8h6.4M9.8 8.2c3.2 0 3.2 5 0 5h-1l4.6 4.6"/></svg></div>
  <div class="fly mv" style="left:120px;top:1300px;--r:-5deg;--fx:345px;--fy:-415px;animation-delay:.05s;background:linear-gradient(150deg,#0C7A6C,#044B43)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.6"/><path d="M11 16.6h2"/></svg></div>
  <div class="fly mv" style="left:810px;top:1280px;--r:8deg;--fx:-345px;--fy:-395px;animation-delay:.1s;background:linear-gradient(150deg,var(--amber),var(--amberDeep))"><svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1 6L12 17l-5.35 2.85 1-6L3.3 9.6l6-.9Z"/></svg></div>
  <div class="rail hi">डीलर कवच · एक ही ऐप</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
