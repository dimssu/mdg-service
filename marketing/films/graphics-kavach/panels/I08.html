<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  #I08 .abs{position:absolute}
  #I08 .top{top:560px;left:60px;right:60px;text-align:center}
  #I08 .top .cap{font-size:64px;margin:0 auto}
  #I08 .tl{top:890px;width:290px;background:linear-gradient(170deg,#fff,#FBF3E7);border:1px solid rgba(201,160,100,.55);
    border-radius:34px;padding:40px 18px 36px;text-align:center;
    box-shadow:0 34px 70px rgba(58,16,10,.28),0 4px 10px rgba(58,16,10,.14)}
  #I08 .tl .g{width:150px;height:150px;margin:0 auto 26px;border-radius:42px;display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:inset 0 -6px 14px rgba(0,0,0,.2),0 12px 24px rgba(58,16,10,.24)}
  #I08 .tl .g svg{width:92px;height:92px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #I08 .tl .t{font-size:46px;color:var(--maroon);line-height:1.1}
  #I08 .link{left:0;top:0;width:1080px;height:1920px;overflow:visible;pointer-events:none}
  #I08 .link path{fill:none;stroke-linecap:round}
  #I08 .lbl{top:770px;left:0;right:0;display:flex;justify-content:center}
  #I08 .lbl div{background:var(--maroon);color:#FFF3E2;font-size:38px;line-height:1.3;text-align:center;padding:14px 30px;border-radius:20px;
    box-shadow:0 14px 30px rgba(74,15,15,.3)}
  #I08 .tick{left:480px;top:945px;width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;background:radial-gradient(circle at 34% 28%,#35A06A,var(--good) 55%,#135636);
    box-shadow:0 0 0 10px rgba(255,253,248,.9),0 18px 36px rgba(30,122,74,.4)}
  #I08 .tick svg{width:70px;height:70px;stroke-width:3.2}
  #I08 .res{top:1266px;left:60px;right:60px;text-align:center;font-size:76px;color:var(--good);line-height:1.2}
  #I08 .quick{--T:3s}
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="p-pump" viewBox="0 0 24 24"><rect x="3.2" y="3" width="10.6" height="17.4" rx="1.8"/><rect x="5.6" y="5.6" width="5.8" height="4.4" rx=".8"/>
    <path d="M13.8 8.4h2.4a1.9 1.9 0 0 1 1.9 1.9v6.4a1.5 1.5 0 0 0 3 0V9l-2.4-2.6"/><path d="M1.8 20.6h13.4"/></symbol>
  <symbol id="p-team" viewBox="0 0 24 24"><circle cx="12" cy="7.6" r="3.4"/><path d="M5.8 20c0-3.6 2.8-6.4 6.2-6.4s6.2 2.8 6.2 6.4"/>
    <circle cx="4.9" cy="9.4" r="2.4"/><path d="M1 18.6c0-2.6 1.7-4.5 3.9-4.5"/><circle cx="19.1" cy="9.4" r="2.4"/><path d="M23 18.6c0-2.6-1.7-4.5-3.9-4.5"/></symbol>
</svg>
<!-- ══ I08 · connected, with permission · K201 "…आपकी अनुमति से … एस-डी-एम-एस और बाक़ी ज़रूरी सिस्टम से जुड़ जाती है" ═══ -->
<div class="panel" id="I08" data-plate="desk" style="--T:4s">
  <div class="glow anim a-glow" style="animation-delay:-1s;top:52%"></div>
  <div class="abs top"><div class="cap hi anim a-fade" style="animation-delay:-.05s"><b>आपकी अनुमति से</b></div></div>

  <!-- the gold line, drawn from his pump to our team -->
  <svg class="abs link" viewBox="0 0 1080 1920">
    <path d="M346 1005 H734" stroke="rgba(199,124,27,.22)" stroke-width="16"/>
    <path d="M346 1005 H734" pathLength="1" class="anim"
      style="stroke:var(--amber);stroke-width:10;stroke-dasharray:1;stroke-dashoffset:1;animation-name:drawOn;--T:7s;animation-delay:.95s"/>
  </svg>

  <div class="abs tl anim a-rise" style="left:60px;animation-delay:-.1s">
    <div class="g" style="background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))"><svg><use href="#p-pump"/></svg></div>
    <div class="t hi">आपका पंप</div></div>
  <div class="abs tl anim a-rise" style="right:60px;animation-delay:.12s">
    <div class="g" style="background:linear-gradient(150deg,#F2B04E,var(--amberDeep))"><svg><use href="#p-team"/></svg></div>
    <div class="t hi">हमारी टीम</div></div>

  <div class="abs lbl quick anim a-pop" style="animation-delay:1.3s"><div class="hi">एस-डी-एम-एस और<br/>बाक़ी ज़रूरी सिस्टम</div></div>
  <div class="abs tick quick anim a-pop" style="animation-delay:2.15s"><svg class="i"><use href="#i-check"/></svg></div>
  <div class="abs res hi quick anim a-rise" style="animation-delay:2.3s">जुड़ गए</div>

  <div class="rail hi">बिना आपकी मेहनत के</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
