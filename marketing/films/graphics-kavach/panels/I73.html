<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes cardIn{0%{opacity:0;transform:translateY(100px) scale(.95)}100%{opacity:1;transform:none}}
  @keyframes push{0%{transform:scale(1)}100%{transform:scale(1.045)}}
  @keyframes dash{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
  @keyframes show{0%{opacity:0}100%{opacity:1}}
  @keyframes pinDrop{0%{opacity:0;transform:translateY(-80px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:none}}
  @keyframes pulse{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
  @keyframes bob{0%,100%{transform:none}40%{transform:translateY(-14px) scale(1.06)}}
  @keyframes wr{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(-10% -4% -10% 0)}}
  @keyframes halo{0%,100%{opacity:.5}50%{opacity:.85}}

  #I73 .halo{position:absolute;left:50%;top:48%;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,162,59,.34),rgba(233,162,59,0) 64%);z-index:1;animation-name:halo;animation-duration:6s}
  #I73 .pushw{animation-name:push;animation-duration:3s;animation-timing-function:cubic-bezier(.4,0,.3,1)}
  #I73 .card{width:900px;border-radius:40px;overflow:hidden;background:linear-gradient(170deg,#fff,#FBF3E7);border:2px solid var(--amberSoft);
    box-shadow:0 50px 100px rgba(58,16,10,.30),0 8px 18px rgba(58,16,10,.16);animation-name:cardIn;animation-duration:.6s}
  #I73 .map{position:relative;height:620px;background:
      linear-gradient(0deg,rgba(255,251,243,.0),rgba(255,251,243,.0)),
      #F4E9D6;border-bottom:4px solid var(--amber)}
  #I73 .map svg.streets{position:absolute;inset:0;width:100%;height:100%}
  #I73 .map svg.streets path{fill:none;stroke:#fff;stroke-linecap:round}
  #I73 .map svg.streets .blk{fill:#EADCC3;stroke:none}
  #I73 .fig{position:absolute;left:50%;top:40px;width:420px;height:540px;margin-left:-210px}
  #I73 .fig svg{width:100%;height:100%;overflow:visible}
  #I73 .fig .p{fill:none;stroke:var(--maroon);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
    animation-name:dash;animation-duration:.6s;animation-timing-function:cubic-bezier(.5,.1,.3,1)}
  #I73 .fig .body{fill:rgba(255,253,248,.95);stroke:none;animation-name:show;animation-duration:.4s}
  #I73 .pin{position:absolute;left:50%;top:0;width:150px;height:190px;margin-left:-75px;animation-name:pinDrop;animation-duration:.5s}
  #I73 .pin .bobw{width:100%;height:100%;animation-name:bob;animation-duration:.8s;animation-timing-function:ease-in-out}
  #I73 .pin svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 12px 16px rgba(58,16,10,.35))}
  #I73 .ring{position:absolute;left:50%;top:150px;width:160px;height:60px;margin-left:-80px;border-radius:50%;border:5px solid var(--amber);
    animation-name:pulse;animation-duration:1s;animation-timing-function:ease-out}
  #I73 .txt{padding:46px 56px 56px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  #I73 .l1{font-size:52px;color:var(--amberDeep);animation-name:wr;animation-duration:.5s;animation-timing-function:linear}
  #I73 .l2{font-size:68px;color:var(--maroon);line-height:1.3;animation-name:wr;animation-duration:.7s;animation-timing-function:linear}
</style>
</head>
<body>
<!-- ══ I73 · meet your city's authorised representative · K905 (held 5.09 s) ═════ -->
<div class="panel" id="I73" data-plate="dusk" style="--T:6s">
  <div class="halo mv"></div>
  <div class="pushw mv" style="animation-delay:3.0s">
    <div class="card mv" style="animation-delay:-.1s">
      <div class="map">
        <svg class="streets" viewBox="0 0 960 620" preserveAspectRatio="none">
          <rect class="blk" x="40" y="40" width="220" height="150" rx="14"/><rect class="blk" x="700" y="60" width="210" height="170" rx="14"/>
          <rect class="blk" x="60" y="420" width="200" height="160" rx="14"/><rect class="blk" x="720" y="400" width="200" height="180" rx="14"/>
          <path d="M0 300 C200 290 380 330 560 300 S860 260 960 280" stroke-width="34"/>
          <path d="M300 0 C310 180 280 400 330 620" stroke-width="26"/>
          <path d="M650 0 C630 200 680 420 640 620" stroke-width="22"/>
          <path d="M0 120 L960 150" stroke-width="14"/><path d="M0 500 L960 470" stroke-width="14"/>
        </svg>
        <div class="fig">
          <svg viewBox="0 0 420 540">
            <path class="body mv" style="animation-delay:.55s" d="M90 540 C90 420 140 350 210 350 S330 420 330 540 Z"/>
            <circle class="body mv" style="animation-delay:.45s" cx="210" cy="270" r="66"/>
            <circle class="p mv" pathLength="1" style="animation-delay:.1s" cx="210" cy="270" r="66"/>
            <path class="p mv" pathLength="1" style="animation-delay:.3s" d="M90 540 C90 420 140 350 210 350 S330 420 330 540"/>
          </svg>
          <div class="ring mv" style="animation-delay:3.05s"></div>
          <div class="pin mv" style="animation-delay:.5s"><div class="bobw mv" style="animation-delay:3.0s">
            <svg viewBox="0 0 24 30"><path d="M12 29s-9-9.6-9-16.4A9 9 0 0 1 21 12.6C21 19.4 12 29 12 29Z" fill="url(#pg)" stroke="#fff" stroke-width="1.2"/>
              <circle cx="12" cy="12.4" r="3.6" fill="#fff"/>
              <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B650"/><stop offset="1" stop-color="#C77C1B"/></linearGradient></defs></svg>
          </div></div>
        </div>
      </div>
      <div class="txt">
        <div class="l1 hi mv" style="animation-delay:.35s">अपने शहर में</div>
        <div class="l2 hi mv" style="animation-delay:.75s">अधिकृत एम-डी-जी सर्विस</div>
        <div class="l2 hi mv" style="animation-delay:1.5s">रिप्रेज़ेंटेटिव से मिलिए</div>
      </div>
    </div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
