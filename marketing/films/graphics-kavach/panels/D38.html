<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* "मान लीजिए" as the day's duty roster on a clipboard: roles only, no names.
   The three attendants are ticked, the manager's line is stamped छुट्टी पर,
   and the inspection arrives on the same day.
   Timed to K016 (first 5.5 s): "मान लीजिए" 0.07–0.70 s, "किसी दिन आपका मैनेजर"
   1.35–2.69 s, "छुट्टी पर है" 2.75–3.28 s, "और ठीक उसी दिन" 4.20–5.22 s;
   "इंस्पेक्शन" is 5.79 s, over S60 — so the chip's second half is written in
   last, just before the cut, and the final 0.6 s are still.
   D39 uses the same clipboard. */
#D38 .tag{position:absolute;left:0;right:0;top:236px;display:flex;justify-content:center}
#D38 .tag span{font-size:60px;line-height:1.2;color:var(--maroonDeep);padding:16px 48px 10px;border-radius:999px;
  background:#FFF1D2;border:3px solid var(--amber);box-shadow:0 12px 26px rgba(120,60,6,.20)}
/* the clipboard */
#D38 .cb{position:absolute;left:110px;top:388px;width:860px;height:1150px}
#D38 .board{position:absolute;inset:0;border-radius:36px;
  background:linear-gradient(170deg,#7E2C22,#5A1812 60%,#461210);
  box-shadow:0 40px 80px rgba(40,10,6,.42),inset 0 3px 0 rgba(255,255,255,.14),inset 0 -8px 20px rgba(0,0,0,.25)}
#D38 .sheet{position:absolute;left:40px;right:40px;top:78px;bottom:44px;border-radius:6px;background:var(--paper);
  box-shadow:0 6px 16px rgba(40,14,6,.30),0 0 0 1px var(--paperEdge);overflow:hidden}
#D38 .sheet::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%),radial-gradient(120% 90% at 80% 110%,rgba(160,120,70,.10),rgba(160,120,70,0) 60%)}
#D38 .clip{position:absolute;left:50%;top:-34px;width:320px;height:120px;margin-left:-160px;z-index:5}
#D38 .clip .plate{position:absolute;left:0;right:0;bottom:0;height:78px;border-radius:18px 18px 12px 12px;
  background:linear-gradient(#F2D08A,#D9A94F 45%,#B7832E);box-shadow:0 10px 18px rgba(40,10,6,.40),inset 0 2px 0 rgba(255,255,255,.55)}
#D38 .clip .ring{position:absolute;left:90px;right:90px;top:0;height:70px;border:12px solid #C99A4E;border-bottom:0;border-radius:36px 36px 0 0;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
#D38 .clip .hole{position:absolute;left:50%;bottom:24px;width:70px;height:22px;margin-left:-35px;border-radius:11px;background:#6B4418;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.45)}
/* the roster printed on it */
#D38 .ttl{padding:70px 44px 22px;font-size:66px;line-height:1.3;color:var(--maroon);border-bottom:3px solid var(--print);display:flex;align-items:baseline}
#D38 .th{height:26px;border-bottom:2px solid #6E655B;display:grid;grid-template-columns:1fr 250px}
#D38 .th div + div{border-left:2px solid #9C9184}
#D38 .rw{position:relative;display:grid;grid-template-columns:1fr 250px;height:196px;border-bottom:2px solid var(--rule)}
#D38 .rw .k{display:flex;align-items:center;padding:10px 44px 0;font-size:58px;color:var(--print);position:relative}
#D38 .rw .v{border-left:2px solid #9C9184;position:relative;display:flex;align-items:center;justify-content:center}
#D38 .rw .v svg{width:92px;height:92px;overflow:visible}
#D38 .rw .v svg path{fill:none;stroke:var(--pen);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
#D38 .hl{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,214,64,.48),rgba(255,214,64,.30));transform-origin:0 50%}
@keyframes hlIn{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.hli{animation-name:hlIn;animation-timing-function:cubic-bezier(.4,.1,.3,1)}
#D38 .lv{position:absolute;right:52px;top:26px;z-index:6;font-size:56px;line-height:1.2;padding:10px 26px 4px;
  color:var(--amberDeep);border:7px solid var(--amberDeep);border-radius:14px;background:rgba(255,248,232,.55);transform:rotate(-8deg)}
@keyframes stampA{0%{opacity:0;transform:scale(1.8) rotate(-15deg)}60%{opacity:1;transform:scale(.96) rotate(-8deg)}100%{opacity:1;transform:rotate(-8deg)}}
.sa{animation-name:stampA;animation-timing-function:cubic-bezier(.3,1.2,.5,1)}
@keyframes drawOn2{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
.dr{animation-name:drawOn2;animation-timing-function:cubic-bezier(.5,.1,.3,1)}
/* the same day */
#D38 .day{position:absolute;left:0;top:1604px;display:flex}
#D38 .day .more{display:inline-block;overflow:hidden;white-space:nowrap;max-width:0}
@keyframes grow{0%{max-width:0}100%{max-width:var(--w)}}
.gr{animation-name:grow;animation-timing-function:cubic-bezier(.3,.6,.3,1)}
#D38 .day .c{display:flex;align-items:center;gap:18px;white-space:nowrap;font-size:56px;line-height:1.2;color:var(--maroon);
  background:#fff;border:4px solid var(--maroon);border-radius:999px;padding:14px 40px 8px 26px;box-shadow:0 16px 32px rgba(74,15,15,.22)}
#D38 .day .c svg{width:56px;height:56px;color:var(--maroon);stroke-width:2.2;margin-top:-6px}
#D38 .day .c b{font-weight:400;color:var(--bad)}
@keyframes chipIn{0%{opacity:0;transform:translateX(-80px)}100%{opacity:1;transform:none}}
.ci{animation-name:chipIn;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
@keyframes writeL{0%{clip-path:inset(-30% 100% -30% -4%)}100%{clip-path:inset(-30% -4% -30% -4%)}}
.wl{animation-name:writeL;animation-timing-function:linear}
@keyframes slideUp{0%{opacity:0;transform:translateY(200px) rotate(2deg)}100%{opacity:1;transform:none}}
.su{animation-name:slideUp;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
@keyframes popTag{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:none}}
.pt{animation-name:popTag;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
@keyframes push{0%{transform:scale(1)}100%{transform:scale(1.025)}}
.ps{animation-name:push;animation-timing-function:linear}
</style>
</head>
<body>
<!-- ══ D38 · today's duty roster, the manager on leave · K016 "मान लीजिए, किसी दिन आपका मैनेजर छुट्टी पर है। और ठीक उसी दिन, …" (first 5.5 s) ══ -->
<div class="panel" id="D38" data-plate="desk" style="--T:6s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;top:50%"></div>
  <div class="tag anim pt" style="animation-delay:-.24s;animation-duration:.36s"><span class="hi">मान लीजिए</span></div>

  <div class="cb anim su" style="animation-delay:-.12s;animation-duration:.55s">
   <div class="anim ps" style="position:absolute;inset:0;transform-origin:50% 50%;animation-delay:.45s;animation-duration:5.5s">
    <div class="board"></div>
    <div class="sheet">
      <div class="ttl hi">आज की ड्यूटी</div>
      <div class="th"><div></div><div></div></div>
      <div class="rw"><div class="k hi">अटेंडेंट · सुबह</div>
        <div class="v"><svg viewBox="0 0 92 92"><path class="anim dr" pathLength="1" style="animation-delay:.5s;animation-duration:.3s" d="M14 50 36 72 80 18"/></svg></div></div>
      <div class="rw"><div class="k hi">अटेंडेंट · दोपहर</div>
        <div class="v"><svg viewBox="0 0 92 92"><path class="anim dr" pathLength="1" style="animation-delay:.9s;animation-duration:.3s" d="M14 48 37 70 80 20"/></svg></div></div>
      <div class="rw"><div class="k hi">अटेंडेंट · रात</div>
        <div class="v"><svg viewBox="0 0 92 92"><path class="anim dr" pathLength="1" style="animation-delay:1.3s;animation-duration:.3s" d="M15 51 36 71 79 19"/></svg></div></div>
      <div class="rw" style="border-bottom:0"><div class="hl anim hli" style="animation-delay:1.82s;animation-duration:.34s"></div>
        <div class="k hi">मैनेजर</div><div class="v"></div></div>
    </div>
    <!-- the stamp sits on the sheet over the manager's line -->
    <div class="lv hi anim sa" style="top:928px;animation-delay:2.28s;animation-duration:.26s">छुट्टी पर</div>
    <div class="clip"><div class="ring"></div><div class="plate"></div><div class="hole"></div></div>
   </div>
  </div>

  <div class="day">
    <div class="c hi anim ci" style="animation-delay:4.0s;animation-duration:.32s"><svg class="i"><use href="#i-cal"/></svg><span>ठीक उसी दिन</span><span class="more anim gr" id="more" style="animation-delay:4.55s;animation-duration:.32s">— <b>इंस्पेक्शन</b></span></div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
<script>
/* the chip is centred on its finished width, and its second half opens to
   exactly its own width */
function fit() {
  const m = document.getElementById('more'), day = document.querySelector('#D38 .day');
  m.style.maxWidth = 'none'; m.style.animationName = 'none';
  const w = m.getBoundingClientRect().width, full = day.getBoundingClientRect().width;
  m.style.maxWidth = ''; m.style.animationName = '';
  m.style.setProperty('--w', Math.ceil(w + 2) + 'px');
  day.style.left = ((1080 - full) / 2).toFixed(0) + 'px';
}
fit();
document.fonts.ready.then(fit);
</script>
</body>
</html>
