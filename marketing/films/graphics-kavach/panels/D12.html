<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* the tanker receipt register: yesterday's line already written, today's line
   writes itself cell by cell; the invoice slides in under it on the SAME column
   grid, so the challan number and the density sit straight below their twins
   and each pair is ringed in gold and joined; then the three checks tick. */
.chip{display:flex;align-items:center;gap:18px;background:linear-gradient(140deg,var(--maroonSoft),var(--maroon));
  color:#fff;border-radius:40px;padding:18px 36px 18px 20px;font-size:38px;line-height:1.35;
  box-shadow:0 16px 34px rgba(74,15,15,.30);max-width:960px}
.chip .no{width:62px;height:62px;border-radius:50%;background:var(--amber);color:var(--maroonDeep);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700}
.g{display:grid;grid-template-columns:22px 128px 186px 104px 144px 190px 96px 22px;
  grid-template-rows:auto 76px 100px 100px 30px 110px 100px;transform:rotate(-.7deg);position:relative}
.bgp{grid-column:1/9;grid-row:1/6;border-radius:6px;background:var(--paper);
  box-shadow:0 40px 80px rgba(40,14,6,.34),0 6px 16px rgba(40,14,6,.2),0 0 0 1px var(--paperEdge)}
.bgi{grid-column:1/9;grid-row:7;border-radius:10px;background:#fff;border-top:10px solid var(--maroon);
  box-shadow:0 26px 50px rgba(40,14,6,.30),0 0 0 1px var(--paperEdge)}
.hd{grid-column:2/8;grid-row:1;padding:28px 0 18px;font-size:48px;color:var(--maroon);line-height:1.3;position:relative;z-index:2}
.th,.td,.iv{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center}
.th{grid-row:2;font-size:24px;line-height:1.2;color:#3A332C;background:#F3ECE0;border:1.5px solid #6E655B;padding:0 4px}
.td{border:1.5px solid #9C9184;border-top:none;font-family:'Kalam',cursive;font-weight:700;font-size:38px;color:#1F3B7A}
.td.p{font-family:'Space Grotesk',sans-serif;font-size:32px;color:var(--print)}
.iv{grid-row:7;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:38px;color:var(--print);padding-top:6px}
.iv.lab{font-family:'Tiro Devanagari Hindi',serif;font-weight:400;font-size:34px;color:var(--maroon)}
@keyframes writeL{0%{clip-path:inset(-30% 100% -30% -4%)}100%{clip-path:inset(-30% -4% -30% -4%)}}
.wl{animation-name:writeL;animation-timing-function:linear}
.rg{position:relative;display:inline-block}
svg.ring{position:absolute;left:-16px;top:-14px;width:calc(100% + 32px);height:calc(100% + 28px);overflow:visible}
svg.ring ellipse{fill:none;stroke:#D9A13A;stroke-width:6;stroke-dasharray:1;stroke-dashoffset:1}
@keyframes drawOn2{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.jn{grid-row:6;position:relative;z-index:3;display:flex;justify-content:center}
.jn i{display:block;width:6px;border-radius:3px;background:#D9A13A;height:calc(100% + 72px);margin-top:-46px;transform-origin:50% 0}
@keyframes growY{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
.jn b{position:absolute;top:50%;left:50%;width:64px;height:64px;margin:-40px 0 0 -32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--good);color:#fff;
  font-family:'Space Grotesk',sans-serif;font-size:44px;line-height:64px;text-align:center;box-shadow:0 8px 18px rgba(30,122,74,.35),0 0 0 5px #fff}
.checks{width:940px;display:flex;flex-direction:column;gap:16px}
.ck{display:flex;align-items:center;gap:24px;background:#fff;border:2px solid #EFE4D2;border-radius:18px;
  padding:18px 28px;box-shadow:0 8px 20px rgba(74,15,15,.10)}
.ck .ic{width:66px;height:66px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ck .ic svg{width:38px;height:38px;stroke-width:3}
.ck span{font-size:46px;color:var(--ink);line-height:1.3}
@keyframes inUp{0%{opacity:0;transform:translateY(90px)}100%{opacity:1;transform:none}}
</style>
</head>
<body>
<!-- ══ D12 · fourth: challan number, density and the rest · K307 "चौथा — चालान नंबर, डेंसिटी, और बाक़ी ज़रूरी जानकारी पंप पर सही लिखी जा रही है या नहीं, इसकी भी जाँच होती है।" (7.44 s) ══ -->
<div class="panel" id="D12" data-plate="desk" style="--T:8s">
  <div class="glow anim a-glow" style="animation-delay:-.5s"></div>
  <div class="chip anim a-stamp" style="animation-delay:0s;animation-duration:4s">
    <div class="no dis">4</div><span class="hi">चौथा · चालान नंबर, डेंसिटी और बाक़ी ज़रूरी जानकारी</span></div>

  <div class="g">
    <div class="bgp anim a-settle" style="--r0:3deg;--r1:0deg;animation-delay:.3s;animation-duration:3s"></div>
    <div class="hd hi anim a-fade" style="animation-delay:.35s;animation-duration:3s">टैंकर रसीद रजिस्टर</div>
    <div class="th hi anim a-fade" style="grid-column:2;animation-delay:.4s;animation-duration:3s">तारीख़</div>
    <div class="th hi anim a-fade" style="grid-column:3;animation-delay:.4s;animation-duration:3s">चालान नं.</div>
    <div class="th hi anim a-fade" style="grid-column:4;animation-delay:.4s;animation-duration:3s">उत्पाद</div>
    <div class="th hi anim a-fade" style="grid-column:5;animation-delay:.4s;animation-duration:3s">मात्रा (L)</div>
    <div class="th hi anim a-fade" style="grid-column:6;animation-delay:.4s;animation-duration:3s">डेंसिटी @15°C</div>
    <div class="th hi anim a-fade" style="grid-column:7;animation-delay:.4s;animation-duration:3s">टैंक</div>
    <!-- 19-08, already in the book -->
    <div class="td anim a-fade" style="grid-column:2;grid-row:3;animation-delay:.45s;animation-duration:3s">19-08</div>
    <div class="td anim a-fade" style="grid-column:3;grid-row:3;animation-delay:.45s;animation-duration:3s">••••4381</div>
    <div class="td p anim a-fade" style="grid-column:4;grid-row:3;animation-delay:.45s;animation-duration:3s">HSD</div>
    <div class="td anim a-fade" style="grid-column:5;grid-row:3;animation-delay:.45s;animation-duration:3s">9,000</div>
    <div class="td anim a-fade" style="grid-column:6;grid-row:3;animation-delay:.45s;animation-duration:3s">831.8</div>
    <div class="td anim a-fade" style="grid-column:7;grid-row:3;animation-delay:.45s;animation-duration:3s">2</div>
    <!-- 20-08, written now, cell by cell -->
    <div class="td" style="grid-column:2;grid-row:4"><span class="anim wl" style="animation-delay:.9s;animation-duration:.22s">20-08</span></div>
    <div class="td" style="grid-column:3;grid-row:4"><span class="rg"><span class="anim wl" style="display:inline-block;animation-delay:1.15s;animation-duration:.26s">••••4436</span><svg class="ring"><ellipse class="anim" pathLength="1" cx="50%" cy="50%" rx="49%" ry="46%" style="animation-name:drawOn2;animation-delay:2.45s;animation-duration:.4s"/></svg></span></div>
    <div class="td p" style="grid-column:4;grid-row:4"><span class="anim wl" style="animation-delay:1.45s;animation-duration:.2s">HSD</span></div>
    <div class="td" style="grid-column:5;grid-row:4"><span class="anim wl" style="animation-delay:1.7s;animation-duration:.24s">6,000</span></div>
    <div class="td" style="grid-column:6;grid-row:4"><span class="rg"><span class="anim wl" style="display:inline-block;animation-delay:1.95s;animation-duration:.24s">831.5</span><svg class="ring"><ellipse class="anim" pathLength="1" cx="50%" cy="50%" rx="49%" ry="46%" style="animation-name:drawOn2;animation-delay:3.35s;animation-duration:.4s"/></svg></span></div>
    <div class="td" style="grid-column:7;grid-row:4"><span class="anim wl" style="animation-delay:2.2s;animation-duration:.15s">2</span></div>

    <!-- the joins -->
    <div class="jn" style="grid-column:3"><i class="anim" style="animation-name:growY;animation-delay:2.75s;animation-duration:.35s"></i><b class="anim a-pop" style="animation-delay:2.95s;animation-duration:3s"><svg viewBox="0 0 24 24" style="width:38px;height:38px"><path d="M5 9h14M5 15h14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg></b></div>
    <div class="jn" style="grid-column:6"><i class="anim" style="animation-name:growY;animation-delay:3.65s;animation-duration:.35s"></i><b class="anim a-pop" style="animation-delay:3.85s;animation-duration:3s"><svg viewBox="0 0 24 24" style="width:38px;height:38px"><path d="M5 9h14M5 15h14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg></b></div>

    <!-- the invoice, on the same columns -->
    <div class="bgi anim" style="animation-name:inUp;animation-delay:2.1s;animation-duration:.6s;animation-timing-function:cubic-bezier(.2,.9,.3,1)"></div>
    <div class="iv lab hi anim" style="grid-column:2;animation-name:inUp;animation-delay:2.1s;animation-duration:.6s">इनवॉइस</div>
    <div class="iv anim" style="grid-column:3;animation-name:inUp;animation-delay:2.1s;animation-duration:.6s"><span class="rg">••••4436<svg class="ring"><ellipse class="anim" pathLength="1" cx="50%" cy="50%" rx="49%" ry="46%" style="animation-name:drawOn2;animation-delay:2.55s;animation-duration:.4s"/></svg></span></div>
    <div class="iv anim" style="grid-column:5;animation-name:inUp;animation-delay:2.1s;animation-duration:.6s">6,000 L</div>
    <div class="iv anim" style="grid-column:6;animation-name:inUp;animation-delay:2.1s;animation-duration:.6s"><span class="rg">831.5<svg class="ring"><ellipse class="anim" pathLength="1" cx="50%" cy="50%" rx="49%" ry="46%" style="animation-name:drawOn2;animation-delay:3.45s;animation-duration:.4s"/></svg></span></div>
  </div>

  <div class="checks">
    <div class="ck anim a-stamp" style="animation-delay:4.35s;animation-duration:4s"><div class="ic"><svg class="i"><use href="#i-check"/></svg></div><span class="hi">चालान नंबर</span></div>
    <div class="ck anim a-stamp" style="animation-delay:4.7s;animation-duration:4s"><div class="ic"><svg class="i"><use href="#i-check"/></svg></div><span class="hi">डेंसिटी</span></div>
    <div class="ck anim a-stamp" style="animation-delay:5.05s;animation-duration:4s"><div class="ic"><svg class="i"><use href="#i-check"/></svg></div><span class="hi">बाक़ी ज़रूरी जानकारी</span></div>
  </div>
  <div class="rail hi">हर रसीद, इनवॉइस से मिलाकर</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
