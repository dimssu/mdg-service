/* With his permission: four changes tick in, then the padlock shuts on the result. */
.top{width:940px;text-align:center}

.ck{display:flex;align-items:center;gap:30px;padding:28px 34px;border-radius:24px;background:rgba(255,255,255,.96);

.ck .bx{flex:none;width:72px;height:72px;border-radius:50%;border:4px solid #CFE7D9;display:flex;align-items:center;justify-content:center;

.res{display:flex;align-items:center;gap:36px;width:940px;padding:34px 40px;border-radius:30px;

.res .lk svg{width:92px;height:92px;stroke-width:1.9}
.res .t{font-size:60px;color:#FFF3E2;line-height:1.3}
.nt{font-size:34px;color:#6E5A4C;margin-top:-18px}
