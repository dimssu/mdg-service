<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* outcome only — every window, around the clock; nothing about how */
#I46{gap:0}
#I46 .lab{font-size:44px;color:var(--amberDeep)}
#I46 .ttl{font-size:88px;line-height:1.25;color:var(--maroon);margin-top:14px;text-align:center}
#I46 .sub{font-size:44px;color:#6B5A4C;margin-top:14px}
#I46 .dial{position:relative;width:900px;height:900px;margin-top:40px}
#I46 .dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#I46 .bs{fill:none;stroke:#E8DDCB;stroke-width:64}
#I46 .sg{fill:none;stroke:url(#gg);stroke-width:64}
@keyframes segIn{0%{opacity:0;stroke-width:30}60%{opacity:1;stroke-width:76}100%{opacity:1;stroke-width:64}}
.si{animation-name:segIn;animation-duration:.35s!important}
#I46 .lb{font-family:'Inter',sans-serif;font-weight:600;font-size:30px;fill:#A89886;text-anchor:middle}
#I46 .lb.on{fill:var(--good)}
#I46 .ctr{position:absolute;left:50%;top:50%;width:392px;height:392px;margin:-196px 0 0 -196px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#FFFDF8,#F4E8D6);box-shadow:0 20px 44px rgba(58,16,10,.18),inset 0 0 0 1px rgba(201,160,100,.5);
  display:flex;align-items:flex-start;justify-content:center;gap:12px;padding-top:128px;font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--maroon)}
#I46 .ctr .num{height:132px;overflow:hidden;font-size:132px;line-height:132px;font-variant-numeric:tabular-nums}
#I46 .ctr .num .col{display:block;text-align:right}
#I46 .ctr .num .col span{display:block;height:132px}
#I46 .ctr .den{font-size:64px;line-height:64px;color:#8A7466;margin-top:54px}
@keyframes countUp{0%{transform:translateY(0)}100%{transform:translateY(-1584px)}}
.cu{animation-name:countUp;animation-duration:3.36s!important;animation-timing-function:steps(12,jump-start)!important}
#I46 .lock{position:absolute;left:50%;top:50%;width:432px;height:432px;margin:-216px 0 0 -216px;border-radius:50%;
  border:8px solid var(--amber);box-shadow:0 0 0 10px rgba(233,162,59,.18)}
</style>
</head>
<body>
