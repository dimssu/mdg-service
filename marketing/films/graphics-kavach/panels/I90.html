<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* Timed to K037's voice (the card starts 4.20 s into the beat, after S68).
   "आज डीलर को सिर्फ़ ज़्यादा बिक्री की नहीं," was said over the shot (ends −1.68 s),
   so the struck line is already struck at 0. "एक मज़बूत सिस्टम" runs across the cut
   (−0.28–0.89 s; "सिस्टम" 0.51 s), "भरोसेमंद" 2.04 s, "कंप्लायंस" 2.94 s,
   "सपोर्ट" 3.58 s, "की" 3.98 s, "ज़रूरत" 4.10 s, "है" 4.50 s, the line ends 4.61 s
   (the stop closures before "की" and before "है" measure 3.90–3.98 and 4.46–4.50 at
   −30 dB). So the first card (its "एक" is said at −0.28 s) is settled at the cut, the second
   lands by 1.85 s, the two lock together at 2.35–2.9 s, and the line is written by
   3.77 s, 0.2 s before "की ज़रूरत", with its gold underline done by 4.12 s. Still
   from 4.15 s. */
.mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
@keyframes wr{0%{clip-path:inset(-12% 100% -12% 0)}100%{clip-path:inset(-12% -4% -12% 0)}}
@keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes settle{0%{opacity:0;transform:translateY(90px) rotate(var(--r0)) scale(.9)}70%{opacity:1;transform:translateY(-6px) rotate(var(--r1))}100%{opacity:1;transform:rotate(var(--r1))}}
@keyframes lockL{0%{transform:none}100%{transform:translateX(24px) rotate(1.5deg)}}
@keyframes lockR{0%{transform:none}100%{transform:translateX(-24px) rotate(-1.4deg)}}
@keyframes clasp{0%{opacity:0;transform:scale(.3) rotate(-40deg)}70%{opacity:1;transform:scale(1.12) rotate(4deg)}100%{opacity:1;transform:none}}
@keyframes frameIn{0%{opacity:0;transform:scale(1.08)}100%{opacity:1;transform:none}}

#I90 .abs{position:absolute}
#I90 .struck{left:0;right:0;top:540px;display:flex;justify-content:center}
#I90 .struck span{position:relative;font-size:74px;color:#8A7466;line-height:1.3;padding:0 10px}
#I90 .struck i{position:absolute;left:-6px;right:-6px;top:53%;height:7px;border-radius:7px;background:var(--maroon);transform:rotate(-2deg)}
#I90 .pair{left:60px;right:60px;top:770px;height:400px;display:flex;justify-content:center;gap:60px}
#I90 .frame{position:absolute;left:64px;right:64px;top:754px;height:432px;border-radius:48px;border:6px solid var(--amber);
  box-shadow:0 0 40px rgba(233,162,59,.35),inset 0 0 30px rgba(233,162,59,.18);background:rgba(255,251,243,.35);animation-name:frameIn;animation-duration:.4s}
#I90 .tile{width:420px;height:400px;border-radius:36px;padding:44px 26px 30px;display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center;
  background:linear-gradient(170deg,#fff,#FBF3E7);border:3px solid #E2B566;
  box-shadow:0 30px 60px rgba(58,16,10,.26),0 4px 10px rgba(58,16,10,.14),inset 0 0 0 3px rgba(255,255,255,.7);animation-name:settle}
#I90 .tile .g{width:128px;height:128px;border-radius:36px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;
  box-shadow:inset 0 -6px 14px rgba(0,0,0,.2),0 12px 24px rgba(58,16,10,.24)}
#I90 .tile .g svg{width:72px;height:72px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#I90 .tile .t{font-size:54px;color:var(--maroon);line-height:1.3}
#I90 .clasp{left:490px;top:922px;width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--maroonDeep);z-index:5;
  background:radial-gradient(circle at 35% 30%,#F7CD78,var(--amber) 55%,var(--amberDeep));
  box-shadow:0 14px 28px rgba(58,16,10,.38),inset 0 0 0 5px rgba(255,255,255,.35);animation-name:clasp}
#I90 .clasp svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
#I90 .need{left:0;right:0;top:1266px;text-align:center}
#I90 .need .t{display:inline-block;font-size:84px;color:var(--maroon);line-height:1.3;animation-name:wr;animation-timing-function:linear}
#I90 .need .u{width:560px;height:9px;border-radius:9px;margin:10px auto 0;transform-origin:0 50%;animation-name:growX;
  background:linear-gradient(90deg,rgba(233,162,59,.2),#E9A23B 18%,#F4C979 70%,rgba(244,201,121,.25))}
</style>
</head>
<body>
<!-- ══ I90 · not just more sales: a strong system · K037 "…बल्कि एक मज़बूत सिस्टम, और भरोसेमंद कंप्लायंस सपोर्ट की ज़रूरत है।" (6.37 s, after S68) ══ -->
<div class="panel" id="I90" data-plate="office" style="--T:7s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;top:48%"></div>
  <div class="abs struck"><span class="hi">सिर्फ़ ज़्यादा बिक्री<i></i></span></div>

  <div class="frame mv" style="animation-delay:2.55s"></div>
  <div class="abs pair">
    <div class="mv" style="animation-name:lockL;animation-delay:2.35s;animation-duration:.4s;animation-timing-function:cubic-bezier(.5,0,.3,1.3)">
      <div class="tile mv" style="--r0:-6deg;--r1:-1.5deg;animation-delay:-.3s;animation-duration:.32s">
        <span class="g" style="background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="t hi">एक मज़बूत<br/>सिस्टम</span>
      </div>
    </div>
    <div class="mv" style="animation-name:lockR;animation-delay:2.35s;animation-duration:.4s;animation-timing-function:cubic-bezier(.5,0,.3,1.3)">
      <div class="tile mv" style="--r0:6deg;--r1:1.4deg;animation-delay:1.55s;animation-duration:.32s">
        <span class="g" style="background:linear-gradient(150deg,var(--amber),var(--amberDeep))"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6Z"/><path d="M8.6 12.2l2.4 2.4 4.4-4.8"/></svg></span>
        <span class="t hi">भरोसेमंद<br/>कंप्लायंस सपोर्ट</span>
      </div>
    </div>
  </div>
  <div class="abs clasp mv" style="animation-delay:2.6s;animation-duration:.3s"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>

  <div class="abs need"><div class="t hi mv" style="animation-delay:3.42s;animation-duration:.35s">आज डीलर की ज़रूरत</div><div class="u mv" style="animation-delay:3.62s;animation-duration:.5s"></div></div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
