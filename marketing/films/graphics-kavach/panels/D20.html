<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* ── the validity ladder: wooden rails, cream rungs, the current rung in gold ── */
.plank{position:relative;height:132px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:22px;
  font-size:58px;color:var(--maroon);z-index:2;
  background:linear-gradient(180deg,#FFFDF8,#F1E3CD);border:2px solid rgba(201,160,100,.7);
  box-shadow:0 18px 36px rgba(58,16,10,.22),inset 0 -8px 12px rgba(160,110,50,.14),inset 0 3px 0 rgba(255,255,255,.8)}
.plank .gl{position:absolute;inset:-2px;border-radius:20px;z-index:-1;
  background:linear-gradient(180deg,#FBDFA0,#E9A23B 70%,#D38A22);border:2px solid #C77C1B;
  box-shadow:0 0 0 10px rgba(233,162,59,.22),0 26px 50px rgba(120,62,8,.38),inset 0 3px 0 rgba(255,255,255,.55)}
.plank.gold{background:linear-gradient(180deg,#FBDFA0,#E9A23B 70%,#D38A22);color:var(--maroonDeep);border-color:#C77C1B;
  box-shadow:0 0 0 10px rgba(233,162,59,.22),0 26px 50px rgba(120,62,8,.38),inset 0 3px 0 rgba(255,255,255,.55)}
.plank svg.i{width:52px;height:52px;stroke-width:2.2;opacity:.8}
.lrail{position:absolute;width:38px;border-radius:14px;z-index:1;
  background:linear-gradient(90deg,#8A3A26,#5E1B12 60%,#42110C);box-shadow:0 12px 26px rgba(40,10,6,.30)}
/* a single rung lifted off the ladder, with stubs of the rails */
.rh{position:relative;width:900px}
.rh .lrail{top:-70px;bottom:-70px;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
  mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
@keyframes liftF{0%{transform:scale(.9) translateY(40px);filter:brightness(.92)}100%{transform:scale(1.04);filter:none}}
.lift{animation:liftF .8s cubic-bezier(.2,.9,.3,1) both paused;transform-origin:50% 60%}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

.panel{gap:64px}
.docw{position:relative;width:960px;height:1100px}
/* a plain printed certificate: ruled double border, no crest or emblem */
.cert{position:absolute;padding:24px}
.cert .frame{border:3px solid var(--print);padding:10px;height:100%}
.cert .frame2{border:1.5px solid var(--print);padding:50px 50px 56px;height:100%;position:relative;
  background:repeating-linear-gradient(45deg,rgba(107,22,22,.035) 0 2px,transparent 2px 9px)}
.cert .iss{font-size:46px;color:#3A332C;text-align:center}
.cert .ti{font-size:74px;color:var(--maroonDeep);margin-top:12px;line-height:1.25;text-align:center}
.cert .rule{height:3px;background:var(--print);width:300px;margin:26px auto 30px}
.cert .ln{font-size:50px;color:var(--print);padding:14px 10px;line-height:1.3;position:relative;white-space:nowrap}
.cert .ln b{font-family:'Inter',sans-serif;font-weight:700}
.cert .bar{height:16px;border-radius:8px;background:#E6DDCF;margin:24px 10px 0}
.cert .sig{position:absolute;right:56px;bottom:62px;width:230px;height:3px;background:#B9AE9F}
@keyframes slideIn{0%{opacity:0;transform:translate(760px,60px) rotate(12deg)}60%{opacity:1}
  100%{opacity:1;transform:rotate(var(--rot,0deg))}}
.slide{animation:slideIn .9s cubic-bezier(.2,.85,.25,1) both paused}
.lit2{background:linear-gradient(transparent 10%,rgba(255,214,64,.62) 10%,rgba(255,214,64,.62) 92%,transparent 92%) no-repeat 0 0 / 0% 100%}
@keyframes litIn{0%{background-size:0% 100%}100%{background-size:100% 100%}}
.a-lit{animation-name:litIn;animation-timing-function:cubic-bezier(.4,.1,.3,1)}

.od{position:relative;display:inline-block}
</style>
</head>
<body>
<!-- ══ D20 · the licence renewal, old date struck, new date written, stamped · K419 "और साल के काम — ट्रेड लाइसेंस का रिन्यूअल, …" (5 s) ══ -->
<div class="panel" id="D20" data-plate="desk" style="--T:5s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;top:58%"></div>
  <div class="rh lift" style="animation-delay:0s">
    <div class="lrail" style="left:96px"></div><div class="lrail" style="right:96px"></div>
    <div class="plank gold hi"><svg class="i"><use href="#i-cal"/></svg>साल के काम</div>
  </div>
  <div class="docw">
    <div class="paper cert slide" style="animation-delay:.1s;left:30px;top:0;width:900px;height:1080px;--rot:-1.2deg">
      <div class="frame"><div class="frame2">
        <div class="iss hi">नगर निगम</div>
        <div class="ti hi">ट्रेड लाइसेंस — रिन्यूअल</div>
        <div class="rule"></div>
        <div class="ln hi">लाइसेंस नं. <b>TL-••••17</b></div>
        <div class="ln hi old">पिछली वैधता: <span class="od"><b>31-03-2026</b>
          <svg class="draw" viewBox="0 0 300 40" preserveAspectRatio="none" style="left:-8px;top:12px;width:calc(100% + 16px);height:40px">
            <path class="anim a-draw" pathLength="1" style="--T:5s;animation-delay:1.3s" d="M4 26 C 90 18, 200 22, 296 14"/></svg></span></div>
        <div class="ln hi"><span class="lit2 anim a-lit" style="--T:.6s;animation-delay:1.75s;display:inline-block;padding:0 8px">नई वैधता: <b class="anim a-write" style="--T:4s;animation-delay:1.9s;display:inline-block">31-03-2027</b></span></div>
        <div class="bar" style="width:84%;margin-top:40px"></div><div class="bar" style="width:66%"></div><div class="bar" style="width:74%"></div><div class="bar" style="width:52%"></div>
        <div class="sig"></div>
        <div class="stamp hi anim a-stampdown" style="--T:5s;position:absolute;left:70px;bottom:70px;font-size:64px;padding:14px 34px;animation-delay:3.0s">रिन्यू ✓</div>
      </div></div>
    </div>
  </div>
  <div class="rail hi">साल के काम · ट्रेड लाइसेंस</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
