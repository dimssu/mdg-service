<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* K506 says "कौन-से काम पेंडिंग हैं" at 3.8–5.4 s and "कौन-से पूरे हो चुके हैं" at 6.3–7.7 s;
   each block fills as its half of the sentence is spoken. */
#P18 .cam{transform-origin:50% 74%}
#P18 .phone{width:860px;height:1290px;border-radius:84px;padding:16px}
#P18 .screen{border-radius:70px;background:var(--cream)}
#P18 .island{position:absolute;top:22px;left:50%;width:150px;height:40px;margin-left:-75px;border-radius:20px;background:#000;z-index:10}
#P18 .app-top{padding:84px 36px 24px;gap:20px}
#P18 .app-top .logo{width:72px;height:72px;border-radius:20px;font-size:28px}
#P18 .app-top .nm{font-size:36px}
#P18 .app-top .on{font-size:28px}
#P18 .app-body{padding:34px 30px;gap:0}
#P18 .kc{border-radius:26px;overflow:hidden;background:#fff;border:2px solid var(--amberSoft);
  box-shadow:0 18px 40px rgba(74,15,15,.16);transform-origin:50% 0}
#P18 .kc-top{background:linear-gradient(120deg,var(--maroonSoft),var(--maroon) 62%);border-bottom:5px solid var(--amber);
  padding:26px 30px;display:flex;align-items:center;gap:18px;color:#fff}
#P18 .kc-top .ti{font-size:42px;line-height:1.25}
#P18 .kc-mid{padding:26px 26px 30px;display:flex;flex-direction:column;gap:16px;background:var(--cream)}
#P18 .lab{display:flex;align-items:center;gap:14px;font-size:34px;margin:10px 4px 2px}
#P18 .lab.p{color:var(--amberDeep)} #P18 .lab.d{color:var(--good)}
#P18 .lab i{display:block;width:14px;height:14px;border-radius:50%;background:currentColor}
#P18 .sl{border:2.5px dashed #E4D3B8;border-radius:18px;min-height:112px}
#P18 .it{display:flex;align-items:center;gap:20px;background:#fff;border:2px solid #EFE4D2;border-radius:18px;
  padding:24px 22px;box-shadow:0 5px 14px rgba(74,15,15,.07);margin:-2.5px}
#P18 .it .tx{font-size:38px;color:var(--ink);line-height:1.35;flex:1;padding-top:6px}
#P18 .it .ck{width:62px;height:62px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
#P18 .it .ck.p{background:#FDF1DC;color:var(--amberDeep);border:3px solid var(--amber)}
#P18 .it .ck.d{background:linear-gradient(150deg,#27935A,#17663C);border:3px solid var(--amber);
  box-shadow:0 6px 14px rgba(30,122,74,.30)}
#P18 .it .ck svg{width:34px;height:34px;stroke-width:3}
#P18 .it.done{border-color:#CFE6D8;background:linear-gradient(90deg,#fff,#F3FAF5)}
@keyframes openCard{0%{opacity:0;transform:scaleY(.2) translateY(-30px)}50%{opacity:1}100%{opacity:1;transform:none}}
.open{animation-name:openCard;animation-duration:.8s!important}
@keyframes tickIn{0%{opacity:0;transform:scale(.3) rotate(-30deg)}60%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:none}}
.tk{animation-name:tickIn;animation-duration:.55s!important}
@keyframes push{0%{transform:scale(1)}100%{transform:scale(1.1)}}
.push{animation-name:push;animation-duration:2.2s!important;animation-timing-function:cubic-bezier(.45,0,.55,1)!important}
.fast{animation-duration:.7s!important}
</style>
</head>
<body>
<!-- ══ P18 · what is pending, what is done · K506 "…कौन-से काम पेंडिंग हैं, और कौन-से पूरे हो चुके हैं" ══ -->
<div class="panel" id="P18" data-plate="desk" style="--T:10s">
  <div class="glow anim a-glow"></div>
  <div class="cam anim push" style="animation-delay:7.15s">
  <div class="phone anim a-rise" style="animation-duration:.9s">
    <div class="screen">
      <div class="island"></div>
      <div class="app-top"><div class="logo dis">DK</div><div class="nm hi">डीलर कवच</div><div class="on hi">आज</div></div>
      <div class="app-body">
        <div class="kc anim open" style="animation-delay:.25s">
          <div class="kc-top"><svg class="i" style="width:44px;height:44px"><use href="#i-cal"/></svg><span class="ti hi">काम की स्थिति · आज</span></div>
          <div class="kc-mid">
            <div class="lab p hi"><i></i>पेंडिंग</div>
            <div class="sl"><div class="it anim a-stamp fast" style="animation-delay:3.3s">
              <span class="ck p"><svg class="i"><use href="#i-clock"/></svg></span><span class="tx hi">टेक्नीशियन विज़िट — कल सुबह</span></div></div>
            <div class="sl"><div class="it anim a-stamp fast" style="animation-delay:4.0s">
              <span class="ck p"><svg class="i"><use href="#i-clock"/></svg></span><span class="tx hi">पाइपलाइन जाँच की रिपोर्ट</span></div></div>

            <div class="lab d hi" style="margin-top:22px"><i></i>पूरे हो चुके</div>
            <div class="sl"><div class="it done anim a-stamp fast" style="animation-delay:5.3s">
              <span class="tx hi">कंप्लेंट दर्ज</span><span class="ck d anim tk" style="animation-delay:5.55s"><svg class="i"><use href="#i-check"/></svg></span></div></div>
            <div class="sl"><div class="it done anim a-stamp fast" style="animation-delay:5.8s">
              <span class="tx hi">वर्क परमिट तैयार</span><span class="ck d anim tk" style="animation-delay:6.05s"><svg class="i"><use href="#i-check"/></svg></span></div></div>
            <div class="sl"><div class="it done anim a-stamp fast" style="animation-delay:6.3s">
              <span class="tx hi">डेली डिक्लेरेशन</span><span class="ck d anim tk" style="animation-delay:6.55s"><svg class="i"><use href="#i-check"/></svg></span></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  <div class="rail hi">क्या बाक़ी है, क्या पूरा हुआ</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
