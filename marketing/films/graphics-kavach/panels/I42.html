<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
#I42{gap:0;justify-content:flex-start;padding-top:370px}
#I42 .hd{font-size:62px;color:var(--maroon);line-height:1.3;margin-bottom:56px;text-align:center}
#I42 .sheet{width:960px;background:rgba(255,253,248,.82);border-radius:34px;padding:40px 36px 30px;
  box-shadow:0 34px 70px rgba(58,16,10,.18),inset 0 0 0 1px rgba(201,160,100,.45)}
#I42 .day{display:flex;align-items:flex-start;gap:22px;margin-bottom:34px}
#I42 .day .n{width:78px;flex:none;font-size:58px;font-weight:700;color:var(--ink);line-height:84px;text-align:right}
#I42 .day .col{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
#I42 .bar{height:84px;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#F2C46E,var(--amber) 55%,var(--amberDeep));
  box-shadow:0 8px 18px rgba(199,124,27,.28);display:flex;align-items:center;justify-content:flex-end;padding-right:22px;width:var(--w)}
#I42 .bar b{font-family:'Space Grotesk',sans-serif;font-size:40px;color:#3A1D05;white-space:nowrap}
/* the bar has 22px of padding, so at width 0 it would still show an orange stub:
   keep it invisible until it starts to grow */
@keyframes growW{0%{width:0;opacity:0}6%{opacity:1}100%{width:var(--w);opacity:1}}
.gw{animation-name:growW;animation-duration:.9s!important;animation-timing-function:cubic-bezier(.25,.8,.35,1)!important}
#I42 .out{align-self:flex-end;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--maroonSoft),var(--maroon));
  color:#FFF3E2;border-radius:16px;padding:12px 24px 12px 16px;font-size:36px;box-shadow:0 12px 24px rgba(74,15,15,.30);position:relative}
#I42 .out::before{content:'';position:absolute;right:60px;top:-12px;border:12px solid transparent;border-top:0;border-bottom-color:var(--maroonSoft)}
#I42 .out .ar{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
#I42 .out .ar svg{width:32px;height:32px;stroke-width:2.6}
#I42 .out b{font-family:'Space Grotesk',sans-serif;color:var(--amberSoft)}
#I42 .line{margin-top:44px;font-size:46px;line-height:1.35;color:var(--maroonDeep);text-align:center;
  background:linear-gradient(transparent 62%,rgba(233,162,59,.45) 62%);padding:0 10px}
.nw{white-space:nowrap}
</style>
</head>
<body>
<!-- ══ I42 · cash flow, planned ahead · K512 "इससे आपके पंप की फ़ाइनेंशियल प्लानिंग और कैश फ़्लो संभालने में मदद मिलती है।" ══ -->
<div class="panel" id="I42" data-plate="office" style="--T:7s">
  <div class="hd hi anim a-fade" style="animation-duration:.6s">कैश फ़्लो · <span class="nw">21 से 26 अगस्त</span></div>
  <div class="sheet anim a-fade" style="animation-duration:.5s">
    <div class="day"><span class="n dis">21</span><div class="col"><div class="bar anim gw" style="--w:85.1%;animation-delay:.25s"><b>₹3,12,400</b></div></div></div>
    <div class="day"><span class="n dis">22</span><div class="col"><div class="bar anim gw" style="--w:81.4%;animation-delay:.5s"><b>₹2,98,700</b></div></div></div>
    <div class="day"><span class="n dis">23</span><div class="col"><div class="bar anim gw" style="--w:83.2%;animation-delay:.75s"><b>₹3,05,100</b></div></div></div>
    <div class="day"><span class="n dis">24</span><div class="col"><div class="bar anim gw" style="--w:87.7%;animation-delay:1.0s"><b>₹3,21,800</b></div>
      <div class="out hi anim a-drop" style="animation-delay:2.6s;animation-duration:.8s"><span class="ar"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v15M5.5 12.5 12 19l6.5-6.5"/></svg></span><span>DOD जमा <b>₹2,50,000</b></span></div></div></div>
    <div class="day"><span class="n dis">25</span><div class="col"><div class="bar anim gw" style="--w:92.7%;animation-delay:1.25s"><b>₹3,40,200</b></div>
      <div class="out hi anim a-drop" style="animation-delay:3.15s;animation-duration:.8s"><span class="ar"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v15M5.5 12.5 12 19l6.5-6.5"/></svg></span><span>DOD जमा <b>₹2,36,120</b></span></div></div></div>
    <div class="day" style="margin-bottom:0"><span class="n dis">26</span><div class="col"><div class="bar anim gw" style="--w:100%;animation-delay:1.5s"><b>₹3,66,900</b></div></div></div>
  </div>
  <div class="line hi anim a-write" style="animation-delay:4.0s;animation-duration:1.1s">फ़ाइनेंशियल प्लानिंग · कैश फ़्लो — पहले से</div>
  <div class="rail hi">पहले से तैयारी</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
