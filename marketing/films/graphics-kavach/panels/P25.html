<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes phoneIn{0%{opacity:0;transform:translateY(160px) scale(.96)}100%{opacity:1;transform:none}}
  @keyframes up{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:none}}
  @keyframes press{0%,100%{transform:scale(1)}35%{transform:scale(.955)}}
  @keyframes ripple{0%{opacity:.55;transform:scale(0)}100%{opacity:0;transform:scale(5)}}
  @keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.9)}12%{opacity:1;transform:translate(0,-14px) scale(1.12)}
    82%{opacity:1;transform:translate(var(--fx),var(--fy)) scale(1)}100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.5)}}
  @keyframes hit{0%{background:#fff;box-shadow:0 4px 12px rgba(74,15,15,.07)}
    30%{background:#FFF0D2;box-shadow:0 0 0 5px rgba(233,162,59,.55)}100%{background:#fff;box-shadow:0 4px 12px rgba(74,15,15,.07)}}
  @keyframes doneIn{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:none}}
  @keyframes fillw{0%{width:0}100%{width:var(--w)}}
  @keyframes show{0%{opacity:0}100%{opacity:1}}
  @keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-20deg)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
  @keyframes halo{0%,100%{opacity:.55}50%{opacity:.9}}

  #P25 .halo{position:absolute;left:50%;top:50%;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,162,59,.36),rgba(233,162,59,0) 64%);z-index:1;animation-name:halo;animation-duration:6s}
  #P25 .phone{animation-name:phoneIn;animation-duration:.8s}
  #P25 .app-top .logo{font-size:24px}
  #P25 .app-body{padding:26px 24px 28px;gap:22px;position:relative}
  #P25 .hdr{background:linear-gradient(125deg,var(--maroonSoft),var(--maroonDeep));border-radius:20px;padding:22px 26px;
    color:#fff;box-shadow:0 10px 22px rgba(74,15,15,.25);border-bottom:5px solid var(--amber)}
  #P25 .hdr .a{font-size:46px;line-height:1.25}
  #P25 .hdr .b{font-size:31px;color:var(--amberSoft);margin-top:4px}
  #P25 .chip{position:relative;display:flex;align-items:center;gap:16px;background:#fff;border:2px solid #EFE4D2;border-radius:18px;
    padding:22px 18px 22px 20px;box-shadow:0 4px 12px rgba(74,15,15,.07);animation-name:up;animation-duration:.45s}
  #P25 .chip .tap{position:relative;width:48px;height:48px;border-radius:50%;flex:none;border:3px solid #D8CBB6;
    display:flex;align-items:center;justify-content:center}
  #P25 .chip .tap .ok{position:absolute;inset:-3px;border-radius:50%;background:var(--good);color:#fff;display:flex;
    align-items:center;justify-content:center;animation-name:doneIn;animation-duration:.3s}
  #P25 .chip .tx{font-size:31px;color:var(--ink);flex:1;line-height:1.3}
  #P25 .chip .pt{position:relative;font-size:34px;font-weight:700;color:var(--good);background:var(--goodBg);border-radius:12px;padding:6px 14px}
  #P25 .chip .inner{display:flex;align-items:center;gap:16px;flex:1;animation-name:press;animation-duration:.35s;animation-timing-function:ease-in-out}
  #P25 .rip{position:absolute;left:44px;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
    background:rgba(107,22,22,.35);pointer-events:none;animation-name:ripple;animation-duration:.6s;animation-timing-function:ease-out}
  #P25 .fl{position:absolute;right:18px;top:50%;margin-top:-28px;font-size:40px;font-weight:700;color:#fff;background:var(--amberDeep);
    border-radius:14px;padding:4px 14px;box-shadow:0 10px 22px rgba(120,60,10,.4);z-index:8;
    animation-name:fly;animation-duration:.85s;animation-timing-function:cubic-bezier(.5,0,.3,1)}
  #P25 .sep{height:2px;background:linear-gradient(90deg,transparent,#E2D2BA,transparent);margin:4px 0}
  #P25 .who{position:relative;display:flex;align-items:center;gap:18px;background:#fff;border:2px solid #EFE4D2;border-radius:18px;padding:24px 22px;
    animation-name:hit;animation-duration:.7s;animation-timing-function:ease-out}
  #P25 .av{width:62px;height:62px;border-radius:50%;flex:none;background:linear-gradient(145deg,var(--amberSoft),#EFC98A);
    color:var(--maroonDeep);font-size:30px;display:flex;align-items:center;justify-content:center}
  #P25 .who .mid{flex:1;display:flex;flex-direction:column;gap:12px}
  #P25 .who .nm{font-size:40px;color:var(--ink);line-height:1.1}
  #P25 .track{position:relative;height:12px;border-radius:99px;background:#F0E6D6}
  #P25 .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;display:block;animation-name:fillw;animation-duration:.9s}
  #P25 .track b{position:absolute;left:90.9%;top:-7px;bottom:-7px;width:0;border-left:3px dashed var(--maroon)}
  #P25 .tot{display:flex;align-items:center;width:150px;flex:none;justify-content:flex-end;animation-name:show;animation-duration:.25s}
  #P25 .tot .n{font-size:70px;font-weight:700;color:var(--maroon);line-height:1}
  #P25 .tot .odo{--T:3s}
  #P25 .tot .odo .col{text-align:right}
  #P25 .tot .odo .col{animation-delay:3.0s !important}
  #P25 .tot .odo .col:nth-child(2){animation-delay:3.08s !important}
  #P25 .tot .odo .col:nth-child(3){animation-delay:3.16s !important}
  #P25 .tick{position:absolute;right:-16px;top:-18px;width:58px;height:58px;border:4px solid #fff;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(30,122,74,.4);animation-name:pop;animation-duration:.45s}
  #P25 .tick svg.i{width:32px;height:32px;stroke-width:3.2}
</style>
</head>
<body>
<!-- ══ P25 · the manager taps the staff's work; points fly into names · K721 (held 5.5 s) ══ -->
<div class="panel" id="P25" data-plate="desk" style="--T:6s">
  <div class="halo mv"></div>
  <div class="phone mv" style="animation-delay:-.3s">
    <div class="screen">
      <div class="app-top"><div class="logo dis">DK</div><div class="nm hi">डीलर कवच</div><div class="on hi">आज</div></div>
      <div class="app-body">
        <div class="hdr"><div class="a hi">वॉरियर्स</div><div class="b hi">आज · लक्ष्य 100 पॉइंट</div></div>

        <div class="chip mv" style="animation-delay:.1s;z-index:6">
          <div class="inner mv" style="animation-delay:.7s">
            <span class="tap"><span class="ok mv" style="animation-delay:.8s"><svg class="i"><use href="#i-check"/></svg></span></span>
            <span class="tx hi">डिस्पेंसर आइलैंड की सफ़ाई</span><span class="pt dis">+12</span></div>
          <span class="rip mv" style="animation-delay:.7s"></span>
          <span class="fl dis mv" id="f1" style="animation-delay:.85s;--fx:-31px;--fy:414px">+12</span>
        </div>
        <div class="chip mv" style="animation-delay:.2s;z-index:5">
          <div class="inner mv" style="animation-delay:1.5s">
            <span class="tap"><span class="ok mv" style="animation-delay:1.6s"><svg class="i"><use href="#i-check"/></svg></span></span>
            <span class="tx hi">टैंकर डिकैंटेशन में मदद</span><span class="pt dis">+20</span></div>
          <span class="rip mv" style="animation-delay:1.5s"></span>
          <span class="fl dis mv" id="f2" style="animation-delay:1.65s;--fx:-28px;--fy:434px">+20</span>
        </div>
        <div class="chip mv" style="animation-delay:.3s;z-index:4">
          <div class="inner mv" style="animation-delay:2.3s">
            <span class="tap"><span class="ok mv" style="animation-delay:2.4s"><svg class="i"><use href="#i-check"/></svg></span></span>
            <span class="tx hi">स्टॉक बोर्ड अपडेट</span><span class="pt dis">+15</span></div>
          <span class="rip mv" style="animation-delay:2.3s"></span>
          <span class="fl dis mv" id="f3" style="animation-delay:2.45s;--fx:-31px;--fy:452px">+15</span>
        </div>

        <div class="sep"></div>

        <div class="who mv" style="animation-delay:1.5s">
          <span class="av hi">सु</span>
          <div class="mid"><span class="nm hi">सुनील</span>
            <span class="track"><i class="mv" style="--w:94.5%;background:var(--good);animation-delay:3.0s"></i><b></b></span></div>
          <div class="tot mv" style="animation-delay:3.0s"><span class="n dis"><span class="odo" data-n="104"></span></span>
            <span class="tick mv" style="animation-delay:3.8s"><svg class="i"><use href="#i-check"/></svg></span></div>
        </div>
        <div class="who mv" style="animation-delay:2.3s">
          <span class="av hi">रा</span>
          <div class="mid"><span class="nm hi">राजू</span>
            <span class="track"><i class="mv" style="--w:78.2%;background:var(--amber);animation-delay:3.1s"></i><b></b></span></div>
          <div class="tot mv" style="animation-delay:3.0s"><span class="n dis"><span class="odo" data-n="86"></span></span></div>
        </div>
        <div class="who mv" style="animation-delay:3.1s">
          <span class="av hi">मो</span>
          <div class="mid"><span class="nm hi">मोहन</span>
            <span class="track"><i class="mv" style="--w:65.5%;background:var(--amber);animation-delay:3.2s"></i><b></b></span></div>
          <div class="tot mv" style="animation-delay:3.0s"><span class="n dis"><span class="odo" data-n="72"></span></span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="rail hi">काम की रेटिंग से रोज़ का असेसमेंट</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
