<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
#I45{gap:0}
#I45 .hd{font-size:70px;line-height:1.3;color:var(--maroon);text-align:center;margin-bottom:80px}
#I45 .list{width:940px;display:flex;flex-direction:column;gap:38px}
#I45 .it{position:relative;display:flex;align-items:center;gap:34px;background:#fff;border:2px solid #EFE4D2;border-radius:28px;
  padding:34px 40px;box-shadow:0 22px 44px rgba(58,16,10,.14)}
#I45 .it .ck{width:92px;height:92px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,#27935A,#17663C);border:4px solid var(--amber);box-shadow:0 8px 18px rgba(30,122,74,.30)}
#I45 .it .ck svg{width:50px;height:50px;stroke-width:3}
#I45 .it .w{font-size:54px;line-height:1.3;color:var(--ink);padding-top:6px}
#I45 .it.hot{border:4px solid var(--amber);background:linear-gradient(100deg,#FFF8E8,#fff 70%)}
#I45 .it .doc{margin-left:auto;width:96px;height:96px;border-radius:24px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#fff;background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))}
#I45 .it .doc svg{width:58px;height:58px;stroke-width:1.9}
#I45 .halo{position:absolute;inset:0;border-radius:28px;box-shadow:0 0 56px 16px rgba(233,162,59,.55);z-index:-1}
@keyframes hGlow{0%{opacity:0}40%{opacity:1}100%{opacity:.8}}
.hg{animation-name:hGlow;animation-duration:1.4s!important}
@keyframes tickIn{0%{opacity:0;transform:scale(.3) rotate(-30deg)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
.tk{animation-name:tickIn;animation-duration:.5s!important}
.fast{animation-duration:.6s!important}
.nw{white-space:nowrap}
</style>
</head>
<body>
<!-- ══ I45 · our team helps with · K515 "…सब्सिडी क्लेम, पंप रीकंस्ट्रक्शन से जुड़े काम, और वर्क परमिट बनाना।" ══ -->
<div class="panel" id="I45" data-plate="office" style="--T:5s">
  <div class="glow anim a-glow" style="top:58%"></div>
  <div class="hd hi anim a-fade" style="animation-duration:.6s">हमारी अनुभवी टीम<br/>मदद करती है</div>
  <div class="list">
    <div class="it anim a-stamp fast" style="animation-delay:.7s"><span class="ck anim tk" style="animation-delay:.95s"><svg class="i"><use href="#i-check"/></svg></span><span class="w hi">सब्सिडी क्लेम</span></div>
    <div class="it anim a-stamp fast" style="animation-delay:1.6s"><span class="ck anim tk" style="animation-delay:1.85s"><svg class="i"><use href="#i-check"/></svg></span><span class="w hi">पंप रीकंस्ट्रक्शन से<br/>जुड़े काम</span></div>
    <div class="it hot anim a-stamp fast" style="animation-delay:2.5s">
      <div class="halo anim hg" style="animation-delay:2.9s"></div>
      <span class="ck anim tk" style="animation-delay:2.75s"><svg class="i"><use href="#i-check"/></svg></span><span class="w hi">वर्क परमिट बनाना</span>
      <span class="doc anim a-pop" style="animation-delay:3.0s;animation-duration:.8s"><svg class="i"><use href="#i-doc"/></svg></span></div>
  </div>
  <div class="rail hi">अनुभव से काम</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
