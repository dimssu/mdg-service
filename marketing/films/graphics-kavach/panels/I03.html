<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  #I03 .abs{position:absolute}
  #I03 .l1{top:210px;left:60px;right:60px;text-align:center}
  #I03 .l1 .cap{font-size:60px;margin:0 auto;display:inline-flex;align-items:center;gap:22px}
  #I03 .l1 .tk{width:64px;height:64px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#F5BE5E,var(--amberDeep));color:var(--maroonDeep);box-shadow:0 10px 24px rgba(0,0,0,.35)}
  #I03 .l1 .tk svg{width:38px;height:38px;stroke-width:3.2}
  #I03 .stage{top:360px;left:60px;width:960px;height:1100px}
  #I03 .stage svg{width:100%;height:100%;overflow:visible}
  /* the shadow grows out of his feet: a scale in the figure's own frame, before the floor transform lays it down */
  #I03 .grow{transform-box:fill-box;transform-origin:50% 100%;animation-name:stretch;animation-duration:1.5s;
    animation-timing-function:cubic-bezier(.3,.7,.2,1)}
  @keyframes stretch{0%{transform:scaleY(0);opacity:0}12%{opacity:1}100%{transform:scaleY(1);opacity:1}}
  #I03 .l2{top:1478px;left:60px;right:60px;text-align:center;font-size:76px;line-height:1.3;color:#FFF3E2}
  #I03 .l2 b{color:var(--amber);font-weight:400}
</style>
</head>
<body>
<!-- ══ I03 · the dealer's shadow · K102 "आपकी अनुमति मिलने के बाद … डीलर की परछाई बनकर काम करते हैं" ═══ -->
<div class="panel ink" id="I03" data-plate="dusk" style="--T:4s">
  <div class="abs l1">
    <div class="cap hi anim a-fade" style="animation-delay:-.1s">
      <span class="tk anim a-pop" style="animation-delay:.35s"><svg class="i"><use href="#i-check"/></svg></span>
      <span>आपकी अनुमति के बाद</span></div>
  </div>

  <div class="abs stage">
    <svg viewBox="0 0 960 1100">
      <defs>
        <g id="man">
          <circle cx="0" cy="-566" r="45"/>
          <rect x="-16" y="-530" width="32" height="34" rx="8"/>
          <path d="M-74,-508 Q-100,-504 -102,-476 L-84,-300 Q-81,-280 -62,-278 L62,-278 Q81,-280 84,-300 L102,-476 Q100,-504 74,-508 Z"/>
          <path d="M-100,-474 Q-114,-466 -116,-440 L-130,-282 Q-132,-260 -116,-258 Q-100,-256 -98,-276 L-84,-396 Z"/>
          <path d="M100,-474 Q114,-466 116,-440 L130,-282 Q132,-260 116,-258 Q100,-256 98,-276 L84,-396 Z"/>
          <rect x="-60" y="-292" width="54" height="284" rx="22"/>
          <rect x="6" y="-292" width="54" height="284" rx="22"/>
          <ellipse cx="-36" cy="-7" rx="38" ry="12"/>
          <ellipse cx="36" cy="-7" rx="38" ry="12"/>
        </g>
        <linearGradient id="shadeFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-560">
          <stop offset="0" stop-color="#2A0606" stop-opacity=".95"/>
          <stop offset="1" stop-color="#4E0F0F" stop-opacity=".62"/>
        </linearGradient>
        <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#F2B55A" stop-opacity=".82"/>
          <stop offset=".6" stop-color="#C77C1B" stop-opacity=".40"/>
          <stop offset="1" stop-color="#C77C1B" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <!-- the lit floor he stands on -->
      <ellipse cx="560" cy="830" rx="600" ry="330" fill="url(#pool)" class="anim a-fade" style="animation-delay:-.3s"/>
      <!-- his shadow, laid on the floor and stretching away from his feet -->
      <g transform="translate(320,610) skewX(47) scale(1,-.8)" filter="url(#soft)">
        <g class="anim grow" style="animation-delay:1.1s"><use href="#man" fill="url(#shadeFade)"/></g>
      </g>
      <!-- him -->
      <g transform="translate(320,610)"><g class="anim a-fade" style="animation-delay:-.05s">
        <use href="#man" fill="#FFF3E2"/>
      </g></g>
    </svg>
  </div>

  <div class="abs l2 hi anim a-write" style="--T:6s;animation-delay:1.5s"><b>डीलर की परछाई</b><br/>बनकर काम</div>
  <div class="rail hi">हर पल, आपके पंप के साथ</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
