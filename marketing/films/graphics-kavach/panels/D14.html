<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* every task has its points and its validity: six example rows slide in with the
   points counting up in gold (real integer counters on the panel's clock); then
   the validity column lights up, each chip coloured by its cycle — daily maroon,
   quarterly amber, yearly deep gold — and the footer stamps in. */
@property --p{syntax:'<integer>';initial-value:0;inherits:false}
.tag{align-self:flex-start;margin-left:84px;background:var(--amber);color:var(--maroonDeep);font-size:36px;
  padding:10px 30px;border-radius:999px;box-shadow:0 8px 18px rgba(199,124,27,.3)}
.stage{display:flex;flex-direction:column;align-items:center;gap:52px;transform-origin:50% 45%}
.sheet{width:900px;--rot:-.9deg;padding:10px 26px 22px}
.g{display:grid;grid-template-columns:1fr 170px 236px;position:relative}
.g > div{display:flex;align-items:center;height:128px;border-bottom:2px solid #E4DACB;position:relative;z-index:2}
.g .h{height:96px;font-size:34px;color:#3A332C;border-bottom:3px solid var(--print);justify-content:center}
.g .h:nth-child(2){justify-content:flex-start;padding-left:14px}
.k{font-size:44px;color:var(--ink);line-height:1.2;padding-left:14px}
.pt{justify-content:center}
.pt span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;color:#B5700F;counter-reset:p var(--p);letter-spacing:-1px}
.pt span::after{content:counter(p)}
@keyframes countTo{0%{--p:0}100%{--p:var(--to)}}
.va{justify-content:center}
.chip{font-size:40px;line-height:1.2;padding:12px 28px;border-radius:999px;color:#6B6258;border:2px solid #D8CBB6}
@keyframes chipOn{0%{background:transparent;color:#6B6258;border-color:#D8CBB6;transform:scale(1)}
  50%{transform:scale(1.12)}100%{background:var(--c);color:var(--fg,#fff);border-color:var(--c);transform:scale(1)}}
.g > .band{position:absolute;right:0;top:96px;bottom:0;width:236px;height:auto;border-bottom:none;z-index:1;border-radius:10px;
  background:linear-gradient(180deg,rgba(255,214,64,.34),rgba(255,214,64,.20));transform-origin:50% 0}
@keyframes growY{0%{transform:scaleY(0);opacity:0}100%{transform:scaleY(1);opacity:1}}
.foot{display:flex;align-items:center;gap:18px;font-size:46px;line-height:1.3;color:var(--maroon);
  border:6px solid var(--maroon);border-radius:18px;padding:18px 32px;background:rgba(255,253,248,.9);transform:rotate(-2deg);
  box-shadow:0 14px 30px rgba(74,15,15,.16)}
.foot svg{width:54px;height:54px;flex:none;stroke-width:2.2}
@keyframes stampIn2{0%{opacity:0;transform:scale(1.7) rotate(-8deg)}55%{opacity:1;transform:scale(.97) rotate(-2deg)}100%{opacity:1;transform:rotate(-2deg)}}
@keyframes push{0%{transform:scale(1)}100%{transform:scale(1.04)}}
</style>
</head>
<body>
<!-- ══ D14 · every task has points and a validity · K403 "हर काम के पॉइंट तय हैं, और हर काम की अपनी वैलिडिटी भी। इसी पॉइंट सिस्टम से हमारी टीम हर दिन आपके पंप का असेसमेंट तैयार करती है।" (8.9 s) ══ -->
<div class="panel" id="D14" data-plate="desk" style="--T:10s">
  <div class="glow anim a-glow" style="animation-delay:-.5s"></div>
  <div class="tag hi anim a-fade" style="animation-delay:0s;animation-duration:3s">उदाहरण</div>
  <div class="stage anim" style="animation-name:push;animation-delay:5.4s;animation-duration:4.2s;animation-timing-function:linear">
    <div class="paper sheet anim a-settle" style="--r0:3deg;--r1:-.9deg;animation-delay:.1s;animation-duration:3s">
      <div class="g">
        <div class="band anim" style="animation-name:growY;animation-delay:3.7s;animation-duration:.5s"></div>
        <div class="h hi">काम</div><div class="h hi">पॉइंट</div><div class="h hi">वैलिडिटी</div>

        <div class="k hi anim a-stamp" style="animation-delay:.45s;animation-duration:3.5s">डी-एस-आर भरना</div>
        <div class="pt anim a-stamp" style="animation-delay:.5s;animation-duration:3.5s"><span class="anim" style="--to:120;animation-name:countTo;animation-delay:.6s;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.3,1)"></span></div>
        <div class="va anim a-stamp" style="animation-delay:.55s;animation-duration:3.5s"><span class="chip hi anim" style="--c:var(--maroon);animation-name:chipOn;animation-delay:3.95s;animation-duration:.4s">रोज़</span></div>

        <div class="k hi anim a-stamp" style="animation-delay:1.0s;animation-duration:3.5s">डेंसिटी रजिस्टर</div>
        <div class="pt anim a-stamp" style="animation-delay:1.05s;animation-duration:3.5s"><span class="anim" style="--to:80;animation-name:countTo;animation-delay:1.15s;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.3,1)"></span></div>
        <div class="va anim a-stamp" style="animation-delay:1.1s;animation-duration:3.5s"><span class="chip hi anim" style="--c:var(--maroon);animation-name:chipOn;animation-delay:4.1s;animation-duration:.4s">रोज़</span></div>

        <div class="k hi anim a-stamp" style="animation-delay:1.55s;animation-duration:3.5s">स्टॉक बोर्ड</div>
        <div class="pt anim a-stamp" style="animation-delay:1.6s;animation-duration:3.5s"><span class="anim" style="--to:60;animation-name:countTo;animation-delay:1.7s;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.3,1)"></span></div>
        <div class="va anim a-stamp" style="animation-delay:1.65s;animation-duration:3.5s"><span class="chip hi anim" style="--c:var(--maroon);animation-name:chipOn;animation-delay:4.25s;animation-duration:.4s">रोज़</span></div>

        <div class="k hi anim a-stamp" style="animation-delay:2.1s;animation-duration:3.5s">बाथरूम-टॉयलेट इंस्पेक्शन</div>
        <div class="pt anim a-stamp" style="animation-delay:2.15s;animation-duration:3.5s"><span class="anim" style="--to:40;animation-name:countTo;animation-delay:2.25s;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.3,1)"></span></div>
        <div class="va anim a-stamp" style="animation-delay:2.2s;animation-duration:3.5s"><span class="chip hi anim" style="--c:var(--maroon);animation-name:chipOn;animation-delay:4.4s;animation-duration:.4s">रोज़</span></div>

        <div class="k hi anim a-stamp" style="animation-delay:2.65s;animation-duration:3.5s">मॉक ड्रिल</div>
        <div class="pt anim a-stamp" style="animation-delay:2.7s;animation-duration:3.5s"><span class="anim" style="--to:150;animation-name:countTo;animation-delay:2.8s;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.3,1)"></span></div>
        <div class="va anim a-stamp" style="animation-delay:2.75s;animation-duration:3.5s"><span class="chip hi anim" style="--c:var(--amber);--fg:var(--maroonDeep);animation-name:chipOn;animation-delay:4.55s;animation-duration:.4s">तीन महीने</span></div>

        <div class="k hi anim a-stamp" style="animation-delay:3.2s;animation-duration:3.5s;border-bottom:none">ट्रेड लाइसेंस</div>
        <div class="pt anim a-stamp" style="animation-delay:3.25s;animation-duration:3.5s;border-bottom:none"><span class="anim" style="--to:200;animation-name:countTo;animation-delay:3.35s;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.3,1)"></span></div>
        <div class="va anim a-stamp" style="animation-delay:3.3s;animation-duration:3.5s;border-bottom:none"><span class="chip hi anim" style="--c:#8C6212;animation-name:chipOn;animation-delay:4.7s;animation-duration:.4s">साल</span></div>
      </div>
    </div>
    <div class="foot hi anim" style="animation-name:stampIn2;animation-delay:5.2s;animation-duration:.5s">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 18a9 9 0 1 1 16 0"/><path d="M12 18l4.2-5.2"/><circle cx="12" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
      इसी से — हर दिन आपके पंप का असेसमेंट</div>
  </div>
  <div class="rail hi">हर काम के पॉइंट, हर काम की वैलिडिटी</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
