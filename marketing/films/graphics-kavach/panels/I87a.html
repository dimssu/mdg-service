<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* K028 runs 4.0 s of S56 first; "सिर्फ़ पेट्रोल और डीज़ल बेचने" has been said by
   this card, so the drop, "पेट्रोल · डीज़ल" and "सिर्फ़ बेचना" are on at frame 0.
   Card time = line time − 4.0: "…का कारोबार (0.35) नहीं (0.81) रह गया (1.13–1.6)।"
   The strike draws and "नहीं रह गया" writes in just ahead of "नहीं"; then the
   first gold orbit draws round the drop — the same ellipse I87b's chips ride
   (centre 540,950; 300.4 × 413 radii). Settled from 2.35 s. */
#I87a{gap:0}
#I87a .st{position:absolute;left:60px;right:60px;top:300px;text-align:center}
#I87a .st span{position:relative;display:inline-block;font-size:96px;line-height:1.25;color:var(--maroon)}
#I87a .st i{position:absolute;left:-18px;right:-18px;top:54%;height:10px;border-radius:6px;background:var(--maroonDeep);transform-origin:0 50%;
  box-shadow:0 3px 8px rgba(78,15,15,.3)}
#I87a .drop{position:absolute;left:430px;top:720px;width:220px;height:260px}
#I87a .drop svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 26px 30px rgba(58,16,10,.28))}
#I87a .fuel{position:absolute;left:60px;right:60px;top:1010px;text-align:center;font-size:66px;line-height:1.3;color:var(--maroon)}
#I87a .fuel b{color:var(--amberDeep);font-weight:400}
#I87a .ver{position:absolute;left:60px;right:60px;top:1420px;text-align:center;font-size:92px;line-height:1.3;color:var(--amberDeep)}
#I87a svg.orb{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
#I87a svg.orb path{fill:none;stroke:var(--amber);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(233,162,59,.55))}
@keyframes strike{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes dim{to{opacity:.55}}
@keyframes wr{0%{clip-path:inset(-20% 100% -20% 0)}100%{clip-path:inset(-20% -4% -20% 0)}}
@keyframes drawOn{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
</style>
</head>
<body>
<!-- ══ I87a · not just selling petrol and diesel · K028 "…सिर्फ़ पेट्रोल और डीज़ल बेचने का कारोबार नहीं रह गया।" (from 4.0 s, 3.18 s) ══ -->
<div class="panel" id="I87a" data-plate="office" style="--T:4s">
  <div class="glow" style="top:49.5%;opacity:.8"></div>

  <div class="st hi"><span><span style="display:inline-block;animation:dim .3s linear .8s both paused">सिर्फ़ बेचना</span><i style="animation:strike .3s cubic-bezier(.5,0,.3,1) .52s both paused"></i></span></div>

  <svg class="orb" viewBox="0 0 1080 1920">
    <path d="M540 537 A300.4 413 0 1 1 540 1363 A300.4 413 0 1 1 540 537" pathLength="1"
      style="stroke-dasharray:1;animation:drawOn 1.05s cubic-bezier(.45,.1,.3,1) 1.2s both paused"/>
  </svg>

  <div class="drop">
    <svg viewBox="0 0 220 260">
      <defs>
        <linearGradient id="dg" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#F6C877"/><stop offset=".55" stop-color="#E9A23B"/><stop offset="1" stop-color="#B86A12"/></linearGradient>
      </defs>
      <path d="M110 6 C110 6 200 110 200 164 A90 90 0 0 1 20 164 C20 110 110 6 110 6 Z" fill="url(#dg)" stroke="#FFF7E6" stroke-width="6"/>
      <path d="M62 170 C62 196 80 214 104 220" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="12" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="fuel hi">पेट्रोल <b>·</b> डीज़ल</div>

  <div class="ver hi"><span style="display:inline-block;animation:wr .45s linear .6s both paused">नहीं रह गया</span></div>

  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
