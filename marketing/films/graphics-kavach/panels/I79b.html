<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* Opens on I79a's last frame exactly (same markup, same positions, glow at
   rest), then narrows the same chart onto a thin income with the minimum-wage
   block pressed up against it.
   Timed to K012 (6.0 s here): "कई पंपों की" 0.11–1.11 s, "आमदनी" 1.23 s,
   "इतनी कम रह गई है" 1.91–3.12 s, "कि स्टाफ़ को मिनिमम वेज देना भी" 3.72–6.08 s,
   "एक चुनौती" 6.49 s — after this panel has cut to S57, so the chip is in
   before the cut and the last 0.6 s are still. */
#I79b .hd{position:absolute;left:80px;right:80px;top:280px;text-align:center}
#I79b .hd > div{width:fit-content;margin-left:auto;margin-right:auto}
#I79b .hd .lbl{font-size:58px;color:var(--amberDeep);line-height:1.3}
#I79b .hd .ttl{font-size:104px;color:var(--maroon);line-height:1.25;margin-top:4px}
#I79b .chart{position:absolute;left:80px;top:676px;width:920px;height:900px;border-radius:30px;
  background:linear-gradient(170deg,#fff,#FBF3E7);border:2px solid rgba(214,168,98,.55);
  box-shadow:0 34px 70px rgba(58,16,10,.24),0 4px 10px rgba(58,16,10,.12)}
#I79b .chart svg.plot{position:absolute;left:0;top:0;width:920px;height:900px;overflow:visible}
#I79b .grid line{stroke:#EADFCB;stroke-width:2;stroke-dasharray:10 12}
#I79b .base{stroke:#8A7466;stroke-width:5;stroke-linecap:round}
#I79b .ln{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
#I79b .ln.inc{stroke:var(--maroon)}
#I79b .ln.exp{stroke:var(--amber)}
#I79b .ax{position:absolute;left:0;right:0;top:740px;text-align:center;font-size:46px;color:var(--inkMuted);
  display:flex;align-items:center;justify-content:center;gap:18px}
#I79b .ax svg{width:70px;height:30px;overflow:visible}
/* in I79a the label is centred in the chart's 916 px padding box; here it sits
   inside the 920 px camera layer, so trim 4 px to keep it on the same pixel */
#I79b .cam .ax{right:4px}
#I79b .rider{position:absolute;left:0;top:0;width:0;height:0;offset-rotate:0deg;offset-distance:100%}
#I79b .rider .dot{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:#fff;border:9px solid currentColor;
  box-shadow:0 4px 10px rgba(58,16,10,.25)}
#I79b .rider .tg{position:absolute;white-space:nowrap;font-size:56px;line-height:1.2;padding:8px 26px 4px;border-radius:999px;color:#fff;
  box-shadow:0 10px 22px rgba(58,16,10,.22)}
#I79b .rider.inc{color:var(--maroon)} #I79b .rider.inc .tg{background:var(--maroon);left:-110px;top:40px}
#I79b .rider.exp{color:var(--amber)} #I79b .rider.exp .tg{background:var(--amberDeep);left:-120px;top:-118px}

/* ── what happens next ── */
@keyframes out{0%{opacity:1}100%{opacity:0}}
@keyframes outUp{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-50px)}}
.o{animation-name:out} .ou{animation-name:outUp}
/* the push in on the low end of the income line: the card stays put, a camera
   inside it moves in until the gap between the ceiling and the floor fills it */
#I79b .chart{overflow:hidden}
#I79b .cam{position:absolute;left:0;top:0;width:920px;height:900px;transform-origin:465px 862px}
@keyframes pushLow{0%{transform:none}100%{transform:scale(1.3636)}}
.pl{animation-name:pushLow;animation-timing-function:cubic-bezier(.45,0,.25,1)}
/* the income line flattens into a ceiling at its own low end */
@keyframes flatten{0%{d:path('M110 150 C 220 150, 270 215, 360 250 S 520 300, 600 360 S 740 440, 800 450')}
  100%{d:path('M70 450 C 250 450, 300 450, 360 450 S 520 450, 600 450 S 760 450, 860 450')}}
.fl{animation-name:flatten;animation-timing-function:cubic-bezier(.5,0,.25,1)}
#I79b .ceil{position:absolute;left:56px;top:186px;font-size:66px;line-height:1.3;color:var(--maroon);white-space:nowrap}
#I79b .ceil b{font-weight:400;color:var(--maroonDeep)}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
.fu{animation-name:fadeUp}
#I79b .tag{position:absolute;left:0;right:0;top:400px;display:flex;justify-content:center}
#I79b .tag span{display:flex;align-items:center;gap:14px;font-size:64px;line-height:1.2;color:var(--maroonDeep);padding:16px 46px 10px;border-radius:999px;
  background:#FFF1D2;border:3px solid var(--amber);box-shadow:0 12px 26px rgba(120,60,6,.20)}
@keyframes popTag{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:none}}
.pt{animation-name:popTag;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
/* the room between the ceiling and the floor; the wage block rises into it */
#I79b .room{position:absolute;left:72px;right:60px;top:457px;height:210px;overflow:hidden}
#I79b .blk{position:absolute;left:133px;right:135px;top:0;bottom:0;border-radius:16px 16px 0 0;
  background:linear-gradient(170deg,#F8D899,#E9A23B 55%,#C77C1B);box-shadow:inset 0 -8px 18px rgba(120,60,6,.25),inset 0 3px 0 rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;gap:16px;color:var(--maroonDeep)}
#I79b .blk .t{font-size:49px;line-height:1.2;padding-top:6px;white-space:nowrap}
#I79b .blk svg{width:62px;height:62px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes riseBlk{0%{transform:translateY(215px)}78%{transform:translateY(-5px)}100%{transform:none}}
.rb{animation-name:riseBlk;animation-timing-function:cubic-bezier(.3,.7,.35,1)}
/* the ceiling gives a little as the block presses into it */
@keyframes bow{0%,100%{transform:none}35%{transform:translateY(-7px)}}
.bw{animation-name:bow;animation-timing-function:ease-in-out}
#I79b .chip{position:absolute;right:40px;top:232px;display:flex;align-items:center;gap:12px;white-space:nowrap;
  font-size:56px;line-height:1.2;color:var(--maroon);background:#fff;border:4px solid var(--maroon);border-radius:999px;padding:10px 34px 4px 22px;
  box-shadow:0 14px 28px rgba(74,15,15,.24)}
#I79b .chip svg{width:52px;height:52px;color:var(--amberDeep)}
@keyframes chipPop{0%{opacity:0;transform:scale(.4) rotate(-8deg)}65%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{opacity:1;transform:rotate(0deg)}}
.cp{animation-name:chipPop;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
</style>
</head>
<body>
<!-- ══ I79b · a thin income, the minimum wage pressed against it · K012 "कई पंपों की आमदनी इतनी कम रह गई है, कि स्टाफ़ को मिनिमम वेज देना भी एक चुनौती बनता जा रहा है।" (first 6.0 s) ══ -->
<div class="panel" id="I79b" data-plate="office" style="--T:7s">
  <!-- I79a's glow, at rest -->
  <div class="glow" style="top:52%;opacity:.34;transform:scale(1)"></div>

  <div class="hd anim ou" style="animation-delay:0s;animation-duration:.22s">
    <div class="lbl hi">सबसे पहली,</div>
    <div class="ttl hi">सबसे बड़ी समस्या</div>
  </div>
  <div class="tag anim pt" style="animation-delay:.06s;animation-duration:.3s"><span class="hi">कई पंपों पर</span></div>

  <div class="chart">
   <div class="cam anim pl" style="animation-delay:.05s;animation-duration:1.0s">
    <svg class="plot" viewBox="0 0 920 900">
      <g class="grid anim o" style="animation-delay:.1s;animation-duration:.6s"><line x1="70" y1="160" x2="860" y2="160"/><line x1="70" y1="330" x2="860" y2="330"/><line x1="70" y1="500" x2="860" y2="500"/></g>
      <line class="base" x1="70" y1="670" x2="860" y2="670"/>
      <line class="base" x1="70" y1="90" x2="70" y2="670"/>
      <g class="anim bw" style="animation-delay:4.0s;animation-duration:.6s">
        <path class="ln inc anim fl" style="animation-delay:.15s;animation-duration:.9s"
          d="M110 150 C 220 150, 270 215, 360 250 S 520 300, 600 360 S 740 440, 800 450"/>
      </g>
      <!-- drawn after the income line, as in I79a, so the crossing does not change at the cut -->
      <path class="ln exp anim o" style="animation-delay:.1s;animation-duration:.5s"
        d="M110 600 C 220 600, 280 555, 370 505 S 520 380, 610 300 S 740 170, 800 150"/>
    </svg>
    <div class="rider inc anim o" style="offset-path:path('M110 150 C 220 150, 270 215, 360 250 S 520 300, 600 360 S 740 440, 800 450');animation-delay:.05s;animation-duration:.35s">
      <span class="dot"></span><span class="tg hi">कमाई</span>
    </div>
    <div class="rider exp anim o" style="offset-path:path('M110 600 C 220 600, 280 555, 370 505 S 520 380, 610 300 S 740 170, 800 150');animation-delay:.05s;animation-duration:.35s">
      <span class="dot"></span><span class="tg hi">ख़र्च</span>
    </div>
    <div class="ax hi">साल दर साल
      <svg viewBox="0 0 70 30"><path d="M4 15H62M50 5l12 10-12 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    <div class="room">
      <div class="blk anim rb" style="animation-delay:3.3s;animation-duration:.95s">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="7.6" r="3.4"/><path d="M5.8 20c0-3.6 2.8-6.4 6.2-6.4s6.2 2.8 6.2 6.4"/>
          <circle cx="4.9" cy="9.4" r="2.4"/><path d="M1 18.6c0-2.6 1.7-4.5 3.9-4.5"/><circle cx="19.1" cy="9.4" r="2.4"/><path d="M23 18.6c0-2.6-1.7-4.5-3.9-4.5"/></svg>
        <span class="t hi">स्टाफ़ का मिनिमम वेज</span>
      </div>
    </div>
   </div>
    <div class="ceil hi anim fu" style="animation-delay:.72s;animation-duration:.35s">आमदनी — <b>कम</b></div>
    <div class="chip hi anim cp" style="animation-delay:5.0s;animation-duration:.4s"><svg class="i"><use href="#i-alert"/></svg>चुनौती</div>
  </div>

  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
