<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes cardIn{0%{opacity:0;transform:translateY(90px) rotate(3deg) scale(.95)}100%{opacity:1;transform:rotate(-1.5deg)}}
  @keyframes flipOut{0%{transform:perspective(1800px) rotateY(0)}100%{transform:perspective(1800px) rotateY(90deg)}}
  @keyframes flipIn{0%{transform:perspective(1800px) rotateY(-90deg)}100%{transform:perspective(1800px) rotateY(0)}}
  @keyframes dash{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
  @keyframes wr{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(-10% -4% -10% 0)}}
  @keyframes halo{0%,100%{opacity:.5}50%{opacity:.85}}
  @keyframes land{0%{box-shadow:0 0 0 0 rgba(233,162,59,.6)}100%{box-shadow:0 0 0 40px rgba(233,162,59,0)}}

  #I67 .halo{position:absolute;left:50%;top:46%;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,162,59,.32),rgba(233,162,59,0) 64%);z-index:1;animation-name:halo;animation-duration:7s}
  #I67 .holder{width:920px;height:560px;position:relative;animation-name:cardIn;animation-duration:.6s}
  #I67 .face{position:absolute;inset:0;border-radius:34px;padding:56px 60px;display:flex;flex-direction:column;justify-content:center;gap:34px;
    box-shadow:0 44px 90px rgba(58,16,10,.32),0 6px 16px rgba(58,16,10,.18)}
  #I67 .front{background:linear-gradient(165deg,#fff,#F7EEE1);border:2px solid #EAD9BF;
    animation-name:flipOut;animation-duration:.4s;animation-timing-function:cubic-bezier(.55,0,.9,.5)}
  #I67 .back{background:linear-gradient(160deg,#FFFBF3,#FBEFD9);border:4px solid var(--amber);align-items:center;gap:6px;
    animation-name:flipIn;animation-duration:.45s;animation-timing-function:cubic-bezier(.1,.5,.4,1)}
  #I67 .front .top{display:flex;align-items:center;gap:24px}
  #I67 .front .pic{width:120px;height:120px;border-radius:28px;background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep));color:var(--amberSoft);
    display:flex;align-items:center;justify-content:center;flex:none}
  #I67 .front .pic svg{width:74px;height:74px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #I67 .front .lbl{font-size:58px;color:var(--maroon)}
  #I67 .front .red{font-size:84px;color:#4A3A30;letter-spacing:0;line-height:1;filter:blur(7px);opacity:.8;padding-left:6px;white-space:nowrap;overflow:hidden}
  #I67 .front .lines{display:flex;flex-direction:column;gap:18px;filter:blur(5px);opacity:.55}
  #I67 .front .lines i{display:block;height:22px;border-radius:11px;background:#8C7B6B}
  #I67 svg.strike{position:absolute;left:40px;top:150px;width:840px;height:260px;overflow:visible;z-index:6}
  #I67 svg.strike path{fill:none;stroke:var(--penRed);stroke-width:14;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
    animation-name:dash;animation-duration:.45s;animation-timing-function:cubic-bezier(.5,.1,.3,1)}
  #I67 .back .lbl{font-size:58px;color:var(--maroon);display:flex;align-items:center;gap:16px}
  #I67 .back .lbl .l{width:70px;height:70px;border-radius:20px;background:var(--maroon);color:var(--amber);display:flex;align-items:center;justify-content:center}
  #I67 .back .lbl .l svg.i{width:44px;height:44px}
  #I67 .back .code{font-size:250px;font-weight:700;color:var(--maroon);line-height:1;letter-spacing:6px}
  #I67 .ring{position:absolute;inset:0;border-radius:34px;animation-name:land;animation-duration:.7s;animation-timing-function:ease-out;pointer-events:none}
  #I67 .note{font-size:66px;color:var(--maroon);animation-name:wr;animation-duration:.6s;animation-timing-function:linear}
  #I67 .note b{color:var(--amberDeep)}
</style>
</head>
<body>
<!-- ══ I67 · not by name, by a code · K803 (held 5.97 s) ═════════════════════════ -->
<div class="panel" id="I67" data-plate="desk" style="--T:7s">
  <div class="halo mv"></div>
  <div class="holder mv" style="animation-delay:-.05s">
    <div class="face front mv" style="animation-delay:2.55s">
      <div class="top">
        <span class="pic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="10" height="18" rx="1.5"/><path d="M6.5 7h5v4h-5z"/><path d="M14 8h2.5a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 0 3 0V9l-2.5-3"/><path d="M3 21h12"/></svg></span>
        <span class="lbl hi">पंप का नाम:</span>
      </div>
      <div class="red">████████</div>
      <div class="lines"><i style="width:78%"></i><i style="width:56%"></i></div>
      <svg class="strike" viewBox="0 0 840 260"><path class="mv" d="M0 172 C 170 160, 360 150, 560 132" pathLength="1" style="animation-delay:1.9s"/></svg>
    </div>
    <div class="face back mv" style="animation-delay:2.95s">
      <div class="lbl hi"><span class="l"><svg class="i"><use href="#i-lock"/></svg></span>कोड:</div>
      <div class="code dis">47Q</div>
      <div class="ring mv" style="animation-delay:3.35s"></div>
    </div>
  </div>
  <div class="note hi mv" style="animation-delay:3.4s">नाम नहीं — <b>एक कोड</b></div>
  <div class="rail hi">आपका डेटा, आपका</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
