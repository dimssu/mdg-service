<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* What such a system must do, 4–6. Opens on I91a's layout (heading and rows 1–3
   at the same positions — change one, change both) after the S69 cutaway.
   Timed to K038b's voice (this card is the whole beat, 12.1 s): "जो" 0 s,
   "स्टाफ़" 0.42 s (its "s" follows a closure at 0.38–0.40 s), "हर आख़िरी तारीख़ का अलर्ट दे" 2.93 s, "और कोई समस्या आने से
   पहले ही" 6.14 s ("समस्या" ≈ 6.45 s), "डीलर को आगाह कर दे" 8.81 s ("आगाह"
   9.54 s), the line ends 10.40 s. So the first three rows shrink to a compact
   block in 0.28 s while row 4 rises into the space it leaves (from 0.16 s, readable
   from 0.21 s and on by 0.29 s, never over row 3: checked at every frame 0–0.375 s); row 5 lands by 2.7 s, row 6
   by 6.0 s and its box glows brightest; on "आगाह कर दे" all six boxes come up
   bright together and hold (steady from 10.0 s). The boxes stay EMPTY. */
.mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
@keyframes rowIn{0%{opacity:0;transform:translateY(50px) scale(.96)}70%{opacity:1;transform:translateY(-4px)}100%{opacity:1;transform:none}}
@keyframes soft{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes bright{0%{opacity:0;transform:scale(.8)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:none}}
@keyframes hdUp{0%{transform:none}100%{transform:translateY(-200px) scale(.84)}}
@keyframes rowsUp{0%{transform:none}100%{transform:translateY(-260px) scale(.78)}}
.shrink{animation-delay:0s;animation-duration:.28s;animation-timing-function:cubic-bezier(.3,0,.2,1)}

#I91b .abs{position:absolute}
#I91b .hd{left:0;right:0;top:600px;text-align:center;transform-origin:50% 0;animation-name:hdUp}
#I91b .hd .t{display:inline-block;font-size:80px;color:var(--maroon);line-height:1.3}
#I91b .hd .u{width:150px;height:7px;border-radius:7px;margin:18px auto 0;background:linear-gradient(90deg,#E9A23B,#F4C979)}
#I91b .rows{left:80px;right:80px;top:800px;display:flex;flex-direction:column;gap:34px;transform-origin:50% 0}
#I91b .rows.prev{animation-name:rowsUp}
#I91b .rows.next{top:995px}
#I91b .row{display:flex;align-items:center;gap:32px;padding:30px 36px 30px 32px;background:#fff;border:2px solid #EFE4D2;border-radius:24px;
  box-shadow:0 14px 30px rgba(74,15,15,.13),0 3px 8px rgba(74,15,15,.08)}
#I91b .rows.next .row{animation-name:rowIn}
#I91b .box{position:relative;width:78px;height:78px;flex:none;border-radius:16px;border:5px solid #E2A640;background:#FFFCF4;
  box-shadow:0 0 20px rgba(233,162,59,.5),inset 0 0 12px rgba(233,162,59,.22)}
#I91b .box i{position:absolute;inset:-16px;border-radius:26px;display:block;
  background:radial-gradient(closest-side,rgba(244,201,121,.0) 50%,rgba(240,180,80,.75) 76%,rgba(244,201,121,0));animation-name:soft;animation-timing-function:ease-in-out}
#I91b .box b{position:absolute;inset:-26px;border-radius:34px;display:block;animation-name:bright;
  background:radial-gradient(closest-side,rgba(255,214,120,.0) 38%,rgba(246,184,72,.95) 66%,rgba(246,184,72,0));
  box-shadow:inset 0 0 0 0 transparent}
#I91b .box b::after{content:'';position:absolute;inset:26px;border-radius:16px;box-shadow:0 0 0 3px #F4C979,0 0 26px 6px rgba(233,162,59,.8)}
#I91b .row .t{font-size:52px;color:var(--ink);line-height:1.32;padding-top:6px}
</style>
</head>
<body>
<!-- ══ I91b · what such a system must do, 4 to 6 · K038b "जो स्टाफ़ की ज़िम्मेदारियाँ साफ़ करे, हर आख़िरी तारीख़ का अलर्ट दे — और कोई समस्या आने से पहले ही, डीलर को आगाह कर दे।" (12.1 s) ══ -->
<div class="panel" id="I91b" data-plate="office" style="--T:13s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;top:50%"></div>
  <div class="abs hd mv shrink"><div class="t hi">ऐसा सिस्टम, जो —</div><div class="u"></div></div>
  <div class="abs rows prev mv shrink">
    <div class="row"><span class="box"><i class="mv" style="animation-delay:0s;animation-duration:2.4s;animation-iteration-count:6"></i><b class="mv" style="animation-delay:9.55s;animation-duration:.45s"></b></span><span class="t hi">ज़रूरी काम समय पर याद दिलाए</span></div>
    <div class="row"><span class="box"><i class="mv" style="animation-delay:-.8s;animation-duration:2.4s;animation-iteration-count:6"></i><b class="mv" style="animation-delay:9.6s;animation-duration:.45s"></b></span><span class="t hi">कोई तय काम छूटने न दे</span></div>
    <div class="row"><span class="box"><i class="mv" style="animation-delay:-1.6s;animation-duration:2.4s;animation-iteration-count:6"></i><b class="mv" style="animation-delay:9.65s;animation-duration:.45s"></b></span><span class="t hi">कंप्लायंस, रिकॉर्ड और रोज़ के कामकाज पर नज़र रखे</span></div>
  </div>
  <div class="abs rows next">
    <div class="row mv" style="animation-delay:.16s;animation-duration:.18s"><span class="box"><i class="mv" style="animation-delay:.29s;animation-duration:2.4s;animation-iteration-count:5"></i><b class="mv" style="animation-delay:9.7s;animation-duration:.45s"></b></span><span class="t hi">स्टाफ़ की ज़िम्मेदारियाँ साफ़ करे</span></div>
    <div class="row mv" style="animation-delay:2.42s;animation-duration:.4s"><span class="box"><i class="mv" style="animation-delay:2.7s;animation-duration:2.4s;animation-iteration-count:5"></i><b class="mv" style="animation-delay:9.75s;animation-duration:.45s"></b></span><span class="t hi">हर आख़िरी तारीख़ का अलर्ट दे</span></div>
    <div class="row mv" style="animation-delay:5.72s;animation-duration:.4s"><span class="box"><i class="mv" style="animation-delay:6.0s;animation-duration:2.4s;animation-iteration-count:3"></i><b class="mv" style="animation-delay:6.0s;animation-duration:.5s"></b></span><span class="t hi">समस्या आने से पहले ही आगाह कर दे</span></div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
