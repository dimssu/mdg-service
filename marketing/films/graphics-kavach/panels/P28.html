<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* the app by day; an amber early-warning sheet slides up over the chat */
.phone{width:860px;height:1520px;border-radius:84px;padding:16px;margin-top:-40px}
.screen{border-radius:70px;background:var(--cream)}
.island{position:absolute;top:22px;left:50%;width:150px;height:40px;margin-left:-75px;
  border-radius:20px;background:#000;z-index:10}
.top{padding:84px 36px 24px;display:flex;align-items:center;gap:20px;background:#fff;
  border-bottom:1px solid #EDE2D3}
.logo{width:72px;height:72px;border-radius:20px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:28px;font-weight:700;color:#fff;
  background:linear-gradient(145deg,var(--maroonSoft),var(--maroonDeep))}
.top .nm{font-size:36px;color:#16120F;line-height:1.2}
.top .st{font-size:27px;color:var(--inkMuted);line-height:1.3}
.chat{flex:1;padding:34px 30px;display:flex;flex-direction:column;gap:24px;position:relative;
  background:radial-gradient(rgba(107,22,22,.06) 1.5px,transparent 1.5px) 0 0/34px 34px,var(--creamSunk)}
/* earlier messages, out of focus: only their shape is there */
.ghost{border-radius:26px;background:#fff;box-shadow:0 3px 10px rgba(74,15,15,.08);padding:26px 28px;
  display:flex;flex-direction:column;gap:14px;filter:blur(1.5px);opacity:.8}
.ghost i{display:block;height:20px;border-radius:10px;background:#E9DECF}
.ghost.me{align-self:flex-end;background:#FBE7C4}.ghost.me i{background:#EBCF9E}
.scrim{position:absolute;inset:0;background:rgba(42,26,22,.34)}
@keyframes dim{0%{opacity:0}100%{opacity:1}}

.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:44px 44px 0 0;
  padding:24px 44px 76px;box-shadow:0 -20px 50px rgba(40,14,6,.30);border-top:6px solid var(--amber);z-index:5}
@keyframes sheetUp{0%{transform:translateY(105%)}70%{transform:translateY(-2%)}100%{transform:none}}
.grab{width:110px;height:10px;border-radius:6px;background:#E3D6C4;margin:0 auto 30px}
.hd{display:flex;align-items:center;gap:24px}
.hd .ic{width:108px;height:108px;border-radius:28px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--amber),var(--amberDeep));color:#fff;box-shadow:0 10px 22px rgba(199,124,27,.35)}
.hd .ic svg{width:56px;height:56px;stroke-width:2}
.hd .t{font-size:58px;color:var(--maroon);line-height:1.2}
.hd .m{font-size:40px;color:var(--inkMuted);line-height:1.3;margin-top:4px}
.hd .m b{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink)}

.verdict{position:relative;margin-top:40px;background:#FDF0D8;border:3px solid var(--amber);border-radius:30px;
  padding:30px 34px;font-size:52px;line-height:1.45;color:#5A3A12}
.verdict .gl{position:absolute;inset:-3px;border-radius:30px;pointer-events:none}
@keyframes softGlow{0%,100%{box-shadow:0 0 0 0 rgba(233,162,59,0)}50%{box-shadow:0 0 0 14px rgba(233,162,59,.22),0 0 40px 10px rgba(233,162,59,.30)}}
@keyframes writeL{0%{clip-path:inset(-30% 100% -30% -4%)}100%{clip-path:inset(-30% -4% -30% -4%)}}
.wl{animation-name:writeL;animation-timing-function:linear}

.line{margin-top:48px;display:flex;align-items:baseline;justify-content:space-between;gap:20px}
.line .l{font-size:44px;color:var(--ink)}
.line .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:88px;color:var(--amberDeep);letter-spacing:-1px}
.line .r .n{color:var(--inkMuted);font-size:72px}
.track{margin-top:22px;height:30px;border-radius:14px;background:#F1E7D8;position:relative;overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:26.1%;border-radius:14px;transform-origin:0 50%;
  background:linear-gradient(90deg,#F4C979,var(--amber) 60%,var(--amberDeep))}
.track .lim{position:absolute;right:0;top:-12px;bottom:-12px;width:6px;border-radius:3px;background:var(--bad)}
@keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
</style>
</head>
<body>
<!-- ══ P28 · told early: a steady shortfall · K220 "… कोई समस्या बड़ी होने से पहले आपको बता देना।" (4 s) ══ -->
<div class="panel" id="P28" data-plate="desk" style="--T:5s">
  <div class="glow anim a-glow" style="animation-delay:-.5s"></div>
  <div class="phone anim a-rise" style="animation-duration:3s">
    <div class="screen">
      <div class="island"></div>
      <div class="top">
        <div class="logo dis">DK</div>
        <div><div class="nm hi">MDG टीम</div><div class="st hi">डीलर कवच</div></div>
      </div>
      <div class="chat">
        <div class="ghost" style="width:78%"><i style="width:40%"></i><i></i><i style="width:70%"></i></div>
        <div class="ghost me" style="width:52%"><i></i><i style="width:60%"></i></div>
        <div class="ghost" style="width:70%"><i style="width:36%"></i><i></i></div>
        <div class="scrim anim" style="animation-name:dim;animation-delay:.1s;animation-duration:.6s"></div>
        <div class="sheet anim" style="animation-name:sheetUp;animation-delay:.1s;animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.9,.3,1)">
          <div class="grab"></div>
          <div class="hd">
            <div class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3.2"/></svg></div>
            <div><div class="t hi">स्टॉक पर नज़र</div><div class="m hi"><b>HSD</b> · <b>21-08</b></div></div>
          </div>
          <div class="verdict hi">
            <div class="anim wl" style="animation-delay:.8s;animation-duration:.8s">HSD में 9 दिन से लगातार कमी —</div>
            <div class="anim wl" style="animation-delay:1.6s;animation-duration:.8s">अभी सीमा में, पर ध्यान दें</div>
            <div class="gl anim" style="animation-name:softGlow;animation-delay:2.7s;animation-duration:1.3s;animation-iteration-count:2;animation-timing-function:ease-in-out"></div>
          </div>
          <div class="anim a-rise" style="animation-delay:2.35s;animation-duration:2.5s">
            <div class="line">
              <div class="l hi">कुल <span class="n">174 L</span> कम</div>
              <div class="l r hi">सीमा <span class="n">666 L</span></div>
            </div>
            <div class="track"><div class="fill anim" style="animation-name:growX;animation-delay:2.6s;animation-duration:.8s"></div><div class="lim"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="rail hi">समस्या बड़ी होने से पहले</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
