<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* ── the validity ladder: wooden rails, cream rungs, the current rung in gold ── */
.plank{position:relative;height:132px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:22px;
  font-size:58px;color:var(--maroon);z-index:2;
  background:linear-gradient(180deg,#FFFDF8,#F1E3CD);border:2px solid rgba(201,160,100,.7);
  box-shadow:0 18px 36px rgba(58,16,10,.22),inset 0 -8px 12px rgba(160,110,50,.14),inset 0 3px 0 rgba(255,255,255,.8)}
.plank .gl{position:absolute;inset:-2px;border-radius:20px;z-index:-1;
  background:linear-gradient(180deg,#FBDFA0,#E9A23B 70%,#D38A22);border:2px solid #C77C1B;
  box-shadow:0 0 0 10px rgba(233,162,59,.22),0 26px 50px rgba(120,62,8,.38),inset 0 3px 0 rgba(255,255,255,.55)}
.plank.gold{background:linear-gradient(180deg,#FBDFA0,#E9A23B 70%,#D38A22);color:var(--maroonDeep);border-color:#C77C1B;
  box-shadow:0 0 0 10px rgba(233,162,59,.22),0 26px 50px rgba(120,62,8,.38),inset 0 3px 0 rgba(255,255,255,.55)}
.plank svg.i{width:52px;height:52px;stroke-width:2.2;opacity:.8}
.lrail{position:absolute;width:38px;border-radius:14px;z-index:1;
  background:linear-gradient(90deg,#8A3A26,#5E1B12 60%,#42110C);box-shadow:0 12px 26px rgba(40,10,6,.30)}
/* a single rung lifted off the ladder, with stubs of the rails */
.rh{position:relative;width:900px}
.rh .lrail{top:-70px;bottom:-70px;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
  mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
@keyframes liftF{0%{transform:scale(.9) translateY(40px);filter:brightness(.92)}100%{transform:scale(1.04);filter:none}}
.lift{animation:liftF .8s cubic-bezier(.2,.9,.3,1) both paused;transform-origin:50% 60%}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.panel{gap:40px}
.tagx{font-size:36px;color:var(--amberDeep);background:#FFF6E4;border:2px dashed var(--amber);border-radius:999px;padding:8px 34px 10px}
.chart{position:relative;width:900px;height:720px;margin-top:150px}
.gridl{position:absolute;left:0;right:0;height:0;border-top:2px dashed rgba(107,22,22,.16)}
.base{position:absolute;left:0;right:0;top:640px;height:3px;background:rgba(107,22,22,.3);border-radius:2px}
@keyframes line{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.dp{position:absolute;width:0;height:0;animation:rise .6s cubic-bezier(.2,.9,.3,1.15) both paused}
@keyframes rise{0%{opacity:0;transform:translateY(var(--rise))}25%{opacity:1}100%{opacity:1;transform:none}}
.dp i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:#fff;border:9px solid var(--maroon);
  box-shadow:0 8px 16px rgba(58,16,10,.28)}
.dp span{position:absolute;left:-60px;width:120px;text-align:center;top:-86px;font-size:34px;font-weight:700;color:var(--maroon)}
.dp.now i{background:var(--amber);border-color:var(--maroonDeep)}
.dp.now span{display:none}
.today{position:absolute;width:0;height:0}
.today::before{content:'';position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;border:5px solid var(--amber);
  animation:ringP .9s ease-out 3.2s 3 both paused}
@keyframes ringP{0%{opacity:0;transform:scale(.6)}10%{opacity:1}100%{opacity:0;transform:scale(1.9)}}
.pin{position:absolute;background:linear-gradient(140deg,var(--maroonSoft),var(--maroon));color:#fff;border-radius:24px;
  padding:22px 30px 26px;font-size:42px;white-space:nowrap;box-shadow:0 18px 38px rgba(58,16,10,.35);transform-origin:90% 100%}
.pin b{color:var(--amber);font-weight:700}
.pin::after{content:'';position:absolute;right:28px;bottom:-20px;border:20px solid transparent;border-bottom:0;border-top:20px solid var(--maroon)}
.aj{position:absolute;top:658px;width:120px;margin-left:-60px;text-align:center;font-size:36px;color:var(--maroon)}
.cav{font-size:30px;color:var(--inkMuted)}
/* a figure that rolls from one value to another (see the script at the end) */
.ctr{display:inline-flex;height:1em;line-height:1;overflow:hidden;vertical-align:top;font-variant-numeric:tabular-nums}
.ctr .cc{display:flex;flex-direction:column}
.ctr .cc span,.ctr .fx{display:block;height:1em;line-height:1}
@keyframes ctrRoll{from{transform:translateY(0)}to{transform:translateY(calc(var(--n) * -1em))}}
@keyframes ctrShow{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<!-- ══ I36 · seven days climbing to where the pump stands today · K424 "…हर दिन आपको ये बताना है कि कंप्लायंस के मामले में आपका पंप इस समय कहाँ खड़ा है।" (6.02 s) ══ -->
<div class="panel" id="I36" data-plate="dusk" style="--T:7s">
  <div class="glow anim a-glow" style="animation-delay:-.4s"></div>
  <div class="tagx hi anim a-fade" style="--T:2s;animation-delay:.05s">मान लीजिए</div>
  <div class="cap hi anim a-fade" style="--T:2s;animation-delay:.15s;font-size:64px">पिछले 7 दिन</div>
  <div class="chart">
    <div class="gridl" style="top:409px"></div><div class="gridl" style="top:80px"></div><div class="base"></div>
    <svg viewBox="0 0 900 700" style="position:absolute;left:0;top:0;width:900px;height:700px;overflow:visible">
      <polyline points="60,474 190,376 320,310 450,277 580,179 710,146 840,80" fill="none" stroke="var(--maroon)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1" style="stroke-dasharray:1;animation:line 2.6s linear .8s both paused"/></svg>
      <div class="dp" style="left:60px;top:474px;--rise:166px;animation-delay:0.40s"><i></i><span class="dis">58%</span></div>
      <div class="dp" style="left:190px;top:376px;--rise:264px;animation-delay:0.82s"><i></i><span class="dis">61%</span></div>
      <div class="dp" style="left:320px;top:310px;--rise:330px;animation-delay:1.24s"><i></i><span class="dis">63%</span></div>
      <div class="dp" style="left:450px;top:277px;--rise:363px;animation-delay:1.66s"><i></i><span class="dis">64%</span></div>
      <div class="dp" style="left:580px;top:179px;--rise:461px;animation-delay:2.08s"><i></i><span class="dis">67%</span></div>
      <div class="dp" style="left:710px;top:146px;--rise:494px;animation-delay:2.50s"><i></i><span class="dis">68%</span></div>
      <div class="dp now" style="left:840px;top:80px;--rise:560px;animation-delay:2.92s"><i></i><span class="dis">70%</span></div>
      <div class="today" style="left:840px;top:80px"></div>
      <div class="pin anim a-pop" style="--T:3s;animation-delay:3.25s;right:16px;top:-125px"><span class="hi">आज आपका पंप यहाँ खड़ा है: <b class="dis">70%</b></span></div>
      <div class="aj hi" style="left:840px">आज</div>
  </div>
  <div class="cav hi anim a-fade" style="--T:2s;animation-delay:3.8s">यह एम-डी-जी का लिखित आकलन है</div>
  <div class="rail hi">कंप्लायंस में आपका पंप · आज</div>
</div>
<script src="../kit.js"></script>
<script>
/* A figure that rolls from one value to another, starting at a chosen second:
   <span class="ctr" data-from="120" data-to="200" data-at="2.8" data-dur=".8">.
   Each digit is a column running from its old digit to its new one; a place
   that did not exist before starts blank. Same paused clock as everything else. */
for (const el of document.querySelectorAll('.ctr[data-to]')) {
  const num = (s) => parseInt((s || '0').replace(/\D/g, '') || '0', 10);
  const to = el.dataset.to, A = num(el.dataset.from), B = num(to);
  const from = (el.dataset.from || '').padStart(to.length, ' ');
  const at = parseFloat(el.dataset.at || '0'), dur = parseFloat(el.dataset.dur || '.9');
  const nd = to.replace(/\D/g, '').length;
  el.textContent = '';
  let k = 0;
  [...to].forEach((ch, i) => {
    if (!/\d/.test(ch)) {
      const f = document.createElement('span'); f.className = 'fx'; f.textContent = ch;
      if (from[i] === ' ') f.style.animation = `ctrShow .15s linear ${(at + dur * .3).toFixed(2)}s both paused`;
      el.appendChild(f); return;
    }
    const p = nd - 1 - k++;
    const a = Math.floor(A / 10 ** p), b = Math.floor(B / 10 ** p);
    let n = b - a; if (n > 14) n = 10 + (((b - a) % 10) + 10) % 10;
    const col = document.createElement('span'); col.className = 'cc';
    for (let j = 0; j <= n; j++) {
      const s = document.createElement('span');
      s.textContent = (j === 0 && from[i] === ' ') ? '\u2007' : String((a + j) % 10);
      col.appendChild(s);
    }
    col.style.setProperty('--n', n);
    col.style.animation = `ctrRoll ${dur}s cubic-bezier(.3,.7,.25,1) ${(at + (nd - k) * .03).toFixed(2)}s both paused`;
    el.appendChild(col);
  });
}
</script>
</body>
</html>
