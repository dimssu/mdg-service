<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* a printed permit: plain double border, no company mark */
#D23 .paper{width:900px;padding:44px;--rot:1.2deg}
#D23 .frame{border:3px solid #3A332C;outline:1.5px solid #3A332C;outline-offset:8px;padding:52px 48px 60px;margin:8px}
#D23 .ttl{font-size:92px;font-weight:700;text-align:center;color:var(--print);line-height:1.2}
#D23 .ttl + .rule{height:4px;background:var(--print);width:360px;margin:26px auto 50px}
#D23 .ln{display:flex;flex-direction:column;gap:6px;padding:22px 0 20px;border-bottom:2px dotted #9C9184}
#D23 .ln .k{font-size:34px;color:#6B6258}
#D23 .ln .v{font-size:46px;color:var(--print);line-height:1.3}
#D23 .ln .v b{font-family:'Space Grotesk',sans-serif}
#D23 .ft{display:flex;align-items:flex-end;justify-content:space-between;margin-top:70px;min-height:170px;position:relative}
#D23 .sig{width:300px;border-bottom:2px solid #3A332C}
#D23 .stamp{font-size:76px;padding:12px 38px;border-width:8px;position:absolute;right:10px;bottom:10px}
@keyframes slideIn{0%{opacity:0;transform:translateX(420px) rotate(8deg)}60%{opacity:1}100%{opacity:1;transform:rotate(1.2deg)}}
.sin{animation-name:slideIn;animation-duration:.7s!important}
.wr{animation-duration:5s!important}
</style>
</head>
<body>
<!-- ══ D23 · work permit, approved · K515 "…और वर्क परमिट बनाना।" ══ -->
<div class="panel" id="D23" data-plate="desk" style="--T:5s">
  <div class="paper anim sin">
    <div class="frame">
      <div class="ttl hi">वर्क परमिट</div><div class="rule"></div>
      <div class="ln"><span class="k hi">काम</span><span class="v hi anim a-write wr" style="animation-delay:.45s">टैंक 2 के पास पाइपलाइन मरम्मत</span></div>
      <div class="ln"><span class="k hi">तारीख़</span><span class="v hi anim a-write wr" style="animation-delay:1.3s"><b>22-08</b> · सुबह 10 से शाम 5</span></div>
      <div class="ln"><span class="k hi">सुरक्षा</span><span class="v hi anim a-write wr" style="animation-delay:2.15s">फ़ायर एक्सटिंग्विशर, घेराबंदी</span></div>
      <div class="ft">
        <svg class="sig" viewBox="0 0 300 90" style="height:90px"><path d="M14 62c20-30 34-44 40-34s-14 36 2 32 26-40 38-34-6 30 8 28 20-22 32-18 4 18 18 16 30-10 52-12" fill="none" stroke="var(--pen)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="stamp hi anim a-stampdown" style="animation-delay:3.0s;animation-duration:3s">स्वीकृत ✓</div>
      </div>
    </div>
  </div>
  <div class="rail hi">परमिट, बनकर तैयार</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
