<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* all the tasks done: the ring climbs from 0 to 98% and warms from maroon to
   gold as it nears the top, the percentage and the points count up with it
   (registered custom properties on the panel's clock, so ring, % and points
   move as one — no odometer, whose spinning columns pass figures above 4,700), and a faint 100% mark glows just ahead of the head. */
@property --pct{syntax:'<percentage>';initial-value:0%;inherits:false}
@property --p{syntax:'<integer>';initial-value:0;inherits:false}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.wrap{position:relative;width:700px;height:700px}
.trk{position:absolute;inset:0;border-radius:50%;border:44px solid rgba(107,22,22,.10);
  box-shadow:inset 0 6px 18px rgba(74,15,15,.08)}
.fill{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#5A1212 0%,#7E1F1C 22%,#A5401F 48%,#D17E22 72%,#E9A23B 88%,#F6CF7E 98%);
  -webkit-mask:conic-gradient(#000 var(--pct),transparent 0),radial-gradient(farthest-side,transparent calc(100% - 44px),#000 calc(100% - 43px));
  -webkit-mask-composite:source-in;mask-composite:intersect;
  filter:drop-shadow(0 10px 20px rgba(74,15,15,.25))}
@keyframes fillTo{0%{--pct:0%}100%{--pct:98%}}
.head{position:absolute;left:50%;top:0;width:44px;height:350px;margin-left:-22px;transform-origin:50% 100%;
  transform:rotate(var(--ang))}
@keyframes turnTo{0%{--ang:0deg}100%{--ang:352.8deg}}
.head i{display:block;width:44px;height:44px;border-radius:50%;background:#F6CF7E;box-shadow:0 0 0 6px rgba(255,255,255,.75),0 0 26px 8px rgba(246,207,126,.8)}
.mark{position:absolute;left:50%;top:-30px;width:8px;height:104px;margin-left:-4px;border-radius:4px;background:var(--good)}
.mark100{position:absolute;left:50%;top:-104px;transform:translateX(-50%);font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:44px;color:var(--good);background:rgba(232,245,238,.9);padding:4px 18px;border-radius:999px;border:3px solid rgba(30,122,74,.35)}
@keyframes faint{0%{opacity:0}100%{opacity:.5}}
@keyframes glowM{0%,100%{opacity:.5;box-shadow:0 0 0 0 rgba(30,122,74,0)}50%{opacity:1;box-shadow:0 0 0 12px rgba(30,122,74,.14),0 0 30px 8px rgba(30,122,74,.25)}}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pc{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:200px;line-height:1;color:var(--maroon);letter-spacing:-6px;
  counter-reset:p var(--p)}
.pc::before{content:counter(p)}
.pc small{font-size:110px;letter-spacing:-2px}
@keyframes countP{0%{--p:0}100%{--p:98}}
.pts{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;color:var(--ink);line-height:1.1;display:flex;align-items:baseline;gap:14px}
.pts .of{color:var(--inkMuted);font-size:50px}
.pts + .u{font-size:36px;color:var(--inkMuted)}
/* a real count with an Indian-style thousands comma: one registered integer on
   the panel's clock, split into thousands and a zero-padded remainder */
@property --n{syntax:'<integer>';initial-value:0;inherits:true}
@counter-style pad3{system:extends decimal;pad:3 "0"}
.cnt{white-space:nowrap;display:inline-flex}
.cnt span{display:inline-block;overflow-x:clip;overflow-y:visible}
.cnt .th{counter-reset:th calc(round(down, var(--n) / 1000, 1));max-width:calc(clamp(0, var(--n) - 999, 1) * 2em)}
.cnt .th::before{content:counter(th) ","}
.cnt .r3{counter-reset:r calc(mod(var(--n), 1000));max-width:calc(clamp(0, var(--n) - 999, 1) * 3em)}
.cnt .r3::before{content:counter(r, pad3)}
.cnt .r0{counter-reset:r calc(mod(var(--n), 1000));max-width:calc((1 - clamp(0, var(--n) - 999, 1)) * 3em)}
.cnt .r0::before{content:counter(r)}
@keyframes cntTo{0%{--n:0}100%{--n:var(--to)}}
.lbl{font-size:60px;color:var(--maroon);line-height:1.35;text-align:center;max-width:900px}
@keyframes settle2{0%{opacity:0;transform:translateY(60px)}100%{opacity:1;transform:none}}
</style>
</head>
<body>
<!-- ══ I26 · all tasks done: near 100% · K405 "जब पंप के सारे ज़रूरी काम सही तरीक़े से पूरे होते हैं, तो आपका स्कोर सौ प्रतिशत के क़रीब पहुँचता है।" (5.5 s) ══ -->
<div class="panel" id="I26" data-plate="office" style="--T:6s;gap:110px">
  <div class="glow anim a-glow" style="animation-delay:-.5s;top:44%"></div>
  <div class="wrap anim a-fade" style="animation-delay:0s;animation-duration:2s;margin-top:90px">
    <div class="trk"></div>
    <div class="fill anim" style="animation-name:fillTo;animation-delay:.3s;animation-duration:3.3s;animation-timing-function:cubic-bezier(.25,.6,.3,1)"></div>
    <div class="head anim" style="animation-name:turnTo;animation-delay:.3s;animation-duration:3.3s;animation-timing-function:cubic-bezier(.25,.6,.3,1)"><i></i></div>
    <div class="anim" style="animation-name:faint;animation-delay:2.9s;animation-duration:.6s">
      <div class="mark anim" style="animation-name:glowM;animation-delay:3.4s;animation-duration:1.1s;animation-iteration-count:2"></div>
      <div class="mark100 anim" style="animation-name:glowM;animation-delay:3.4s;animation-duration:1.1s;animation-iteration-count:2">100%</div>
    </div>
    <div class="mid">
      <div class="pc anim" style="animation-name:countP;animation-delay:.3s;animation-duration:3.3s;animation-timing-function:cubic-bezier(.25,.6,.3,1)"><small>%</small></div>
      <div class="pts"><span class="cnt anim" style="--to:4626;animation-name:cntTo;animation-delay:.3s;animation-duration:3.3s;animation-timing-function:cubic-bezier(.25,.6,.3,1)"><span class="th"></span><span class="r3"></span><span class="r0"></span></span><span class="of">/ 4,700</span></div>
      <div class="u hi">पॉइंट</div>
    </div>
  </div>
  <!-- the line opens on the condition ("जब पंप के सारे ज़रूरी काम सही तरीक़े से पूरे होते हैं", 0.4–4.0 s)
       and only then gives the result, so the condition is on screen while it is spoken -->
  <div class="lbl hi anim" style="animation-name:settle2;animation-delay:.45s;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.9,.3,1)">सारे ज़रूरी काम सही तरीक़े से पूरे</div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
