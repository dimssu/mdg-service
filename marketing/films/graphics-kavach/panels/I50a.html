<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* The six premium services as a hand of gold cards. I50a deals them in;
   I50b opens on I50a's last frame exactly (same markup, same positions),
   pushes in, tags each card with its fee rule, then writes the fee note.
   Six 150 px cards at a 34 px gap (1,070 px) would run into the fee note at
   1,520 px, so the hand is 128 px cards at a 26 px gap: 898 px, the height the
   five used to take. The number tab stays square (128 px), its figure scaled
   with it. */
.grp{width:900px;display:flex;flex-direction:column;align-items:center;margin-top:-150px;transform-origin:50% 40%}
.ttl{font-size:84px;color:var(--maroon);line-height:1.25}
.trule{width:180px;height:7px;border-radius:7px;margin:22px 0 58px;
  background:linear-gradient(90deg,#E9A23B,#F4C979);transform-origin:50% 50%}
.stack{width:900px;display:flex;flex-direction:column;gap:26px}
.sv{position:relative;display:flex;align-items:center;height:128px;border-radius:22px;overflow:visible;
  background:linear-gradient(170deg,#fff,#FBF3E7);border:2px solid rgba(214,168,98,.65);
  box-shadow:0 26px 52px rgba(58,16,10,.22),0 4px 10px rgba(58,16,10,.12);transform:rotate(var(--r1,0deg))}
.sv .no{flex:none;width:128px;height:100%;border-radius:20px 0 0 20px;display:flex;align-items:center;justify-content:center;
  font-size:52px;font-weight:700;color:#4E0F0F;
  background:linear-gradient(160deg,#F8D899,#E9A23B 55%,#C27716);box-shadow:inset -6px 0 14px rgba(120,60,6,.18)}
.sv .nm{padding:0 30px 0 38px;font-size:46px;color:var(--maroon);line-height:1.2}
.tag{position:absolute;top:-24px;right:26px;padding:6px 20px 7px;border-radius:999px;font-size:26px;
  color:var(--maroonDeep);background:#FFF1D2;border:2px solid var(--amber);
  box-shadow:0 8px 16px rgba(120,60,6,.22);white-space:nowrap}
.fee{position:absolute;left:70px;right:70px;top:1520px;text-align:center}
.fee .t{font-size:46px;color:var(--maroon);line-height:1.45}
.fee .u{width:620px;height:8px;border-radius:8px;margin:14px auto 0;transform-origin:0 50%;
  background:linear-gradient(90deg,#E9A23B,#F4C979 70%,rgba(244,201,121,.3))}
@keyframes dealIn{0%{opacity:0;transform:translate(460px,-90px) rotate(14deg)}
  16%{opacity:1;transform:translate(-8px,0) rotate(var(--r1,0deg))}22%,100%{opacity:1;transform:rotate(var(--r1,0deg))}}
.a-deal{animation-name:dealIn}
@keyframes growX{0%{transform:scaleX(0)}22%,100%{transform:scaleX(1)}}
.a-growx{animation-name:growX}
@keyframes pushIn{0%{transform:scale(1)}48%,100%{transform:scale(1.05)}}
.a-pushin{animation-name:pushIn;animation-timing-function:cubic-bezier(.35,.1,.3,1)}
</style>
</head>
<body>
<!-- ══ I50a · the six premium services dealt in · K604, first 6 s ("इसके अलावा कुछ प्रीमियम सेवाएँ हैं, …") ══ -->
<div class="panel" id="I50a" data-plate="office" style="--T:6s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;top:40%"></div>
  <div class="grp">
    <div class="ttl hi anim a-rise" style="animation-delay:0s;animation-duration:4s">प्रीमियम सेवाएँ</div>
    <div class="trule anim a-growx" style="animation-delay:.35s;animation-duration:3s"></div>
    <div class="stack">
      <div class="sv anim a-deal" style="--r1:-.9deg;animation-delay:0.70s;animation-duration:4.5s">
        <div class="no dis">01</div><div class="nm hi">लीगल असिस्टेंस</div>
      </div>
      <div class="sv anim a-deal" style="--r1:.7deg;animation-delay:1.45s;animation-duration:4.5s">
        <div class="no dis">02</div><div class="nm hi">अकाउंटिंग और फ़ाइनेंशियल मॉनिटरिंग</div>
      </div>
      <div class="sv anim a-deal" style="--r1:-.5deg;animation-delay:2.20s;animation-duration:4.5s">
        <div class="no dis">03</div><div class="nm hi">साइबर सिक्योरिटी</div>
      </div>
      <div class="sv anim a-deal" style="--r1:.8deg;animation-delay:2.95s;animation-duration:4.5s">
        <div class="no dis">04</div><div class="nm hi">क्विक रिस्पॉन्स सर्विस</div>
      </div>
      <div class="sv anim a-deal" style="--r1:-.6deg;animation-delay:3.70s;animation-duration:4.5s">
        <div class="no dis">05</div><div class="nm hi">स्टाफ़ असेसमेंट</div>
      </div>
      <div class="sv anim a-deal" style="--r1:.6deg;animation-delay:4.45s;animation-duration:4.5s">
        <div class="no dis">06</div><div class="nm hi">फ़ाइनेंशियल असिस्टेंस</div>
      </div>
    </div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
