<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* Financial assistance, the whole of it in one frame: the story in one row
   at the top (short → the help → no interest → the load on time), and what it
   protects — the dealer's credit and his DOD — as two shields, each ticked.

   The chain row was spoken before this card (over S71), so it is there at
   frame 0. The card now starts 1.05 s earlier, on "क्रेडिट" (0.0–0.46 s), then
   "या डी-ओ-डी बचा सकें" 0.9–2.31 s ("डी-ओ-डी" ≈ 1.1–1.6 s). So each shield rises
   on its own word and takes its tick just after (0.0–0.3 s, tick 0.35 s;
   0.9–1.2 s, tick 1.35 s), a glint crosses each, the line comes in 1.5–1.8 s
   and its rule has drawn by 2.25 s. Then a hold under a slow 2% push, into the
   privacy chapter card. */
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes push{0%{transform:scale(1)}100%{transform:scale(1.02)}}
  @keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  @keyframes tickIn{0%{opacity:0;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
  @keyframes shRise{0%{opacity:0;transform:translateY(90px) scale(.94)}100%{opacity:1;transform:none}}
  @keyframes lineIn{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:none}}
  @keyframes glint{0%{transform:translateX(-160%) skewX(-18deg);opacity:0}25%{opacity:.8}100%{transform:translateX(620%) skewX(-18deg);opacity:0}}

  #I95c .stage{display:flex;flex-direction:column;align-items:center;margin-top:-40px;transform-origin:50% 45%;
    animation-name:push;animation-duration:4.5s;animation-timing-function:linear}

  /* the story, in one row */
  #I95c .chain{display:flex;align-items:center;gap:8px}
  #I95c .ch{position:relative;height:178px;border-radius:20px;background:linear-gradient(170deg,#fff,#FBF3E7);
    border:2px solid rgba(214,168,98,.65);box-shadow:0 20px 40px rgba(58,16,10,.18),0 4px 10px rgba(58,16,10,.10);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:14px 8px 8px}
  #I95c .ch::before{content:'';position:absolute;left:0;right:0;top:0;height:9px;background:var(--band,var(--amber))}
  #I95c .ch .a{font-size:31px;color:var(--maroon);line-height:1.28;white-space:nowrap}
  #I95c .ch .dis{font-weight:700;letter-spacing:-1px}
  #I95c .ch.short{width:160px;--band:repeating-linear-gradient(-45deg,var(--bad) 0 8px,#E58C7F 8px 16px)}
  #I95c .ch.short .a{color:var(--bad)}
  #I95c .ch.help{width:236px;--band:linear-gradient(90deg,#F4C979,#E9A23B,#C27716)}
  #I95c .ch.zero{width:156px;background:linear-gradient(170deg,#F8D899,#E9A23B 58%,#D08A22);border-color:rgba(194,119,22,.8);
    --band:rgba(120,60,6,.25)}
  #I95c .ch.zero .a{color:var(--maroonDeep)}
  #I95c .ch.ontime{width:184px;--band:var(--good)}
  #I95c .ch .ck{width:46px;height:46px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:6px;
    box-shadow:0 6px 12px rgba(30,122,74,.3)}
  #I95c .ch .ck svg.i{width:28px;height:28px;stroke-width:3.4}
  #I95c .ar{flex:none;width:28px;height:34px;color:var(--amberDeep)}
  #I95c .ar svg{width:28px;height:34px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

  /* what it protects */
  #I95c .shields{display:flex;gap:90px;margin-top:96px}
  #I95c .sh{position:relative;width:330px;height:372px;animation-name:shRise;animation-duration:.3s;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  #I95c .sh > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 26px 30px rgba(58,16,10,.30))}
  #I95c .sh .lb{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:60px;color:#FFF3E2;line-height:1.25;
    text-shadow:0 4px 12px rgba(0,0,0,.28)}
  #I95c .sh .gl{position:absolute;inset:0;overflow:hidden;
    clip-path:path('M165 10 L312 64 L312 176 C312 262 252 324 165 356 C78 324 18 262 18 176 L18 64 Z')}
  #I95c .sh .gl i{position:absolute;top:0;bottom:0;left:0;width:70px;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.42),rgba(255,255,255,0));animation-name:glint;animation-duration:.7s;animation-timing-function:ease-in-out}
  #I95c .sh .tk{position:absolute;left:50%;bottom:-24px;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:var(--good);color:#fff;
    display:flex;align-items:center;justify-content:center;border:5px solid #FFF8EA;box-shadow:0 12px 24px rgba(30,122,74,.35);animation-name:tickIn;animation-duration:.3s}
  #I95c .sh .tk svg.i{width:56px;height:56px;stroke-width:3.2}

  /* the line */
  #I95c .line{margin-top:92px;display:flex;flex-direction:column;align-items:center}
  #I95c .line .t{font-size:54px;color:var(--maroon);line-height:1.3;white-space:nowrap;animation-name:lineIn;animation-duration:.3s;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  #I95c .line .u{width:600px;height:8px;border-radius:8px;margin-top:12px;transform-origin:0 50%;
    background:linear-gradient(90deg,#E9A23B,#F4C979 70%,rgba(244,201,121,.3));animation-name:growX;animation-duration:.4s}
</style>
</head>
<body>
<!-- ══ I95c · load on time; credit and DOD kept safe · K726, last 4.08 s (after S71), "…क्रेडिट या डी-ओ-डी बचा सकें।"
     Card time: "क्रेडिट" 0.0–0.46 · "या डी-ओ-डी बचा सकें" 0.9–2.31 ("डी-ओ-डी" ≈ 1.1–1.6). The chain is there at
     frame 0; the "क्रेडिट" shield rises 0.0–0.3 s and is ticked at 0.35 s; the "डी-ओ-डी" shield rises
     0.9–1.2 s and is ticked at 1.35 s; the line comes in 1.5–1.8 s, its rule draws 1.85–2.25 s. Then a hold.
     The line follows the voice ("आप अपना … बचा सकें"), not the plan's "आपका … — बचा रहे". ══ -->
<div class="panel" id="I95c" data-plate="office" style="--T:4.6s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;animation-duration:3.5s;top:48%"></div>
  <div class="stage mv">
    <div class="chain">
      <div class="ch short"><div class="a"><span class="dis">₹1–3</span></div><div class="a hi">लाख कम</div></div>
      <div class="ar"><svg viewBox="0 0 28 34"><path d="M3 17h21M17 10l7 7-7 7"/></svg></div>
      <div class="ch help"><div class="a hi"><span class="dis">2–3</span> दिन के पैसों</div><div class="a hi">तक की मदद</div></div>
      <div class="ar"><svg viewBox="0 0 28 34"><path d="M3 17h21M17 10l7 7-7 7"/></svg></div>
      <div class="ch zero"><div class="a hi">ब्याज:</div><div class="a hi">कोई नहीं</div></div>
      <div class="ar"><svg viewBox="0 0 28 34"><path d="M3 17h21M17 10l7 7-7 7"/></svg></div>
      <div class="ch ontime"><span class="ck"><svg class="i"><use href="#i-check"/></svg></span><div class="a hi">लोड समय पर</div></div>
    </div>

    <div class="shields">
      <div class="sh mv" style="animation-delay:0s">
        <svg viewBox="0 0 330 372"><defs>
            <linearGradient id="shf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A2B2B"/><stop offset="1" stop-color="#4E0F0F"/></linearGradient>
            <linearGradient id="shr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8D899"/><stop offset=".5" stop-color="#E9A23B"/><stop offset="1" stop-color="#B5700F"/></linearGradient></defs>
          <path d="M165 10 L312 64 L312 176 C312 262 252 324 165 356 C78 324 18 262 18 176 L18 64 Z" fill="url(#shf)" stroke="url(#shr)" stroke-width="12" stroke-linejoin="round"/>
          <path d="M165 36 L290 81 L290 176 C290 250 240 302 165 330 C90 302 40 250 40 176 L40 81 Z" fill="none" stroke="rgba(246,220,168,.35)" stroke-width="3"/>
        </svg>
        <div class="gl"><i class="mv" style="animation-delay:.45s"></i></div>
        <div class="lb hi">क्रेडिट</div>
        <div class="tk mv" style="animation-delay:.22s;animation-duration:.16s"><svg class="i"><use href="#i-check"/></svg></div>
      </div>
      <div class="sh mv" style="animation-delay:.9s">
        <svg viewBox="0 0 330 372">
          <path d="M165 10 L312 64 L312 176 C312 262 252 324 165 356 C78 324 18 262 18 176 L18 64 Z" fill="url(#shf)" stroke="url(#shr)" stroke-width="12" stroke-linejoin="round"/>
          <path d="M165 36 L290 81 L290 176 C290 250 240 302 165 330 C90 302 40 250 40 176 L40 81 Z" fill="none" stroke="rgba(246,220,168,.35)" stroke-width="3"/>
        </svg>
        <div class="gl"><i class="mv" style="animation-delay:1.45s"></i></div>
        <div class="lb hi">डी-ओ-डी</div>
        <div class="tk mv" style="animation-delay:1.22s;animation-duration:.16s"><svg class="i"><use href="#i-check"/></svg></div>
      </div>
    </div>

    <div class="line">
      <div class="t hi mv" style="animation-delay:1.5s">आप अपना क्रेडिट या डी-ओ-डी बचा सकें</div>
      <div class="u mv" style="animation-delay:1.85s"></div>
    </div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
