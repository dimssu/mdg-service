<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  #P03 .abs{position:absolute}
  #P03 .hd3{top:236px;left:60px;right:60px;text-align:center}
  #P03 .hd3 .cap{font-size:70px;margin:0 auto}
  /* a close crop of the DSR image: the card runs off both sides of the frame on purpose */
  #P03 .crop{left:-70px;width:1220px;top:410px}
  #P03 .rc{background:var(--cream);border-radius:26px;border:3px solid var(--amberSoft);overflow:hidden;
    box-shadow:0 50px 100px rgba(58,16,10,.30),0 8px 20px rgba(58,16,10,.16);transform:rotate(-1.6deg)}
  #P03 .rc-top{background:linear-gradient(120deg,var(--maroonSoft),var(--maroon) 62%);padding:30px 172px;display:flex;align-items:center;gap:20px;
    border-bottom:6px solid var(--amber)}
  #P03 .rc-top .tile{background:#fff;color:var(--maroon);font-size:30px;font-weight:700;padding:6px 14px;border-radius:10px}
  #P03 .rc-top .ti{color:#fff;font-size:46px}
  #P03 .gl{padding:34px 162px 40px;display:flex;flex-direction:column;gap:26px}
  #P03 .gr{background:#fff;border:2px solid #EFE4D2;border-radius:24px;padding:26px 40px 30px;position:relative;overflow:hidden;
    box-shadow:0 8px 20px rgba(74,15,15,.07)}
  #P03 .gr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:12px;background:linear-gradient(180deg,#F6C877,var(--amberDeep))}
  #P03 .gr .k{font-size:50px;color:var(--inkMuted);line-height:1.2}
  #P03 .gr .v{display:flex;align-items:baseline;gap:14px;color:var(--maroon);font-weight:700;line-height:1;margin-top:8px}
  #P03 .gr .v .n{font-size:150px;letter-spacing:-3px}
  #P03 .gr .v .u{font-size:70px}
  #P03 .gr.q{--T:3s}
</style>
</head>
<body>
<!-- ══ P03 · his pump today in three numbers · K210 "इससे आपके पंप की असली, रोज़ की हालत समझना आसान हो जाता है।" ═══ -->
<div class="panel" id="P03" data-plate="desk" style="--T:4s">
  <div class="glow anim a-glow" style="animation-delay:-1.2s;top:56%"></div>
  <div class="abs hd3"><div class="cap hi anim a-fade" style="animation-delay:-.05s"><b>आज की असली हालत</b></div></div>

  <div class="abs crop anim a-drift" style="--rot:0deg;--s0:1;--s1:1.05;--dy1:-10px">
    <div class="rc">
      <div class="rc-top"><span class="tile dis">DSR</span><span class="ti hi">डी-एस-आर · 21-08 · HSD</span></div>
      <div class="gl">
        <div class="gr q anim a-rise" style="animation-delay:.1s"><div class="k hi">कल की बिक्री</div>
          <div class="v dis"><span class="n"><span class="odo" data-n="4,222" data-at=".15" style="--T:2.4s"></span></span><span class="u">L</span></div></div>
        <div class="gr q anim a-rise" style="animation-delay:.65s"><div class="k hi">टंकी में अभी</div>
          <div class="v dis"><span class="n"><span class="odo" data-n="14,246" data-at=".7" style="--T:2.4s"></span></span><span class="u">L</span></div></div>
        <div class="gr q anim a-rise" style="animation-delay:1.2s"><div class="k hi">कल आया</div>
          <div class="v dis"><span class="n"><span class="odo" data-n="6,000" data-at="1.25" style="--T:2.4s"></span></span><span class="u">L</span></div></div>
      </div>
    </div>
  </div>
  <div class="rail hi">तीन आँकड़े, पूरा दिन साफ़</div>
</div>
<script src="../kit.js"></script>
<script>
for (const el of document.querySelectorAll('.odo[data-at]')) {
  const at = parseFloat(el.dataset.at);
  el.querySelectorAll('.col').forEach((c, i) => { c.style.animationDelay = (at + i * 0.07).toFixed(2) + 's'; });
}
/* An odometer column is as wide as its widest digit, so a landed "1" leaves a
   hole ("1 4,246"). Size each column to the digit it lands on; the wider digits
   overflow it sideways only while they are rolling past. */
function fitOdo() {
  for (const col of document.querySelectorAll('.odo .col')) {
    const p = document.createElement('span');
    p.textContent = col.style.getPropertyValue('--d').trim();
    p.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap';
    col.parentElement.appendChild(p);
    col.style.width = p.offsetWidth + 'px';
    col.style.alignItems = 'center';
    p.remove();
  }
}
fitOdo(); document.fonts.ready.then(fitOdo);
</script>
</body>
</html>
