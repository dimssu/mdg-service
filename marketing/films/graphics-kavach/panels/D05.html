<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  #D05 .sheet{position:absolute;left:72px;top:250px;width:936px}
  #D05 .paper{--rot:-.6deg;padding:0 44px 40px}
  #D05 .paper .head{display:block;text-align:center;padding:34px 0 22px;border-bottom:3px solid var(--maroon)}
  #D05 .paper .head .t{font-size:54px;font-weight:400;color:var(--maroon);display:block;line-height:1.25}
  #D05 .paper .head .m{font-size:36px;color:#5E554C;display:block;margin:6px 0 0;line-height:1.3}
  #D05 .r{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1.5px dashed #D8CCBA;--T:4s}
  #D05 .r .k{font-size:40px;color:var(--print);line-height:1.3}
  #D05 .r .v{font-family:'Inter',sans-serif;font-weight:700;font-size:50px;color:var(--print);white-space:nowrap}
  #D05 .r.var .k{color:var(--maroon)}
  #D05 .r.var .v{font-family:'Space Grotesk',sans-serif;font-size:84px;color:var(--bad);position:relative;display:flex;align-items:baseline;gap:10px}
  #D05 .r.var .v .u{font-size:44px}
  #D05 .r.var .v .kami{font-size:40px;color:var(--bad)}
  #D05 .r.var .circ{position:relative;display:flex;align-items:baseline;gap:8px;margin-right:52px}
  #D05 .r.var svg.draw{left:-44px;top:-26px;width:calc(100% + 88px);height:calc(100% + 52px)}
  #D05 .r.var svg.draw ellipse{stroke:var(--amber);stroke-width:5;stroke-linecap:butt}
  #D05 .band{margin-top:22px;background:#FBF3E6;border:2px solid #EFE0C6;border-radius:18px;padding:6px 28px 10px}
  #D05 .band .r{border-bottom-color:#E6D5B8}
  #D05 .band .r .k{font-size:36px;max-width:640px}
  #D05 .band .r .v{font-size:46px}
  #D05 .band .r .k small{font-size:32px;color:#6B6258}
  #D05 .band .r.sum{border-bottom:none;border-top:3px solid var(--print);margin-top:4px}
  #D05 .band .r.sum .k{font-size:42px;color:var(--maroon)}
  #D05 .band .r.sum .v{font-family:'Space Grotesk',sans-serif;font-size:70px;color:var(--maroon)}
  #D05 .bar{margin-top:40px;position:relative;height:190px;--T:4s}
  #D05 .bar .trk{position:absolute;left:0;right:0;top:56px;height:44px;border-radius:22px;background:#EFE4D2;overflow:hidden;
    box-shadow:inset 0 3px 6px rgba(0,0,0,.08)}
  #D05 .bar .trk i{display:block;height:100%;background:linear-gradient(90deg,#F6C877,var(--amberDeep));border-radius:22px}
  #D05 .bar .end{position:absolute;right:0;top:0;font-family:'Inter',sans-serif;font-weight:700;font-size:34px;color:var(--maroon)}
  #D05 .bar .end::after{content:'';position:absolute;right:10px;top:48px;width:5px;height:64px;background:var(--maroon);border-radius:3px}
  #D05 .bar .at{position:absolute;left:26.1%;top:112px;transform:translateX(-50%);font-family:'Inter',sans-serif;font-weight:700;font-size:34px;color:var(--amberDeep)}
  #D05 .ver{display:flex;justify-content:center;margin-top:10px}
  #D05 .ver .stamp{font-size:54px;display:flex;align-items:center;gap:14px;padding:12px 30px;border-width:6px;--T:6s}
  #D05 .ver .stamp svg{width:52px;height:52px;stroke-width:3.4}
  @keyframes fillTo{0%{width:0}100%{width:26.1%}}
  #D05 .fill.anim{animation-name:fillTo;animation-duration:1s;animation-timing-function:cubic-bezier(.3,.8,.4,1)}
</style>
</head>
<body>
<!-- ══ D05 · the stock variation sheet: how much, and inside the limit? · K213 (first 6.5 s) ═══ -->
<div class="panel" id="D05" data-plate="desk" style="--T:7s">
  <div class="glow anim a-glow" style="animation-delay:-1.6s;top:50%"></div>
  <div class="sheet anim a-rise" style="animation-delay:-.05s;animation-duration:5s">
    <div class="paper">
      <div class="head"><span class="t hi">स्टॉक वेरिएशन शीट · HSD</span><span class="m hi">12-08 (इंस्पेक्शन) से 20-08</span></div>

      <div class="r anim a-stamp" style="animation-delay:.2s"><span class="k hi">बुक स्टॉक</span><span class="v">14,420 L</span></div>
      <div class="r anim a-stamp" style="animation-delay:.7s"><span class="k hi">टंकी में (डिप से)</span><span class="v">14,246 L</span></div>
      <div class="r var anim a-stamp" style="animation-delay:1.25s"><span class="k hi">वेरिएशन कितना</span>
        <span class="v"><span class="circ"><span class="odo" data-n="−174" data-at="1.3" style="--T:2.6s"></span><span class="u">L</span>
          <svg class="draw" viewBox="0 0 100 40" preserveAspectRatio="none"><ellipse cx="50" cy="20" rx="47" ry="18" pathLength="1" class="anim a-draw" style="--T:7s;animation-delay:1.95s"/></svg></span><span class="kami hi">(कमी)</span></span></div>

      <div class="band anim a-fade" style="--T:3s;animation-delay:2.3s">
        <div class="r anim a-stamp" style="animation-delay:2.4s"><span class="k hi">टंकी स्टॉक का 4%</span><span class="v">570 L</span></div>
        <div class="r anim a-stamp" style="animation-delay:2.85s"><span class="k hi">+ बिक्री पर<br/><small>(38,400 L × 0.25%, सिर्फ़ कमी पर)</small></span><span class="v">96 L</span></div>
        <div class="r sum anim a-stamp" style="animation-delay:3.3s"><span class="k hi">तय सीमा</span><span class="v">666 L</span></div>
      </div>

      <div class="bar anim a-fade" style="animation-delay:3.75s">
        <span class="end">666 L</span>
        <div class="trk"><i class="fill anim" style="animation-delay:3.85s"></i></div>
        <span class="at anim a-fade" style="animation-delay:4.35s">174 L</span>
      </div>
      <div class="ver"><div class="stamp anim a-stampdown" style="animation-delay:4.4s"><span class="hi">तय सीमा के अंदर</span><svg class="i"><use href="#i-check"/></svg></div></div>
    </div>
  </div>
  <div class="rail hi">कितना अंतर, और सीमा में है या नहीं</div>
</div>
<script src="../kit.js"></script>
<script>
for (const el of document.querySelectorAll('.odo[data-at]')) {
  const at = parseFloat(el.dataset.at);
  el.querySelectorAll('.col').forEach((c, i) => { c.style.animationDelay = (at + i * 0.08).toFixed(2) + 's'; });
}
/* An odometer column is as wide as its widest digit, so a landed "1" leaves a
   hole ("1 4,246"). Size each column to the digit it lands on; the wider digits
   overflow it sideways only while they are rolling past. */
function fitOdo() {
  for (const col of document.querySelectorAll('.odo .col')) {
    const p = document.createElement('span');
    p.textContent = col.style.getPropertyValue('--d').trim();
    p.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap';
    col.parentElement.appendChild(p);
    col.style.width = p.offsetWidth + 'px';
    col.style.alignItems = 'center';
    p.remove();
  }
}
fitOdo(); document.fonts.ready.then(fitOdo);
</script>
</body>
</html>
