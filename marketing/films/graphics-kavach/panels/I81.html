<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* Fixed deadlines as rows, each with its own ticking clock; an "आज" marker
   runs down them, the first two are done, the weekly one is missed, and the
   miss is answered for. Only deadlines the film itself names later (K416–K419).
   Timed to K018 (first 6.2 s): "कई काम तो" 0.13–0.88 s — the rows are those
   "many tasks", so they are arriving from the first frame; "तय" 0.95 s is the
   heading; "तारीख़ तक" 1.28–1.9 s pops each row's deadline chip; "ही करने
   होते हैं" to 2.71 s, "इनमें से एक भी काम" 3.94–5.3 s, "छूट गया" 5.35–5.96 s. "तो जवाब आपको देना पड़ सकता है" (6.57–8.60 s) falls
   after the cut to S60, so the answer box is in before the cut and the last
   0.6 s are still. */
#I81 .hd{position:absolute;left:60px;right:60px;top:250px;display:flex;flex-direction:column;align-items:center}
#I81 .hd .t{font-size:92px;color:var(--maroon);line-height:1.25}
#I81 .hd .u{width:180px;height:7px;border-radius:7px;margin-top:18px;transform-origin:50% 50%;background:linear-gradient(90deg,#E9A23B,#F4C979)}
#I81 .rw{position:absolute;left:146px;width:850px;height:172px;display:flex;align-items:center;gap:22px;padding:0 26px 0 26px;
  background:#fff;border:2px solid #EFE4D2;border-radius:22px;box-shadow:0 14px 30px rgba(74,15,15,.13),0 3px 8px rgba(74,15,15,.08)}
#I81 .rw .ic{position:relative;width:84px;height:84px;flex:none}
#I81 .rw .ic > *{position:absolute;inset:0}
#I81 .rw .ic svg{width:100%;height:100%;overflow:visible}
#I81 .rw .nm{flex:1;font-size:54px;line-height:1.2;color:var(--ink);padding-top:10px;white-space:nowrap}
#I81 .rw .dl{position:relative;flex:none;width:210px;height:76px}
#I81 .chip{position:absolute;right:0;top:0;height:76px;display:flex;align-items:center;white-space:nowrap;font-size:44px;line-height:1;
  padding:10px 26px 0;border-radius:999px;color:#8A4B10;background:#FFF6E6;border:3px solid var(--amberSoft)}
#I81 .chip.bad{color:#fff;background:var(--bad);border-color:var(--bad);box-shadow:0 10px 22px rgba(192,57,43,.35)}
#I81 .ok{border-radius:50%;background:linear-gradient(150deg,#27935A,#17663C);border:4px solid var(--amber);display:flex;align-items:center;justify-content:center;color:#fff}
#I81 .ok svg{width:44px!important;height:44px!important;stroke-width:3.2}
#I81 .no{border-radius:50%;background:var(--bad);display:flex;align-items:center;justify-content:center;color:#fff}
#I81 .no svg{width:46px!important;height:46px!important;stroke-width:2.8}
#I81 .rw.miss{border-color:rgba(192,57,43,.55)}
#I81 .redge{position:absolute;inset:-2px;border-radius:22px;border:4px solid var(--bad);pointer-events:none}
#I81 .hand{transform-origin:32px 32px;animation-name:tickH;animation-duration:3s;animation-timing-function:steps(12);animation-iteration-count:infinite}
@keyframes tickH{to{transform:rotate(360deg)}}
/* the "आज" marker */
#I81 .mk{position:absolute;left:18px;top:0;width:1000px;height:0}
#I81 .mk .p{position:absolute;left:0;top:-32px;height:64px;display:flex;align-items:center;font-size:44px;line-height:1;color:#fff;
  padding:8px 20px 0 18px;border-radius:12px;background:var(--amberDeep);box-shadow:0 8px 18px rgba(120,60,6,.30)}
#I81 .mk .p::after{content:'';position:absolute;right:-18px;top:50%;margin-top:-12px;border:12px solid transparent;border-left:14px solid var(--amberDeep);border-right:0}
@keyframes mkIn{0%{opacity:0}100%{opacity:1}}
@keyframes mkRun{0%{transform:translateY(440px)}30%{transform:translateY(586px)}55%{transform:translateY(790px)}82%,100%{transform:translateY(994px)}}
.mr{animation-name:mkRun;animation-timing-function:cubic-bezier(.45,0,.35,1)}
/* the answer */
#I81 .ans{position:absolute;left:296px;top:1422px;width:700px;height:170px;display:flex;align-items:center;gap:26px;padding:0 36px;border-radius:26px;
  background:linear-gradient(120deg,var(--maroonSoft),var(--maroon) 70%);color:#fff;box-shadow:0 22px 44px rgba(74,15,15,.30)}
#I81 .ans .env{width:94px;height:94px;border-radius:50%;flex:none;background:#fff;color:var(--maroon);display:flex;align-items:center;justify-content:center;
  border:3px solid var(--amber)}
#I81 .ans .env svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#I81 .ans .t{font-size:66px;line-height:1.2;padding-top:10px;white-space:nowrap}
#I81 .ans .t b{font-weight:400;color:var(--amberSoft)}
#I81 svg.arr{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible;pointer-events:none}
#I81 svg.arr path{fill:none;stroke:var(--maroon);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
@keyframes drawOn2{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
.dr{animation-name:drawOn2;animation-timing-function:cubic-bezier(.5,.1,.3,1)}
@keyframes fadeUp{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:none}}
.fu{animation-name:fadeUp}
@keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.gx{animation-name:growX}
@keyframes rowIn{0%{opacity:0;transform:translateX(-90px) rotate(-2deg)}70%{opacity:1;transform:translateX(6px)}100%{opacity:1;transform:none}}
.ri{animation-name:rowIn;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
@keyframes swapIn{0%{opacity:0;transform:scale(.4) rotate(-30deg)}65%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
.si{animation-name:swapIn}
@keyframes out{0%{opacity:1}100%{opacity:0}}
.o{animation-name:out}
@keyframes stampC{0%{opacity:0;transform:scale(1.6) rotate(-10deg)}60%{opacity:1;transform:scale(.95) rotate(-3deg)}100%{opacity:1;transform:rotate(-3deg)}}
.sc{animation-name:stampC;animation-timing-function:cubic-bezier(.3,1.2,.5,1)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.sh{animation-name:shake}
@keyframes popIn2{0%{opacity:0;transform:scale(.85) translateY(20px)}70%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:none}}
.pi2{animation-name:popIn2;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
@keyframes chipIn{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
.pc{animation-name:chipIn;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="k-clock" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#FFF4E0" stroke="var(--amberDeep)" stroke-width="4"/></symbol>
  <symbol id="k-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.2"/><path d="M3.6 6.6 12 13l8.4-6.4"/></symbol>
</svg>
<!-- ══ I81 · fixed deadlines; one missed and the dealer answers · K018 "कई काम तो तय तारीख़ तक ही करने होते हैं। इनमें से एक भी काम छूट गया, …" (first 6.2 s) ══ -->
<div class="panel" id="I81" data-plate="office" style="--T:7s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;animation-duration:2.4s;top:46%"></div>

  <div class="hd">
    <div class="t hi anim fu" style="animation-delay:.42s;animation-duration:.4s">तय तारीख़ तक</div>
    <div class="u anim gx" style="animation-delay:.62s;animation-duration:.4s"></div>
  </div>

  <!-- row 1: daily declaration, done -->
  <div class="rw anim ri" style="top:500px;animation-delay:-.3s;animation-duration:.36s">
    <div class="ic"><svg viewBox="0 0 64 64" class="anim o" style="animation-delay:3.9s;animation-duration:.1s"><use href="#k-clock"/><g class="hand anim" style="animation-delay:-.4s"><path d="M32 36V12" stroke="var(--maroon)" stroke-width="4" stroke-linecap="round"/></g><circle cx="32" cy="32" r="4" fill="var(--maroon)"/></svg>
      <span class="ok anim si" style="animation-delay:3.88s;animation-duration:.3s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="nm hi">डेली डिक्लेरेशन</div>
    <div class="dl anim pc" style="animation-delay:.92s;animation-duration:.3s"><span class="chip hi">रोज़</span></div>
  </div>
  <!-- row 2: stock board, done -->
  <div class="rw anim ri" style="top:704px;animation-delay:-.1s;animation-duration:.36s">
    <div class="ic"><svg viewBox="0 0 64 64" class="anim o" style="animation-delay:4.3s;animation-duration:.1s"><use href="#k-clock"/><g class="hand anim" style="animation-delay:-1.3s"><path d="M32 36V12" stroke="var(--maroon)" stroke-width="4" stroke-linecap="round"/></g><circle cx="32" cy="32" r="4" fill="var(--maroon)"/></svg>
      <span class="ok anim si" style="animation-delay:4.28s;animation-duration:.3s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="nm hi">स्टॉक बोर्ड अपडेट</div>
    <div class="dl anim pc" style="animation-delay:1.0s;animation-duration:.3s"><span class="chip hi">रोज़</span></div>
  </div>
  <!-- row 3: the weekly declarations — missed -->
  <div class="rw anim ri" style="top:908px;animation-delay:.1s;animation-duration:.36s">
    <div class="anim sh" style="position:absolute;inset:0;animation-delay:4.9s;animation-duration:.36s;display:flex;align-items:center;gap:22px;padding:0 26px">
      <div class="ic"><svg viewBox="0 0 64 64" class="anim o" style="animation-delay:4.88s;animation-duration:.1s"><use href="#k-clock"/><g class="hand anim" style="animation-delay:-2.1s"><path d="M32 36V12" stroke="var(--maroon)" stroke-width="4" stroke-linecap="round"/></g><circle cx="32" cy="32" r="4" fill="var(--maroon)"/></svg>
        <span class="no anim si" style="animation-delay:4.86s;animation-duration:.3s"><svg class="i"><use href="#i-alert"/></svg></span></div>
      <div class="nm hi">हफ़्ते के डिक्लेरेशन</div>
      <div class="dl anim pc" style="animation-delay:1.08s;animation-duration:.3s"><span class="chip hi anim o" style="animation-delay:4.88s;animation-duration:.1s">हर हफ़्ते</span>
        <span class="chip bad hi anim sc" style="animation-delay:4.88s;animation-duration:.26s">छूट गया</span></div>
    </div>
    <div class="redge anim a-fade" style="animation-delay:4.86s;animation-duration:1.4s"></div>
  </div>
  <!-- row 4: trade licence renewal, not yet due -->
  <div class="rw anim ri" style="top:1112px;animation-delay:.3s;animation-duration:.36s">
    <div class="ic"><svg viewBox="0 0 64 64"><use href="#k-clock"/><g class="hand anim" style="animation-delay:-2.7s"><path d="M32 36V12" stroke="var(--maroon)" stroke-width="4" stroke-linecap="round"/></g><circle cx="32" cy="32" r="4" fill="var(--maroon)"/></svg></div>
    <div class="nm hi">ट्रेड लाइसेंस रिन्यूअल</div>
    <div class="dl anim pc" style="animation-delay:1.16s;animation-duration:.3s"><span class="chip hi">साल</span></div>
  </div>

  <!-- today runs down the rows and stops on the missed one -->
  <div class="mk anim a-fade" style="animation-delay:3.45s;animation-duration:1.4s">
    <div class="anim mr" style="position:absolute;left:0;top:0;width:1000px;animation-delay:3.45s;animation-duration:1.45s">
      <span class="p hi">आज</span>
    </div>
  </div>

  <!-- from the missed row, round the right margin, to the answer -->
  <svg class="arr" viewBox="0 0 1080 1920">
    <path class="anim dr" pathLength="1" style="animation-delay:5.05s;animation-duration:.36s" d="M1002 994 C 1046 994, 1050 1020, 1050 1070 L 1050 1440 C 1050 1490, 1040 1507, 1010 1507"/>
    <path class="anim dr" pathLength="1" style="animation-delay:5.36s;animation-duration:.12s" d="M1028 1482 L 1004 1507 L 1028 1532"/>
  </svg>
  <div class="ans anim pi2" style="animation-delay:5.2s;animation-duration:.34s">
    <span class="env"><svg><use href="#k-mail"/></svg></span>
    <span class="t hi">जवाब — <b>आपको</b></span>
  </div>

  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
