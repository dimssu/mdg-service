<style>
/* "मान लीजिए": an empty ring draws, then I24's 43 task tiles (same tints, the
   same twelve sample names) fly in one by one clockwise and settle round it,
   while the ring fills and the total counts 0 → 4,700 on the same clock (a real
   count, not an odometer, so every frame shows a true running total). Then a
   slow push and a breathing glow, so nothing holds still. */
.panel{justify-content:flex-start}
.top{position:absolute;left:0;right:0;top:150px;display:flex;flex-direction:column;align-items:center;gap:22px}
.tag{background:var(--amber);color:var(--maroonDeep);font-size:40px;padding:10px 34px;border-radius:999px;box-shadow:0 8px 18px rgba(199,124,27,.3)}
.lbl{font-size:60px;color:var(--maroon);line-height:1.3}
.stage{position:absolute;inset:0;transform-origin:540px 1050px}
.gl{position:absolute;left:210px;top:720px;width:660px;height:660px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,162,59,.45),rgba(233,162,59,0) 66%)}
svg.gauge{position:absolute;left:290px;top:800px;width:500px;height:500px;overflow:visible;transform:rotate(-90deg)}
svg.gauge circle{fill:none;stroke-width:30;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
svg.gauge .trk{stroke:rgba(107,22,22,.14)}
svg.gauge .fil{stroke:url(#gold)}
@keyframes drawOn2{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.mid{position:absolute;left:330px;top:940px;width:420px;text-align:center}
.mid .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:124px;line-height:1;color:var(--maroon);letter-spacing:-3px}
.mid .u{font-size:44px;color:var(--inkMuted);margin-top:14px}
/* a real count with an Indian-style thousands comma: one registered integer on
   the panel's clock, split into thousands and a zero-padded remainder */
@property --n{syntax:'<integer>';initial-value:0;inherits:true}
@counter-style pad3{system:extends decimal;pad:3 "0"}
.cnt{white-space:nowrap;display:inline-flex}
.cnt span{display:inline-block;overflow-x:clip;overflow-y:visible}
.cnt .th{counter-reset:th calc(round(down, var(--n) / 1000, 1));max-width:calc(clamp(0, var(--n) - 999, 1) * 2em)}
.cnt .th::before{content:counter(th) ","}
.cnt .r3{counter-reset:r calc(mod(var(--n), 1000));max-width:calc(clamp(0, var(--n) - 999, 1) * 3em)}
.cnt .r3::before{content:counter(r, pad3)}
.cnt .r0{counter-reset:r calc(mod(var(--n), 1000));max-width:calc((1 - clamp(0, var(--n) - 999, 1)) * 3em)}
.cnt .r0::before{content:counter(r)}
@keyframes cntTo{0%{--n:0}100%{--n:var(--to)}}
.tl{position:absolute;height:50px;min-width:50px;margin:-25px 0 0 -25px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  color:#fff;box-shadow:0 8px 16px rgba(40,14,6,.22),inset 0 -4px 8px rgba(0,0,0,.18);
  animation-name:flyIn;animation-duration:.6s;animation-timing-function:cubic-bezier(.2,.9,.3,1.15)}
.tl svg{width:26px;height:26px;opacity:.85}
.tl.lab{height:62px;padding:0 20px;font-size:30px;line-height:1.2;white-space:nowrap;transform:translateX(-50%);margin:-31px 0 0 0}
@keyframes flyIn{0%{opacity:0;translate:var(--dx) var(--dy);scale:.4}60%{opacity:1}100%{opacity:1;translate:0 0;scale:1}}
@keyframes push{0%{transform:scale(1)}100%{transform:scale(1.02)}}
@keyframes breathe2{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
</style>
</head>
