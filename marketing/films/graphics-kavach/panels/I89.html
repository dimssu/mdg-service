<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* I77's big-word layout on the night plate. The eyebrow was said in K036
   ("…तो सवाल उठता है।"), so it is on at 0 s with its short gold rule. The
   question is written line by line as K036b says it (measured onsets:
   0.06 · 1.80 · "कैसे" ≈ 2.68 · 4.24 · 5.62 · 7.71 s, the line ends 8.88 s): the first line is
   already written at the cut ("पंप" is said at 0.06 s), each later line is
   written just ahead of its words; the gold question mark draws after "रहे?"
   and holds. The block pushes in 3% over the card. The words follow the voice,
   which says "पंप को … कैसे बनाया जाए, कि वो डीलर …" (the plan's summary
   read "पंप इतना … कैसे बने, कि डीलर …"). */
.mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
@keyframes wr{0%{clip-path:inset(-12% 100% -12% 0)}100%{clip-path:inset(-12% -4% -12% 0)}}
@keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes push{0%{transform:scale(1)}100%{transform:scale(1.03)}}
@keyframes drawOn3{0%{stroke-dashoffset:1;opacity:0}2%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes dotIn{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:none}}

#I89{gap:0}
#I89 .blk{width:1000px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 45%;margin-top:-30px;animation-name:push;animation-timing-function:linear}
#I89 .srule{width:150px;height:7px;border-radius:7px;background:linear-gradient(90deg,#E9A23B,#F4C979)}
#I89 .lbl{font-size:60px;color:var(--amber);margin-top:30px}
#I89 .q{margin-top:40px;text-align:center;font-size:88px;line-height:1.32;color:#FFF3E2;text-shadow:0 18px 44px rgba(0,0,0,.35)}
#I89 .q div{animation-name:wr;animation-timing-function:linear;white-space:nowrap}
#I89 .qm{width:180px;height:276px;margin-top:36px;overflow:visible}
#I89 .qm path{fill:none;stroke:url(#qg);stroke-width:17;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation-name:drawOn3;animation-timing-function:cubic-bezier(.45,.1,.3,1)}
#I89 .qm circle{transform-box:fill-box;transform-origin:50% 50%;animation-name:dotIn}
</style>
</head>
<body>
<!-- ══ I89 · the question · K036b "पंप को इतना व्यवस्थित और ऑटोमैटिक कैसे बनाया जाए, कि वो डीलर की हर पल की मौजूदगी के बिना भी, ठीक से चलता रहे?" (9.87 s) ══ -->
<div class="panel ink" id="I89" data-plate="night" style="--T:11s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;top:46%;background:radial-gradient(circle,rgba(233,162,59,.24),rgba(233,162,59,0) 66%)"></div>
  <div class="blk mv" style="animation-duration:10.3s">
    <div class="srule"></div>
    <div class="lbl hi">तो सवाल उठता है</div>
    <div class="q hi">
      <div class="mv" style="animation-delay:-.5s;animation-duration:.5s">पंप को इतना व्यवस्थित</div>
      <div class="mv" style="animation-delay:1.52s;animation-duration:.4s">और ऑटोमैटिक</div>
      <div class="mv" style="animation-delay:2.42s;animation-duration:.4s">कैसे बनाया जाए,</div>
      <div class="mv" style="animation-delay:3.95s;animation-duration:.45s">कि वो डीलर की हर पल</div>
      <div class="mv" style="animation-delay:5.3s;animation-duration:.45s">की मौजूदगी के बिना भी,</div>
      <div class="mv" style="animation-delay:7.4s;animation-duration:.45s">ठीक से चलता रहे?</div>
    </div>
    <svg class="qm" viewBox="0 0 120 184">
      <defs><linearGradient id="qg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4C979"/><stop offset=".55" stop-color="#E9A23B"/><stop offset="1" stop-color="#C27716"/></linearGradient></defs>
      <path pathLength="1" class="mv" style="animation-delay:7.95s;animation-duration:.6s" d="M20 50C20 24 38 10 60 10C84 10 100 26 100 48C100 70 84 78 72 88C62 96 60 104 60 122"/>
      <circle class="mv" cx="60" cy="160" r="12" fill="#E9A23B" style="animation-delay:8.5s;animation-duration:.25s"/>
    </svg>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
