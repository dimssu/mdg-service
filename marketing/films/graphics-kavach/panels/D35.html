<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes boardIn{0%{opacity:0;transform:translateY(90px) rotate(2.5deg) scale(.96)}100%{opacity:1;transform:rotate(-1.4deg)}}
  @keyframes gridIn{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 0 0)}}
  @keyframes pr{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:none}}
  @keyframes wr{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(-10% -10% -10% 0)}}
  @keyframes band{0%{opacity:0;transform:scaleY(.2)}25%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
  @keyframes sweepX{0%{transform:translateX(-120%) skewX(-16deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(560%) skewX(-16deg);opacity:0}}
  @keyframes glowIn{0%{opacity:0}100%{opacity:1}}

  #D35 .board{width:936px;padding:74px 30px 34px;border-radius:26px;position:relative;
    background:linear-gradient(160deg,#9A6A3C,#6F4524 70%,#5C381C);
    box-shadow:0 50px 90px rgba(40,14,6,.45),0 8px 20px rgba(40,14,6,.3),inset 0 2px 0 rgba(255,255,255,.18);
    animation-name:boardIn;animation-duration:.7s}
  #D35 .clip{position:absolute;left:50%;top:-26px;width:300px;height:96px;margin-left:-150px;border-radius:18px;
    background:linear-gradient(180deg,#E8E4DE,#A9A39A 60%,#8C857B);z-index:5;
    box-shadow:0 10px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.7)}
  #D35 .clip::after{content:'';position:absolute;left:50%;top:22px;width:80px;height:26px;margin-left:-40px;border-radius:13px;
    background:#5C574F;box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
  #D35 .paper{--rot:.6deg;padding:34px 34px 40px}
  #D35 .paper .head{padding:14px 4px 22px;border-bottom:3px solid var(--print);margin-bottom:26px}
  #D35 .paper .head .t{font-size:52px;color:var(--maroonDeep)}
  #D35 .tw{position:relative;animation-name:gridIn;animation-duration:.8s;animation-timing-function:cubic-bezier(.4,.1,.3,1)}
  #D35 table.grid th{font-size:32px;line-height:1.28;padding:16px 6px;text-transform:none;color:#2F2822;vertical-align:middle}
  #D35 table.grid{table-layout:fixed}
  #D35 table.grid th:first-child{width:160px}
  #D35 table.grid td{height:170px;padding:6px}
  #D35 table.grid td.nm{font-size:48px;color:var(--print);text-align:left;padding-left:24px}
  #D35 .rt{display:inline-block;font-size:72px;line-height:1;color:var(--pen);font-weight:700;
    animation-name:wr;animation-duration:.42s;animation-timing-function:linear}
  #D35 .ph{display:block;animation-name:pr;animation-duration:.4s}
  #D35 .colband{position:absolute;top:0;bottom:0;background:rgba(233,162,59,.16);border-left:3px solid rgba(233,162,59,.7);
    border-right:3px solid rgba(233,162,59,.7);pointer-events:none;animation-name:band;animation-duration:.95s;animation-timing-function:ease-out}
  #D35 .sw{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:6px;z-index:7}
  #D35 .sw i{position:absolute;top:-10%;bottom:-10%;left:0;width:22%;display:block;
    background:linear-gradient(90deg,rgba(255,214,110,0),rgba(255,214,110,.55),rgba(255,214,110,0));
    animation-name:sweepX;animation-duration:1.1s;animation-timing-function:ease-in-out}
  #D35 .done{position:absolute;inset:0;border-radius:4px;box-shadow:inset 0 0 0 5px rgba(233,162,59,.8),inset 0 0 50px rgba(233,162,59,.35);
    pointer-events:none;animation-name:glowIn;animation-duration:.6s}
</style>
</head>
<body>
<!-- ══ D35 · staff rated on set measures · K720 (held 5.74 s) ══════════════════ -->
<div class="panel" id="D35" data-plate="office" style="--T:7s">
  <div class="board mv">
    <div class="clip"></div>
    <div class="paper">
      <div class="head"><span class="t hi">स्टाफ़ असेसमेंट — तय पैमाने</span></div>
      <div class="tw mv" style="animation-delay:.2s">
        <table class="grid">
          <thead><tr>
            <th class="hi"><span class="ph mv" style="animation-delay:.3s">स्टाफ़</span></th>
            <th class="hi"><span class="ph mv" style="animation-delay:.45s">समय पर हाज़िरी</span></th>
            <th class="hi"><span class="ph mv" style="animation-delay:.6s">साफ़-सफ़ाई</span></th>
            <th class="hi"><span class="ph mv" style="animation-delay:.75s">ग्राहक से व्यवहार</span></th>
            <th class="hi"><span class="ph mv" style="animation-delay:.9s">रिकॉर्ड में मदद</span></th>
          </tr></thead>
          <tbody>
            <tr><td class="nm hi">सुनील</td>
              <td><span class="rt hand mv" style="animation-delay:1.0s">5/5</span></td>
              <td><span class="rt hand mv" style="animation-delay:1.7s">4/5</span></td>
              <td><span class="rt hand mv" style="animation-delay:2.4s">5/5</span></td>
              <td><span class="rt hand mv" style="animation-delay:3.1s">4/5</span></td></tr>
            <tr><td class="nm hi">राजू</td>
              <td><span class="rt hand mv" style="animation-delay:1.15s">4/5</span></td>
              <td><span class="rt hand mv" style="animation-delay:1.85s">5/5</span></td>
              <td><span class="rt hand mv" style="animation-delay:2.55s">4/5</span></td>
              <td><span class="rt hand mv" style="animation-delay:3.25s">3/5</span></td></tr>
            <tr><td class="nm hi">मोहन</td>
              <td><span class="rt hand mv" style="animation-delay:1.3s">3/5</span></td>
              <td><span class="rt hand mv" style="animation-delay:2.0s">4/5</span></td>
              <td><span class="rt hand mv" style="animation-delay:2.7s">4/5</span></td>
              <td><span class="rt hand mv" style="animation-delay:3.4s">4/5</span></td></tr>
          </tbody>
        </table>
        <!-- a pale band follows the column being filled -->
        <div class="colband mv" style="left:19.8%;width:20.05%;animation-delay:.95s"></div>
        <div class="colband mv" style="left:39.85%;width:20.05%;animation-delay:1.65s"></div>
        <div class="colband mv" style="left:59.9%;width:20.05%;animation-delay:2.35s"></div>
        <div class="colband mv" style="left:79.95%;width:20.05%;animation-delay:3.05s"></div>
        <div class="done mv" style="animation-delay:4.0s"></div>
        <div class="sw"><i class="mv" style="animation-delay:4.0s"></i></div>
      </div>
    </div>
  </div>
  <div class="rail hi">तय पैमानों पर असेसमेंट</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
