<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  /* the app's own chat, as on P06/P07/P08: notch, white header with the DK badge,
     cream chat, maroon mic — the same phone on every chat card */
  #P01 .phone{width:860px;height:1560px;border-radius:84px;padding:16px;margin-top:-40px}
  #P01 .screen{border-radius:70px;background:var(--cream)}
  #P01 .island{position:absolute;top:22px;left:50%;width:150px;height:40px;margin-left:-75px;
    border-radius:20px;background:#000;z-index:10}
  #P01 .top{padding:84px 36px 24px;display:flex;align-items:center;gap:20px;background:#fff;
    border-bottom:1px solid #EDE2D3;position:relative;z-index:2}
  #P01 .logo{width:72px;height:72px;border-radius:20px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:28px;font-weight:700;color:#fff;
    background:linear-gradient(145deg,var(--maroonSoft),var(--maroonDeep))}
  #P01 .top .nm{font-size:36px;color:#16120F;line-height:1.2}
  #P01 .top .st{font-size:27px;color:var(--inkMuted);line-height:1.3}
  #P01 .ph-body{flex:1;padding:30px 30px 30px;display:flex;flex-direction:column;justify-content:flex-end;gap:28px;
    background:radial-gradient(rgba(107,22,22,.06) 1.5px,transparent 1.5px) 0 0/34px 34px,var(--creamSunk)}
  #P01 .compose{margin:0 26px 34px;display:flex;align-items:center;gap:18px}
  #P01 .compose .in{flex:1;background:#fff;border:2px solid #EDE2D3;border-radius:999px;padding:22px 30px;font-size:28px;color:#A89484}
  #P01 .compose .mic{width:84px;height:84px;border-radius:50%;background:var(--maroon);color:#fff;
    display:flex;align-items:center;justify-content:center}
  #P01 .b{border-radius:28px;padding:24px 30px 16px;font-size:43px;line-height:1.45;max-width:86%;color:var(--ink);
    box-shadow:0 4px 12px rgba(74,15,15,.12);--T:5s}
  #P01 .b.me{align-self:flex-end;background:#FBE7C4;border-top-right-radius:8px}
  #P01 .b.them{align-self:flex-start;background:#fff;border-top-left-radius:8px}
  #P01 .b .tm{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:24px;color:#9C9184;margin-top:6px;font-family:'Space Grotesk','Inter',sans-serif}
  #P01 .ticks{position:relative;width:36px;height:22px;display:inline-block}
  #P01 .ticks svg{position:absolute;inset:0;width:36px;height:22px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  #P01 .ticks .g{stroke:#A89A8B} #P01 .ticks .bl{stroke:var(--maroonSoft)}
  #P01 .photo{width:570px;height:400px;border-radius:18px;overflow:hidden;position:relative;background:#DCD3C4}
  #P01 .photo .pg{position:absolute;left:44px;top:26px;width:480px;height:400px;background:#FFFDF6;transform:rotate(-4deg);
    filter:blur(2.4px);box-shadow:0 8px 20px rgba(0,0,0,.25);
    background-image:linear-gradient(90deg,transparent 58px,rgba(231,169,160,.9) 58px 61px,transparent 61px),
      linear-gradient(transparent calc(100% - 2px),#B7C8E2 0);background-size:100% 100%,100% 34px}
  #P01 .photo .pg i{position:absolute;left:74px;height:7px;border-radius:6px;background:#2C4D9E;opacity:.8}
  #P01 .typing{position:absolute;left:0;bottom:0;background:#fff;border-radius:28px;border-top-left-radius:8px;padding:26px 30px;display:flex;gap:12px;
    box-shadow:0 4px 12px rgba(74,15,15,.12)}
  #P01 .typing i{width:16px;height:16px;border-radius:50%;background:#A89A8B;display:block;animation-name:hop;animation-duration:.45s;
    animation-iteration-count:2;animation-timing-function:ease-in-out}
  @keyframes hop{0%,100%{transform:none;opacity:.5}50%{transform:translateY(-10px);opacity:1}}
  @keyframes typeLife{0%{opacity:0;transform:translateY(20px)}12%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
  #P01 .typing.anim{animation-name:typeLife;animation-duration:.95s}
  #P01 .ul{background:linear-gradient(var(--amber),var(--amber)) no-repeat 0 94% / 0% 7px;padding-bottom:2px;white-space:nowrap}
  @keyframes ulIn{0%{background-size:0% 7px}100%{background-size:100% 7px}}
  #P01 .ul.anim{animation-name:ulIn;animation-duration:.7s}
  #P01 .okc{display:inline-flex;vertical-align:-5px;width:44px;height:44px;border-radius:50%;background:var(--good);color:#fff;align-items:center;justify-content:center}
  #P01 .okc svg{width:26px;height:26px;stroke-width:3.4}
</style>
</head>
<body>
<svg style="display:none"><symbol id="dbl" viewBox="0 0 36 22"><path d="M2 12.5 7.5 18 17 5"/><path d="M13 16.4 14.6 18 24 5"/></symbol></svg>
<!-- ══ P01 · manual dip and running sent, DSR on the way · K206 "…मैनुअल डिप और रनिंग लेकर, आपका रोज़ का डी-एस-आर तैयार करती है" ═══ -->
<div class="panel" id="P01" data-plate="desk" style="--T:7s">
  <div class="glow anim a-glow" style="animation-delay:-1.5s;top:52%"></div>
  <div class="phone anim a-rise" style="animation-delay:-.1s;animation-duration:5s">
    <div class="screen">
      <div class="island"></div>
      <div class="top">
        <div class="logo dis">DK</div>
        <div><div class="nm hi">MDG टीम</div><div class="st hi">डीलर कवच</div></div>
      </div>
      <div class="ph-body">
        <div class="b me hi anim a-bub" style="animation-delay:.45s">आज ऑटोमेशन से डेटा नहीं आया — मैनुअल डिप और रनिंग भेज रहे हैं
          <div class="tm">08:05 <span class="ticks"><svg class="g"><use href="#dbl"/></svg><svg class="bl anim a-fade" style="--T:3s;animation-delay:3.85s"><use href="#dbl"/></svg></span></div></div>
        <div class="b me anim a-bub" style="animation-delay:1.35s;padding:12px 12px 12px">
          <div class="photo"><div class="pg">
            <i style="top:44px;width:180px"></i><i style="top:78px;width:250px"></i><i style="top:112px;width:140px"></i>
            <i style="top:146px;width:230px"></i><i style="top:180px;width:190px"></i><i style="top:214px;width:260px"></i><i style="top:248px;width:120px"></i><i style="top:282px;width:240px"></i><i style="top:316px;width:170px"></i></div></div>
          <div class="tm" style="padding-right:14px">08:05 <span class="ticks"><svg class="g"><use href="#dbl"/></svg><svg class="bl anim a-fade" style="--T:3s;animation-delay:3.85s"><use href="#dbl"/></svg></span></div></div>
        <div class="b me hi anim a-bub" style="animation-delay:2.2s">टैंक 2 डिप: 160 cm
          <div class="tm">08:06 <span class="ticks"><svg class="g"><use href="#dbl"/></svg><svg class="bl anim a-fade" style="--T:3s;animation-delay:3.85s"><use href="#dbl"/></svg></span></div></div>
        <div style="position:relative;align-self:stretch;display:flex;flex-direction:column">
          <div class="typing anim" style="animation-delay:2.85s"><i class="anim" style="animation-delay:2.95s"></i><i class="anim" style="animation-delay:3.05s"></i><i class="anim" style="animation-delay:3.15s"></i></div>
          <div class="b them hi anim a-bub" style="animation-delay:3.8s">मिल गया <span class="okc"><svg class="i"><use href="#i-check"/></svg></span> आपकी आज की <span class="ul anim" style="animation-delay:4.35s">डी-एस-आर</span> इसी से तैयार हो रही है
            <div class="tm">08:12</div></div>
        </div>
      </div>
      <div class="compose">
        <div class="in hi">संदेश लिखें…</div>
        <div class="mic"><svg class="i" style="width:38px;height:38px" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>
      </div>
    </div>
  </div>
  <div class="rail hi">ऑटोमेशन रुके, तब भी रिपोर्ट नहीं रुकती</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
