<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* The first and biggest problem as two lines crossing: income falling, costs
   rising. Direction only — no figure on either axis.
   Timed to K011: "सबसे पहली" 0–0.86 s, "और सबसे बड़ी समस्या" 1.21–2.64 s,
   "कमाई घट रही है" 3.68–4.62 s, "और ख़र्च" 5.54–6.06 s, "लगातार बढ़ रहा है"
   6.39–7.56 s. Each line's label rides its tip, so the word is on screen
   just before it is spoken and the slope is drawn while it is described.
   I79b opens on this panel's last frame: the chart, both lines and every label
   are copied there at the same positions. Change one, change both. */
#I79a .hd{position:absolute;left:80px;right:80px;top:280px;text-align:center}
#I79a .hd > div{width:fit-content;margin-left:auto;margin-right:auto}
#I79a .hd .lbl{font-size:58px;color:var(--amberDeep);line-height:1.3}
#I79a .hd .ttl{font-size:104px;color:var(--maroon);line-height:1.25;margin-top:4px}
#I79a .chart{position:absolute;left:80px;top:676px;width:920px;height:900px;border-radius:30px;
  background:linear-gradient(170deg,#fff,#FBF3E7);border:2px solid rgba(214,168,98,.55);
  box-shadow:0 34px 70px rgba(58,16,10,.24),0 4px 10px rgba(58,16,10,.12)}
#I79a .chart svg.plot{position:absolute;left:0;top:0;width:920px;height:900px;overflow:visible}
#I79a .grid line{stroke:#EADFCB;stroke-width:2;stroke-dasharray:10 12}
#I79a .base{stroke:#8A7466;stroke-width:5;stroke-linecap:round}
#I79a .ln{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
#I79a .ln.inc{stroke:var(--maroon)}
#I79a .ln.exp{stroke:var(--amber)}
#I79a .ax{position:absolute;left:0;right:0;top:740px;text-align:center;font-size:46px;color:var(--inkMuted);
  display:flex;align-items:center;justify-content:center;gap:18px}
#I79a .ax svg{width:70px;height:30px;overflow:visible}
/* a label that rides the tip of its line: a zero-size point moved along the
   same path, with the same timing, as the stroke that draws it */
#I79a .rider{position:absolute;left:0;top:0;width:0;height:0;offset-rotate:0deg}
#I79a .rider .dot{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:#fff;border:9px solid currentColor;
  box-shadow:0 4px 10px rgba(58,16,10,.25)}
#I79a .rider .tg{position:absolute;white-space:nowrap;font-size:56px;line-height:1.2;padding:8px 26px 4px;border-radius:999px;color:#fff;
  box-shadow:0 10px 22px rgba(58,16,10,.22)}
#I79a .rider.inc{color:var(--maroon)} #I79a .rider.inc .tg{background:var(--maroon);left:-110px;top:40px}
#I79a .rider.exp{color:var(--amber)} #I79a .rider.exp .tg{background:var(--amberDeep);left:-120px;top:-118px}
@keyframes drawLine{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
@keyframes ride{0%{offset-distance:0%}100%{offset-distance:100%}}
.dl{animation-name:drawLine}
.rd{animation-name:ride}
@keyframes tgIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
.tgin{animation-name:tgIn;animation-timing-function:cubic-bezier(.2,1.3,.4,1)}
#I79a .cross{position:absolute;width:0;height:0}
#I79a .cross i{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;border:6px solid var(--bad);opacity:0}
@keyframes ring{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.9)}}
.rg{animation-name:ring;animation-timing-function:ease-out}
@keyframes fadeUp{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:none}}
.fu{animation-name:fadeUp}
</style>
</head>
<body>
<!-- ══ I79a · income falling, costs rising · K011 "सबसे पहली, और सबसे बड़ी समस्या — कमाई घट रही है, और ख़र्च लगातार बढ़ रहा है।" (9.31 s) ══ -->
<div class="panel" id="I79a" data-plate="office" style="--T:10s">
  <!-- the glow breathes three times and is still by 6.8 s, so the last frame is a fixed point for I79b -->
  <div class="glow anim a-glow" style="animation-delay:-.4s;animation-duration:2.4s;top:52%"></div>

  <div class="hd">
    <div class="lbl hi anim a-write" style="animation-delay:-.3s;animation-duration:3.4s">सबसे पहली,</div>
    <div class="ttl hi anim a-write" style="animation-delay:.72s;animation-duration:3.6s">सबसे बड़ी समस्या</div>
  </div>

  <div class="chart anim fu" style="animation-delay:-.15s;animation-duration:.6s">
    <svg class="plot" viewBox="0 0 920 900">
      <g class="grid"><line x1="70" y1="160" x2="860" y2="160"/><line x1="70" y1="330" x2="860" y2="330"/><line x1="70" y1="500" x2="860" y2="500"/></g>
      <line class="base" x1="70" y1="670" x2="860" y2="670"/>
      <line class="base" x1="70" y1="90" x2="70" y2="670"/>
      <path id="p-inc" class="ln inc anim dl" pathLength="1" style="animation-delay:3.4s;animation-duration:1.15s;animation-timing-function:cubic-bezier(.35,.1,.35,1)"
        d="M110 150 C 220 150, 270 215, 360 250 S 520 300, 600 360 S 740 440, 800 450"/>
      <path id="p-exp" class="ln exp anim dl" pathLength="1" style="animation-delay:5.42s;animation-duration:1.5s;animation-timing-function:cubic-bezier(.35,.1,.35,1)"
        d="M110 600 C 220 600, 280 555, 370 505 S 520 380, 610 300 S 740 170, 800 150"/>
    </svg>
    <div class="cross" id="cross"><i class="anim rg" style="animation-delay:6.22s;animation-duration:.9s"></i></div>
    <div class="rider inc anim rd" style="offset-path:path('M110 150 C 220 150, 270 215, 360 250 S 520 300, 600 360 S 740 440, 800 450');animation-delay:3.4s;animation-duration:1.15s;animation-timing-function:cubic-bezier(.35,.1,.35,1)">
      <span class="dot anim tgin" style="animation-delay:3.3s;animation-duration:.3s"></span>
      <span class="tg hi anim tgin" style="animation-delay:3.3s;animation-duration:.3s">कमाई</span>
    </div>
    <div class="rider exp anim rd" style="offset-path:path('M110 600 C 220 600, 280 555, 370 505 S 520 380, 610 300 S 740 170, 800 150');animation-delay:5.42s;animation-duration:1.5s;animation-timing-function:cubic-bezier(.35,.1,.35,1)">
      <span class="dot anim tgin" style="animation-delay:5.3s;animation-duration:.3s"></span>
      <span class="tg hi anim tgin" style="animation-delay:5.3s;animation-duration:.3s">ख़र्च</span>
    </div>
    <div class="ax hi anim a-fade" style="animation-delay:.2s;animation-duration:3s">साल दर साल
      <svg viewBox="0 0 70 30"><path d="M4 15H62M50 5l12 10-12 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>

  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
<script>
/* put the pulse ring exactly where the two lines cross */
(function () {
  const a = document.getElementById('p-inc'), b = document.getElementById('p-exp');
  const A = [], B = [], n = 400, la = a.getTotalLength(), lb = b.getTotalLength();
  for (let i = 0; i <= n; i++) { A.push(a.getPointAtLength(la * i / n)); B.push(b.getPointAtLength(lb * i / n)); }
  let best = { d: 1e9 };
  for (const p of A) for (const q of B) { const d = (p.x - q.x) ** 2 + (p.y - q.y) ** 2; if (d < best.d) best = { d, x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 }; }
  const c = document.getElementById('cross');
  c.style.left = best.x + 'px'; c.style.top = best.y + 'px';
})();
</script>
</body>
</html>
