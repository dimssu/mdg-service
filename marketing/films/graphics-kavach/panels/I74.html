<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  /* Number, website and the app, in the order the line speaks them. The number
     is the toll-free line the parent company publishes; the founder asked for
     all three on this card (29 Sep). */
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes cardIn{0%{opacity:0;transform:translateY(110px) scale(.95)}100%{opacity:1;transform:none}}
  @keyframes rowIn{0%{opacity:0;transform:translateX(-60px)}100%{opacity:1;transform:none}}
  @keyframes type{0%{clip-path:inset(-20% 100% -20% 0)}100%{clip-path:inset(-20% -2% -20% 0)}}
  @keyframes breathe2{0%,100%{transform:none}50%{transform:scale(1.025)}}
  @keyframes halo{0%,100%{opacity:.5}50%{opacity:.85}}

  #I74 .halo{position:absolute;left:50%;top:50%;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,162,59,.34),rgba(233,162,59,0) 64%);z-index:1;animation-name:halo;animation-duration:5.5s;animation-iteration-count:2}
  #I74 .card{width:960px;border-radius:40px;overflow:hidden;background:linear-gradient(170deg,#fff,#FBF3E7);border:2px solid var(--amberSoft);
    box-shadow:0 50px 100px rgba(58,16,10,.30),0 8px 18px rgba(58,16,10,.16);animation-name:cardIn;animation-duration:.7s}
  #I74 .top{background:linear-gradient(120deg,var(--maroonSoft),var(--maroon) 62%);border-bottom:6px solid var(--amber);padding:48px 56px;
    display:flex;align-items:center;gap:30px}
  #I74 .top .g{width:110px;height:110px;border-radius:30px;background:rgba(255,255,255,.14);color:var(--amberSoft);display:flex;align-items:center;justify-content:center;flex:none}
  #I74 .top .g svg.i{width:66px;height:66px;stroke-width:1.9}
  #I74 .top .h{font-size:66px;color:#fff;line-height:1.25}
  #I74 .rows{padding:40px 50px 54px;display:flex;flex-direction:column;gap:30px}
  #I74 .r{display:flex;align-items:center;gap:30px;background:#fff;border:2px solid #EFE4D2;border-radius:28px;padding:34px 36px;
    box-shadow:0 10px 24px rgba(74,15,15,.08);animation-name:rowIn;animation-duration:.5s}
  #I74 .r .ic{width:100px;height:100px;border-radius:28px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:inset 0 -5px 12px rgba(0,0,0,.2)}
  #I74 .r .ic svg{width:58px;height:58px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  #I74 .r .k{font-size:40px;color:var(--inkMuted);line-height:1.2}
  #I74 .r .v{display:inline-flex;align-items:center;font-size:74px;font-weight:700;color:var(--maroon);line-height:1.15;letter-spacing:-.5px}
  #I74 .r .v .tx{animation-name:type;animation-duration:1.3s;animation-timing-function:steps(14,end)}
  #I74 .r.web{border-color:var(--amber);box-shadow:0 0 0 4px rgba(233,162,59,.22),0 14px 30px rgba(74,15,15,.12)}
  #I74 .r.web .inner{display:flex;flex-direction:column;gap:6px}
  #I74 .r .v2{font-size:60px;color:var(--maroon);line-height:1.2}
  #I74 .bw{animation-name:breathe2;animation-duration:3s;animation-timing-function:ease-in-out;animation-iteration-count:2}
</style>
</head>
<body>
<!-- ══ I74 · talk to our team directly — toll-free, website, Play Store · K906 (held 9.67 s) -->
<div class="panel" id="I74" data-plate="dusk" style="--T:11s">
  <div class="halo mv"></div>
  <div class="card mv" style="animation-delay:-.05s">
    <div class="top"><span class="g"><svg class="i"><use href="#i-chat"/></svg></span><span class="h hi">सीधे हमारी टीम से जुड़िए</span></div>
    <div class="rows">
      <div class="bw mv" style="animation-delay:2.6s">
        <div class="r web mv" style="animation-delay:1.0s">
          <span class="ic" style="background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg></span>
          <div class="inner"><span class="k hi">टोल-फ़्री नंबर</span>
            <span class="v dis"><span class="tx mv" style="animation-delay:1.25s">1800-891-3496</span></span></div>
        </div>
      </div>
      <div class="r mv" style="animation-delay:4.6s">
          <span class="ic" style="background:linear-gradient(150deg,#C7743A,#8E3A1E)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3Z"/></svg></span>
          <div class="inner" style="display:flex;flex-direction:column;gap:6px"><span class="k hi">वेबसाइट</span>
            <span class="v dis" style="font-size:66px"><span class="tx mv" style="animation-delay:4.85s">mdgservices.in</span></span></div>
      </div>
      <div class="r mv" style="animation-delay:7.3s">
        <span class="ic" style="background:linear-gradient(150deg,#F2B650,var(--amberDeep))"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg></span>
        <div class="inner" style="display:flex;flex-direction:column;gap:6px"><span class="k hi">Google Play स्टोर पर</span><span class="v2 hi">डीलर कवच</span></div>
      </div>
    </div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
