<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* The example on I41's day track, so chapter 5's answer (P20a, I41: the same
   26-08 handled three days early) rhymes with it: the due date buried under
   the day's rush until it turns into 27-08, unpaid. No bank, no company, no
   amount.
   Timed to K020: "जैसे" 0–0.35 s, "आज" 1.37 s, "पैसे भेजने की आख़िरी तारीख़ थी"
   1.74–3.70 s, "पर काम की भागदौड़ में" 4.89–6.29 s, "याद ही नहीं रहा"
   6.65–7.51 s, "और भुगतान समय पर नहीं हो पाया" 8.43–10.40 s. The reminder is
   pinned in the pause after "थी"; the rush buries it before "याद"; the day
   turns over in the pause before "भुगतान" (8.82 s), and the stamp is down on "और".
   The stamp says "नहीं हो पाया", as the voice does (the plan had "नहीं हुआ").
   When the day turns over, 26-08 stays on the track with its row greyed and
   pinned to it, the row's "आज" flips to "कल थी", and 27-08 arrives as a new,
   live dot below it: the track reads 24-08, 25-08, 26-08, 27-08. */
.top{position:absolute;left:0;right:0;top:220px;display:flex;justify-content:center}
.top span{font-size:60px;line-height:1.2;color:var(--maroonDeep);padding:16px 48px 10px;border-radius:999px;
  background:#FFF1D2;border:3px solid var(--amber);box-shadow:0 12px 26px rgba(120,60,6,.20)}
.track{position:absolute;left:276px;top:380px;width:10px;height:420px;border-radius:5px;
  background:linear-gradient(#E9A23B,#C77C1B 60%,var(--maroon));transform-origin:50% 0}
@keyframes drawY{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
.dy{animation-name:drawY}
.node{position:absolute;left:40px;right:60px;height:200px;display:flex;align-items:center}
.node .dt{position:relative;width:190px;height:70px;text-align:right;font-size:50px;font-weight:700;color:var(--ink);padding-right:4px;perspective:600px}
.node .dt span{position:absolute;right:4px;top:0;line-height:70px;backface-visibility:hidden;transform-origin:50% 50%}
.node .dot{width:60px;height:60px;border-radius:50%;margin:0 24px 0 0;flex:none;position:relative;left:21px;
  background:#fff;border:8px solid var(--amber);box-shadow:0 6px 14px rgba(58,16,10,.22)}
.node .dot.last{width:84px;height:84px;left:9px;border-color:var(--maroon);background:var(--maroon);
  box-shadow:0 0 0 10px rgba(107,22,22,.14),0 8px 18px rgba(58,16,10,.3)}
.node .dot .face{position:absolute;inset:-8px;border-radius:50%}
.node .dot .face svg{width:100%;height:100%;overflow:visible}
.sk{flex:1;margin-left:24px;height:100px;border-radius:24px;background:rgba(255,255,255,.72);border:2px solid #EFE4D2;
  box-shadow:0 10px 24px rgba(74,15,15,.08);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 32px}
.sk i{display:block;height:20px;border-radius:10px;background:linear-gradient(90deg,#EFE6D8,#F7F0E5)}
.cd{flex:1;margin-left:18px;border-radius:28px;padding:34px 36px 22px;font-size:58px;line-height:1.3;color:#fff;
  background:linear-gradient(120deg,var(--maroonSoft),var(--maroon) 70%);box-shadow:0 18px 38px rgba(74,15,15,.26)}
.cd b{font-weight:400;color:var(--amberSoft)}
/* the reminder, pinned to the day */
.bell{position:absolute;left:520px;top:926px;z-index:4;display:flex;align-items:center;gap:14px;white-space:nowrap;
  font-size:48px;line-height:1.2;color:var(--maroonDeep);padding:12px 32px 6px 22px;border-radius:999px;
  background:#FFF1D2;border:3px solid var(--amber);box-shadow:0 12px 24px rgba(120,60,6,.26);transform:rotate(-3deg)}
.bell svg{width:54px;height:54px;fill:none;stroke:var(--amberDeep);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:-6px}
@keyframes pinIn{0%{opacity:0;transform:translateY(-50px) rotate(-14deg) scale(.8)}70%{opacity:1;transform:translateY(4px) rotate(-2deg)}100%{opacity:1;transform:rotate(-3deg)}}
.pn{animation-name:pinIn;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
/* the day's rush, piling onto it */
.tk{position:absolute;z-index:5;width:330px;height:136px;display:flex;align-items:center;gap:18px;padding:0 26px;
  border-radius:22px;background:linear-gradient(170deg,#FFFDF8,#F2E4CF);transform:rotate(var(--r));
  box-shadow:0 22px 44px rgba(58,16,10,.30),0 4px 10px rgba(58,16,10,.18),inset 0 0 0 1px rgba(201,160,100,.45)}
.tk .g{width:76px;height:76px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep));box-shadow:inset 0 -4px 10px rgba(0,0,0,.2)}
.tk .g svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tk .w{font-size:58px;line-height:1.2;color:#3A1410;padding-top:8px}
@keyframes pileDrop{0%{opacity:0;transform:translateY(-420px) rotate(calc(var(--r) * -3))}
  55%{opacity:1;transform:translateY(14px) rotate(calc(var(--r) * 1.4))}
  78%{transform:translateY(-6px) rotate(var(--r))}100%{opacity:1;transform:rotate(var(--r))}}
.pd{animation-name:pileDrop;animation-timing-function:cubic-bezier(.3,.7,.4,1)}
/* the day turns over */
@keyframes flipOut{0%{opacity:1;transform:rotateX(0)}100%{opacity:0;transform:rotateX(90deg)}}
@keyframes flipIn{0%{opacity:0;transform:rotateX(-90deg)}100%{opacity:1;transform:rotateX(0)}}
.fo{animation-name:flipOut;animation-timing-function:cubic-bezier(.5,0,.8,.4)}
.fi{animation-name:flipIn;animation-timing-function:cubic-bezier(.2,.6,.4,1)}
.sweep{transform-origin:50px 50px}
@keyframes sweepR{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.sr{animation-name:sweepR;animation-timing-function:cubic-bezier(.5,0,.5,1)}
/* the stamp across the pile */
.nopay{position:absolute;left:160px;top:1360px;z-index:9;width:760px;text-align:center;font-size:76px;line-height:1.25;
  border-width:8px;padding:14px 20px 8px;background:rgba(253,247,238,.9);mix-blend-mode:normal;transform:rotate(-7deg);
  box-shadow:0 18px 40px rgba(74,15,15,.22)}
.nopay svg{display:inline-block;width:.78em;height:.78em;vertical-align:-.04em;margin-left:.2em;overflow:visible}
.nopay svg path{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round}
@keyframes stampR{0%{opacity:0;transform:scale(1.7) rotate(-14deg)}60%{opacity:1;transform:scale(.97) rotate(-7deg)}100%{opacity:1;transform:rotate(-7deg)}}
.sd{animation-name:stampR;animation-timing-function:cubic-bezier(.3,1.2,.5,1)}
@keyframes popTag{0%{opacity:0;transform:scale(.7)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:none}}
.pt{animation-name:popTag;animation-timing-function:cubic-bezier(.2,.9,.3,1)}
@keyframes cardIn{0%{opacity:0;transform:translateX(-90px) rotate(-2deg)}70%{opacity:1;transform:translateX(6px)}100%{opacity:1;transform:none}}
.ci{animation-name:cardIn;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
/* once the date has turned over, the due card is yesterday's: it greys back so
   "आज" is not read as belonging to 27-08 (filter only, so cardIn keeps opacity) */
@keyframes dimK{0%{filter:none}100%{filter:grayscale(.7) opacity(.62)}}
.ci.dim{animation-name:cardIn,dimK}
/* the row's first word turns over with the day: "आज" squashes away (7.86–8.02 s),
   the rest of the line slides over while neither word shows (8.02–8.12 s), and
   "कल थी" opens in (8.1–8.3 s). Nothing reflows: the slot is "कल थी"'s width from
   the start, and before the swap the rest of the line sits 49 px to the left
   (a transform on its own layer). Reflowing the line instead left a 1 px sliver
   of "पैसे"'s matra behind on some frames. A flat squash, not a 3D flip, for the
   same reason. The card greys 8.03–8.43 s. */
.cd .sw{display:inline-block;position:relative}
.cd .sw .w1{position:absolute;left:0;top:0;white-space:nowrap;transform-origin:50% 55%}
.cd .sw .w2{display:inline-block;white-space:nowrap;transform-origin:50% 55%}
.cd .rest{display:inline-block;white-space:nowrap;will-change:transform}
@keyframes sqOut{0%{opacity:1;transform:none}100%{opacity:0;transform:scaleY(.05)}}
@keyframes sqIn{0%{opacity:0;transform:scaleY(.05)}100%{opacity:1;transform:none}}
@keyframes restIn{0%{transform:translateX(var(--dx))}100%{transform:none}}
.cd .sw .w1{animation-name:sqOut;animation-timing-function:cubic-bezier(.5,0,.8,.4)}
.cd .sw .w2{animation-name:sqIn;animation-timing-function:cubic-bezier(.2,.6,.4,1)}
.cd .rest{animation-name:restIn;animation-timing-function:cubic-bezier(.45,0,.35,1)}
@keyframes lightUp{0%{background:#fff;border-color:var(--amber);transform:scale(.7)}100%{background:var(--maroon);border-color:var(--maroon);transform:none}}
.lu{animation-name:lightUp}
@keyframes push{0%{transform:scale(1)}100%{transform:scale(1.02)}}
.ps{animation-name:push;animation-timing-function:linear}
.fast{animation-duration:.5s!important}
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="b-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="b-truck" viewBox="0 0 24 24"><path d="M2.5 7h11v9.5h-11Z"/><path d="M13.5 10.5h4.2l3 3.2v2.8h-7.2"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></symbol>
  <symbol id="b-meter" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M7.5 7h9v4h-9Z"/><path d="M8 15h2M11 15h2M14 15h2M8 18h8"/></symbol>
  <symbol id="b-team" viewBox="0 0 24 24"><circle cx="12" cy="7.6" r="3.4"/><path d="M5.8 20c0-3.6 2.8-6.4 6.2-6.4s6.2 2.8 6.2 6.4"/><circle cx="4.9" cy="9.4" r="2.4"/><path d="M1 18.6c0-2.6 1.7-4.5 3.9-4.5"/><circle cx="19.1" cy="9.4" r="2.4"/><path d="M23 18.6c0-2.6-1.7-4.5-3.9-4.5"/></symbol>
  <symbol id="b-car" viewBox="0 0 24 24"><path d="M3.5 15.5v-3l2-5h13l2 5v3Z"/><path d="M3.5 12.5h17"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/></symbol>
  <symbol id="b-book" viewBox="0 0 24 24"><path d="M4.5 4.5h11a3 3 0 0 1 3 3v12h-11a3 3 0 0 1-3-3Z"/><path d="M4.5 16.5a3 3 0 0 1 3-3h11"/><path d="M8.5 8h6"/></symbol>
</svg>
<!-- ══ I82 · the payment due date, missed in the rush · K020 "जैसे — आज पैसे भेजने की आख़िरी तारीख़ थी, पर काम की भागदौड़ में याद ही नहीं रहा, और भुगतान समय पर नहीं हो पाया।" (12.19 s) ══ -->
<div class="panel" id="I82" data-plate="desk" style="--T:13s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;animation-duration:3s;top:54%"></div>
  <div class="top anim pt" style="animation-delay:-.2s;animation-duration:.36s"><span class="hi">उदाहरण</span></div>

  <div class="anim ps" style="position:absolute;inset:0;transform-origin:50% 55%;animation-delay:8.4s;animation-duration:4.2s">
  <div class="track anim dy" style="animation-delay:.2s;animation-duration:.9s"></div>

  <div class="node" style="top:330px">
    <div class="dt dis anim a-fade fast" style="animation-delay:.4s"><span>24-08</span></div>
    <div class="dot anim a-pop fast" style="animation-delay:.35s"></div>
    <div class="sk anim ci" style="animation-delay:.45s;animation-duration:.4s"><i style="width:62%"></i><i style="width:38%"></i></div>
  </div>
  <div class="node" style="top:490px">
    <div class="dt dis anim a-fade fast" style="animation-delay:.62s"><span>25-08</span></div>
    <div class="dot anim a-pop fast" style="animation-delay:.58s"></div>
    <div class="sk anim ci" style="animation-delay:.68s;animation-duration:.4s"><i style="width:48%"></i><i style="width:66%"></i></div>
  </div>
  <div class="node" style="top:700px">
    <div class="dt dis anim a-fade fast" style="animation-delay:.9s;color:var(--maroon)">
      <span class="anim" style="animation-name:dimK;animation-delay:8.03s;animation-duration:.4s">26-08</span></div>
    <div class="dot last anim" style="animation-name:popIn,dimK;animation-delay:.86s,8.03s;animation-duration:.5s,.4s">
      <div class="face anim a-fade" style="animation-delay:7.4s;animation-duration:1s">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#FFF4E0" stroke="var(--maroon)" stroke-width="8"/>
          <g class="sweep anim sr" style="animation-delay:7.5s;animation-duration:.5s"><path d="M50 54V18" stroke="var(--maroon)" stroke-width="7" stroke-linecap="round"/></g>
          <circle cx="50" cy="50" r="6" fill="var(--maroon)"/></svg></div>
    </div>
    <div class="cd hi anim ci dim" style="animation-delay:.96s,8.03s;animation-duration:.34s,.4s"><b class="sw"><span class="w2 anim" style="animation-delay:8.1s;animation-duration:.2s">कल थी</span><span class="w1 anim" style="animation-delay:7.86s;animation-duration:.16s">आज</span></b> <span class="rest anim" style="--dx:-49px;animation-delay:8.02s;animation-duration:.1s">· पैसे भेजने की</span><br/>आख़िरी तारीख़</div>
  </div>
  <!-- the next day: a new dot below the old one, the track drawn down to it -->
  <div class="track anim dy" style="top:800px;height:210px;background:linear-gradient(var(--maroon),var(--maroonSoft));animation-delay:7.86s;animation-duration:.2s"></div>
  <div class="node" style="top:910px">
    <div class="dt dis" style="color:var(--maroon)"><span class="anim fi" style="animation-delay:8.03s;animation-duration:.2s">27-08</span></div>
    <div class="dot last anim a-pop fast" style="animation-delay:7.92s"></div>
  </div>

  <div class="bell hi anim pn" style="animation-delay:3.72s;animation-duration:.34s"><svg><use href="#b-bell"/></svg>याद रखें: भुगतान</div>

  <div class="tk anim pd" style="left:340px;top:1036px;--r:-5deg;animation-delay:4.86s;animation-duration:.5s"><span class="g"><svg><use href="#b-truck"/></svg></span><span class="w hi">टैंकर</span></div>
  <div class="tk anim pd" style="left:672px;top:1024px;--r:5deg;animation-delay:5.24s;animation-duration:.48s"><span class="g"><svg><use href="#b-meter"/></svg></span><span class="w hi">रीडिंग</span></div>
  <div class="tk anim pd" style="left:372px;top:1172px;--r:3deg;animation-delay:5.56s;animation-duration:.44s"><span class="g"><svg><use href="#b-team"/></svg></span><span class="w hi">स्टाफ़</span></div>
  <div class="tk anim pd" style="left:500px;top:910px;width:460px;--r:-3deg;animation-delay:5.82s;animation-duration:.42s"><span class="g"><svg><use href="#b-car"/></svg></span><span class="w hi">ग्राहक</span></div>
  <div class="tk anim pd" style="left:672px;top:1166px;width:350px;--r:-3deg;animation-delay:6.04s;animation-duration:.4s"><span class="g"><svg><use href="#b-book"/></svg></span><span class="w hi">रजिस्टर</span></div>

  <div class="stamp bad nopay hi anim sd" style="animation-delay:8.35s;animation-duration:.26s">भुगतान समय पर<br/>नहीं हो पाया<svg viewBox="0 0 20 20"><path d="M3 3 17 17M17 3 3 17"/></svg></div>
  </div>

  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
