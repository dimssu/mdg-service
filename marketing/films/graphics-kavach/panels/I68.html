<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes land{0%{opacity:0;transform:translateY(-140px) rotate(var(--r0)) scale(1.04)}65%{opacity:1;transform:translateY(8px) rotate(var(--r1))}100%{opacity:1;transform:rotate(var(--r1))}}
  @keyframes dash{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
  @keyframes dim{0%{opacity:1}100%{opacity:.8}}
  @keyframes thud{0%,100%{transform:scale(1)}30%{transform:scale(.94)}}
  @keyframes halo{0%,100%{opacity:.5}50%{opacity:.85}}

  #I68{gap:70px}
  #I68 .halo{position:absolute;left:50%;top:50%;width:1200px;height:1200px;margin:-600px 0 0 -600px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,162,59,.30),rgba(233,162,59,0) 64%);z-index:1;animation-name:halo;animation-duration:6s}
  #I68 .chip{width:950px;display:flex;align-items:center;gap:44px;padding:44px 50px;border-radius:34px;
    background:linear-gradient(165deg,#fff,#FBF3E7);border:2px solid var(--amberSoft);
    box-shadow:0 40px 80px rgba(58,16,10,.26),0 6px 14px rgba(58,16,10,.14);animation-name:land;animation-duration:.6s}
  #I68 .ic{position:relative;width:260px;height:260px;flex:none;border-radius:50px;background:linear-gradient(150deg,#FFF6E6,#F6DCA8);
    box-shadow:inset 0 -8px 18px rgba(160,100,30,.18),0 14px 28px rgba(58,16,10,.18);display:flex;align-items:center;justify-content:center;
    animation-name:thud;animation-duration:.4s}
  #I68 .ic .art{width:224px;height:224px;animation-name:dim;animation-duration:.5s}
  #I68 .ic .art svg{width:100%;height:100%;fill:none;stroke:var(--maroonSoft);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  #I68 svg.x{position:absolute;inset:-18px;width:calc(100% + 36px);height:calc(100% + 36px);overflow:visible;z-index:4}
  #I68 svg.x path{fill:none;stroke:var(--maroon);stroke-width:8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
    filter:drop-shadow(0 6px 8px rgba(58,16,10,.35));animation-name:dash;animation-duration:.28s;animation-timing-function:cubic-bezier(.6,.1,.3,1)}
  #I68 .tx{font-size:68px;line-height:1.3;color:var(--maroon)}
</style>
</head>
<body>
<!-- ══ I68 · never sold, never used in ads · K805 (held 5.55 s) ═════════════════ -->
<div class="panel" id="I68" data-plate="desk" style="--T:6s">
  <div class="halo mv"></div>

  <div class="chip mv" style="animation-delay:.05s;--r0:-4deg;--r1:-1.4deg">
    <div class="ic mv" style="animation-delay:.75s">
      <div class="art mv" style="animation-delay:.8s">
        <!-- a price tag -->
        <svg viewBox="0 0 24 24"><path d="M3.5 12.2V4.8A1.3 1.3 0 0 1 4.8 3.5h7.4l8.3 8.3a1.3 1.3 0 0 1 0 1.8l-6.9 6.9a1.3 1.3 0 0 1-1.8 0Z"/>
          <circle cx="7.6" cy="7.6" r="1.5"/><path d="M10.6 9.9h4.6M10.6 11.8h4.6M11.3 9.9c2.6 0 2.6 3.8 0 3.8h-.7l3.6 3.6"/></svg>
      </div>
      <svg class="x" viewBox="0 0 100 100"><path class="mv" d="M14 14 L86 86" pathLength="1" style="animation-delay:.75s"/>
        <path class="mv" d="M86 14 L14 86" pathLength="1" style="animation-delay:1.0s"/></svg>
    </div>
    <div class="tx hi">डेटा बेचा<br/>नहीं जाता</div>
  </div>

  <div class="chip mv" style="animation-delay:2.55s;--r0:4deg;--r1:1.2deg">
    <div class="ic mv" style="animation-delay:3.2s">
      <div class="art mv" style="animation-delay:3.25s">
        <!-- a megaphone -->
        <svg viewBox="0 0 24 24"><path d="M3.5 10v4a1 1 0 0 0 1 1h2.2l5.8 4.3V4.7L6.7 9H4.5a1 1 0 0 0-1 1Z"/>
          <path d="M6.7 15l1.1 4.3a1 1 0 0 0 1 .7h.9"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6"/><path d="M18.3 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
      </div>
      <svg class="x" viewBox="0 0 100 100"><path class="mv" d="M14 14 L86 86" pathLength="1" style="animation-delay:3.2s"/>
        <path class="mv" d="M86 14 L14 86" pathLength="1" style="animation-delay:3.45s"/></svg>
    </div>
    <div class="tx hi">किसी विज्ञापन में<br/>इस्तेमाल नहीं</div>
  </div>

  <div class="rail hi">आपका डेटा, आपका</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
