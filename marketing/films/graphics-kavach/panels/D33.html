<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* Which policy the claim goes under, then when and how to tell the insurer:
   two policy papers side by side, the right one ticked and lifted, then the
   "कब / कैसे" strip slides up and the camera leans toward it. */
.wrap{position:absolute;inset:0;transform-origin:50% 80%}
@keyframes lean{0%,70%{transform:scale(1)}100%{transform:scale(1.04)}}
.a-lean{animation-name:lean;animation-timing-function:cubic-bezier(.45,.05,.4,1)}
.ttl{position:absolute;left:60px;right:60px;top:200px;text-align:center;font-size:66px;color:var(--maroon)}
.pol{position:absolute;top:360px;width:420px;height:560px;padding:0;overflow:hidden}
.pol .band{height:22px;background:linear-gradient(90deg,var(--maroonSoft),var(--maroon))}
.pol .in{padding:34px 34px 0}
.pol .k{font-size:28px;color:#6B6258;font-family:'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase}
.pol .n{font-size:48px;line-height:1.3;color:var(--maroonDeep);margin-top:8px}
.pol .cv{display:flex;align-items:flex-start;gap:14px;margin-top:26px;padding-top:22px;border-top:2px dashed #D9CCB6;font-size:36px;color:#3A2E27;line-height:1.4}
.pol .cv svg{flex:none;width:44px;height:44px;margin-top:2px;color:var(--amberDeep);stroke-width:2}
.pol .rl{position:absolute;left:34px;right:34px;bottom:40px;height:92px;
  background-image:linear-gradient(transparent calc(100% - 2px),#E6DAC6 0);background-size:100% 30px}
.gtk{position:absolute;right:-10px;top:-26px;width:104px;height:104px;border-radius:50%;z-index:9;display:flex;align-items:center;justify-content:center;
  color:#fff;background:radial-gradient(circle at 35% 30%,#F8D899,#E9A23B 55%,#B5700F);box-shadow:0 14px 30px rgba(120,60,6,.45)}
.gtk svg{width:62px;height:62px;stroke-width:3}
@keyframes liftUp{0%{transform:rotate(-2deg) translateY(0)}100%{transform:rotate(-2deg) translateY(-34px) scale(1.03);
  box-shadow:0 70px 110px rgba(40,14,6,.45),0 10px 24px rgba(40,14,6,.25),0 0 0 3px var(--amber)}}
.a-lift{animation-name:liftUp;animation-timing-function:cubic-bezier(.3,.8,.3,1)}
@keyframes dimOut{0%{opacity:1}100%{opacity:.62}}
.a-dim{animation-name:dimOut}
.match{position:absolute;left:84px;right:84px;top:990px;display:flex;align-items:center;gap:18px;padding:22px 30px;border-radius:22px;
  background:var(--goodBg);border:2px solid #BFE0CC;font-size:40px;color:var(--good);line-height:1.35}
.strip{position:absolute;left:84px;right:84px;top:1180px;padding:34px 40px 38px;border-radius:26px;background:var(--paper);
  box-shadow:0 40px 80px rgba(40,14,6,.36),0 6px 16px rgba(40,14,6,.2),0 0 0 1px var(--paperEdge);border-top:10px solid var(--amber)}
.ln2{display:flex;align-items:flex-start;gap:24px;padding:16px 0}
.ln2 + .ln2{border-top:2px dashed #D9CCB6}
.ln2 .key{flex:none;padding:6px 20px 8px;border-radius:14px;background:var(--maroon);color:#FFF3E2;font-size:40px}
.ln2 .v{font-size:44px;color:#2A1A16;line-height:1.4;padding-top:4px}
</style>
</head>
<body>
<!-- ══ D33 · which policy covers the claim, and how to tell the insurer · K716 "किस इंश्योरेंस पॉलिसी में क्लेम हो सकता है, और इंश्योरेंस कंपनी को कब और कैसे बताना है।" (7.55 s) ══ -->
<div class="panel" id="D33" data-plate="desk" style="--T:8s">
  <div class="wrap anim a-lean">
    <div class="ttl hi anim a-fade" style="animation-delay:0s;animation-duration:3s">इंश्योरेंस पॉलिसी</div>
    <div class="anim a-rise" style="animation-delay:.15s;animation-duration:3s;position:absolute;inset:0">
      <div class="paper pol anim a-dim" style="left:560px;--rot:2deg;animation-delay:1.4s;animation-duration:.8s">
        <div class="band"></div><div class="in">
          <div class="n hi">बर्गलरी (चोरी)<br/>पॉलिसी</div>
          <div class="cv hi"><svg class="i"><use href="#x-shield"/></svg><span>चोरी</span></div></div>
        <div class="rl"></div></div>
      <div class="paper pol anim a-lift" style="left:100px;transform:rotate(-2deg);animation-delay:1.3s;animation-duration:.9s">
        <div class="band"></div><div class="in">
          <div class="n hi">फ़ायर एंड स्पेशल<br/>पेरिल्स पॉलिसी</div>
          <div class="cv hi"><svg class="i"><use href="#x-shield"/></svg><span>आग, दुर्घटना से नुक़सान</span></div></div>
        <div class="rl"></div></div>
    </div>
    <div class="gtk anim a-pop" style="position:absolute;left:432px;top:318px;right:auto;animation-delay:1.35s;animation-duration:3s"><svg class="i"><use href="#i-check"/></svg></div>
    <div class="match hi anim a-stamp" style="animation-delay:1.9s;animation-duration:4s">इस घटना में क्लेम: फ़ायर एंड स्पेशल पेरिल्स ✓</div>
    <div class="strip anim a-rise" style="animation-delay:2.45s;animation-duration:4s">
      <div class="ln2"><span class="key hi">कब:</span><span class="v hi anim a-write" style="animation-delay:2.9s;animation-duration:5s">घटना के तुरंत बाद</span></div>
      <div class="ln2"><span class="key hi">कैसे:</span><span class="v hi"><span class="anim a-write" style="display:block;animation-delay:3.9s;animation-duration:5s">पहले फ़ोन पर, फिर लिखित में —</span><span class="anim a-write" style="display:block;animation-delay:4.5s;animation-duration:4s">पॉलिसी नंबर के साथ</span></span></div>
    </div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<svg style="display:none"><symbol id="x-shield" viewBox="0 0 24 24"><path d="M12 2.8 19.5 5.6v6.1c0 4.6-3.1 8-7.5 9.6-4.4-1.6-7.5-5-7.5-9.6V5.6Z"/></symbol></svg>
<script src="../kit.js"></script>
</body>
</html>
