<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* I46's 24-hour ring, EMPTY — the answer comes in chapter 5. K025 over the
   whole card: "अब वॉटर (0.2) इनग्रेस (0.62) टेस्टिंग (1.22) जैसे (1.63) काम (1.94) भी,
   तय (2.99) अंतराल पर करने होते हैं।" (measured: the three स bursts at 1.1, 1.35 and
   1.77 s place इनग्रेस, टेस्टिंग and जैसे). The label writes in just ahead of its
   words, the twelve two-hour windows draw 2.0–2.9 s and "तय अंतराल पर" is in by 2.8 s. From
   3.1 s nothing moves: I85b opens on this frame (same markup, same positions). */
#I85a .lab1{position:absolute;left:40px;right:40px;top:340px;text-align:center;font-size:86px;line-height:1.2;color:var(--maroon)}
#I85a .lab2{position:absolute;left:40px;right:40px;top:450px;text-align:center;font-size:60px;line-height:1.2;color:var(--amberDeep)}
#I85a .sub{position:absolute;left:40px;right:40px;top:536px;text-align:center;font-size:48px;line-height:1.3;color:#6B5A4C}
#I85a .dial{position:absolute;left:90px;top:710px;width:900px;height:900px}
#I85a .dial > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#I85a .bs{fill:none;stroke:#DECBAF;stroke-width:64}
#I85a .lb{font-family:'Inter',sans-serif;font-weight:600;font-size:30px;fill:#A89886;text-anchor:middle}
#I85a .ctr{position:absolute;left:50%;top:50%;width:392px;height:392px;margin:-196px 0 0 -196px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#FFFDF8,#F4E8D6);box-shadow:0 20px 44px rgba(58,16,10,.18),inset 0 0 0 1px rgba(201,160,100,.5);
  display:flex;align-items:center;justify-content:center}
#I85a .ctr svg.i{width:150px;height:150px;stroke-width:1.3;color:#D9C7AE}
@keyframes wr{0%{clip-path:inset(-20% 100% -20% 0)}100%{clip-path:inset(-20% -4% -20% 0)}}
@keyframes segIn{0%{opacity:0;stroke-width:30}60%{opacity:1;stroke-width:74}100%{opacity:1;stroke-width:64}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes ctrIn{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:none}}
@keyframes up{0%{opacity:0;transform:translateY(26px)}100%{opacity:1;transform:none}}
</style>
</head>
<body>
<!-- ══ I85a · water ingress: fixed intervals · K025 "अब वॉटर इनग्रेस टेस्टिंग जैसे काम भी, तय अंतराल पर करने होते हैं।" (6.34 s) ══ -->
<div class="panel" id="I85a" data-plate="office" style="--T:7s">
  <div class="glow" style="top:58%;opacity:.8"></div>
  <div class="lab1 hi" style="animation:wr .6s linear 0s both paused">वॉटर इनग्रेस टेस्टिंग</div>
  <div class="lab2 hi" style="animation:wr .3s linear 1.18s both paused">जैसे काम</div>
  <div class="sub hi" style="animation:up .35s cubic-bezier(.2,.9,.3,1) 2.5s both paused">तय अंतराल पर</div>
  <div class="dial">
    <svg viewBox="0 0 900 900" id="ring"></svg>
    <div class="ctr" style="animation:ctrIn .45s cubic-bezier(.2,.9,.3,1) 1.7s both paused"><svg class="i"><use href="#i-clock"/></svg></div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
<script>
/* I46's ring exactly: twelve two-hour windows, drawn one by one, all empty */
const ns = 'http://www.w3.org/2000/svg', ring = document.getElementById('ring');
const L = [[540.6,121.9],[697.5,212.5],[788.1,369.4],[788.1,550.6],[697.5,707.5],[540.6,798.1],[359.4,798.1],[202.5,707.5],[111.9,550.6],[111.9,369.4],[202.5,212.5],[359.4,121.9]];
for (let k = 0; k < 12; k++) {
  const t = (2.0 + k * 0.08).toFixed(2);
  const c = document.createElementNS(ns, 'circle');
  Object.entries({ cx: 450, cy: 450, r: 262, pathLength: 360, 'stroke-dasharray': '26 334', transform: `rotate(${-88 + 30 * k} 450 450)`, class: 'bs' })
    .forEach(([a, v]) => c.setAttribute(a, v));
  c.style.animation = `segIn .35s cubic-bezier(.16,.9,.24,1) ${t}s both paused`;
  ring.appendChild(c);
  const tx = document.createElementNS(ns, 'text');
  tx.setAttribute('x', L[k][0]); tx.setAttribute('y', L[k][1]); tx.setAttribute('class', 'lb');
  tx.textContent = `${String(2 * k).padStart(2, '0')}–${String(2 * k + 2).padStart(2, '0')}`;
  tx.style.animation = `show .3s linear ${t}s both paused`;
  ring.appendChild(tx);
}
</script>
</body>
</html>
