<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* The problems chapter's card. I07's layout on the night plate, but with no
   chapter number anywhere: the opening act stays unnumbered. Where I07 has its
   ghost numeral, the outlines of I01's seven list cards keep drifting down
   behind the title — the list from the line before, still arriving.
   Timed to K010 (5.5 s here): "पर बात सिर्फ़ इस लिस्ट की नहीं है" 0.05–1.85 s,
   "आज" 2.80 s, "पंप का कारोबार…" from 3.29 s. So the list has the frame to
   itself while it is being talked about, steps back as "आज" arrives, and the
   title is in before "पंप". */
#I78 .ghosts{position:absolute;left:120px;right:120px;top:0;bottom:0;z-index:2;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent 4%,#000 22%,#000 78%,transparent 96%);
          mask-image:linear-gradient(transparent 4%,#000 22%,#000 78%,transparent 96%)}
#I78 .gcol{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;gap:22px}
#I78 .gc{height:124px;border-radius:20px;border:3px solid rgba(233,162,59,.30);display:flex;align-items:center;gap:30px;padding:0 34px 0 24px}
#I78 .gc .pi{width:76px;height:76px;border-radius:18px;border:3px solid rgba(233,162,59,.30);flex:none}
#I78 .gc .bar{height:22px;border-radius:99px;border:3px solid rgba(233,162,59,.24)}
#I78 .gc.dash{border-style:dashed}
#I78 .gc .bx{width:50px;height:50px;border-radius:10px;border:3px solid rgba(233,162,59,.30);flex:none;margin-left:auto}
@keyframes gdrift{0%{transform:translateY(-360px)}100%{transform:translateY(0)}}
#I78 .gcol.anim{animation-name:gdrift;animation-timing-function:linear}
@keyframes gback{0%{opacity:1}100%{opacity:.5}}
#I78 .ghosts .dim{animation-name:gback;animation-timing-function:ease-in-out}
#I78 .chap{display:flex;flex-direction:column;align-items:center;transform-origin:50% 50%}
#I78 .chap .no{font-size:48px}
#I78 .chap .nm{font-size:118px;margin-top:26px;text-shadow:0 20px 50px rgba(0,0,0,.35)}
#I78 .chap .rule{width:420px;height:7px;margin-top:44px;transform-origin:center;
  background:linear-gradient(90deg,rgba(233,162,59,0),var(--amber) 22%,#F6C877 50%,var(--amber) 78%,rgba(233,162,59,0))}
@keyframes ruleIn{0%{transform:scaleX(0);opacity:0}20%{opacity:1}100%{transform:scaleX(1);opacity:1}}
#I78 .rule.anim{animation-name:ruleIn}
@keyframes titleIn{0%{opacity:0;transform:translateY(90px) scale(.96)}100%{opacity:1;transform:none}}
#I78 .ti{animation-name:titleIn}
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
#I78 .fu{animation-name:fadeUp}
@keyframes push2{0%{transform:scale(1)}100%{transform:scale(1.02)}}
#I78 .push{animation-name:push2;animation-timing-function:linear}
.nw{white-space:nowrap}
</style>
</head>
<body>
<!-- ══ I78 · the problems chapter card, no number · K010, first 5.5 s ("पर बात सिर्फ़ इस लिस्ट की नहीं है। आज पंप का कारोबार…") ══ -->
<div class="panel ink" id="I78" data-plate="night" style="--T:6s">
  <div class="glow anim a-glow" style="animation-delay:-1.4s;top:48%"></div>

  <!-- I01's seven list cards, as outlines only, drifting down -->
  <div class="ghosts"><div class="dim anim" style="position:absolute;inset:0;animation-delay:1.95s;animation-duration:.7s">
    <div class="gcol anim" style="top:40px;animation-delay:0s;animation-duration:6s">
      <div class="gc"><span class="pi"></span><span class="bar" style="width:220px"></span><span class="bx"></span></div>
      <div class="gc"><span class="pi"></span><span class="bar" style="width:120px"></span><span class="bx"></span></div>
      <div class="gc"><span class="pi"></span><span class="bar" style="width:260px"></span><span class="bx"></span></div>
      <div class="gc"><span class="pi"></span><span class="bar" style="width:200px"></span><span class="bx"></span></div>
      <div class="gc"><span class="pi"></span><span class="bar" style="width:170px"></span><span class="bx"></span></div>
      <div class="gc"><span class="pi"></span><span class="bar" style="width:230px"></span><span class="bx"></span></div>
      <div class="gc"><span class="pi"></span><span class="bar" style="width:300px"></span><span class="bx"></span></div>
      <!-- and, as in I01, the list keeps coming -->
      <div class="gc dash"><span class="pi"></span><span class="bar" style="width:300px"></span><span class="bx"></span></div>
      <div class="gc dash"><span class="pi"></span><span class="bar" style="width:220px"></span><span class="bx"></span></div>
      <div class="gc dash"><span class="pi"></span><span class="bar" style="width:340px"></span><span class="bx"></span></div>
      <div class="gc dash"><span class="pi"></span><span class="bar" style="width:260px"></span><span class="bx"></span></div>
    </div>
  </div></div>

  <div class="chap push anim" style="animation-delay:2.6s;animation-duration:3.4s">
    <div class="no hi anim fu" style="animation-delay:2.1s;animation-duration:.5s">आज के समय में</div>
    <div class="nm hi anim ti" style="animation-delay:2.45s;animation-duration:.65s"><span class="nw">पेट्रोल पंप की</span><br/><span class="nw">असली चुनौतियाँ</span></div>
    <div class="rule anim" style="animation-delay:3.0s;animation-duration:.9s"></div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
