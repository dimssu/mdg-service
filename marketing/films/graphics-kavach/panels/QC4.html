<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* I95a's top band on its own, for the short: the stopped load, and the money
   the load needs with its end missing. Same parts, same colours, same drawing
   as I95a — only larger, because I95a's figures came out 12 px tall on a phone.
   Type is 1.6x I95a's. I95a's band is already 900 px wide, so 1.6x cannot be
   had sideways: the gap's label moves from beside the bar's caption to under
   the gap (its bracket turned to point up at it), and the tanker is 1.15x so it
   still sits beside its chip. The block is centred in the upper two-thirds;
   below it there is only the rail. */
  .mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
  @keyframes hatch{0%{background-position:0 0}100%{background-position:148px 0}}
  @keyframes wipeX{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0)}}
  @keyframes drawB{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
  @keyframes gcIn{0%{opacity:0;transform:translateX(-30px)}100%{opacity:1;transform:none}}

  #QC4 .glow{top:33%;opacity:.5}
  #QC4 .st{position:absolute;inset:0;z-index:3}
  #QC4 .st > *{position:absolute}

  /* the stopped load (I95a's drawing, 1.15x) and its chip (1.55x) */
  #QC4 .tk{left:60px;top:240px;width:494px;height:226px;overflow:visible}
  #QC4 .tk .b{fill:#EFE7DC;stroke:#A99D91;stroke-width:7;stroke-linejoin:round}
  #QC4 .tk .l{fill:none;stroke:#BFB3A6;stroke-width:5;stroke-linecap:round}
  #QC4 .tk .w{fill:#D6CCC1;stroke:#A99D91;stroke-width:7}
  #QC4 .stop{right:60px;top:280px;display:flex;align-items:center;gap:22px;padding:17px 44px 21px 19px;border-radius:999px;
    background:var(--badBg);border:3px solid rgba(192,57,43,.32);color:var(--bad);font-size:74px;line-height:1.2;
    box-shadow:0 20px 44px rgba(120,20,10,.14)}
  #QC4 .stop .ic{width:94px;height:94px;border-radius:50%;background:var(--bad);display:flex;align-items:center;justify-content:center;gap:14px;flex:none}
  #QC4 .stop .ic i{display:block;width:13px;height:38px;border-radius:4px;background:#fff}

  /* the money the load needs; its end is missing */
  #QC4 .nl{left:60px;top:576px;font-size:70px;color:var(--maroon);line-height:1.3;white-space:nowrap}
  #QC4 .need{left:60px;top:690px;width:960px;height:189px;border-radius:34px;overflow:hidden;background:#fff;
    box-shadow:0 0 0 3px rgba(214,168,98,.65),0 40px 80px rgba(58,16,10,.20),0 6px 16px rgba(58,16,10,.10)}
  #QC4 .need .have{position:absolute;left:0;top:0;bottom:0;width:640px;
    background:linear-gradient(180deg,var(--maroonSoft),var(--maroonDeep));box-shadow:inset 0 -16px 32px rgba(0,0,0,.18),inset 0 10px 16px rgba(255,255,255,.08)}
  /* the gap wipes in from the bar's edge 0.9–1.4 s (it is a shape, not words) */
  #QC4 .need .hole{position:absolute;left:640px;right:0;top:0;bottom:0;border-left:6px dashed var(--amberDeep);
    background:repeating-linear-gradient(-45deg,rgba(233,162,59,.62) 0 21px,rgba(255,241,210,.75) 21px 42px);
    background-size:auto;animation-name:hatch,wipeX;animation-duration:7.7s,.5s;animation-delay:0s,.9s;
    animation-timing-function:linear,cubic-bezier(.35,.1,.3,1)}
  /* its bracket, under the gap, pointing up at it */
  #QC4 .br{left:640px;top:893px;width:380px;height:40px;overflow:visible}
  #QC4 .br path{fill:none;stroke:var(--bad);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.75;stroke-dasharray:1;
    animation-name:drawB;animation-duration:.4s;animation-delay:1.0s;animation-timing-function:cubic-bezier(.4,.1,.3,1)}
  /* and its words, which arrive whole (a wipe would cut the letters) */
  #QC4 .gc{right:60px;top:942px;font-size:80px;color:var(--bad);line-height:1.3;white-space:nowrap;
    animation-name:gcIn;animation-duration:.32s;animation-delay:1.04s;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  #QC4 .gc .dis{font-weight:700;letter-spacing:-1.5px}
</style>
</head>
<body>
<!-- ══ QC4 · the short, Q09 "…जब लोड के लिए एक से तीन लाख कम पड़ जाएँ…" (film 30.15–32.40) · 2.25 s
     I95a's opening state, enlarged. Voice on this card's clock: 'एक से तीन लाख' 1.06–1.89.
     0.0 the stopped load, its chip, the caption and the bar (the part he has) · 0.9–1.4 the hatched
     gap wipes in from the bar's edge, its bracket draws 1.0–1.4 and '₹1–3 लाख कम' slides in whole
     1.04–1.36 · held to the end (the hatch keeps its slow crawl, as in I95a). ══ -->
<div class="panel" id="QC4" data-plate="office" style="--T:3s">
  <div class="glow"></div>
  <div class="st">
    <svg class="tk" viewBox="0 0 460 210">
      <rect class="b" x="8" y="42" width="298" height="112" rx="56"/>
      <path class="l" d="M112 48v100M204 48v100"/>
      <rect class="b" x="140" y="24" width="40" height="18" rx="5"/>
      <path class="b" d="M306 120h14"/>
      <path class="b" d="M320 166V74h72l52 52v40Z"/>
      <path class="l" d="M336 90h50l34 34h-84Z"/>
      <path class="l" d="M4 166h450" style="stroke:#A99D91;stroke-width:7"/>
      <circle class="w" cx="74" cy="184" r="22"/><circle class="w" cx="156" cy="184" r="22"/><circle class="w" cx="398" cy="184" r="22"/>
    </svg>
    <div class="stop hi"><span class="ic"><i></i><i></i></span>लोड रुका</div>

    <div class="nl hi">लोड उठाने के लिए ज़रूरी रक़म</div>
    <div class="need">
      <div class="have"></div>
      <div class="hole mv"></div>
    </div>
    <svg class="br" viewBox="0 0 380 40"><path class="mv" pathLength="1" d="M6 4V26h368V4"/></svg>
    <div class="gc mv"><span class="dis">₹1–3</span> <span class="hi">लाख कम</span></div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
