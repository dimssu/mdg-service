<style>
/* The four emergencies, named and never shown: quiet line icons, no flames,
   no damage, no red. Then the one thing that matters — help, and the right steps. */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:34px;width:940px}
.em{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;height:380px;border-radius:34px;
  background:linear-gradient(170deg,#fff,#FBF3E7);border:1px solid rgba(201,160,100,.5);
  box-shadow:0 30px 60px rgba(58,16,10,.18),0 4px 10px rgba(58,16,10,.1)}
.em svg{width:150px;height:150px;fill:none;stroke:#7A6A5E;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.em .t{font-size:54px;color:#3A2E27}
.resp{text-align:center}
.resp .t{font-size:66px;color:#3A2E27}
.resp .t b{font-weight:400;color:var(--good)}
.resp .u{width:560px;height:8px;border-radius:8px;margin:18px auto 0;transform-origin:50% 50%;
  background:linear-gradient(90deg,rgba(233,162,59,.2),#E9A23B 25%,#F4C979 75%,rgba(244,201,121,.2))}
@keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.a-growx{animation-name:growX;animation-timing-function:cubic-bezier(.4,.1,.3,1)}
</style>
</head>
