<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
#I47 .hd{position:absolute;left:60px;right:60px;top:370px;text-align:center;font-size:74px;line-height:1.3;color:var(--maroon)}
/* the day, left to right: dawn, noon, night */
#I47 .day{position:absolute;left:100px;right:100px;top:630px;height:150px}
#I47 .trk{position:absolute;left:0;right:0;top:66px;height:14px;border-radius:7px;background:#E6DAC6}
#I47 .fill{position:absolute;left:0;right:0;top:66px;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--amber),var(--amberDeep));transform-origin:0 50%}
@keyframes fillX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.fx{animation-name:fillX;animation-duration:3.6s!important;animation-timing-function:linear!important}
#I47 .ends{position:absolute;left:-40px;right:-40px;top:112px;display:flex;justify-content:space-between;color:#9C8878}
#I47 .ends svg{width:42px;height:42px;stroke-width:2}
#I47 .notch{position:absolute;top:43px;width:60px;height:60px;margin-left:-30px;border-radius:50%;background:#fff;border:5px solid #D8C8AE;
  display:flex;align-items:center;justify-content:center;color:#A89886}
#I47 .notch svg{width:30px;height:30px;stroke-width:2.4}
#I47 .notch .on{position:absolute;inset:-5px;border-radius:50%;background:var(--good);border:5px solid var(--good);color:#fff;display:flex;align-items:center;justify-content:center}
#I47 .mk{position:absolute;left:0;top:73px;width:0;height:0}
#I47 .mk i{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#FFE3A6,var(--amber) 60%,var(--amberDeep));box-shadow:0 0 0 10px rgba(233,162,59,.25),0 0 36px 10px rgba(233,162,59,.5)}
@keyframes run{0%{left:0}100%{left:100%}}
.rn{animation-name:run;animation-duration:3.6s!important;animation-timing-function:linear!important}
#I47 .rows{position:absolute;left:60px;right:60px;top:900px;display:flex;flex-direction:column;gap:34px}
#I47 .rw{display:flex;align-items:center;gap:26px;background:#fff;border:2px solid #EFE4D2;border-radius:26px;padding:30px 30px;
  box-shadow:0 18px 36px rgba(58,16,10,.12)}
#I47 .rw .ic{width:84px;height:84px;border-radius:22px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))}
#I47 .rw .ic svg{width:48px;height:48px;stroke-width:2}
#I47 .rw .tx{flex:1;display:flex;flex-direction:column;gap:6px}
#I47 .rw .n{font-size:48px;line-height:1.25;color:var(--ink)}
#I47 .rw .s{font-size:38px;color:var(--good)}
#I47 .rw .s b{font-family:'Space Grotesk',sans-serif}
#I47 .rw .s.due{color:var(--amberDeep)}
#I47 .rw .ck{width:84px;height:84px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,#27935A,#17663C);border:4px solid var(--amber);box-shadow:0 8px 18px rgba(30,122,74,.3)}
#I47 .rw .ck svg{width:46px;height:46px;stroke-width:3}
#I47 .rw .ck0{width:84px;height:84px;border-radius:50%;flex:none;border:4px dashed #D8C8AE;position:relative}
#I47 .rw .ck0 .ck{position:absolute;left:-4px;top:-4px}
@keyframes tickIn{0%{opacity:0;transform:scale(.3) rotate(-30deg)}60%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:none}}
.ti{animation-name:tickIn;animation-duration:.45s!important}
.fast{animation-duration:.5s!important}
</style>
</head>
<body>
<!-- ══ I47 · on time, as scheduled · K519 "हमारी टीम ऐसे कामों पर नज़र रखती है…" ══ -->
<div class="panel" id="I47" data-plate="office" style="--T:6s">
  <div class="glow anim a-glow" style="top:58%"></div>
  <div class="hd hi anim a-fade" style="animation-duration:.5s">तय समय के हिसाब से</div>

  <div class="day anim a-fade" style="animation-duration:.5s">
    <div class="trk"></div>
    <div class="fill anim fx" style="animation-delay:.3s"></div>
    <div class="ends">
      <svg class="i" viewBox="0 0 24 24"><path d="M3 18h18M6.5 18a5.5 5.5 0 0 1 11 0M12 6.5V9M5.3 10.3l1.6 1.6M18.7 10.3l-1.6 1.6"/></svg>
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg>
      <svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </div>
    <div class="notch" style="left:25%"><svg class="i"><use href="#i-drop"/></svg><span class="on anim a-pop fast" style="animation-delay:1.2s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="notch" style="left:50%"><svg class="i"><use href="#i-doc"/></svg><span class="on anim a-pop fast" style="animation-delay:2.1s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="notch" style="left:75%"><svg class="i"><use href="#i-cal"/></svg><span class="on anim a-pop fast" style="animation-delay:3.0s"><svg class="i"><use href="#i-check"/></svg></span></div>
    <div class="mk anim rn" style="animation-delay:.3s"><i></i></div>
  </div>

  <div class="rows">
    <div class="rw anim a-stamp fast" style="animation-delay:.3s"><span class="ic"><svg class="i"><use href="#i-drop"/></svg></span>
      <span class="tx"><span class="n hi">वॉटर टेस्टिंग विंडो</span><span class="s hi anim a-fade fast" style="animation-delay:1.2s"><b>12</b> में से <b>12</b></span></span>
      <span class="ck0"><span class="ck anim ti" style="animation-delay:1.2s"><svg class="i"><use href="#i-check"/></svg></span></span></div>
    <div class="rw anim a-stamp fast" style="animation-delay:.5s"><span class="ic"><svg class="i"><use href="#i-doc"/></svg></span>
      <span class="tx"><span class="n hi">डेली डिक्लेरेशन</span><span class="s hi anim a-fade fast" style="animation-delay:2.1s">आज</span></span>
      <span class="ck0"><span class="ck anim ti" style="animation-delay:2.1s"><svg class="i"><use href="#i-check"/></svg></span></span></div>
    <div class="rw anim a-stamp fast" style="animation-delay:.7s"><span class="ic"><svg class="i"><use href="#i-cal"/></svg></span>
      <span class="tx"><span class="n hi">मॉक ड्रिल</span><span class="s due hi anim a-fade fast" style="animation-delay:3.0s">अगली: <b>18</b> दिन में</span></span>
      <span class="ck0"><span class="ck anim ti" style="animation-delay:3.0s"><svg class="i"><use href="#i-check"/></svg></span></span></div>
  </div>

  <div class="rail hi">तय समय पर</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
