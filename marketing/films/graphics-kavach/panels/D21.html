<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* ── the validity ladder: wooden rails, cream rungs, the current rung in gold ── */
.plank{position:relative;height:132px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:22px;
  font-size:58px;color:var(--maroon);z-index:2;
  background:linear-gradient(180deg,#FFFDF8,#F1E3CD);border:2px solid rgba(201,160,100,.7);
  box-shadow:0 18px 36px rgba(58,16,10,.22),inset 0 -8px 12px rgba(160,110,50,.14),inset 0 3px 0 rgba(255,255,255,.8)}
.plank .gl{position:absolute;inset:-2px;border-radius:20px;z-index:-1;
  background:linear-gradient(180deg,#FBDFA0,#E9A23B 70%,#D38A22);border:2px solid #C77C1B;
  box-shadow:0 0 0 10px rgba(233,162,59,.22),0 26px 50px rgba(120,62,8,.38),inset 0 3px 0 rgba(255,255,255,.55)}
.plank.gold{background:linear-gradient(180deg,#FBDFA0,#E9A23B 70%,#D38A22);color:var(--maroonDeep);border-color:#C77C1B;
  box-shadow:0 0 0 10px rgba(233,162,59,.22),0 26px 50px rgba(120,62,8,.38),inset 0 3px 0 rgba(255,255,255,.55)}
.plank svg.i{width:52px;height:52px;stroke-width:2.2;opacity:.8}
.lrail{position:absolute;width:38px;border-radius:14px;z-index:1;
  background:linear-gradient(90deg,#8A3A26,#5E1B12 60%,#42110C);box-shadow:0 12px 26px rgba(40,10,6,.30)}
/* a single rung lifted off the ladder, with stubs of the rails */
.rh{position:relative;width:900px}
.rh .lrail{top:-70px;bottom:-70px;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);
  mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
@keyframes liftF{0%{transform:scale(.9) translateY(40px);filter:brightness(.92)}100%{transform:scale(1.04);filter:none}}
.lift{animation:liftF .8s cubic-bezier(.2,.9,.3,1) both paused;transform-origin:50% 60%}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}

.panel{gap:64px}
.docw{position:relative;width:960px;height:1100px}
/* a plain printed certificate: ruled double border, no crest or emblem */
.cert{position:absolute;padding:24px}
.cert .frame{border:3px solid var(--print);padding:10px;height:100%}
.cert .frame2{border:1.5px solid var(--print);padding:50px 50px 56px;height:100%;position:relative;
  background:repeating-linear-gradient(45deg,rgba(107,22,22,.035) 0 2px,transparent 2px 9px)}
.cert .iss{font-size:46px;color:#3A332C;text-align:center}
.cert .ti{font-size:74px;color:var(--maroonDeep);margin-top:12px;line-height:1.25;text-align:center}
.cert .rule{height:3px;background:var(--print);width:300px;margin:26px auto 30px}
.cert .ln{font-size:50px;color:var(--print);padding:14px 10px;line-height:1.3;position:relative;white-space:nowrap}
.cert .ln b{font-family:'Inter',sans-serif;font-weight:700}
.cert .bar{height:16px;border-radius:8px;background:#E6DDCF;margin:24px 10px 0}
.cert .sig{position:absolute;right:56px;bottom:62px;width:230px;height:3px;background:#B9AE9F}
@keyframes slideIn{0%{opacity:0;transform:translate(760px,60px) rotate(12deg)}60%{opacity:1}
  100%{opacity:1;transform:rotate(var(--rot,0deg))}}
.slide{animation:slideIn .9s cubic-bezier(.2,.85,.25,1) both paused}
.lit2{background:linear-gradient(transparent 10%,rgba(255,214,64,.62) 10%,rgba(255,214,64,.62) 92%,transparent 92%) no-repeat 0 0 / 0% 100%}
@keyframes litIn{0%{background-size:0% 100%}100%{background-size:100% 100%}}
.a-lit{animation-name:litIn;animation-timing-function:cubic-bezier(.4,.1,.3,1)}

.od{position:relative;display:inline-block}
.seal2{position:absolute;right:40px;top:40px;width:190px;height:190px;color:rgba(107,22,22,.55)}
.cert.wm .frame2{padding-top:60px}
.cert.wm .ti{padding-right:200px}
.dg{display:inline-block;padding:0 10px;border-radius:10px;animation:dateGlow 1.2s ease-out 2.8s both paused}
@keyframes dateGlow{0%{background:rgba(233,162,59,0);box-shadow:0 0 0 0 rgba(233,162,59,0)}
  40%{background:rgba(233,162,59,.55);box-shadow:0 0 0 14px rgba(233,162,59,.25)}
  100%{background:rgba(233,162,59,.45);box-shadow:0 0 0 6px rgba(233,162,59,.18)}}
.note{position:absolute;right:30px;bottom:-54px;display:flex;align-items:center;gap:16px;font-size:46px;color:#7A4A08;
  background:#FDEBC4;border:3px solid var(--amber);border-radius:999px;padding:16px 38px 20px 28px;white-space:nowrap;
  box-shadow:0 18px 36px rgba(120,62,8,.35);transform:rotate(-2deg);animation:noteIn .7s cubic-bezier(.2,.9,.3,1.1) 3.1s both paused}
.note svg{width:46px;height:46px;stroke-width:2.6}
@keyframes noteIn{0%{opacity:0;transform:translateX(160px) rotate(-2deg)}100%{opacity:1;transform:rotate(-2deg)}}
</style>
</head>
<body>
<!-- ══ D21 · the W&M certificate slides over the licence, validity date glows · K419 "…नापतौल से जुड़ा सालाना काम, …" (5 s) ══ -->
<div class="panel" id="D21" data-plate="desk" style="--T:5s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;top:58%"></div>
  <div class="rh">
    <div class="lrail" style="left:96px"></div><div class="lrail" style="right:96px"></div>
    <div class="plank gold hi"><svg class="i"><use href="#i-cal"/></svg>साल के काम</div>
  </div>
  <div class="docw">
    <div class="paper cert" style="left:-10px;top:20px;width:780px;height:960px;--rot:-6deg;transform:rotate(-6deg) scale(.92);transform-origin:0 0;filter:brightness(.97)">
      <div class="frame"><div class="frame2">
        <div class="iss hi">नगर निगम</div>
        <div class="ti hi" style="visibility:hidden">ट्रेड लाइसेंस — रिन्यूअल</div>
        <div class="rule"></div>
        <div class="ln hi">लाइसेंस नं. <b>TL-••••17</b></div>
        <div class="ln hi old">पिछली वैधता: <span class="od"><b>31-03-2026</b>
          <svg class="draw" viewBox="0 0 300 40" preserveAspectRatio="none" style="left:-8px;top:12px;width:calc(100% + 16px);height:40px">
            <path class="anim a-draw" pathLength="1" style="--T:5s;animation-delay:-2s" d="M4 26 C 90 18, 200 22, 296 14"/></svg></span></div>
        <div class="ln hi"><span class="lit2 anim a-lit" style="--T:.6s;animation-delay:-2s;display:inline-block;padding:0 8px">नई वैधता: <b class="anim a-write" style="--T:4s;animation-delay:-2s;display:inline-block">31-03-2027</b></span></div>
        <div class="bar" style="width:84%;margin-top:40px"></div><div class="bar" style="width:66%"></div><div class="bar" style="width:74%"></div><div class="bar" style="width:52%"></div>
        <div class="sig"></div>
        <div class="stamp hi anim a-stampdown" style="--T:5s;position:absolute;left:70px;bottom:70px;font-size:64px;padding:14px 34px;animation-delay:-2s">रिन्यू ✓</div>
      </div></div>
    </div>
    <div class="paper cert wm slide" style="left:100px;top:140px;width:860px;height:980px;--rot:2deg;animation-delay:.1s">
      <div class="frame"><div class="frame2">
        <svg class="seal2" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="52" fill="none" stroke="currentColor" stroke-width="3"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(0 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(15 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(30 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(45 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(60 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(75 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(90 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(105 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(120 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(135 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(150 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(165 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(180 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(195 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(210 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(225 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(240 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(255 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(270 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(285 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(300 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(315 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(330 100 100)"/><line x1="100" y1="22" x2="100" y2="44" stroke="currentColor" stroke-width="2" transform="rotate(345 100 100)"/>
  <circle cx="100" cy="100" r="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 5"/></svg>
        <div class="ti hi" style="text-align:left;margin-top:0;font-size:64px">नापतौल —<br/>सालाना सत्यापन प्रमाणपत्र</div>
        <div class="rule" style="margin-left:10px"></div>
        <div class="ln hi anim a-write" style="--T:4s;animation-delay:1.0s">डिस्पेंसिंग यूनिट: <b>DU-1, DU-2</b></div>
        <div class="ln hi anim a-write" style="--T:4s;animation-delay:1.6s">सील: लगी हुई <b style="color:var(--good)">✓</b></div>
        <div class="ln hi anim a-write" style="--T:4s;animation-delay:2.2s">प्रमाणपत्र वैध: <span class="dg"><b>04-09-2026</b></span> तक</div>
        <div class="bar" style="width:80%;margin-top:40px"></div><div class="bar" style="width:62%"></div><div class="bar" style="width:70%"></div>
        <div class="sig"></div>
      </div></div>
      <div class="note hi"><svg class="i"><use href="#i-clock"/></svg>रिन्यूअल आने वाला है</div>
    </div>
  </div>
  <div class="rail hi">साल के काम · नापतौल</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
