<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* Timed to K033's voice (the card starts 3.10 s into the beat, after S62 —
   1.1 s earlier than it did, so everything after the tag is 1.1 s later).
   Over the shot: "कई पंपों पर … कि डीलर ख़ुद" (ends ≈ 0.6 s), so the tag and
   "डीलर ख़ुद" are already on at 0. "चौबीस घंटे की" 1.05 s ("टे" 1.95, "की" 2.18),
   "ज़िम्मेदारी" 2.32 s (stop closures at −28 dB), "पर्याप्त स्टाफ़" 4.00 s, "ठीक-ठाक मुनाफ़ा" 7.59 s,
   "मुनाफ़ा" ≈ 8.23 s, the line ends 9.20 s. So: the ribbon pops 0.8–1.1 s and "24 घंटे की"
   comes in word by word 0.85–1.05 s, "ज़िम्मेदारी" comes in whole 1.85–2.1 s and the pan
   sinks under it (1.8–2.6 s), the staff card drops in by 3.85 s and the pan sinks
   again, the right label lands by 7.4 s, a small coin drops in on "मुनाफ़ा" and
   barely moves the beam; still from 8.5 s. Every label's words slide in whole:
   a left-to-right wipe showed a lone "ि" and a bare half-letter for a frame.
   The beam and both hangers run on ONE keyframe list with the same stops, so
   the pans stay on the beam's ends: a hanger moves by (L(1−cosθ), L·sinθ),
   L = 280 px, for θ = 4° / 12° / 13.5° / 17° / 18.5° / 16.5°. */
.mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
@keyframes pop{0%{opacity:0;transform:scale(.72) translateY(30px)}62%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes fall{0%{opacity:0;transform:translateY(-420px)}55%{opacity:1;transform:translateY(10px)}78%{transform:translateY(-6px)}100%{opacity:1;transform:none}}
@keyframes coin{0%{opacity:0;transform:translateY(-300px)}60%{opacity:1;transform:translateY(4px)}100%{opacity:1;transform:none}}
/* 0.7 / 1.2 / 1.5 / 2.8 / 3.1 / 3.4 / 7.0 / 7.15 / 7.4 s on a 10 s run, started 1.1 s in */
@keyframes tilt{0%,7%{transform:rotate(-4deg)}12%{transform:rotate(-13.5deg)}15%,28%{transform:rotate(-12deg)}
  31%{transform:rotate(-18.5deg)}34%,70%{transform:rotate(-17deg)}71.5%{transform:rotate(-16.5deg)}74%,100%{transform:rotate(-17deg)}}
@keyframes hangL{0%,7%{transform:translate(.7px,19.5px)}12%{transform:translate(7.7px,65.3px)}15%,28%{transform:translate(6.1px,58.2px)}
  31%{transform:translate(14.5px,88.8px)}34%,70%{transform:translate(12.2px,81.9px)}71.5%{transform:translate(11.5px,79.5px)}74%,100%{transform:translate(12.2px,81.9px)}}
@keyframes hangR{0%,7%{transform:translate(-.7px,-19.5px)}12%{transform:translate(-7.7px,-65.3px)}15%,28%{transform:translate(-6.1px,-58.2px)}
  31%{transform:translate(-14.5px,-88.8px)}34%,70%{transform:translate(-12.2px,-81.9px)}71.5%{transform:translate(-11.5px,-79.5px)}74%,100%{transform:translate(-12.2px,-81.9px)}}
.swing{animation-duration:10s;animation-delay:1.1s;animation-timing-function:cubic-bezier(.45,0,.35,1)}
/* a word of the ribbon arrives whole: a short slide and a fade, never a partial glyph */
@keyframes wIn{0%{opacity:0;transform:translateX(-18px)}100%{opacity:1;transform:none}}
#I88b .wd{display:inline-block;animation-name:wIn;animation-timing-function:cubic-bezier(.2,.8,.3,1)}

#I88b .abs{position:absolute}
#I88b .tagw{left:0;right:0;top:330px;display:flex;justify-content:center}
#I88b .tag{padding:10px 34px 12px;border-radius:999px;font-size:46px;color:var(--maroonDeep);background:#FFF1D2;
  border:3px solid var(--amber);box-shadow:0 10px 22px rgba(120,60,6,.18)}
/* the stand: the same gold scale as I86b (post, foot, trays, cords), so the
   object is recognisably the one the film showed a few beats earlier */
#I88b .post{left:526px;top:720px;width:28px;height:760px;border-radius:14px;
  background:linear-gradient(90deg,#C77C1B,#F4C979 45%,#C27716);box-shadow:0 20px 40px rgba(58,16,10,.22)}
#I88b .base{left:380px;top:1466px;width:320px;height:52px;border-radius:26px 26px 12px 12px;
  background:linear-gradient(180deg,#F4C979,#C77C1B);box-shadow:0 22px 40px rgba(58,16,10,.28)}
#I88b .shadow{left:300px;top:1512px;width:480px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(58,16,10,.28),rgba(58,16,10,0))}
/* the beam, centred on the pivot (540, 720) */
#I88b .beam{left:230px;top:707px;width:620px;height:26px;border-radius:13px;transform-origin:50% 50%;
  background:linear-gradient(180deg,#F4C979,var(--amber) 40%,var(--amberDeep));box-shadow:0 12px 24px rgba(58,16,10,.28)}
#I88b .beam::before,#I88b .beam::after{content:'';position:absolute;top:-6px;width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#F7CD78,var(--amberDeep));box-shadow:0 4px 8px rgba(58,16,10,.3)}
#I88b .beam::before{left:12px} #I88b .beam::after{right:12px}
#I88b .pivot{left:504px;top:684px;width:72px;height:72px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#F7CD78,var(--amber) 55%,var(--amberDeep));
  box-shadow:0 10px 20px rgba(58,16,10,.35),inset 0 0 0 5px rgba(255,255,255,.35)}
/* a hanger: its top-centre is the beam end; cords, pan, what sits in it, its label */
#I88b .hang{top:720px;width:0;height:0}
#I88b .hang svg.cords{position:absolute;left:-210px;top:0;width:420px;height:340px;overflow:visible}
#I88b .pan{position:absolute;left:-210px;top:292px;width:420px;height:56px}
#I88b .pan svg{width:100%;height:100%;overflow:visible}
#I88b .stack{position:absolute;left:-175px;width:350px;bottom:-292px;display:flex;flex-direction:column-reverse;gap:10px}
#I88b .it{height:100px;display:flex;align-items:center;gap:18px;padding:0 20px 0 16px;background:#fff;border:2px solid #EFE4D2;border-radius:18px;
  box-shadow:0 14px 30px rgba(74,15,15,.16),0 3px 8px rgba(74,15,15,.08)}
#I88b .it .pi{width:66px;height:66px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep));box-shadow:inset 0 -4px 10px rgba(0,0,0,.2)}
#I88b .it .pi svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#I88b .it .t{font-size:46px;color:var(--ink);line-height:1;padding-top:10px;white-space:nowrap}
#I88b .rib{position:absolute;left:-200px;width:400px;top:372px;text-align:center;border-radius:20px;padding:16px 10px 12px;
  background:linear-gradient(140deg,var(--maroonSoft),var(--maroonDeep));color:#FFF3E2;font-size:50px;line-height:1.3;
  box-shadow:0 18px 36px rgba(74,15,15,.30),inset 0 0 0 3px rgba(233,162,59,.55)}
#I88b .rlab{position:absolute;left:-200px;width:400px;top:372px;text-align:center;font-size:56px;line-height:1.3;color:var(--amberDeep)}
#I88b .coin{position:absolute;left:-30px;top:240px;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;color:var(--maroonDeep);
  background:radial-gradient(circle at 35% 30%,#F8D899,var(--amber) 58%,var(--amberDeep));box-shadow:0 6px 12px rgba(58,16,10,.3)}
</style>
</head>
<body>
<!-- ══ I88b · 24 hours' responsibility against a thin profit · K033 "…कि डीलर ख़ुद चौबीस घंटे की ज़िम्मेदारी उठाए, पर्याप्त स्टाफ़ भी रखे — और फिर भी ठीक-ठाक मुनाफ़ा बचा सके।" (10.95 s, after S62) ══ -->
<div class="panel" id="I88b" data-plate="desk" style="--T:11.5s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;animation-duration:11s;top:50%"></div>
  <div class="abs tagw"><div class="tag hi">कई पंपों पर</div></div>

  <div class="abs shadow"></div>
  <div class="abs post"></div>
  <div class="abs base"></div>

  <!-- left hanger: beam end at (260, 720) -->
  <div class="abs hang mv swing" style="left:260px;animation-name:hangL">
    <svg class="cords" viewBox="0 0 420 340"><path d="M210 8 20 300M210 8 400 300" stroke="#A8834F" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="210" cy="8" r="11" fill="none" stroke="var(--amberDeep)" stroke-width="6"/></svg>
    <div class="pan"><svg viewBox="0 0 420 56"><path d="M4 6H416Q400 52 210 52Q20 52 4 6Z" fill="url(#panG)"/><rect x="0" y="0" width="420" height="12" rx="6" fill="var(--amber)"/></svg></div>
    <div class="stack">
      <div class="it"><span class="pi"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.6" r="3.6"/><path d="M4.6 20.4c0-4.2 3.3-7 7.4-7s7.4 2.8 7.4 7"/></svg></span><span class="t hi">डीलर ख़ुद</span></div>
      <div class="it mv" style="animation-name:fall;animation-delay:3.5s;animation-duration:.45s"><span class="pi"><svg viewBox="0 0 24 24"><circle cx="8" cy="8.4" r="3"/><path d="M2.4 19.6c0-3.5 2.5-5.8 5.6-5.8s5.6 2.3 5.6 5.8"/><circle cx="16.6" cy="7.2" r="2.6"/><path d="M14.6 13.1c.6-.2 1.3-.3 2-.3 2.7 0 4.9 2.1 4.9 5.6"/></svg></span><span class="t hi">पर्याप्त स्टाफ़</span></div>
    </div>
    <div class="rib hi mv" style="animation-name:pop;animation-delay:.8s;animation-duration:.3s"><div><span class="wd mv" style="animation-delay:.85s;animation-duration:.12s">24</span> <span class="wd mv" style="animation-delay:.89s;animation-duration:.12s">घंटे</span> <span class="wd mv" style="animation-delay:.93s;animation-duration:.12s">की</span></div><div><span class="wd mv" style="animation-delay:1.85s;animation-duration:.25s">ज़िम्मेदारी</span></div></div>
  </div>

  <!-- right hanger: beam end at (820, 720) -->
  <div class="abs hang mv swing" style="left:820px;animation-name:hangR">
    <svg class="cords" viewBox="0 0 420 340"><path d="M210 8 20 300M210 8 400 300" stroke="#A8834F" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="210" cy="8" r="11" fill="none" stroke="var(--amberDeep)" stroke-width="6"/></svg>
    <div class="pan"><svg viewBox="0 0 420 56"><path d="M4 6H416Q400 52 210 52Q20 52 4 6Z" fill="url(#panG)"/><rect x="0" y="0" width="420" height="12" rx="6" fill="var(--amber)"/></svg></div>
    <div class="coin mv" style="animation-name:coin;animation-delay:7.85s;animation-duration:.3s">₹</div>
    <div class="rlab hi"><div><span class="wd mv" style="animation-delay:7.1s;animation-duration:.2s">ठीक-ठाक</span></div><div><span class="wd mv" style="animation-delay:7.22s;animation-duration:.2s">मुनाफ़ा?</span></div></div>
  </div>

  <div class="abs beam mv swing" style="animation-name:tilt"></div>
  <div class="abs pivot"></div>

  <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="panG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4C979"/><stop offset="1" stop-color="#C77C1B"/></linearGradient></defs></svg>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
