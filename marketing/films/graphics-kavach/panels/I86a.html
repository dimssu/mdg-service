<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* K026 runs 2.8 s of S64 first; "अलग से एक कर्मचारी" is said over the shot and
   the start of this card, so he is on at frame 0. Card time = line time − 2.8
   (1.3 s later than when the shot ran 4.1 s): "तो उसका वेतन (1.54) और (2.18) बाक़ी
   ख़र्च (≈2.4–3.1) भी जुड़ेंगे (≈3.25–3.7) — मान लीजिए (4.8–5.5), पंद्रह हज़ार (6.07–6.8)
   रुपये महीना (≈7.15–7.58)।" Everything after him is 1.3 s later than it was.
   The tag clips on with "वेतन", "+ बाक़ी ख़र्च" writes on its
   words ("+" on "और"), "मान लीजिए" stamps on its words (the voice says it here, not
   at the start), the price has rolled to ₹15,000 just before "पंद्रह" and "/ महीना"
   follows. No yearly total.
   Static from 7.2 s: I86c opens on this frame (same markup — change both). */
#I86a{gap:0}
#I86a .badge{position:absolute;left:50%;top:390px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:14px;font-size:46px;color:#5A3508;
  padding:12px 40px 14px;border-radius:999px;white-space:nowrap;background:linear-gradient(150deg,#FFE3A6,var(--amber));box-shadow:0 12px 26px rgba(199,124,27,.30)}
#I86a .badge .dot{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--amberDeep);display:flex;align-items:center;justify-content:center;flex:none;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px}
#I86a .who{position:absolute;left:60px;right:60px;top:508px;text-align:center;font-size:72px;line-height:1.25;color:var(--maroon)}
#I86a .fig{position:absolute;left:360px;top:635px;width:360px;height:400px}
#I86a .fig svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 24px 30px rgba(58,16,10,.18))}
#I86a .fig .body{fill:rgba(255,253,248,.96)}
#I86a .fig .p{fill:none;stroke:var(--maroon);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
/* the tag, hung from a clip on his chest */
#I86a .hang{position:absolute;left:110px;top:990px;width:860px;transform-origin:430px 20px}
#I86a .clip{position:absolute;left:413px;top:0;width:34px;height:74px;border-radius:10px;z-index:3;
  background:linear-gradient(90deg,#9A9A9A,#E4E4E4 45%,#8A8A8A);box-shadow:0 4px 8px rgba(0,0,0,.3)}
#I86a .str{position:absolute;left:428px;top:60px;width:4px;height:62px;background:#8A7466;border-radius:2px}
#I86a .tag{position:relative;margin-top:112px;border-radius:36px;background:linear-gradient(170deg,#FFFDF8,#F6ECDD);
  border:4px solid var(--amber);box-shadow:0 44px 90px rgba(58,16,10,.28),0 8px 20px rgba(58,16,10,.16);
  padding:62px 40px 46px;display:flex;flex-direction:column;align-items:center;gap:26px}
#I86a .tag .hole{position:absolute;left:50%;top:18px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#EADBC4;
  box-shadow:inset 0 3px 5px rgba(0,0,0,.3)}
#I86a .tag .l1{font-size:54px;color:var(--maroonSoft);line-height:1.25;white-space:nowrap}
#I86a .tag .note{width:100%;height:2px;background:repeating-linear-gradient(90deg,#D8C8AE 0 14px,transparent 14px 26px)}
#I86a .price{display:flex;align-items:baseline;gap:18px;color:var(--maroon);white-space:nowrap;height:150px}
#I86a .price .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:144px;line-height:1;letter-spacing:-2px}
#I86a .price .per{font-size:58px;color:#6B5A4C}
.ctr{display:inline-flex;height:1em;line-height:1;overflow:hidden;vertical-align:top;font-variant-numeric:tabular-nums}
.ctr .cc{display:flex;flex-direction:column}
.ctr .cc span,.ctr .fx{display:block;height:1em;line-height:1}
@keyframes ctrRoll{from{transform:translateY(0)}to{transform:translateY(calc(var(--n) * -1em))}}
@keyframes ctrShow{from{opacity:0}to{opacity:1}}
@keyframes clipOn{0%{opacity:0;transform:translateY(-170px) rotate(-16deg)}45%{opacity:1;transform:translateY(12px) rotate(3deg)}
  70%{transform:translateY(-4px) rotate(-3deg)}100%{opacity:1;transform:rotate(-2deg)}}
@keyframes jig{0%,100%{transform:rotate(-2deg)}30%{transform:rotate(-4.5deg)}65%{transform:rotate(.5deg)}}
/* a word arrives whole (a left-to-right wipe cut letters in half for a frame) */
@keyframes wIn{0%{opacity:0;transform:translateX(-16px)}100%{opacity:1;transform:none}}
#I86a .wd{display:inline-block}
@keyframes stampIn{0%{opacity:0;transform:translateX(-50%) scale(1.5) rotate(-6deg)}60%{opacity:1;transform:translateX(-50%) scale(.96)}100%{opacity:1;transform:translateX(-50%)}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes hide{from{opacity:1}to{opacity:0}}
/* until the figure is spoken, the price line waits as three soft dots */
#I86a .dots{position:absolute;left:0;right:0;bottom:46px;height:150px;display:flex;align-items:center;justify-content:center;gap:34px}
#I86a .dots i{width:26px;height:26px;border-radius:50%;background:#E6D7BF}
@keyframes settleX{0%{opacity:0;transform:translateX(40px)}100%{opacity:1;transform:none}}
</style>
</head>
<body>
<!-- ══ I86a · a separate employee, ₹15,000 a month · K026 "…अलग से एक कर्मचारी रखें, तो उसका वेतन और बाक़ी ख़र्च भी जुड़ेंगे — मान लीजिए, पंद्रह हज़ार रुपये महीना।" (from 2.8 s, 9.53 s) ══ -->
<div class="panel" id="I86a" data-plate="desk" style="--T:10s">
  <div class="glow" style="top:52%;opacity:.8"></div>

  <div class="badge hi" style="animation:stampIn .4s cubic-bezier(.3,1.2,.5,1) 4.55s both paused">मान लीजिए</div>
  <div class="who hi">अलग से एक कर्मचारी</div>
  <div class="fig">
    <svg viewBox="0 0 360 400">
      <path class="body" d="M40 398 C40 290 100 238 180 238 S320 290 320 398 Z"/>
      <circle class="body" cx="180" cy="118" r="78"/>
      <circle class="p" cx="180" cy="118" r="78"/>
      <path class="p" d="M40 398 C40 290 100 238 180 238 S320 290 320 398"/>
    </svg>
  </div>

  <div class="hang" style="animation:clipOn .48s cubic-bezier(.3,.7,.4,1) 1.3s both paused">
    <div style="position:absolute;inset:0;transform-origin:430px 20px;animation:jig .6s ease-in-out 3.02s both paused">
      <div class="clip"></div><div class="str"></div>
      <div class="tag">
        <span class="hole"></span>
        <div class="l1 hi">वेतन&nbsp;<span class="wd" style="animation:wIn .15s cubic-bezier(.2,.8,.3,1) 1.9s both paused">+</span> <span class="wd" style="animation:wIn .15s cubic-bezier(.2,.8,.3,1) 1.99s both paused">बाक़ी</span> <span class="wd" style="animation:wIn .15s cubic-bezier(.2,.8,.3,1) 2.1s both paused">ख़र्च</span></div>
        <div class="note"></div>
        <div class="dots" style="animation:hide .15s linear 5.25s both paused"><i></i><i></i><i></i></div>
        <div class="price" style="animation:show .15s linear 5.3s both paused">
          <span class="n"><span class="ctr" data-from="0" data-to="₹15,000" data-at="5.35" data-dur=".7"></span></span>
          <span class="per hi" style="animation:settleX .4s cubic-bezier(.2,.9,.3,1) 6.6s both paused">/ महीना</span>
        </div>
      </div>
    </div>
  </div>

  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
<script>
/* A figure that rolls from one value to another (I37's counter). */
for (const el of document.querySelectorAll('.ctr[data-to]')) {
  const num = (s) => parseInt((s || '0').replace(/\D/g, '') || '0', 10);
  const to = el.dataset.to, A = num(el.dataset.from), B = num(to);
  const from = (el.dataset.from || '').padStart(to.length, ' ');
  const at = parseFloat(el.dataset.at || '0'), dur = parseFloat(el.dataset.dur || '.9');
  const nd = to.replace(/\D/g, '').length;
  el.textContent = '';
  let k = 0;
  [...to].forEach((ch, i) => {
    if (!/\d/.test(ch)) {
      const f = document.createElement('span'); f.className = 'fx'; f.textContent = ch;
      if (from[i] === ' ' && ch !== '₹') f.style.animation = `ctrShow .15s linear ${(at + dur * .3).toFixed(2)}s both paused`;
      el.appendChild(f); return;
    }
    const p = nd - 1 - k++;
    const a = Math.floor(A / 10 ** p), b = Math.floor(B / 10 ** p);
    let n = b - a; if (n > 14) n = 10 + (((b - a) % 10) + 10) % 10;
    const col = document.createElement('span'); col.className = 'cc';
    for (let j = 0; j <= n; j++) {
      const s = document.createElement('span');
      s.textContent = (j === 0 && from[i] === ' ') ? ' ' : String((a + j) % 10);
      col.appendChild(s);
    }
    col.style.setProperty('--n', n);
    col.style.animation = `ctrRoll ${dur}s cubic-bezier(.3,.7,.25,1) ${(at + (nd - k) * .03).toFixed(2)}s both paused`;
    el.appendChild(col);
  });
}
</script>
</body>
</html>
