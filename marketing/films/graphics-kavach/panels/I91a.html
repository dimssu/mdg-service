<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* What such a system must do, 1–3. Timed to K038's voice (this card opens the
   beat, 7.9 s, then S69): "ऐसा सिस्टम," 0–0.84 s, "जो ज़रूरी काम समय पर याद
   दिलाए" 1.17 s, "कोई तय काम छूटने न दे" 4.08 s, "और कंप्लायंस, रिकॉर्ड और रोज़
   के कामकाज पर नज़र रखे" 6.27 s. The heading is written as it is said; each row
   lands ~0.2 s before its words (1.0 · 3.85 · 6.05 s) with an EMPTY gold box
   that glows softly — needed, not yet done. Still from 6.35 s.
   I91b picks these rows up after the cutaway: same heading and rows at the
   same positions (it then shrinks them). Change one, change both. */
.mv{animation-fill-mode:both;animation-play-state:paused;animation-timing-function:cubic-bezier(.16,.9,.24,1)}
@keyframes wr{0%{clip-path:inset(-12% 100% -12% 0)}100%{clip-path:inset(-12% -4% -12% 0)}}
@keyframes growX{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes rowIn{0%{opacity:0;transform:translateY(70px) scale(.96)}70%{opacity:1;transform:translateY(-4px)}100%{opacity:1;transform:none}}
@keyframes soft{0%,100%{opacity:.45}50%{opacity:1}}

#I91a .abs{position:absolute}
#I91a .hd{left:0;right:0;top:600px;text-align:center;transform-origin:50% 0}
#I91a .hd .t{display:inline-block;font-size:80px;color:var(--maroon);line-height:1.3;animation-name:wr;animation-timing-function:linear}
#I91a .hd .u{width:150px;height:7px;border-radius:7px;margin:18px auto 0;background:linear-gradient(90deg,#E9A23B,#F4C979);transform-origin:50% 50%;animation-name:growX}
#I91a .rows{left:80px;right:80px;top:800px;display:flex;flex-direction:column;gap:34px;transform-origin:50% 0}
#I91a .row{display:flex;align-items:center;gap:32px;padding:30px 36px 30px 32px;background:#fff;border:2px solid #EFE4D2;border-radius:24px;
  box-shadow:0 14px 30px rgba(74,15,15,.13),0 3px 8px rgba(74,15,15,.08);animation-name:rowIn}
#I91a .box{position:relative;width:78px;height:78px;flex:none;border-radius:16px;border:5px solid #E2A640;background:#FFFCF4;
  box-shadow:0 0 20px rgba(233,162,59,.5),inset 0 0 12px rgba(233,162,59,.22)}
#I91a .box i{position:absolute;inset:-16px;border-radius:26px;display:block;
  background:radial-gradient(closest-side,rgba(244,201,121,.0) 50%,rgba(240,180,80,.75) 76%,rgba(244,201,121,0));animation-name:soft;animation-timing-function:ease-in-out}
#I91a .row .t{font-size:52px;color:var(--ink);line-height:1.32;padding-top:6px}
</style>
</head>
<body>
<!-- ══ I91a · what such a system must do, 1 to 3 · K038 "ऐसा सिस्टम, जो ज़रूरी काम समय पर याद दिलाए, कोई तय काम छूटने न दे, और कंप्लायंस, रिकॉर्ड और रोज़ के कामकाज पर नज़र रखे।" (first 7.9 s, then S69) ══ -->
<div class="panel" id="I91a" data-plate="office" style="--T:9s">
  <div class="glow anim a-glow" style="animation-delay:-.4s;top:50%"></div>
  <div class="abs hd"><div class="t hi mv" style="animation-delay:-.1s;animation-duration:.45s">ऐसा सिस्टम, जो —</div><div class="u mv" style="animation-delay:.2s;animation-duration:.4s"></div></div>
  <div class="abs rows">
    <div class="row mv" style="animation-delay:.72s;animation-duration:.4s"><span class="box"><i class="mv" style="animation-delay:1.0s;animation-duration:2.4s;animation-iteration-count:4"></i></span><span class="t hi">ज़रूरी काम समय पर याद दिलाए</span></div>
    <div class="row mv" style="animation-delay:3.57s;animation-duration:.4s"><span class="box"><i class="mv" style="animation-delay:3.85s;animation-duration:2.4s;animation-iteration-count:3"></i></span><span class="t hi">कोई तय काम छूटने न दे</span></div>
    <div class="row mv" style="animation-delay:5.77s;animation-duration:.4s"><span class="box"><i class="mv" style="animation-delay:6.05s;animation-duration:2.4s;animation-iteration-count:2"></i></span><span class="t hi">कंप्लायंस, रिकॉर्ड और रोज़ के कामकाज पर नज़र रखे</span></div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
