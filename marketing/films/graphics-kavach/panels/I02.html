<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  #I02{gap:0}
  #I02 .chapter{display:flex;align-items:center;gap:22px;font-size:40px;color:var(--amber);margin-bottom:70px}
  #I02 .chapter i{display:block;width:70px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(233,162,59,0),var(--amber))}
  #I02 .chapter i.r{background:linear-gradient(270deg,rgba(233,162,59,0),var(--amber))}
  #I02 .medal{position:relative;width:430px;height:430px}
  #I02 .medal svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  #I02 .medal .coin{position:absolute;inset:48px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#F8C46A,var(--amber) 42%,var(--amberDeep) 100%);
    display:flex;align-items:center;justify-content:center;font-size:170px;font-weight:700;color:var(--maroonDeep);
    box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 -10px 22px rgba(120,60,0,.35),inset 0 8px 16px rgba(255,240,200,.5)}
  #I02 .medal .coin::before{content:'';position:absolute;inset:18px;border-radius:50%;border:3px solid rgba(78,15,15,.28)}
  #I02 .medal .shine{position:absolute;inset:48px;border-radius:50%;overflow:hidden}
  #I02 .name{font-size:104px;color:#FFF3E2;line-height:1.3;margin-top:64px;text-align:center}
  #I02 .latin{position:relative;overflow:hidden;margin-top:18px;padding:4px 10px}
  #I02 .latin .w{font-size:58px;font-weight:700;color:var(--amber);letter-spacing:.04em}
</style>
</head>
<body>
<!-- ══ I02 · the company, named once · K101 "यही है एम-डी-जी सर्विसेज़।" ═══════════════════ -->
<div class="panel ink" id="I02" data-plate="dusk" style="--T:4s">
  <div class="glow anim a-glow" style="animation-delay:-1.2s;top:44%"></div>

  <div class="chapter anim a-fade" style="animation-delay:1.3s"><i></i><span class="hi">अध्याय 1 · आपकी परछाई</span><i class="r"></i></div>

  <div class="medal anim a-rise" style="animation-delay:-.05s">
    <svg class="ring" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="56" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2.4"/>
      <circle cx="60" cy="60" r="56" fill="none" stroke="var(--amber)" stroke-width="2.4" stroke-linecap="round"
        stroke-dasharray="352" class="anim" style="--off:0;animation-name:ringFill;animation-delay:.1s;animation-duration:1.9s;stroke-dasharray:352"/>
    </svg>
    <div class="coin dis">M</div>
    <div class="shine"><div class="anim a-sweep" style="animation-delay:.9s;position:absolute;inset:0;width:46%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent)"></div></div>
  </div>

  <div class="name hi anim a-write" style="--T:7s;animation-delay:.7s">एम-डी-जी सर्विसेज़</div>
  <div class="latin anim a-fade" style="animation-delay:1.1s">
    <div class="w dis">MDG Services</div>
  </div>

  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
