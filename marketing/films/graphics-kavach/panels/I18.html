<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  /* chapter card — the same build as chapter 2's I07: a huge outlined numeral
     standing behind, the eyebrow fading in, the title rising and settling, and
     a gold underline drawing out from its centre. */
  #I18 .ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);font-size:900px;font-weight:700;line-height:1;
    color:transparent;-webkit-text-stroke:3px rgba(233,162,59,.16);z-index:2}
  #I18 .chap{max-width:960px}
  #I18 .chap .no{font-size:48px}
  #I18 .chap .nm{font-size:118px;margin-top:26px}
  #I18 .chap .rule{width:420px;height:7px;margin-top:44px;transform-origin:center;
    background:linear-gradient(90deg,rgba(233,162,59,0),var(--amber) 22%,#F6C877 50%,var(--amber) 78%,rgba(233,162,59,0))}
  @keyframes ruleIn{0%{transform:scaleX(0);opacity:0}20%{opacity:1}100%{transform:scaleX(1);opacity:1}}
  #I18 .rule.anim{animation-name:ruleIn;animation-duration:.9s}
</style>
</head>
<body>
<!-- ══ I18 · chapter 3 card · K301 "अब बात रिकॉर्ड के मिलान की।" (3.23 s) ══ -->
<div class="panel ink" id="I18" data-plate="night" style="--T:4s">
  <div class="glow anim a-glow" style="animation-delay:-1.4s;top:48%"></div>
  <div class="ghost dis anim a-fade" style="animation-delay:-.2s;animation-duration:4s">3</div>
  <div class="chap">
    <div class="no hi anim a-fade" style="animation-delay:-.02s;animation-duration:4s">अध्याय 3</div>
    <div class="nm hi anim a-rise" style="animation-delay:.5s;animation-duration:4s">रिकॉर्ड का मिलान</div>
    <div class="rule anim" style="animation-delay:1.0s"></div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
