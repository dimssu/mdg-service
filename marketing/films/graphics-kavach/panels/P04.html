<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
  /* the app's own chat, as on P06/P07/P08: notch, white header with the DK badge,
     cream chat, maroon mic — the same phone on every chat card */
  #P04 .phone{width:860px;height:1520px;border-radius:84px;padding:16px;margin-top:-40px}
  #P04 .screen{border-radius:70px;background:var(--cream)}
  #P04 .island{position:absolute;top:22px;left:50%;width:150px;height:40px;margin-left:-75px;
    border-radius:20px;background:#000;z-index:10}
  #P04 .top{padding:84px 36px 24px;display:flex;align-items:center;gap:20px;background:#fff;
    border-bottom:1px solid #EDE2D3;position:relative;z-index:2}
  #P04 .logo{width:72px;height:72px;border-radius:20px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:28px;font-weight:700;color:#fff;
    background:linear-gradient(145deg,var(--maroonSoft),var(--maroonDeep))}
  #P04 .top .nm{font-size:36px;color:#16120F;line-height:1.2}
  #P04 .top .st{font-size:27px;color:var(--inkMuted);line-height:1.3}
  #P04 .ab{flex:1;padding:44px 24px;display:flex;flex-direction:column;justify-content:center;
    background:radial-gradient(rgba(107,22,22,.06) 1.5px,transparent 1.5px) 0 0/34px 34px,var(--creamSunk)}
  #P04 .compose{margin:0 26px 34px;display:flex;align-items:center;gap:18px}
  #P04 .compose .in{flex:1;background:#fff;border:2px solid #EDE2D3;border-radius:999px;padding:22px 30px;font-size:28px;color:#A89484}
  #P04 .compose .mic{width:84px;height:84px;border-radius:50%;background:var(--maroon);color:#fff;
    display:flex;align-items:center;justify-content:center}
  #P04 .card{border-width:3px;box-shadow:0 30px 60px rgba(74,15,15,.22),0 6px 14px rgba(74,15,15,.12)}
  #P04 .card-top{padding:26px 28px}
  #P04 .card-top .tile{font-size:26px;padding:6px 12px}
  #P04 .card-top .ti{font-size:50px;font-weight:400}
  #P04 .card-mid{padding:54px 30px 52px;gap:44px}
  #P04 .pill{align-self:center;display:flex;align-items:center;gap:18px;padding:22px 40px 22px 26px;border-radius:999px;
    background:linear-gradient(180deg,#EAF7EF,#D5EEDF);color:var(--good);font-size:68px;line-height:1.1;
    border:4px solid var(--amber);box-shadow:0 0 0 8px rgba(233,162,59,.18),0 16px 30px rgba(30,122,74,.2)}
  #P04 .pill .ok{width:78px;height:78px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  #P04 .pill .ok svg{width:50px;height:50px;stroke-width:3.4}
  #P04 .ln{display:flex;align-items:center;gap:20px;font-size:50px;color:var(--ink);line-height:1.3;padding:6px 4px}
  #P04 .ln .ic{width:60px;height:60px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(150deg,var(--maroonSoft),var(--maroonDeep))}
  #P04 .ln .ic svg{width:36px;height:36px}
  #P04 .ln b{font-family:'Inter',sans-serif;font-weight:700}
  #P04 .todo{border-color:var(--good);background:#F2FAF5}
  #P04 .todo .v{font-size:46px;color:var(--good);display:flex;align-items:center;gap:16px}
  #P04 .card .foot{font-size:24px;padding:16px 20px}
  #P04 .w{--T:6s}
</style>
</head>
<body>
<!-- ══ P04 · stock check: fine · K213 (last 4.25 s) "…और वो तय सीमा के अंदर है या नहीं।" ═══ -->
<div class="panel" id="P04" data-plate="office" style="--T:5s">
  <div class="glow anim a-glow" style="animation-delay:-1.2s;top:52%"></div>
  <div class="phone anim a-rise" style="animation-delay:-.1s;animation-duration:5s">
    <div class="screen">
      <div class="island"></div>
      <div class="top">
        <div class="logo dis">DK</div>
        <div><div class="nm hi">MDG टीम</div><div class="st hi">डीलर कवच</div></div>
      </div>
      <div class="ab">
        <div class="card anim a-rise" style="--T:4s;animation-delay:.1s">
          <div class="card-top"><span class="tile" style="display:flex;padding:8px"><svg class="i" style="width:34px;height:34px"><use href="#i-gauge"/></svg></span><span class="ti hi">स्टॉक जाँच · HSD</span></div>
          <div class="card-mid">
            <div class="pill hi anim a-pop" style="--T:4s;animation-delay:.55s"><span class="ok"><svg class="i"><use href="#i-check"/></svg></span>स्टॉक ठीक है</div>
            <div class="ln hi w anim a-write" style="animation-delay:1.0s"><span class="ic"><svg class="i"><use href="#i-gauge"/></svg></span><span>अंतर: <b>174 L</b> कम</span></div>
            <div class="ln hi w anim a-write" style="animation-delay:1.6s"><span class="ic"><svg class="i"><use href="#i-drop"/></svg></span><span>सीमा: <b>570 L + 96 L = 666 L</b></span></div>
            <div class="todo anim a-fade" style="--T:3s;animation-delay:2.15s"><div class="v hi w anim a-write" style="animation-delay:2.2s"><svg class="i" style="width:44px;height:44px;stroke-width:3"><use href="#i-check"/></svg>अभी कुछ करने की ज़रूरत नहीं</div></div>
          </div>
          <div class="foot hi">Dealer's कवच Programme · MDG Services</div>
        </div>
      </div>
      <div class="compose">
        <div class="in hi">संदेश लिखें…</div>
        <div class="mic"><svg class="i" style="width:38px;height:38px" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></div>
      </div>
    </div>
  </div>
  <div class="rail hi">साफ़ जवाब, सीधे आपके फ़ोन पर</div>
</div>
<script src="../kit.js"></script>
</body>
</html>
