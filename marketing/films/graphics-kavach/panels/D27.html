<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../kit-base.css" />
<link rel="stylesheet" href="../kit-doc.css" />
<style>
/* The cost estimate, told before any case begins: the letter slides in under
   its "पारदर्शिता" chip, the four lines arrive one by one, the total rolls up,
   the stamp lands, and the camera leans toward the stamp. */
/* origin and scale chosen so the pushed sheet still keeps a 60px margin both sides */
.wrap{position:absolute;inset:0;transform-origin:56% 74%}
@keyframes lean{0%,76%{transform:scale(1)}100%{transform:scale(1.05)}}
.a-lean{animation-name:lean;animation-timing-function:cubic-bezier(.45,.05,.4,1)}
.pchip{position:absolute;left:90px;top:236px;display:flex;align-items:center;gap:16px;padding:16px 32px 18px 24px;border-radius:999px;
  font-size:44px;color:#FFF3E2;background:linear-gradient(140deg,var(--maroonSoft),var(--maroonDeep));
  box-shadow:0 18px 36px rgba(58,16,10,.32);transform:rotate(-2deg)}
.pchip svg{width:48px;height:48px;fill:none;stroke:var(--amber);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.let{position:absolute;left:90px;top:360px;width:900px;--rot:.8deg;padding:0 0 250px}
.lh{display:flex;align-items:center;gap:16px;padding:30px 50px 24px;border-bottom:4px solid var(--amber)}
.lh .m{width:58px;height:58px;border-radius:15px;background:linear-gradient(145deg,var(--maroonSoft),var(--maroonDeep));
  color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
.lh .n{font-size:34px;font-weight:700;color:var(--maroon)}
.lh .d{margin-left:auto;font-size:28px;color:#6B6258}
.bd{padding:36px 50px 0}
.h1{font-size:54px;line-height:1.35;color:var(--maroon)}
.mat{margin-top:18px;font-size:38px;color:#4A3F37}
.lines{margin-top:34px;border-top:2px solid #6E655B}
.ln{display:flex;align-items:baseline;justify-content:space-between;padding:26px 4px 22px;border-bottom:2px dashed #CDBFA9}
.ln .k{font-size:40px;color:var(--ink)}
.ln .v{font-size:44px;font-weight:600;font-family:'Inter',sans-serif;color:var(--print)}
.tot{display:flex;align-items:center;justify-content:space-between;padding:30px 4px 0;border-top:6px double #6E655B;margin-top:-2px}
.tot .k{font-size:46px;color:var(--maroonDeep);font-weight:700}
.tot .v{font-size:84px;font-weight:700;color:var(--maroon);font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-2px}
.stp{position:absolute;left:390px;top:1262px;font-size:40px;line-height:1.3;text-align:center;padding:16px 30px;z-index:7;
  background:rgba(255,255,255,.35)}
.stp.anim{transform-origin:50% 50%}
</style>
</head>
<body>
<!-- ══ D27 · the cost estimate, told before any case begins · K705, after I77 (9.97 s) ══ -->
<div class="panel" id="D27" data-plate="desk" style="--T:10s">
  <div class="wrap anim a-lean">
    <div class="paper let anim a-rise" style="animation-delay:.15s;animation-duration:4s">
      <div class="lh"><span class="m dis">M</span><span class="n dis">MDG Services</span><span class="d hi">डीलर कवच</span></div>
      <div class="bd">
        <div class="h1 hi">क़ानूनी कार्यवाही से पहले —<br/>ख़र्च का अनुमान</div>
        <div class="mat hi">मामला: ग्राहक से जुड़ा विवाद</div>
        <div class="lines">
          <div class="ln anim a-write" style="animation-delay:1.5s;animation-duration:5s"><span class="k hi">एडवोकेट फ़ीस</span><span class="v">₹15,000</span></div>
          <div class="ln anim a-write" style="animation-delay:2.4s;animation-duration:5s"><span class="k hi">कोर्ट फ़ीस और काग़ज़ात</span><span class="v">₹3,500</span></div>
          <div class="ln anim a-write" style="animation-delay:3.3s;animation-duration:5s"><span class="k hi">आने-जाने का ख़र्च</span><span class="v">₹2,000</span></div>
        </div>
        <div class="tot anim a-fade" style="animation-delay:4.2s;animation-duration:3s"><span class="k hi">कुल अनुमान</span>
          <span class="v"><span class="odo" data-n="20,500" data-at="4.3" data-roll="1.3">₹</span></span></div>
      </div>
    </div>
    <div class="pchip anim a-stamp" style="animation-delay:0s;animation-duration:5s">
      <svg viewBox="0 0 24 24"><path d="M8.5 14.2V5.4a1.2 1.2 0 0 1 2.4 0V11M10.9 11V4a1.2 1.2 0 0 1 2.4 0v7M13.3 11V5a1.2 1.2 0 0 1 2.4 0v6.4M15.7 11.4V7.6a1.2 1.2 0 0 1 2.4 0v6.6c0 4-2.6 6.8-5.8 6.8-2.3 0-3.8-.8-5-2.4l-2.8-3.9c-.7-1-.4-2.1.5-2.5.8-.4 1.7-.1 2.2.6l1.2 1.6"/></svg>
      <span class="hi">पारदर्शिता</span></div>
    <div class="stamp stp anim a-stampdown" style="animation-delay:5.6s;animation-duration:8s">कार्यवाही शुरू होने से पहले<br/>बताया गया ✓</div>
  </div>
  <div class="rail hi">Dealer's कवच Programme · MDG Services</div>
</div>
<script src="../kit.js"></script>
<script>
/* Odometers that roll when their row arrives, not at frame 0: data-at is the
   second the roll starts, data-roll how long it takes. */
for (const el of document.querySelectorAll('.odo[data-at]')) {
  const at = parseFloat(el.dataset.at), roll = parseFloat(el.dataset.roll || '1.3');
  el.querySelectorAll('.col').forEach((c, i) => {
    c.style.animationDelay = (at + i * 0.06).toFixed(2) + 's';
    c.style.animationDuration = (roll / 0.3).toFixed(2) + 's';
  });
}
</script>
</body>
</html>
